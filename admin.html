<!doctype html>
<html lang="en">
<head>
<script>document.documentElement.style.visibility='hidden';</script>
<script>window.MLSkipPaywall = true;</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080c1a">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin — The Magic Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cabinet+Grotesk:wght@400;500;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth-modal.css">
  <script defer src="auth.js"></script>
  <script defer src="require-auth.js"></script>
  <script defer src="auth-modal.js"></script>
  <style>
    :root {
      --bg:#080c1a; --surface:rgba(255,255,255,0.048); --surface2:rgba(255,255,255,0.032);
      --border:rgba(255,255,255,0.085); --text:#e4e8f8; --text2:rgba(210,218,245,0.65);
      --muted:rgba(210,218,245,0.38); --accent-1:#7c6dfa; --accent-2:#11d98f; --accent-red:#f87171;
      --fd:"Cabinet Grotesk",sans-serif; --fm:"JetBrains Mono",monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: var(--fd); font-size: 15px; background: var(--bg); color: var(--text);
      min-height: 100vh; -webkit-font-smoothing: antialiased;
      background-image:
        radial-gradient(ellipse 60% 40% at 5% 3%, rgba(124,109,250,0.16) 0%, transparent 60%),
        radial-gradient(ellipse 50% 35% at 95% 8%, rgba(17,217,143,0.10) 0%, transparent 60%);
      background-attachment: fixed;
    }
    nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 52px; border-bottom: 1px solid var(--border);
    }
    .nav-logo {
      font-family: var(--fd); font-weight: 800; font-size: 18px; text-decoration: none;
      background: linear-gradient(120deg, #fff 0%, #c4baff 50%, #6ee7b7 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .nav-pill {
      display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 99px;
      border: 1px solid var(--border); background: var(--surface); color: var(--muted);
      text-decoration: none; transition: all 140ms; cursor: pointer; font-family: var(--fd); font-size: 13px;
    }
    .nav-pill:hover { background: rgba(255,255,255,0.09); color: var(--text); }
    main { max-width: 900px; margin: 0 auto; padding: 40px 24px 80px; }
    .page-title { font-size: 26px; font-weight: 800; margin-bottom: 6px; }
    .page-sub { color: var(--muted); font-size: 14px; margin-bottom: 32px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
    .tab-btn {
      padding: 7px 16px; border-radius: 99px; border: 1px solid var(--border); background: var(--surface);
      color: var(--muted); font-family: var(--fd); font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .tab-btn.active { background: rgba(124,109,250,0.18); border-color: rgba(124,109,250,0.45); color: #c4baff; }
    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
      padding: 18px 20px; margin-bottom: 12px; display: flex; align-items: center; gap: 16px;
    }
    .card-info { flex: 1; min-width: 0; }
    .card-name { font-weight: 700; font-size: 15px; margin-bottom: 3px; }
    .card-meta { color: var(--muted); font-size: 12.5px; font-family: var(--fm); line-height: 1.7; }
    .card-actions { display: flex; gap: 8px; flex-shrink: 0; }
    .btn {
      padding: 8px 16px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface2);
      color: var(--text); font-family: var(--fd); font-size: 13px; font-weight: 700; cursor: pointer;
      transition: all 140ms;
    }
    .btn-verify { border-color: rgba(17,217,143,0.40); background: rgba(17,217,143,0.12); color: #6ee7b7; }
    .btn-verify:hover { background: rgba(17,217,143,0.22); }
    .btn-reject { border-color: rgba(248,113,113,0.35); background: rgba(248,113,113,0.10); color: var(--accent-red); }
    .btn-reject:hover { background: rgba(248,113,113,0.20); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .empty-state { color: var(--muted); font-size: 14px; padding: 40px 0; text-align: center; }
    .denied {
      max-width: 460px; margin: 120px auto; text-align: center; padding: 32px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    }
    .denied h1 { font-size: 18px; margin-bottom: 8px; }
    .denied p { color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">The Magic Lab</a>
  <a href="account.html" class="nav-pill">← My Account</a>
</nav>

<main id="deniedView" hidden>
  <div class="denied">
    <h1>Access restricted</h1>
    <p>This page is only available to the site's administrator account.</p>
  </div>
</main>

<main id="adminView" hidden>
  <div class="page-title">CDV Verification</div>
  <div class="page-sub">Approve or reject learners/teachers who typed a Curro Durbanville school name at sign-up.</div>

  <div class="tabs">
    <button class="tab-btn active" data-status="pending">Pending</button>
    <button class="tab-btn" data-status="verified">Verified</button>
    <button class="tab-btn" data-status="rejected">Rejected</button>
  </div>

  <div id="list"></div>
</main>

<script>
// Purely cosmetic — hides the UI for non-admins. The actual security
// boundary is inside the admin_list_cdv / admin_set_cdv_status
// Postgres functions themselves (see supabase-admin-cdv-functions.sql),
// which reject every auth.uid() except the hardcoded admin account
// regardless of what this page does or doesn't check.
const ADMIN_UID = '31a201b0-f426-455a-973a-b1862001b748';

let currentStatus = 'pending';

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderRow(p) {
  const name = p.display_name || p.email || '(no name)';
  const role = p.role === 'teacher' ? 'Teacher' : 'Student';
  const grade = p.grade ? `Grade ${p.grade}` : '';
  const meta = [p.email, role, grade, p.school].filter(Boolean).join(' · ');
  const showButtons = currentStatus !== 'verified';
  const showReject = currentStatus !== 'rejected';
  return `
    <div class="card" data-id="${p.id}">
      <div class="card-info">
        <div class="card-name">${escapeHtml(name)}</div>
        <div class="card-meta">${escapeHtml(meta)}</div>
      </div>
      <div class="card-actions">
        ${currentStatus !== 'verified' ? `<button class="btn btn-verify" data-action="verified">Verify</button>` : ''}
        ${showReject ? `<button class="btn btn-reject" data-action="rejected">Reject</button>` : ''}
      </div>
    </div>`;
}

async function loadList() {
  const listEl = document.getElementById('list');
  listEl.innerHTML = '<div class="empty-state">Loading…</div>';
  const supabase = window.MagicLabAuth._supabase();
  const { data, error } = await supabase.rpc('admin_list_cdv', { status_filter: currentStatus });
  if (error) {
    listEl.innerHTML = `<div class="empty-state">Error: ${escapeHtml(error.message)}</div>`;
    return;
  }
  if (!data || data.length === 0) {
    listEl.innerHTML = '<div class="empty-state">Nothing here.</div>';
    return;
  }
  listEl.innerHTML = data.map(renderRow).join('');
}

document.getElementById('list').addEventListener('click', async (e) => {
  const btn = e.target.closest('button[data-action]');
  if (!btn) return;
  const card = btn.closest('.card');
  const id = card.dataset.id;
  const action = btn.dataset.action;
  card.querySelectorAll('button').forEach(b => b.disabled = true);
  const supabase = window.MagicLabAuth._supabase();
  const { error } = await supabase.rpc('admin_set_cdv_status', { target_user_id: id, new_status: action });
  if (error) {
    alert('Failed: ' + error.message);
    card.querySelectorAll('button').forEach(b => b.disabled = false);
    return;
  }
  card.remove();
  const listEl = document.getElementById('list');
  if (!listEl.children.length) listEl.innerHTML = '<div class="empty-state">Nothing here.</div>';
});

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentStatus = btn.dataset.status;
    loadList();
  });
});

function init() {
  const uid = window.MagicLabAuth?.getSession()?.user?.id;
  if (uid === ADMIN_UID) {
    document.getElementById('adminView').hidden = false;
    loadList();
  } else {
    document.getElementById('deniedView').hidden = false;
  }
}

document.addEventListener('magiclab:auth:ready', init);
document.addEventListener('magiclab:auth:change', init);
</script>

</body>
</html>
