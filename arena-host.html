<style>
/* ══════════════════════════════════════════════════════════════════════════
   The Arena — host view.

   Stylesheet only; every class and id the game script drives is untouched.

   This one is projected. It is read from the back of a classroom, through a
   projector that crushes mid-tones and washes out colour, so it breaks two
   habits the rest of the site keeps: nothing important is set in a faint
   grey, and the join code is solid rather than gradient-filled. A
   gradient-clipped numeral is the worst possible treatment for the single
   thing thirty people are trying to read from four metres away.

   The four answer hues are byte-identical to arena.html on purpose. A learner
   sees a red triangle on their phone and has to find the red triangle on the
   wall; if the two drift apart the whole colour code stops working.
   ═════════════════════════════════════════════════════════════════════════ */

:root {
  --surface2: rgba(255,255,255,0.03);
  --border2:  var(--line-soft);
  --text2:    var(--text-2);
  --font:     var(--font-display);
  --mono:     var(--font-mono);
}

html, body { height: 100%; }
body {
  font-family: var(--font); background: var(--ink-900); color: var(--text);
  min-height: 100vh; -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column;
}

.wrap { flex: 1; display: flex; flex-direction: column; width: 100%; max-width: 1100px; margin: 0 auto; padding: 28px 32px 40px; }
.top-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-5); }
.logo { font-family: var(--font-display); font-weight: 800; font-size: 17px; letter-spacing: -0.025em; color: var(--text-2); text-decoration: none; }
.game-title { font-weight: 700; font-size: 15px; color: var(--text-2); }
.top-row-right { display: flex; align-items: center; gap: var(--space-4); }

/* Ending the quiz for everyone in the room is destructive, so it stays red. */
.btn-end-quiz {
  padding: 9px 16px; border-radius: var(--radius-2xs);
  border: 1px solid rgba(239,91,91,0.38); background: rgba(239,91,91,0.10); color: #f5a3a3;
  cursor: pointer; font-family: var(--font); font-size: 12.5px; font-weight: 700;
  transition: background var(--dur-fast) var(--ease-standard);
}
.btn-end-quiz:hover { background: rgba(239,91,91,0.20); }

.state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.hidden { display: none !important; }

/* ── Lobby ────────────────────────────────────────────────────────────── */
/* The join code is the whole screen. Solid paper, tabular figures so the
   characters do not jitter as it is typed out, and no gradient. */
.join-code {
  font-family: var(--mono); font-weight: 700;
  font-size: clamp(56px, 10vw, 104px); letter-spacing: 0.1em;
  color: var(--paper); margin: 12px 0 6px;
  font-variant-numeric: tabular-nums;
}
.join-hint { font-size: 15px; color: var(--text-2); margin-bottom: var(--space-7); }
.join-hint b { color: var(--paper); }
.lobby-count { font-family: var(--mono); font-size: 13px; color: var(--text-2); margin-bottom: var(--space-4); font-variant-numeric: tabular-nums; }
.lobby-players { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 700px; margin-bottom: var(--space-8); }
.lobby-chip {
  padding: 8px 18px; border-radius: var(--radius-full);
  background: var(--ink-850); border: 1px solid var(--line);
  font-size: 14.5px; font-weight: 700; color: var(--text);
}

.btn-primary {
  padding: 15px 36px; border-radius: var(--radius-sm); cursor: pointer;
  border: 1px solid var(--paper); background: var(--paper); color: var(--ink-900);
  font-family: var(--font); font-size: 16px; font-weight: 700; letter-spacing: -0.01em;
  transition: background var(--dur-fast) var(--ease-standard), transform var(--dur-fast) var(--ease-standard);
}
.btn-primary:hover:not(:disabled) { background: #fff; transform: translateY(-1px); }
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
.btn-ghost {
  padding: 11px 22px; border-radius: var(--radius-sm);
  border: 1px solid var(--line-hard); background: transparent; color: var(--text);
  cursor: pointer; font-family: var(--font); font-size: 13.5px; font-weight: 700;
  transition: background var(--dur-fast) var(--ease-standard), border-color var(--dur-fast) var(--ease-standard);
}
.btn-ghost:hover { background: rgba(255,255,255,0.05); border-color: var(--paper); }

/* ── Question ─────────────────────────────────────────────────────────── */
.q-progress { font-family: var(--mono); font-size: 12.5px; color: var(--text-2); margin-bottom: 10px; font-variant-numeric: tabular-nums; }
.q-timer-track { width: 100%; max-width: 480px; height: 8px; margin-bottom: var(--space-5); border-radius: var(--radius-full); background: rgba(255,255,255,0.10); overflow: hidden; }
/* Solid, not a gradient: a bar that changes hue as it drains reads as a
   second signal that is not actually saying anything. */
.q-timer-fill { height: 100%; border-radius: var(--radius-full); background: var(--paper); transition: width 200ms linear; }
.q-text {
  font-family: var(--font-display); font-weight: 800;
  font-size: clamp(24px, 3.4vw, 40px); letter-spacing: -0.03em; line-height: 1.22;
  max-width: 820px; margin-bottom: var(--space-8); color: var(--paper);
  text-wrap: balance;
}
.q-answered { font-family: var(--mono); font-size: 13.5px; color: var(--text-2); margin-bottom: var(--space-5); font-variant-numeric: tabular-nums; }

.opt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: 100%; max-width: 820px; }
.opt-tile {
  position: relative; overflow: hidden;
  min-height: 78px; padding: 22px 24px; border-radius: var(--radius-md);
  display: flex; align-items: center; gap: 12px; text-align: left;
  font-family: var(--font); font-size: 16px; font-weight: 700; color: #fff;
}
.opt-tile .opt-shape { font-size: 20px; flex-shrink: 0; }
/* Identical to arena.html. All four clear WCAG AA against their own text
   colour; the amber takes ink text because white on yellow cannot. */
.opt-tile.c0 { background: #d24141; }
.opt-tile.c1 { background: #2f6fe0; }
.opt-tile.c2 { background: #e5a828; color: var(--ink-900); }
.opt-tile.c3 { background: #19853e; }
.opt-tile.dimmed { opacity: 0.32; }
/* The response-distribution bar. On the amber tile a white wash would wreck
   the ink text it sits under, so that one darkens instead of lightening. */
.opt-tile .opt-bar { position: absolute; inset: 0; width: 0%; background: rgba(255,255,255,0.18); transition: width 500ms ease; }
.opt-tile.c2 .opt-bar { background: rgba(0,0,0,0.16); }
.opt-tile .opt-count { position: relative; margin-left: auto; flex-shrink: 0; font-family: var(--mono); font-size: 14px; font-variant-numeric: tabular-nums; }
.opt-tile .opt-label { position: relative; }
.opt-tile.correct { outline: 3px solid var(--paper); outline-offset: 2px; }

/* ── Leaderboard and podium ───────────────────────────────────────────── */
.podium { display: flex; align-items: flex-end; gap: 18px; margin-bottom: var(--space-8); }
.podium-spot { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.podium-name { font-family: var(--font-display); font-weight: 800; font-size: 15px; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--paper); }
.podium-score { font-family: var(--mono); font-size: 12.5px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.podium-bar {
  width: 110px; border-radius: var(--radius-sm) var(--radius-sm) 0 0;
  display: flex; align-items: flex-start; justify-content: center; padding-top: 10px;
  font-family: var(--font-display); font-weight: 900; font-size: 22px; color: var(--ink-900);
}
/* Gold, silver and bronze are the one place a literal metaphor beats the
   palette — everyone in the room already knows what they mean. Flat fills so
   they survive a projector. */
.podium-spot.p1 .podium-bar { height: 150px; background: #e8b93c; }
.podium-spot.p2 .podium-bar { height: 110px; background: #b8c2cf; }
.podium-spot.p3 .podium-bar { height:  80px; background: #cd7f45; }

.leaderboard-list { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 8px; margin-bottom: var(--space-7); }
.lb-row {
  display: flex; align-items: center; gap: 12px; padding: 11px 16px;
  background: var(--ink-850); border: 1px solid var(--line); border-radius: var(--radius-sm);
}
.lb-rank { width: 24px; flex-shrink: 0; font-family: var(--mono); font-size: 13px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.lb-name { flex: 1; text-align: left; font-weight: 700; font-size: 14.5px; color: var(--text); }
.lb-score { font-family: var(--mono); font-size: 13.5px; font-weight: 600; color: var(--good); font-variant-numeric: tabular-nums; }

.btn-row { display: flex; gap: 10px; margin-top: var(--space-2); }
</style>
</head>
<body>

<div class="wrap">
  <div class="top-row">
    <a href="dashboard-teacher.html" class="logo">🧙 The Magic Lab</a>
    <div class="top-row-right">
      <span class="game-title" id="gameTitle"></span>
      <button class="btn-end-quiz hidden" id="btnEndQuiz" onclick="onEndQuiz()">End Quiz</button>
    </div>
  </div>

  <!-- Loading -->
  <div class="state" id="stateLoading"><p style="color:var(--muted);">Loading arena…</p></div>

  <!-- Lobby -->
  <div class="state hidden" id="stateLobby">
    <div style="font-size:14px;color:var(--muted);font-family:var(--mono);text-transform:uppercase;letter-spacing:0.1em;">Join code</div>
    <div class="join-code" id="joinCodeDisplay">------</div>
    <div class="join-hint">Learners go to <b>arena.html</b> and enter this code</div>
    <div class="lobby-count" id="lobbyCount">0 players joined</div>
    <div class="lobby-players" id="lobbyPlayers"></div>
    <button class="btn-primary" id="btnStart" onclick="onStart()" disabled>Start Round</button>
  </div>

  <!-- Question -->
  <div class="state hidden" id="stateQuestion">
    <div class="q-progress" id="qProgress"></div>
    <div class="q-timer-track"><div class="q-timer-fill" id="qTimerFill" style="width:100%;"></div></div>
    <div class="q-text" id="qText"></div>
    <div class="q-answered" id="qAnswered"></div>
    <div class="opt-grid" id="qOpts"></div>
    <div class="btn-row">
      <button class="btn-primary" id="btnReveal" onclick="onReveal()">Reveal Answer</button>
    </div>
  </div>

  <!-- Reveal -->
  <div class="state hidden" id="stateReveal">
    <div class="q-progress" id="rProgress"></div>
    <div class="q-text" id="rText"></div>
    <div class="opt-grid" id="rOpts"></div>
    <div class="btn-row">
      <button class="btn-primary" id="btnNext" onclick="onNext()">Next Question</button>
    </div>
  </div>

  <!-- Ended -->
  <div class="state hidden" id="stateEnded">
    <div style="font-weight:900;font-size:clamp(24px,3vw,34px);letter-spacing:-0.03em;margin-bottom:24px;">🏆 Final Results</div>
    <div class="podium" id="podium"></div>
    <div class="leaderboard-list" id="fullLeaderboard"></div>
    <div class="btn-row">
      <a href="dashboard-teacher.html" class="btn-ghost" style="text-decoration:none;">← Back to Dashboard</a>
    </div>
  </div>
</div>

<script src="auth.js"></script>
<script defer src="require-auth.js"></script>
<script src="games.js"></script>
<script>
const params = new URLSearchParams(location.search);
const sessionId = params.get('session');
const OPT_SHAPES = ['🪄', '🔮', '⭐', '💎']; // wand / orb / star / gem — matches arena.html's tiles

let session = null;
let pollTimer = null;
let lastRenderedStatus = null;
let lastRenderedIndex = -1;

function showState(name) {
  ['Loading','Lobby','Question','Reveal','Ended'].forEach(s => {
    document.getElementById('state' + s).classList.toggle('hidden', s !== name);
  });
}

async function tick() {
  try {
    await tickOnce();
  } catch (e) {
    console.warn('[LiveGame] tick error:', e.message);
  }
}

async function tickOnce() {
  if (!sessionId) { showState('Loading'); document.querySelector('#stateLoading p').textContent = 'No arena session specified.'; return; }
  session = await window.MagicLabGames.getSession(sessionId);
  if (!session) { showState('Loading'); document.querySelector('#stateLoading p').textContent = 'Arena not found.'; return; }

  document.getElementById('gameTitle').textContent = session.title;
  document.getElementById('btnEndQuiz').classList.toggle('hidden', session.status === 'ended');

  if (session.status === 'lobby') await renderLobby();
  else if (session.status === 'question') await renderQuestion();
  else if (session.status === 'reveal') await renderReveal();
  else if (session.status === 'ended') await renderEnded();
}

async function renderLobby() {
  showState('Lobby');
  document.getElementById('joinCodeDisplay').textContent = session.join_code;
  const players = await window.MagicLabGames.getParticipants(sessionId);
  document.getElementById('lobbyCount').textContent = `${players.length} player${players.length === 1 ? '' : 's'} joined`;
  document.getElementById('lobbyPlayers').innerHTML = players.map(p => `<div class="lobby-chip">${p.display_name}</div>`).join('');
  document.getElementById('btnStart').disabled = players.length === 0;
}

async function renderQuestion() {
  showState('Question');
  const q = session.questions_public[session.current_index];
  document.getElementById('qProgress').textContent = `Question ${session.current_index + 1} of ${session.question_count}`;
  document.getElementById('qText').textContent = q.q;
  document.getElementById('qOpts').innerHTML = q.opts.map((text, i) => `
    <div class="opt-tile c${i % 4}"><span class="opt-shape">${OPT_SHAPES[i % 4]}</span><span class="opt-label">${text}</span></div>
  `).join('');

  const players = await window.MagicLabGames.getParticipants(sessionId);
  const { total } = await window.MagicLabGames.getAnswerBreakdown(sessionId, session.current_index, q.opts.length);
  document.getElementById('qAnswered').textContent = `${total} of ${players.length} answered`;

  const started = session.question_started_at ? new Date(session.question_started_at).getTime() : Date.now();
  const elapsed = (Date.now() - started) / 1000;
  const pct = Math.max(0, Math.min(100, 100 - (elapsed / session.question_seconds) * 100));
  document.getElementById('qTimerFill').style.width = pct + '%';

  // Everyone's in — skip waiting out the timer and jump straight to reveal.
  if (players.length > 0 && total >= players.length) {
    await window.MagicLabGames.revealQuestion(sessionId);
    await tick();
  }
}

async function renderReveal() {
  showState('Reveal');
  const q = session.questions_public[session.current_index];
  document.getElementById('rProgress').textContent = `Question ${session.current_index + 1} of ${session.question_count} — Answer`;
  document.getElementById('rText').textContent = q.q;

  const { counts, total } = await window.MagicLabGames.getAnswerBreakdown(sessionId, session.current_index, q.opts.length);
  const correctIndex = await window.MagicLabGames.getCorrectOptionIndex(sessionId, session.current_index);
  document.getElementById('rOpts').innerHTML = q.opts.map((text, i) => {
    const pct = total ? Math.round((counts[i] / total) * 100) : 0;
    const isCorrect = i === correctIndex;
    return `
    <div class="opt-tile c${i % 4}${isCorrect ? ' correct' : ' dimmed'}">
      <div class="opt-bar" style="width:${pct}%"></div>
      <span class="opt-shape">${OPT_SHAPES[i % 4]}</span><span class="opt-label">${text}${isCorrect ? ' ✓' : ''}</span>
      <span class="opt-count">${counts[i]} (${pct}%)</span>
    </div>`;
  }).join('');

  document.getElementById('btnNext').textContent =
    session.current_index + 1 >= session.question_count ? 'Show Final Results' : 'Next Question';
}

async function renderEnded() {
  showState('Ended');
  const players = await window.MagicLabGames.getParticipants(sessionId);
  const top3 = players.slice(0, 3);
  const order = [1, 0, 2]; // 2nd, 1st, 3rd for podium visual layout
  document.getElementById('podium').innerHTML = order
    .filter(i => top3[i])
    .map(i => {
      const p = top3[i];
      const cls = i === 0 ? 'p1' : i === 1 ? 'p2' : 'p3';
      const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : '🥉';
      return `<div class="podium-spot ${cls}">
        <div class="podium-name">${p.display_name}</div>
        <div class="podium-score">${(p.score || 0).toLocaleString()} pts</div>
        <div class="podium-bar">${medal}</div>
      </div>`;
    }).join('');

  document.getElementById('fullLeaderboard').innerHTML = players.map((p, i) => `
    <div class="lb-row">
      <span class="lb-rank">#${i + 1}</span>
      <span class="lb-name">${p.display_name}</span>
      <span class="lb-score">${(p.score || 0).toLocaleString()} pts</span>
    </div>`).join('') || '<div style="color:var(--muted);font-size:13px;">No players joined.</div>';

  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}

async function onStart() {
  document.getElementById('btnStart').disabled = true;
  await window.MagicLabGames.startGame(sessionId);
  await tick();
}
async function onReveal() {
  await window.MagicLabGames.revealQuestion(sessionId);
  await tick();
}
async function onNext() {
  await window.MagicLabGames.nextQuestion(sessionId, session.current_index, session.question_count);
  await tick();
}
async function onEndQuiz() {
  if (!confirm('End this quiz now? Players will immediately see the final results.')) return;
  await window.MagicLabGames.endGame(sessionId);
  await tick();
}

document.addEventListener('magiclab:games:ready', () => {
  tick();
  pollTimer = setInterval(tick, 1500);
});
</script>
