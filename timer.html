/* ════════════════════════════════════════════════════════════════════════
   Timer Talisman — the display.

   Everything it shows comes from the link: the settings are in the URL
   hash (TTLink in assets/timer-talisman-themes.js), written by
   timer-talisman.html. So a teacher can open it in a
   new tab, or copy the link to the projector laptop, and get the same
   timer. A running timer's state (start time, pauses, laps) is kept in
   localStorage under a key made from the link, so a refresh does not lose
   it.

   The colours are the user's own, so this page does not load theme.js.
   Times are always worked out from the clock (Date.now), never by counting
   ticks, so a timer in a background tab stays correct.
   ════════════════════════════════════════════════════════════════════════ */
:root {
  --panel-w: min(500px, 94vw);
  --bg: #08090b; --fg: #f2f5f9; --accent: #ed5c86; --warn: #f5b041; --face: #111418;
  --font: 'Cabinet Grotesk', system-ui, sans-serif; --dsize: 1; --tsize: 1; --dweight: 800;
}
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font);
  display: flex; flex-direction: column; overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
body.hide-cursor { cursor: none; }
.stage {
  flex: 1; min-height: 0; box-sizing: border-box;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2.4vmin; padding: 5vmin 4vw 12vmin; text-align: center;
  position: relative;   /* above the screen fill */
}
/* Screen fill (look.fill): the background fills like a loading bar as the
   time runs out, left to right or bottom to top. The thin line marks where
   reading time ends in an exam. */
.fill { position: fixed; inset: 0; pointer-events: none; display: none; }
.fill-across .fill, .fill-up .fill { display: block; }
.fill i, .fill b { position: absolute; display: block; }
.fill i { background: color-mix(in srgb, var(--accent) 24%, var(--bg)); }
.fill-across .fill i { left: 0; top: 0; bottom: 0; border-right: 0.6vmin solid var(--accent); }
.fill-up .fill i { left: 0; right: 0; bottom: 0; border-top: 0.6vmin solid var(--accent); }
.fill i.zero { border: 0; }
.fill.alt i { background: color-mix(in srgb, var(--accent) 12%, var(--bg)); }
.fill.warn i { background: color-mix(in srgb, var(--warn) 26%, var(--bg)); border-color: var(--warn); }
/* with a picture: a pale, grey copy under the full-colour one, which is
   uncovered as the time runs out; a light veil of the background colour keeps
   the text readable */
.fill .pic { position: absolute; inset: 0; background-size: cover; background-position: center; display: none; }
.has-pic .fill .pic { display: block; }
.fill .pic0 { filter: grayscale(1) contrast(0.45) brightness(1.7); opacity: 0.7; }
.fill .veil { position: absolute; inset: 0; display: none; background: color-mix(in srgb, var(--bg) 38%, transparent); }
.has-pic .fill .veil { display: block; }
.has-pic .fill i, .has-pic .fill.alt i, .has-pic .fill.warn i { background: transparent; }
.has-pic .stage, .has-pic .now { text-shadow: 0 0.2vmin 1vmin color-mix(in srgb, var(--bg) 85%, transparent); }
.fill-across .fill b { top: 0; bottom: 0; border-left: 2px dashed color-mix(in srgb, var(--fg) 35%, transparent); }
.fill-up .fill b { left: 0; right: 0; border-top: 2px dashed color-mix(in srgb, var(--fg) 35%, transparent); }
.head:empty, .info:empty { display: none; }
/* a long heading wraps before it reaches the time in the top corner */
.head { max-width: calc(100vw - 6vw - 18vmin * var(--tsize)); }
/* the status lines keep their space even when empty, so nothing jumps up or
   down when "Paused" or an end time appears; a clock never uses them */
.phase, .sub { min-height: 1.3em; }
.mode-clock .phase, .mode-clock .sub { display: none; }
/* every digit sits in a slot as wide as the font's widest digit (--dw), so
   the time keeps one width while it counts and the layout never re-centres */
.digital .dc { display: inline-block; width: var(--dw, 0.62em); text-align: center; }
.head .title { font-weight: 800; font-size: calc(5.4vmin * var(--tsize)); line-height: 1.1; letter-spacing: -0.02em; }
.head .meta { font-size: calc(2.9vmin * var(--tsize)); opacity: 0.75; margin-top: 0.8vmin; }
.phase { font-size: calc(3.4vmin * var(--tsize)); font-weight: 700; color: var(--accent); }
.faces { display: flex; align-items: center; justify-content: center; gap: 6vw; flex-wrap: wrap; min-height: 0; }
.digital {
  font-size: calc(19vmin * var(--dsize)); font-weight: var(--dweight); line-height: 1;
  font-variant-numeric: tabular-nums; letter-spacing: -0.02em; white-space: nowrap;
}
.both .digital { font-size: calc(14vmin * var(--dsize)); }
.analogue { width: calc(48vmin * var(--dsize)); height: calc(48vmin * var(--dsize)); max-width: 88vw; max-height: 60vh; }
.both .analogue { width: calc(50vmin * var(--dsize)); height: calc(50vmin * var(--dsize)); max-height: 66vh; }
/* with a clock beside the digits, the status lines sit above and below the
   digits in this column, so the clock can use their height as well */
.dcol { display: flex; flex-direction: column; align-items: center; gap: 1.6vmin; min-width: 0; }
.sub { font-size: calc(2.7vmin * var(--tsize)); opacity: 0.8; font-variant-numeric: tabular-nums; }
.info {
  font-size: calc(2.7vmin * var(--tsize)); line-height: 1.45; white-space: pre-line;
  max-width: min(80vw, 60em); opacity: 0.9;
  border-top: 1px solid color-mix(in srgb, var(--fg) 22%, transparent); padding-top: 2vmin;
}
.laps { font-size: calc(2.4vmin * var(--tsize)); font-variant-numeric: tabular-nums; opacity: 0.85; columns: 2; column-gap: 4vw; max-height: 18vh; overflow: hidden; }
.laps:empty { display: none; }
.now { position: fixed; top: 2.4vmin; right: 3vw; font-size: calc(2.6vmin * var(--tsize)); opacity: 0.7; font-variant-numeric: tabular-nums; }
/* Layouts (look.layout), from least to most information. "standard" is
   the original page and needs no rules. */
.lay-minimal .head, .lay-minimal .phase, .lay-minimal .sub, .lay-minimal .info,
.lay-minimal .laps, .lay-minimal .now { display: none; }
.lay-simple .head .meta, .lay-simple .sub, .lay-simple .info, .lay-simple .laps { display: none; }
.lay-detailed .sub, .lay-detailed .info, .lay-detailed .now { display: none; }
.facts { display: none; }
.lay-detailed .facts {
  display: block; text-align: left; flex: 0 0 auto; box-sizing: border-box; width: clamp(240px, calc(30vw * var(--tsize)), 44vw); min-width: 0;
  border-left: 1px solid color-mix(in srgb, var(--fg) 22%, transparent); padding-left: 3vw;
  font-size: calc(2.6vmin * var(--tsize)); overflow: hidden;
}
.facts dl { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3.4vmin 3vw; margin: 0; }
/* each fact: its label above a large value, two to a row */
.facts .fact { display: flex; flex-direction: column; gap: 0.6vmin; min-width: 0; }
.facts dt { opacity: 0.75; line-height: 1.2; }
.facts dd { margin: 0; text-align: left; font-weight: 800; font-size: 1.6em; line-height: 1.1; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.facts .fnote { white-space: pre-line; line-height: 1.45; opacity: 0.9; margin-top: 2.6vmin; padding-top: 2vmin;
  border-top: 1px solid color-mix(in srgb, var(--fg) 22%, transparent); }
.facts .fnote:empty { display: none; }
/* a tall, narrow screen puts the side panel under the timer */
.lay-detailed .stage.narrow .faces { flex-wrap: wrap; row-gap: 3vmin; }
.lay-detailed .stage.narrow .facts { flex-basis: 100%; width: auto; max-width: 560px; border-left: 0; padding-left: 0;
  border-top: 1px solid color-mix(in srgb, var(--fg) 22%, transparent); padding-top: 2vmin; }
/* Several subjects in one venue (exam.count): one column each, with its own
   time left and finish time, in place of the single time */
.multi { display: none; justify-content: center; align-items: stretch; min-width: 0; }
.is-multi .multi { display: flex; }
.multi .col { flex: 1 1 0; min-width: 0; padding: 0 2vw; display: flex; flex-direction: column; align-items: center; gap: 1vmin; }
.multi .col + .col { border-left: 1px solid color-mix(in srgb, var(--fg) 22%, transparent); }
.multi .cname { font-weight: 800; font-size: var(--cname, calc(4.4vmin * var(--tsize))); line-height: 1.1; letter-spacing: -0.02em; max-width: 100%; }
.multi .cpaper { font-size: calc(2.6vmin * var(--tsize)); opacity: 0.75; }
.multi .cphase { font-size: calc(2.9vmin * var(--tsize)); font-weight: 700; color: var(--accent); min-height: 1.3em; }
.multi .ctime { font-size: var(--ctime, 12vmin); font-weight: var(--dweight); line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; white-space: nowrap; }
.multi .ctime:empty { display: none; }
.multi .ctime .dc { display: inline-block; width: var(--dw, 0.62em); text-align: center; }
.multi .csub { font-size: calc(2.4vmin * var(--tsize)); opacity: 0.8; font-variant-numeric: tabular-nums; min-height: 1.3em; }
.multi .cpaper:empty { display: none; }
.multi .warn .cphase, .multi .warn .ctime { color: var(--warn); }
.multi .done .ctime { animation: blink 1s steps(2, start) infinite; font-size: var(--cdone, var(--ctime, 12vmin)); }
.lay-minimal .multi .cpaper, .lay-minimal .multi .csub, .lay-simple .multi .cpaper, .lay-simple .multi .csub { display: none; }
.warn .digital, .warn .phase { color: var(--warn); }
.done .digital { animation: blink 1s steps(2, start) infinite; }
@keyframes blink { 50% { opacity: 0.3; } }
@media (prefers-reduced-motion: reduce) { .done .digital { animation: none; } }

.bar {
  position: fixed; left: 50%; bottom: 2.4vmin; transform: translateX(-50%);
  display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; padding: 14px;
  border-radius: 999px; width: max-content; max-width: calc(100vw - 24px); box-sizing: border-box;
  background: color-mix(in srgb, var(--fg) 9%, var(--bg));
  border: 1px solid color-mix(in srgb, var(--fg) 14%, transparent);
  font-family: 'Cabinet Grotesk', system-ui, sans-serif;
  transition: opacity 0.3s;
}
.bar.idle { opacity: 0; pointer-events: none; }
.bar button {
  font: inherit; font-size: 24px; font-weight: 700; color: var(--fg); background: transparent;
  border: 1px solid color-mix(in srgb, var(--fg) 26%, transparent); border-radius: 999px;
  padding: 18px 26px; display: inline-flex; align-items: center; gap: 12px; cursor: pointer;
}
.bar button:hover { border-color: var(--fg); }
.bar button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.bar button.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.bar button svg { width: 26px; height: 26px; }
.bar button.icon-only { padding: 18px 20px; }
.preview .bar button { font-size: 12px; padding: 6px 10px; }
.preview .bar button svg { width: 13px; height: 13px; }

/* ── Display settings panel ── */
.panel {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 20; box-sizing: border-box;
  width: var(--panel-w); overflow-y: auto; padding: 22px 22px 34px;
  background: color-mix(in srgb, var(--fg) 7%, var(--bg)); color: var(--fg);
  border-left: 1px solid color-mix(in srgb, var(--fg) 18%, transparent);
  box-shadow: -12px 0 32px rgba(0, 0, 0, 0.28);
  font-family: 'Cabinet Grotesk', system-ui, sans-serif; font-size: 17px;
}
.panel[hidden] { display: none; }
/* while the panel is open the timer moves aside, so changes stay in view */
.panel-open .stage { padding-right: calc(var(--panel-w) + 3vw); }
.panel-open .now { right: calc(var(--panel-w) + 3vw); }
.panel-open .bar { left: calc((100vw - var(--panel-w)) / 2); }
.ph { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
.ph h2 { font-size: 22px; font-weight: 800; margin: 0; }
.pf { display: flex; flex-direction: column; gap: 7px; margin-bottom: 17px; }
.pf > span, .plabel { font-size: 15px; font-weight: 700; opacity: 0.85; }
.pf[hidden] { display: none; }
.prow { display: flex; gap: 6px; }
#pFontPick { --fp-bg: var(--bg); --fp-fg: var(--fg); --fp-line: color-mix(in srgb, var(--fg) 30%, transparent); --fp-hl: color-mix(in srgb, var(--fg) 12%, transparent); --fp-accent: var(--accent); }
.prow select { flex: 1; min-width: 0; }
.panel select, .panel input[type="color"] {
  font: inherit; color: var(--fg); background: var(--bg); box-sizing: border-box; width: 100%;
  border: 1px solid color-mix(in srgb, var(--fg) 30%, transparent); border-radius: 8px; padding: 10px;
}
.panel input[type="color"] { padding: 2px; height: 42px; cursor: pointer; }
.pcols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px; }
.pcols label { display: flex; align-items: center; gap: 10px; font-size: 15px; cursor: pointer; }
.pcols input[type="color"] { width: 48px; height: 36px; flex-shrink: 0; }
.pseg { display: flex; gap: 6px; }
.pseg button, .pclose {
  font: inherit; font-size: 15px; font-weight: 700; color: var(--fg); background: transparent; cursor: pointer;
  border: 1px solid color-mix(in srgb, var(--fg) 28%, transparent); border-radius: 999px; padding: 10px 10px;
}
.pseg button { flex: 1; }
.pseg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.pclose { display: inline-flex; padding: 7px; }
.pclose svg { width: 20px; height: 20px; }
.pclose[hidden] { display: none; }
.pchk { display: flex; align-items: center; gap: 11px; margin-bottom: 12px; cursor: pointer; }
.pchk input { width: 20px; height: 20px; margin: 0; }
.panel input[type="checkbox"], .panel input[type="range"] { accent-color: var(--accent); }
.panel input[type="range"] { width: 100%; height: 22px; }
.panel input:disabled { opacity: 0.4; }
.pnote { font-size: 14px; line-height: 1.5; opacity: 0.8; margin: 16px 0 0; }
.ttp-what { font-size: 14px; line-height: 1.45; opacity: 0.85; white-space: pre-line; }
.panel :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  // ── Fill the screen: size the faces to the space the other lines leave ──
  function fit() {
    var dg = $('digital'), an = $('analogue'), faces = $('faces'), stage = $('stage');
    stage.classList.toggle('narrow', stage.clientWidth < stage.clientHeight * 1.15);
    // "Fill the screen" makes the timer as big as the room allows; otherwise
    // the size slider sets it, but never bigger than that room
    var cs = getComputedStyle(stage), gap = parseFloat(cs.rowGap) || 0;
    var W = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    var H = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    [].forEach.call(stage.children, function (c) { if (c !== faces && c.offsetParent) H -= c.offsetHeight + gap; });
    H = Math.max(40, H);
    var showA = an.style.display !== 'none', showD = dg.style.display !== 'none';
    var mu = $('multi'), showM = !!mu.offsetParent && mu.children.length > 0;
    // the Detailed layout's side panel: beside the timer, or under it on a tall screen
    var facts = $('facts'), under = !!facts.offsetParent && stage.classList.contains('narrow');
    // several subjects before a set start: the countdown to the start on top, the columns under it
    var stack = showM && showD;
    faces.style.flexWrap = under || stack ? 'wrap' : 'nowrap';
    var Hd = stack ? H * 0.5 : H;
    // big text on a small screen: the panel's text shrinks until it fits
    facts.style.fontSize = '';
    if (facts.offsetParent) {
      var room = under ? H * 0.45 : H;
      var shrink = Math.min(1, room / facts.offsetHeight, facts.clientWidth / facts.scrollWidth);
      if (shrink < 1) facts.style.fontSize = parseFloat(getComputedStyle(facts).fontSize) * shrink * 0.95 + 'px';
      if (under) H = Math.max(40, H - facts.offsetHeight - (parseFloat(getComputedStyle(faces).rowGap) || 0));
      else W -= facts.offsetWidth + Math.min(W * 0.04, 48);
    }
    var vmin = Math.min(window.innerWidth, window.innerHeight) / 100, own = cfg.look.fit ? Infinity : vmin * Math.max(0.3, Math.min(3, cfg.look.size / 100));
    var side = showD || showM, fgap = showA && side ? Math.min(W * 0.04, 48) : 0, a = 0;
    faces.style.columnGap = Math.min(W * 0.04, 48) + 'px';
    // beside several subject columns the clock takes a smaller share of the width
    var share = showM ? 0.3 : 0.48;
    if (showA) { a = Math.min(side ? Math.min(Hd, W * share) : Math.min(Hd, W), own * (side ? 50 : 48)); an.style.width = an.style.height = a + 'px'; an.style.maxHeight = 'none'; }
    if (showD) {
      // the digits share their column with the status lines beside a clock
      var col = $('dcol'), ch = 0, cgap = parseFloat(getComputedStyle(col).rowGap) || 0;
      [].forEach.call(col.children, function (c) { if (c !== dg && c.offsetParent) ch += c.offsetHeight + cgap; });
      dg.style.fontSize = '100px';
      var w = dg.scrollWidth || 1, h = dg.offsetHeight || 1;
      dg.style.fontSize = Math.floor(Math.min((W - a - fgap) / w * 97, Math.max(20, Hd - ch) / h * 97, own * (showA ? 14 : 19))) + 'px';
      // above the columns while a set start is still ahead: the columns need their room too
      if (stack) H = Math.max(40, H - Math.max(a, $('dcol').offsetHeight) - (parseFloat(getComputedStyle(faces).rowGap) || 0));
    }
    if (showM) {

      // are redrawn as the seconds tick)
      var names = [].slice.call(mu.querySelectorAll('.cname'));
      mu.style.removeProperty('--cname');

      var nk = Math.min.apply(null, names.map(function (e) { return e.scrollWidth > e.clientWidth ? e.clientWidth / e.scrollWidth : 1; }));

      if (times.length) {
        mu.style.setProperty('--ctime', '100px');
        var cw = (mw / cols.length) - parseFloat(getComputedStyle(cols[0]).paddingLeft) * 2;

      $('pPicPick').addEventListener('click', function () { $('pPicFile').click(); });
      $('pPicFile').addEventListener('change', function () {
        var file = this.files && this.files[0]; if (!file) return;
        TTPicture.save(file, function (ok) {
          if (!ok) { alert(t('pPicBad')); return; }
          loadPicture(); L.pic = true; lookChanged(); buildPanel(); $('pPicPick').focus();
        });
      });
      $('pPicOff').addEventListener('click', function () { TTPicture.clear(); loadPicture(); L.pic = false; lookChanged(); buildPanel(); $('pPicPick').focus(); });
    }
    if ($('pAudPick')) {
      $('pAudPick').addEventListener('click', function () { $('pAudFile').click(); });
      $('pAudFile').addEventListener('change', function () {
        var file = this.files && this.files[0]; if (!file) return;
        TTAudio.save(file, function (ok) {
          if (!ok) { alert(t('pAudioBad')); return; }
          cfg.exam.audio = true; lookChanged();
          loadAudio(function () { buildPanel(); $('pAudPick').focus(); });
        });
      });
      $('pAudOff').addEventListener('click', function () {
        TTAudio.clear(function () { loadAudio(function () { buildPanel(); $('pAudPick').focus(); }); });
      });
      $('pAudOn').addEventListener('change', function () { cfg.exam.audio = this.checked; if (!this.checked && audio) audio.pause(); lookChanged(); });
    }
    [['#pStyle', 'display'], ['#pLayout', 'layout'], ['#pFill', 'fill']].forEach(function (g) {
      [].forEach.call(p.querySelectorAll(g[0] + ' button'), function (b) {
        b.addEventListener('click', function () {
          L[g[1]] = b.getAttribute('data-v');
          [].forEach.call(p.querySelectorAll(g[0] + ' button'), function (x) { x.setAttribute('aria-pressed', x === b); });
          lookChanged();
        });
      });
    });
    [].forEach.call(p.querySelectorAll('[data-l]'), function (inp) {
      var ev = inp.type === 'range' || inp.type === 'color' ? 'input' : 'change';
      inp.addEventListener(ev, function () {
        var k = inp.getAttribute('data-l');
        L[k] = inp.type === 'checkbox' ? inp.checked : inp.type === 'range' ? +inp.value : inp.value;
        if (k === 'size' || k === 'fit') { $('pSizeOut').textContent = L.fit ? '—' : L.size + '%'; $('pSize').disabled = !!L.fit; }
        if (k === 'tsize') $('pTsizeOut').textContent = L.tsize + '%';
        if (inp.type === 'color') themeList = TTThemes.fill($('pTheme'), L, cfg.lang).shown;
        lookChanged();
      });
    });
  }
  // ── Fill in the exam from the timetable, from this panel ──
  var TT = null;   // the timetable, once it has loaded (TTTimetable, in the themes file)
  function ttToday() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function ttDayLabel(d) { return new Date(d + 'T12:00').toLocaleDateString(locale(), { weekday: 'short', day: 'numeric', month: 'long' }); }
  function ttOpts(list, label, cur) { return list.map(function (v) { return '<option value="' + esc(v) + '"' + (v === cur ? ' selected' : '') + '>' + esc(label(v)) + '</option>'; }).join(''); }
  function ttLen(m) { var h = Math.floor(m / 60), mm = m % 60; return (h ? h + ' ' + t('h') : '') + (h && mm ? ' ' : '') + (mm ? mm + ' ' + t('min') : ''); }
  function ttListText(date, start, venue) {
    return TTTimetable.columns(TT, date, start, venue, cfg.lang).map(function (c) { return c.name + ' · ' + c.paper + ' · ' + ttLen(c.mins); }).join('\n');
  }
  function ttPanelHtml() {
    if (cfg.mode !== 'exam' || !TT) return '';
    var days = TTTimetable.days(TT), date = days.indexOf(cfg.exam.date) >= 0 ? cfg.exam.date : (days.filter(function (d) { return d >= ttToday(); })[0] || days[days.length - 1]);
    var starts = TTTimetable.sessions(TT, date), start = starts[0], venues = TTTimetable.venues(TT, date, start);
    var same = function (v) { return v; };
    return '<div class="pf ttp"><span class="plabel">' + esc(t('ttTitle')) + '</span>' +
      '<select id="pTtDate">' + ttOpts(days, ttDayLabel, date) + '</select>' +
      '<select id="pTtSession">' + ttOpts(starts, same, start) + '</select>' +
      '<select id="pTtVenue">' + ttOpts(venues, same, venues[0]) + '</select>' +
      '<div class="ttp-what" id="pTtWhat"></div>' +
      '<button type="button" class="pclose" id="pTtFill" style="justify-content:center">' + esc(t('ttFill')) + '</button></div>';
  }
  function ttPanelWire() {
    if (!$('pTtDate')) return;
    var d = $('pTtDate'), s = $('pTtSession'), v = $('pTtVenue'), same = function (x) { return x; };
    var show = function (prefix) {
      $('pTtWhat').textContent = (prefix ? prefix + '\n' : '') + (d.value && s.value && v.value ? ttListText(d.value, s.value, v.value) : '');
    };
    d.addEventListener('change', function () {
      var starts = TTTimetable.sessions(TT, d.value);
      s.innerHTML = ttOpts(starts, same, starts[0]);
      v.innerHTML = ttOpts(TTTimetable.venues(TT, d.value, s.value), same);
      show();
    });
    s.addEventListener('change', function () { v.innerHTML = ttOpts(TTTimetable.venues(TT, d.value, s.value), same); show(); });
    v.addEventListener('change', function () { show(); });
    $('pTtFill').addEventListener('click', function () {
      var f = TTTimetable.fill(TT, d.value, s.value, v.value, cfg.lang);
      if (!f) return;
      if (f.more) alert(t('ttMany'));
      Object.assign(cfg.exam, f.exam);
      lookChanged(); start(cfg);   // a new exam has its own saved progress, so start again
      show(t('ttDone'));
    });
    show();
  }
  function togglePanel(open) {
    panelOpen = open === undefined ? !panelOpen : open;
    if (panelOpen) { buildPanel(); $('panel').hidden = false; $('pTheme').focus(); }
    else { $('panel').hidden = true; }
    document.body.classList.toggle('panel-open', panelOpen);
    fit(); wake();
  }

  var ticking = null;
  function init() {
    TTLink.decode(location.hash.slice(1)).then(start);
  }
  function start(c) {
    cfg = c;
    TTTimetable.load(function (data) { TT = data; });
    loadPicture();
    if (!audioAsked) { audioAsked = true; loadAudio(); }
    var x = cfg.exam;
    key = 'ml-timer-talisman:' + hash(JSON.stringify([cfg.mode, cfg.cd, cfg.pomo, x.reading, x.writing, x.start, x.date, x.subject]));
    st = loadState(); lastPhase = null; view = {};
    applyLook(); render(true); wake();
    if (running()) keepAwake();
    if (!ticking) ticking = setInterval(function () { render(false); }, 100);
  }

  window.addEventListener('hashchange', init);
  ['mousemove', 'pointerdown', 'touchstart'].forEach(function (ev) { document.addEventListener(ev, function () { if (cfg) wake(); }, { passive: true }); });
  // a click anywhere lets the browser play the chime later
  document.addEventListener('pointerdown', function () { TTSounds.unlock(); }, { passive: true });
  document.addEventListener('keydown', function (e) {
    if (!cfg || e.ctrlKey || e.metaKey || e.altKey) return;
    TTSounds.unlock();
    wake();
    if (e.key === 'Escape' && panelOpen) { togglePanel(false); return; }
    if (e.target.closest && (e.target.closest('#panel') || (e.target.tagName === 'BUTTON' && (e.key === ' ' || e.key === 'Enter')))) return;
    var k = e.key.toLowerCase();
    if (k === ' ') { e.preventDefault(); if (!(cfg.mode === 'exam' && examStart() && !st.started)) toggle(); }
    else if (k === 'r') reset();
    else if (k === 'f') fullscreen();
    else if (k === 'i') toggleAudio();
    else if (k === 'l' && cfg.mode === 'stopwatch' && running()) { st.laps.push(elapsed()); save(); render(true); }
    else if ((k === '+' || k === '=') && st.started && (cfg.mode === 'countdown' || cfg.mode === 'exam')) adjust(1);
    else if (k === '-' && st.started && (cfg.mode === 'countdown' || cfg.mode === 'exam')) adjust(-1);
  });
  // slots are measured from the real font, so measure again once the page's
  // fonts (Cabinet Grotesk comes from Fontshare) have arrived
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { if (cfg) { measureDigits(); fit(); } });
  init();
})();
</script>
</body>
