<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0f1e">
  <title>Computer Codex — Digital Literacy</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23475569'/%3E%3Crect x='10' y='8' width='28' height='36' rx='3' fill='none' stroke='%23cbd5e1' stroke-width='3'/%3E%3Crect x='8' y='12' width='6' height='28' rx='2' fill='rgba(203,213,225,0.2)' stroke='rgba(203,213,225,0.5)' stroke-width='2'/%3E%3Cline x1='17' y1='17' x2='33' y2='17' stroke='%23cbd5e1' stroke-width='2' stroke-linecap='round'/%3E%3Cline x1='17' y1='22' x2='31' y2='22' stroke='%23cbd5e1' stroke-width='2' stroke-linecap='round'/%3E%3Cline x1='17' y1='27' x2='33' y2='27' stroke='%23cbd5e1' stroke-width='2' stroke-linecap='round'/%3E%3Ctext x='38' y='56' font-family='monospace' font-size='12' fill='%23818cf8'%3E01%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cabinet+Grotesk:wght@400;500;700;800;900&family=JetBrains+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="auth-modal.css">
  <script defer src="auth.js"></script>
  <script defer src="progress.js"></script>
  <script defer src="auth-modal.js"></script>
  <style>
    :root {
      --bg: #080c1a; --bg2: #0d1226;
      --surface: rgba(255,255,255,0.048); --surface2: rgba(255,255,255,0.032);
      --border: rgba(255,255,255,0.085); --border2: rgba(255,255,255,0.055);
      --text: #e4e8f8; --text2: rgba(210,218,245,0.65); --muted: rgba(210,218,245,0.38);
      --accent-1: #7c6dfa; --accent-2: #11d98f; --accent-3: #f5a623;
      --font-display: "Cabinet Grotesk", sans-serif;
      --font-body: "Cabinet Grotesk", sans-serif;
      --font-mono: "JetBrains Mono", monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; width: 100%; overflow: hidden; }
    body {
      font-family: var(--font-body); font-size: 15px;
      background: var(--bg); color: var(--text);
      display: flex; flex-direction: column; height: 100%;
      -webkit-font-smoothing: antialiased;
    }

    /* ── App shell ── */
    #appShell {
      height: 100%; display: flex; flex-direction: column; overflow: hidden;
      background:
        radial-gradient(ellipse 55% 35% at 6%  4%, rgba(99,116,158,0.18) 0%, transparent 60%),
        radial-gradient(ellipse 45% 30% at 96%  6%, rgba(124,109,250,0.12) 0%, transparent 55%),
        radial-gradient(ellipse 35% 25% at 50% 98%, rgba(245,166,35,0.07) 0%, transparent 60%),
        var(--bg);
    }

    /* ── Header ── */
    #appHeader {
      flex-shrink: 0; display: flex; align-items: center; gap: 12px;
      padding: 10px 20px; border-bottom: 1px solid var(--border);
    }
    .home-btn {
      display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600;
      padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--surface); color: var(--muted);
      text-decoration: none; transition: all 140ms; flex-shrink: 0;
      font-family: var(--font-body);
    }
    .home-btn:hover { background: rgba(255,255,255,0.10); color: var(--text); border-color: rgba(255,255,255,0.16); }
    .app-icon {
      width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0;
      background: linear-gradient(135deg, #3d5068, #5256c8);
      display: flex; align-items: center; justify-content: center; font-size: 17px;
    }
    h1.app-title {
      font-family: var(--font-display); font-weight: 900; letter-spacing: -0.03em;
      font-size: clamp(17px, 1.8vw, 23px); line-height: 1;
      background: linear-gradient(125deg, #fff 0%, #cbd5e1 45%, #a89ffc 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .grade-badge {
      font-family: var(--font-mono); font-size: 10px; font-weight: 600;
      letter-spacing: 0.07em; text-transform: uppercase;
      padding: 3px 10px; border-radius: 99px;
      background: rgba(99,116,158,0.18); border: 1px solid rgba(99,116,158,0.30); color: #94a3b8;
    }
    .header-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .progress-text { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }

    /* ── Main layout ── */
    #mainLayout { flex: 1; display: flex; min-height: 0; overflow: hidden; }

    /* ── Sidebar ── */
    #sidebar {
      width: 272px; flex-shrink: 0;
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column; overflow: hidden;
      background: rgba(0,0,0,0.22);
    }
    #sidebarHeader {
      flex-shrink: 0; padding: 14px 16px 10px;
      border-bottom: 1px solid var(--border2);
    }
    .sidebar-title {
      font-family: var(--font-mono); font-size: 10px; font-weight: 600;
      letter-spacing: 0.10em; text-transform: uppercase; color: var(--muted);
    }
    #sidebarList { flex: 1; overflow-y: auto; padding-bottom: 14px; }

    /* ── Collapsible unit groups ── */
    .unit-group { }
    .unit-header {
      display: flex; align-items: center; gap: 8px;
      padding: 11px 16px 6px; cursor: pointer;
      border-top: 1px solid var(--border2);
      user-select: none; transition: background 120ms;
    }
    .unit-header:hover { background: rgba(255,255,255,0.03); }
    .unit-header-label {
      font-family: var(--font-mono); font-size: 9px; font-weight: 600;
      letter-spacing: 0.10em; text-transform: uppercase;
      color: rgba(210,218,245,0.28); flex: 1; line-height: 1.4;
    }
    .unit-header-count {
      font-family: var(--font-mono); font-size: 9px; color: rgba(210,218,245,0.20); flex-shrink: 0;
    }
    .unit-caret {
      font-size: 10px; color: rgba(210,218,245,0.28); flex-shrink: 0;
      transition: transform 200ms ease; display: inline-block;
    }
    .unit-group.collapsed .unit-lessons { display: none; }
    .lesson-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 16px; cursor: pointer; transition: background 110ms;
      border-left: 2px solid transparent;
    }
    .lesson-item:hover { background: rgba(255,255,255,0.04); }
    .lesson-item.active {
      background: rgba(124,109,250,0.10); border-left-color: var(--accent-1);
    }
    .lesson-num {
      font-family: var(--font-mono); font-size: 10px;
      color: rgba(210,218,245,0.22); width: 20px; flex-shrink: 0;
    }
    .lesson-name {
      font-size: 13px; font-weight: 500; color: var(--text2); line-height: 1.35;
    }
    .lesson-item.active .lesson-name { color: #c4baff; font-weight: 700; }
    .lesson-done { margin-left: auto; font-size: 11px; color: var(--accent-2); flex-shrink: 0; }

    /* ── Progress bar ── */
    #progressBar {
      flex-shrink: 0; padding: 10px 16px;
      border-top: 1px solid var(--border2);
    }
    .progress-label {
      font-family: var(--font-mono); font-size: 10px; color: var(--muted);
      margin-bottom: 6px; display: flex; justify-content: space-between;
    }
    .progress-track {
      height: 4px; background: rgba(255,255,255,0.08); border-radius: 99px; overflow: hidden;
    }
    .progress-fill {
      height: 100%; background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
      border-radius: 99px; transition: width 400ms ease;
    }

    /* ── Content area ── */
    #contentArea { flex: 1; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
    #lessonScroll { flex: 1; overflow-y: auto; padding: 36px 44px 28px; }

    /* ── Lesson content ── */
    .lesson-badge {
      display: inline-flex; align-items: center; gap: 6px;
      font-family: var(--font-mono); font-size: 10px; font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase;
      padding: 4px 12px; border-radius: 99px; margin-bottom: 14px;
      background: rgba(124,109,250,0.15); border: 1px solid rgba(124,109,250,0.28); color: var(--accent-1);
    }
    .lesson-title {
      font-family: var(--font-display); font-weight: 900; letter-spacing: -0.03em;
      font-size: clamp(22px, 2.5vw, 30px);
      color: #fff; margin-bottom: 8px; line-height: 1.1;
    }
    .lesson-subtitle { font-size: 15px; color: var(--muted); margin-bottom: 28px; }

    .lesson-body p { font-size: 15px; line-height: 1.8; color: var(--text2); margin-bottom: 16px; }
    .lesson-body p strong { color: var(--text); font-weight: 700; }
    .lesson-body p em { color: var(--accent-1); font-style: normal; font-weight: 700; }
    .lesson-body h3 {
      font-family: var(--font-display); font-weight: 800; font-size: 16px; letter-spacing: -0.01em;
      color: #c4baff; margin: 26px 0 12px; display: flex; align-items: center; gap: 8px;
    }
    .lesson-body ul, .lesson-body ol {
      font-size: 15px; line-height: 1.85; color: var(--text2);
      padding-left: 22px; margin-bottom: 16px;
    }
    .lesson-body li { margin-bottom: 4px; }

    /* Callouts */
    .callout {
      border-radius: 12px; padding: 14px 18px; margin-bottom: 18px;
      font-size: 14px; line-height: 1.7;
    }
    .callout.tip  { background: rgba(17,217,143,0.10); border: 1px solid rgba(17,217,143,0.22); color: #6ee7b7; }
    .callout.info { background: rgba(124,109,250,0.10); border: 1px solid rgba(124,109,250,0.25); color: #c4baff; }
    .callout.warn { background: rgba(245,166,35,0.10); border: 1px solid rgba(245,166,35,0.25); color: #fcd34d; }
    .callout strong { font-weight: 700; }

    .key-term {
      display: inline-block; background: rgba(124,109,250,0.12);
      border: 1px solid rgba(124,109,250,0.25); border-radius: 6px;
      padding: 2px 8px; font-size: 13px; color: #c4baff;
      font-family: var(--font-mono);
    }

    .visual-box {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 14px; padding: 18px 22px; margin-bottom: 18px;
    }
    .visual-box-title {
      font-family: var(--font-mono); font-size: 10px; font-weight: 600;
      letter-spacing: 0.09em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 14px;
    }

    .win-mockup {
      background: #1e2030; border: 1px solid rgba(255,255,255,0.10);
      border-radius: 10px; overflow: hidden; margin-bottom: 18px; font-size: 12px;
    }
    .win-titlebar {
      background: #2d3148; padding: 6px 12px;
      display: flex; align-items: center; gap: 8px;
    }
    .win-dot { width: 10px; height: 10px; border-radius: 50%; }
    .win-titlebar-text { font-size: 12px; color: var(--muted); flex: 1; text-align: center; }
    .win-body { padding: 14px 16px; }

    .taskbar {
      background: rgba(15,20,40,0.95); border: 1px solid var(--border);
      border-radius: 10px; padding: 7px 14px;
      display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
      font-size: 12px; flex-wrap: wrap;
    }
    .taskbar-icon { width: 30px; height: 30px; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; }
    .taskbar-label { font-size: 10px; color: var(--muted); text-align: center; margin-top: 2px; }
    .taskbar-group { display: flex; flex-direction: column; align-items: center; }

    .file-tree {
      background: #0f1220; border: 1px solid var(--border);
      border-radius: 10px; padding: 12px 14px; margin-bottom: 14px;
      font-family: var(--font-mono); font-size: 12px;
    }
    .file-row { display: flex; align-items: center; gap: 7px; padding: 3px 0; color: var(--text2); }
    .file-row.folder { color: #fbbf24; }
    .file-row.indent-1 { padding-left: 18px; }
    .file-row.indent-2 { padding-left: 36px; }
    .file-row.highlight { background: rgba(124,109,250,0.15); border-radius: 5px; padding: 3px 8px; color: #c4baff; }

    .ext-table { width: 100%; border-collapse: collapse; margin-bottom: 18px; font-size: 13px; }
    .ext-table th { text-align: left; padding: 8px 14px; font-family: var(--font-mono); font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--border2); }
    .ext-table td { padding: 8px 14px; border-bottom: 1px solid rgba(255,255,255,0.04); color: var(--text2); }
    .ext-table tr:last-child td { border-bottom: none; }
    .ext-tag { display: inline-block; padding: 2px 8px; border-radius: 5px; font-family: var(--font-mono); font-size: 11px; font-weight: 600; }

    .ribbon { background: #1a3a5c; border: 1px solid rgba(255,255,255,0.10); border-radius: 10px; overflow: hidden; margin-bottom: 18px; }
    .ribbon-tabs { background: #12293f; display: flex; padding: 0 10px; }
    .ribbon-tab { padding: 7px 15px; font-size: 12px; font-weight: 600; color: var(--muted); cursor: default; border-bottom: 2px solid transparent; }
    .ribbon-tab.active { color: #fff; border-bottom-color: #2196f3; }
    .ribbon-body { padding: 12px 16px; display: flex; gap: 18px; align-items: flex-start; flex-wrap: wrap; }
    .ribbon-group { display: flex; flex-direction: column; align-items: center; gap: 5px; padding-right: 18px; border-right: 1px solid var(--border2); }
    .ribbon-group:last-child { border-right: none; }
    .ribbon-group-label { font-size: 10px; color: var(--muted); margin-top: 2px; }
    .ribbon-btns { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; }
    .ribbon-btn { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 5px 8px; border-radius: 5px; background: var(--surface); border: 1px solid var(--border2); cursor: default; min-width: 38px; }
    .ribbon-btn-icon { font-size: 15px; }
    .ribbon-btn-label { font-size: 10px; color: var(--muted); white-space: nowrap; }
    .ribbon-btn.big { padding: 9px 11px; min-width: 46px; }
    .ribbon-btn.big .ribbon-btn-icon { font-size: 22px; }

    .shortcut-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 9px; margin-bottom: 18px; }
    .shortcut-card { background: var(--surface2); border: 1px solid var(--border2); border-radius: 10px; padding: 11px 14px; display: flex; align-items: center; gap: 12px; }
    .shortcut-keys { display: flex; align-items: center; gap: 3px; flex-shrink: 0; }
    .kbd { background: rgba(255,255,255,0.09); border: 1px solid rgba(255,255,255,0.16); border-bottom: 2px solid rgba(255,255,255,0.10); border-radius: 5px; padding: 2px 7px; font-family: var(--font-mono); font-size: 11px; color: #c4baff; white-space: nowrap; }
    .shortcut-desc { font-size: 12px; color: var(--text2); }

    .excel-grid { background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 18px; font-family: var(--font-mono); font-size: 12px; }
    .excel-row { display: flex; border-bottom: 1px solid var(--border2); }
    .excel-row:last-child { border-bottom: none; }
    .excel-cell { padding: 6px 10px; border-right: 1px solid rgba(255,255,255,0.05); min-width: 84px; color: var(--text2); }
    .excel-cell:last-child { border-right: none; }
    .excel-cell.header { background: var(--surface); color: var(--muted); font-weight: 600; text-align: center; }
    .excel-cell.row-header { background: rgba(255,255,255,0.04); color: var(--muted); text-align: center; min-width: 38px; }
    .excel-cell.formula { color: #86efac; }
    .excel-cell.result  { color: #fbbf24; font-weight: 700; }
    .excel-cell.abs     { color: #f472b6; }
    .excel-cell.active  { background: rgba(124,109,250,0.15); color: #c4baff; outline: 1px solid var(--accent-1); }

    .formula-card { background: var(--surface2); border: 1px solid var(--border2); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
    .formula-name { font-family: var(--font-mono); font-size: 14px; font-weight: 600; color: #86efac; margin-bottom: 5px; }
    .formula-syntax { font-family: var(--font-mono); font-size: 12px; color: var(--muted); margin-bottom: 7px; }
    .formula-desc { font-size: 13px; color: var(--text2); margin-bottom: 7px; }
    .formula-example { font-family: var(--font-mono); font-size: 12px; background: rgba(0,0,0,0.30); border-radius: 6px; padding: 4px 10px; color: #fbbf24; display: inline-block; }

    /* Quiz */
    .quiz-section { margin: 22px 0 18px; }
    .quiz-toggle {
      display: flex; align-items: center; gap: 8px;
      padding: 11px 16px; border-radius: 12px; width: 100%;
      background: rgba(124,109,250,0.08); border: 1px solid rgba(124,109,250,0.20);
      color: #c4baff; font-family: var(--font-body);
      font-size: 14px; font-weight: 700; cursor: pointer;
      transition: all 150ms; text-align: left;
    }
    .quiz-toggle:hover { background: rgba(124,109,250,0.15); border-color: rgba(124,109,250,0.32); }
    .quiz-toggle .toggle-icon { margin-left: auto; font-size: 15px; transition: transform 200ms; }
    .quiz-toggle.open { background: rgba(124,109,250,0.14); border-color: rgba(124,109,250,0.32); }
    .quiz-toggle.open .toggle-icon { transform: rotate(180deg); }
    .quiz-inner { display: none; padding-top: 14px; }
    .quiz-inner.open { display: block; }
    .quiz-box { background: var(--surface2); border: 1px solid var(--border2); border-radius: 12px; padding: 16px 18px; margin: 20px 0 18px; }
    .quiz-q { font-size: 15px; font-weight: 700; color: #c4baff; margin-bottom: 12px; }
    .quiz-opts { display: flex; flex-direction: column; gap: 7px; }
    .quiz-opt { padding: 10px 14px; border-radius: 9px; background: var(--surface); border: 1px solid var(--border2); color: var(--text2); font-size: 14px; cursor: pointer; transition: all 120ms; text-align: left; font-family: var(--font-body); }
    .quiz-opt:hover { background: rgba(255,255,255,0.09); }
    .quiz-opt.correct { background: rgba(17,217,143,0.14); border-color: rgba(17,217,143,0.38); color: #6ee7b7; }
    .quiz-opt.wrong   { background: rgba(239,68,68,0.12); border-color: rgba(239,68,68,0.35); color: #fca5a5; }
    .quiz-feedback { font-size: 13px; margin-top: 9px; min-height: 18px; }
    .quiz-feedback.correct { color: #6ee7b7; }
    .quiz-feedback.wrong   { color: #fca5a5; }

    /* Bottom nav */
    #bottomNav {
      flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
      padding: 12px 24px; border-top: 1px solid var(--border);
      background: rgba(0,0,0,0.22);
    }
    .nav-btn {
      display: flex; align-items: center; gap: 7px; padding: 9px 20px;
      border-radius: 10px; border: none; cursor: pointer;
      font-family: var(--font-body); font-size: 14px; font-weight: 700;
      transition: all 140ms; letter-spacing: -0.01em;
    }
    #prevBtn { background: var(--surface); border: 1px solid var(--border); color: var(--text2); }
    #prevBtn:hover { background: rgba(255,255,255,0.10); }
    #nextBtn { background: linear-gradient(135deg,#3d5068,#5256c8); color: #fff; box-shadow: 0 3px 14px rgba(82,86,200,0.28); }
    #nextBtn:hover { box-shadow: 0 5px 18px rgba(82,86,200,0.44); }
    #lessonCounter { font-family: var(--font-mono); font-size: 12px; font-weight: 600; color: var(--muted); }

    /* Scrollbars */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 99px; }
    .hidden { display: none !important; }

    @media (max-width: 720px) {
      #sidebar { display: none; }
      #lessonScroll { padding: 22px 20px 18px; }
    }
  
    .copyright-footer {
      position: fixed;
      right: 12px;
      bottom: 8px;
      z-index: 9999;
      padding: 4px 10px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 999px;
      background: rgba(10,15,30,0.78);
      color: rgba(221,225,240,0.68);
      font-size: 11px;
      font-weight: 600;
      line-height: 1.35;
      text-align: right;
      pointer-events: none;
      backdrop-filter: blur(10px);
    }

    @media (max-width: 640px) {
      .copyright-footer {
        right: 8px;
        bottom: 6px;
        max-width: calc(100% - 16px);
        font-size: 10px;
      }
    }
</style>

<style>.app-footer{flex-shrink:0;height:26px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:rgba(210,218,245,0.26);border-top:1px solid rgba(255,255,255,0.06);background:rgba(0,0,0,0.15);letter-spacing:0.02em;}</style>
</head>
<body>
<div id="appShell">

  <!-- Header -->
  <header id="appHeader">
    <a href="index.html" class="home-btn">
      <i data-lucide="arrow-left" style="width:12px;height:12px;"></i> Home

<p>A <strong>spreadsheet</strong> is a grid of rows and columns used to organise, calculate, and analyse data. Microsoft <em>Excel</em> is the most widely used spreadsheet program in the world.</p>

    <div class="excel-cell">16</div>
    <div class="excel-cell">82</div>

  </div>
  <div class="excel-row">

    <div class="excel-cell">Diego</div>
    <div class="excel-cell">17</div>
    <div class="excel-cell">67</div>
    <div class="excel-cell">C</div>
  </div>
  <div class="excel-row">
    <div class="excel-cell row-header">4</div>
    <div class="excel-cell">Leila</div>
    <div class="excel-cell">16</div>
    <div class="excel-cell">91</div>
    <div class="excel-cell">A</div>
  </div>
</div>

<ul>
  <li><strong>Columns</strong> — run vertically, labelled A, B, C, D… (up to XFD in Excel)</li>
  <li><strong>Rows</strong> — run horizontally, labelled 1, 2, 3… (up to 1,048,576 rows)</li>
  <li><strong>Cell</strong> — the intersection of a column and row. The highlighted cell above is <em>A1</em></li>
  <li><strong>Cell reference</strong> — the address of a cell: column letter + row number. e.g. <span class="key-term">C3</span> = column C, row 3</li>
  <li><strong>Active cell</strong> — the cell you have selected (shown in the Name Box at the top-left)</li>
</ul>

<h3><i data-lucide="database" style="width:14px;height:14px;"></i> What Goes in a Cell?</h3>
<table class="ext-table">
  <tr><th>Type</th><th>Example</th><th>Aligned</th></tr>
  <tr><td><strong>Text (Labels)</strong></td><td>Name, City, Product</td><td>Left</td></tr>

  <tr><td><strong>Formulas</strong></td><td>=A1+B1, =SUM(A1:A10)</td><td>Right (shows result)</td></tr>
  <tr><td><strong>Dates</strong></td><td>2024/01/15</td><td>Right</td></tr>
</table>

<div class="callout info"><strong>Entering data:</strong> Click a cell, type your data, then press <span class="key-term">Enter</span> to confirm and move down, or <span class="key-term">Tab</span> to confirm and move right.</div>

<div class="callout tip"><strong>Cell range:</strong> A range is a group of cells. <span class="key-term">A1:A10</span> means all cells from A1 to A10. <span class="key-term">A1:C4</span> means a rectangular block from A1 to C4.</div>

<p><strong>COUNTIF</strong> and <strong>SUMIF</strong> are more powerful versions of COUNT and SUM — they only count or add cells that meet a specific condition.</p>

<h3><i data-lucide="filter" style="width:14px;height:14px;"></i> COUNTIF — Count cells meeting a condition</h3>

<div class="formula-card">
  <div class="formula-name">=COUNTIF( )</div>

  <div class="formula-desc">Counts cells in <em>range</em> that match the <em>criteria</em>.</div>
  <div class="formula-example">=COUNTIF(B2:B20, "Pass")</div>
</div>

<div class="excel-grid">
  <div class="excel-row">
    <div class="excel-cell row-header"></div>
    <div class="excel-cell header">A</div>
    <div class="excel-cell header">B</div>

  </div>

  <div class="excel-row"><div class="excel-cell row-header">8</div><div class="excel-cell">Passes:</div><div class="excel-cell formula">=COUNTIF(B2:B6,"Pass")</div><div class="excel-cell result">3</div></div>
  <div class="excel-row"><div class="excel-cell row-header">9</div><div class="excel-cell">Score &gt;= 75:</div><div class="excel-cell formula">=COUNTIF(C2:C6,">=75")</div><div class="excel-cell result">2</div></div>

<p>The criteria can be:</p>
<ul>

  </div>
</div>

<p>This adds C2+C4+C5 (82+91+74 = 247) because B2, B4, B5 all equal "Pass".</p>

<div class="callout info"><strong>SUMIF vs COUNTIF:</strong> COUNTIF simply counts how many cells match. SUMIF adds up a different column based on the match. Use COUNTIF when you want a count; use SUMIF when you want a total.</div>

<p>This is one of the most important concepts in Excel — and one of the most misunderstood.</p>

<h3><i data-lucide="move" style="width:14px;height:14px;"></i> Relative References</h3>
<p>By default, all cell references are <strong>relative</strong>. This means when you copy a formula, the references <em>adjust automatically</em> based on where you paste it.</p>

<div class="excel-grid">

  <div class="excel-row"><div class="excel-cell row-header">2</div><div class="excel-cell">10.00</div><div class="excel-cell">5</div><div class="excel-cell formula">=A2*B2</div></div>
  <div class="excel-row"><div class="excel-cell row-header">3</div><div class="excel-cell">25.00</div><div class="excel-cell">3</div><div class="excel-cell formula">=A3*B3 (auto-adjusted)</div></div>
  <div class="excel-row"><div class="excel-cell row-header">4</div><div class="excel-cell">8.50</div><div class="excel-cell">12</div><div class="excel-cell formula">=A4*B4 (auto-adjusted)</div></div>
</div>

<p>When you type <code>=A2*B2</code> in C2 and then copy it down to C3 and C4, Excel automatically changes it to <code>=A3*B3</code> and <code>=A4*B4</code>. This is useful — you only type the formula once.</p>

<h3><i data-lucide="lock" style="width:14px;height:14px;"></i> Absolute References</h3>
<p>Sometimes you DON'T want the reference to change. You <strong>lock</strong> it by adding <strong>$</strong> signs. Press <span class="key-term">F4</span> after clicking a cell in the formula bar to add the dollar signs automatically.</p>

<div class="excel-grid">
  <div class="excel-row">
    <div class="excel-cell row-header"></div>

    <div class="excel-cell header">B</div>

  <div class="excel-row"><div class="excel-cell row-header">4</div><div class="excel-cell">250.00</div><div class="excel-cell abs">=A4*$B$1 (B1 stays fixed)</div><div class="excel-cell result">37.50</div></div>
  <div class="excel-row"><div class="excel-cell row-header">5</div><div class="excel-cell">80.00</div><div class="excel-cell abs">=A5*$B$1 (B1 stays fixed)</div><div class="excel-cell result">12.00</div></div>
</div>

<p><code>$B$1</code> means "always look at column B, row 1 — never change this reference when copying."</p>

<table class="ext-table">

<div class="callout tip"><strong>Rule of thumb:</strong> Use absolute references ($) any time your formula refers to a cell that contains a single shared value — like a tax rate, a discount percentage, or a conversion factor — that should not change as you copy the formula down or across.</div>

<p>Computational Thinking is built on four pillars. Each lesson in this unit covers one pillar in depth. Together, they form a complete framework for solving any kind of problem — from writing a program to planning a school event.</p>

      <div style="font-size:14px;font-weight:700;color:#6ee7b7;margin-bottom:4px;">2. Pattern Recognition</div>

<p><strong>Decomposition</strong> is the process of breaking a complex problem or task into smaller, more manageable sub-problems. Each sub-problem is easier to understand, easier to solve, and easier to test than the original.</p>

<div class="callout info"><strong>Key idea:</strong> You cannot eat an entire pizza in one bite — but you can eat it one slice at a time. Decomposition is cutting the pizza.</div>

<h3><i data-lucide="scissors" style="width:14px;height:14px;"></i> Why decompose?</h3>
<ul>
  <li>Large problems feel overwhelming — smaller problems feel manageable</li>
  <li>Different people (or different parts of a program) can work on different sub-problems at the same time</li>
  <li>If one sub-problem fails, you only need to fix that part — not redo everything</li>
  <li>Testing becomes easier because you can check each piece independently</li>
</ul>

<h3><i data-lucide="git-branch" style="width:14px;height:14px;"></i> Example 1 — Building a school website</h3>

<p><strong>Pattern Recognition</strong> is the ability to notice similarities, trends, and repeated structures within a problem — or across different problems. When you recognise a pattern, you can reuse a solution that already worked instead of starting from scratch.</p>

<div class="callout info"><strong>Key idea:</strong> If you've solved a similar problem before, pattern recognition lets you apply that solution again — saving time and reducing errors.</div>

<h3><i data-lucide="repeat" style="width:14px;height:14px;"></i> Patterns in everyday life</h3>
<ul>
  <li><strong>Weather:</strong> It rains every afternoon in summer in Cape Town → you learn to carry an umbrella after 2pm</li>
  <li><strong>Sport:</strong> A rugby team always kicks to the left when under pressure → the opposing team positions their defence accordingly</li>
  <li><strong>School:</strong> You notice you always score lower on tests taken after late nights → you change your study schedule</li>
</ul>

<h3><i data-lucide="code" style="width:14px;height:14px;"></i> Patterns in programming</h3>

<p><strong>Abstraction</strong> is the process of identifying and focusing on the <em>essential</em> features of a problem while deliberately ignoring details that are not relevant to the solution. It is about managing complexity by hiding unnecessary information.</p>

<div class="callout info"><strong>Key idea:</strong> A map of South Africa shows roads, cities, and borders — but not every tree, rock, or building. The map-maker <em>abstracted</em> away the irrelevant details so the map is useful.</div>

<h3><i data-lucide="filter" style="width:14px;height:14px;"></i> What to keep and what to remove</h3>

  subtitle: "Creating precise step-by-step instructions to solve any problem",
  content: `
<p>An <strong>algorithm</strong> is a precise, ordered set of instructions that describes exactly how to solve a problem or complete a task. Algorithms must be unambiguous (no room for guessing), finite (they must end), and effective (each step must be achievable).</p>

<div class="callout info"><strong>Key idea:</strong> A recipe is an algorithm. A set of driving directions is an algorithm. Any step-by-step process that reliably produces a correct result is an algorithm.</div>

<h3><i data-lucide="list-ordered" style="width:14px;height:14px;"></i> Properties of a good algorithm</h3>
<ul>
  <li><strong>Unambiguous</strong> — every step has exactly one meaning and cannot be interpreted differently</li>
  <li><strong>Ordered</strong> — steps must be followed in the correct sequence</li>
  <li><strong>Finite</strong> — the algorithm must eventually stop (no infinite loops)</li>
  <li><strong>Effective</strong> — every step must be simple enough to actually carry out</li>
  <li><strong>Correct</strong> — it must produce the right output for all valid inputs</li>
</ul>

<p><strong>Pseudo code</strong> is a way of writing out the logic of a program in plain, structured English — without using any specific programming language syntax. It is a planning tool used by programmers to think through a solution before writing actual code.</p>

<h3><i data-lucide="pencil" style="width:14px;height:14px;"></i> Why Use Pseudo Code?</h3>
<ul>
  <li>Forces you to think through the logic before worrying about syntax</li>
  <li>Easy for anyone — including non-programmers — to read and review</li>
  <li>Helps identify logical errors early, before any code is written</li>
  <li>Works for any programming language — the logic translates directly</li>
  <li>Required in IEB/CAPS examinations as a planning step</li>
</ul>

<div class="visual-box">
  <div class="visual-box-title">Pseudo Code Keywords and Conventions</div>
  <table style="width:100%;font-size:12px;border-collapse:collapse;">
    <tr style="background:rgba(255,255,255,0.06);">
      <th style="padding:8px;text-align:left;color:#a5b4fc;border-bottom:1px solid rgba(255,255,255,0.10);">Keyword</th>
      <th style="padding:8px;text-align:left;color:#a5b4fc;border-bottom:1px solid rgba(255,255,255,0.10);">Meaning</th>
      <th style="padding:8px;text-align:left;color:#a5b4fc;border-bottom:1px solid rgba(255,255,255,0.10);">Example</th>
    </tr>
    <tr><td style="padding:8px;border-bottom:1px solid rgba(255,255,255,0.06);"><code>INPUT</code></td><td style="padding:8px;border-bottom:1px solid rgba(255,255,255,0.06);">Receive data from user</td><td style="padding:8px;border-bottom:1px solid rgba(255,255,255,0.06);"><code>INPUT age</code></td></tr>
    <tr><td style="padding:8px;border-bottom:1px solid rgba(255,255,255,0.06);"><code>OUTPUT / PRINT</code></td><td style="padding:8px;border-bottom:1px solid rgba(255,255,255,0.06);">Display something</td><td style="padding:8px;border-bottom:1px solid rgba(255,255,255,0.06);"><code>OUTPUT "Hello"</code></td></tr>
    <tr><td style="padding:8px;border-bottom:1px solid rgba(255,255,255,0.06);"><code>SET / ASSIGN</code></td><td style="padding:8px;border-bottom:1px solid rgba(255,255,255,0.06);">Store a value</td><td style="padding:8px;border-bottom:1px solid rgba(255,255,255,0.06);"><code>SET total = price * qty</code></td></tr>
    <tr><td style="padding:8px;border-bottom:1px solid rgba(255,255,255,0.06);"><code>IF / ELSE / ENDIF</code></td><td style="padding:8px;border-bottom:1px solid rgba(255,255,255,0.06);">Decision / branching</td><td style="padding:8px;border-bottom:1px solid rgba(255,255,255,0.06);"><code>IF age &gt;= 18 THEN</code></td></tr>
    <tr><td style="padding:8px;border-bottom:1px solid rgba(255,255,255,0.06);"><code>WHILE / ENDWHILE</code></td><td style="padding:8px;border-bottom:1px solid rgba(255,255,255,0.06);">Loop while condition is true</td><td style="padding:8px;border-bottom:1px solid rgba(255,255,255,0.06);"><code>WHILE count &lt; 10</code></td></tr>
    <tr><td style="padding:8px;border-bottom:1px solid rgba(255,255,255,0.06);"><code>FOR / ENDFOR</code></td><td style="padding:8px;border-bottom:1px solid rgba(255,255,255,0.06);">Count-controlled loop</td><td style="padding:8px;border-bottom:1px solid rgba(255,255,255,0.06);"><code>FOR i = 1 TO 10</code></td></tr>
    <tr><td style="padding:8px;"><code>BEGIN / END</code></td><td style="padding:8px;">Start and end of program</td><td style="padding:8px;"><code>BEGIN ... END</code></td></tr>
  </table>
</div>

<div class="callout tip"><strong>Indentation matters:</strong> Indent code inside IF blocks and loops — just like in real programming. This makes the structure clear at a glance.</div>

  content: `
<p>The best way to learn pseudo code is through examples. Below are three practical problems — each demonstrating a different structure.</p>

<h3><i data-lucide="arrow-right" style="width:14px;height:14px;"></i> Example 1: Sequence — Calculate Total Price</h3>
<p>A sequence executes steps in order, one after another, with no branching or looping.</p>

<div class="visual-box">
  <div class="visual-box-title">Calculate Total Price with VAT</div>
  <pre style="font-family:'JetBrains Mono',monospace;font-size:12px;color:#e2e8f0;line-height:1.8;margin:0;white-space:pre-wrap;">BEGIN
  INPUT price
  INPUT quantity
  SET subtotal = price * quantity
  SET vat = subtotal * 0.15
  SET total = subtotal + vat
  OUTPUT "Subtotal: R" + subtotal
  OUTPUT "VAT (15%): R" + vat
  OUTPUT "Total: R" + total
END</pre>
</div>

<h3><i data-lucide="git-branch" style="width:14px;height:14px;"></i> Example 2: Decision — Grade Calculator</h3>
<p>An IF / ELSE structure makes a decision based on a condition and branches accordingly.</p>

<div class="visual-box">
  <div class="visual-box-title">Assign a Grade Symbol</div>
  <pre style="font-family:'JetBrains Mono',monospace;font-size:12px;color:#e2e8f0;line-height:1.8;margin:0;white-space:pre-wrap;">BEGIN
  INPUT mark
  IF mark >= 80 THEN
      OUTPUT "Distinction (Level 7)"
  ELSE IF mark >= 70 THEN
      OUTPUT "Merit (Level 6)"
  ELSE IF mark >= 60 THEN
      OUTPUT "Substantial Achievement (Level 5)"
  ELSE IF mark >= 50 THEN
      OUTPUT "Adequate Achievement (Level 4)"
  ELSE IF mark >= 30 THEN
      OUTPUT "Elementary Achievement (Level 3)"
  ELSE
      OUTPUT "Not Achieved (Level 1-2)"
  ENDIF
END</pre>
</div>

<h3><i data-lucide="repeat" style="width:14px;height:14px;"></i> Example 3: Loop — Find the Highest Score</h3>
<p>A WHILE loop repeats a block of steps until a condition is no longer true.</p>

<div class="visual-box">
  <div class="visual-box-title">Find the Highest Score in a Class</div>
  <pre style="font-family:'JetBrains Mono',monospace;font-size:12px;color:#e2e8f0;line-height:1.8;margin:0;white-space:pre-wrap;">BEGIN
  SET highest = 0
  SET count = 0
  INPUT numberOfStudents
  WHILE count < numberOfStudents
      INPUT score
      IF score > highest THEN
          SET highest = score
      ENDIF
      SET count = count + 1
  ENDWHILE
  OUTPUT "Highest score: " + highest
END</pre>
</div>

<div class="callout warn"><strong>Common exam mistake:</strong> Forgetting ENDIF after an IF block, or ENDWHILE after a WHILE loop. Always close every structure you open.</div>

<div class="quiz-box">

    <button class="quiz-opt" data-correct="false">FOR loop</button>
    <button class="quiz-opt" data-correct="true">IF / ELSE IF / ENDIF</button>

</div>
<div class="quiz-box">

  content: `
<p>A <strong>flow diagram</strong> (also called a flowchart) is a visual representation of an algorithm or process. It uses standardised shapes connected by arrows to show the sequence of steps, decisions, and outcomes in a program or procedure.</p>

<h3><i data-lucide="shapes" style="width:14px;height:14px;"></i> Standard Flow Diagram Symbols</h3>

<div class="visual-box">
  <div class="visual-box-title">IEB/CAPS Standard Flowchart Symbols</div>
  <div style="display:flex;flex-direction:column;gap:12px;">
    <div style="display:flex;align-items:center;gap:14px;">
      <div style="width:90px;flex-shrink:0;text-align:center;">
        <div style="width:80px;height:36px;border-radius:18px;background:rgba(99,102,241,0.15);border:2px solid #a5b4fc;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#a5b4fc;margin:0 auto;">START/END</div>
      </div>
      <div style="font-size:12px;color:rgba(221,225,240,0.75);"><strong style="color:#c7d2fe;">Oval / Rounded Rectangle</strong> — Marks the beginning (START) or end (END/STOP) of a program.</div>
    </div>
    <div style="display:flex;align-items:center;gap:14px;">
      <div style="width:90px;flex-shrink:0;text-align:center;">
        <div style="width:80px;height:36px;background:rgba(16,185,129,0.15);border:2px solid #6ee7b7;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#6ee7b7;margin:0 auto;">PROCESS</div>
      </div>
      <div style="font-size:12px;color:rgba(221,225,240,0.75);"><strong style="color:#6ee7b7;">Rectangle</strong> — A processing step: calculation, assignment, or action. E.g. SET total = price * qty.</div>
    </div>
    <div style="display:flex;align-items:center;gap:14px;">
      <div style="width:90px;flex-shrink:0;text-align:center;">
        <div style="width:80px;height:38px;background:rgba(245,158,11,0.15);border:2px solid #fcd34d;transform:skewX(-10deg);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fcd34d;margin:0 auto;"><span style="transform:skewX(10deg);">INPUT/OUTPUT</span></div>
      </div>
      <div style="font-size:12px;color:rgba(221,225,240,0.75);"><strong style="color:#fcd34d;">Parallelogram</strong> — Input from user or output to screen. E.g. INPUT age, OUTPUT result.</div>
    </div>
    <div style="display:flex;align-items:center;gap:14px;">
      <div style="width:90px;flex-shrink:0;text-align:center;">
        <svg viewBox="0 0 90 60" xmlns="http://www.w3.org/2000/svg" style="width:90px;height:60px;display:block;margin:0 auto;">
          <polygon points="45,4 86,30 45,56 4,30" fill="rgba(236,72,153,0.15)" stroke="#f9a8d4" stroke-width="2"/>
          <text x="45" y="27" text-anchor="middle" font-size="9" font-weight="700" fill="#f9a8d4" font-family="Cabinet Grotesk,sans-serif">YES /</text>
          <text x="45" y="40" text-anchor="middle" font-size="9" font-weight="700" fill="#f9a8d4" font-family="Cabinet Grotesk,sans-serif">NO?</text>
        </svg>
      </div>
      <div style="font-size:12px;color:rgba(221,225,240,0.75);"><strong style="color:#f9a8d4;">Diamond</strong> — A decision point with two exits: YES and NO. E.g. Is score >= 50?</div>
    </div>
    <div style="display:flex;align-items:center;gap:14px;">
      <div style="width:90px;flex-shrink:0;text-align:center;font-size:22px;color:#94a3b8;">→</div>
      <div style="font-size:12px;color:rgba(221,225,240,0.75);"><strong style="color:#e2e8f0;">Arrow / Flow Line</strong> — Shows the direction of flow from one step to the next.</div>
    </div>
  </div>
</div>

<h3><i data-lucide="info" style="width:14px;height:14px;"></i> Rules for Drawing Flow Diagrams</h3>
<ul>
  <li>Every diagram must have exactly <strong>one START</strong> and at least <strong>one END</strong></li>
  <li>Arrows must show direction — never leave a shape without an outgoing arrow</li>
  <li>Decision diamonds always have <strong>exactly two exits</strong>: YES and NO</li>
  <li>Flow generally goes <strong>top to bottom</strong> and <strong>left to right</strong></li>
  <li>Loops are shown by an arrow looping <strong>back up</strong> to an earlier step</li>
</ul>

<div class="callout tip"><strong>Exam tip:</strong> In IEB/CAPS papers you may be asked to draw OR trace a flow diagram. Tracing means following the arrows with given values and writing down the output.</div>

</div>
<div class="quiz-box">

<p>You've heard of ChatGPT, Claude, Gemini, and Copilot. These are all <strong>Large Language Models (LLMs)</strong> — a specific type of AI trained on vast amounts of text to understand and generate human language.</p>

<h3><i data-lucide="file-text" style="width:14px;height:14px;"></i> What Does "Language Model" Mean?</h3>
<p>A language model is a system that predicts text. At its simplest: given a sequence of words, what word is most likely to come next?</p>

<div class="visual-box">
  <div class="visual-box-title">Token Prediction — The Core Idea</div>
  <div style="font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.8;padding:6px 0;">
    <div style="margin-bottom:10px;color:rgba(221,225,240,0.55);font-size:10px;letter-spacing:0.08em;text-transform:uppercase;">Input prompt:</div>
    <div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:16px;">
      ${["The","capital","of","South","Africa","is"].map(w=>`<span style="padding:3px 8px;background:rgba(99,102,241,0.18);border:1px solid rgba(99,102,241,0.30);border-radius:5px;color:#a5b4fc;font-size:11px;">${w}</span>`).join('')}
      <span style="padding:3px 8px;background:rgba(16,185,129,0.25);border:2px solid rgba(16,185,129,0.50);border-radius:5px;color:#6ee7b7;font-size:11px;font-weight:700;">???</span>
    </div>
    <div style="margin-bottom:10px;color:rgba(221,225,240,0.55);font-size:10px;letter-spacing:0.08em;text-transform:uppercase;">Model's top predictions:</div>
    ${[["Pretoria / Tshwane","94%","#6ee7b7"],["Johannesburg","3%","#fbbf24"],["Cape Town","2%","#f87171"],["Other","1%","#94a3b8"]].map(([w,p,c])=>`
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:5px;">
      <div style="font-size:11px;color:${c};min-width:160px;">${w}</div>
      <div style="flex:1;height:6px;background:rgba(255,255,255,0.05);border-radius:99px;overflow:hidden;"><div style="height:100%;width:${p};background:${c};border-radius:99px;"></div></div>
      <div style="font-size:10px;color:rgba(221,225,240,0.40);min-width:30px;text-align:right;">${p}</div>
    </div>`).join('')}
  </div>
</div>

<p>LLMs do this prediction billions of times in sequence to produce an entire paragraph or conversation. They don't "know" facts the way humans do — they predict statistically likely text based on patterns in their training data.</p>

<h3><i data-lucide="zap" style="width:14px;height:14px;"></i> The Transformer Architecture</h3>
<p>The breakthrough that made LLMs possible was the <strong>Transformer</strong>, introduced by Google researchers in a 2017 paper titled <em>"Attention Is All You Need."</em></p>
<p>The key innovation was <strong>attention</strong> — a mechanism that lets the model focus on the most relevant parts of the input when generating each word, similar to how your eyes scan a sentence for the most important words.</p>

<div class="callout info"><strong>Example:</strong> When generating the word after "The South African rand is the currency of ___", the attention mechanism focuses heavily on "South African" and "currency" — not just the previous word — so it correctly predicts "South Africa".</div>

<h3><i data-lucide="database" style="width:14px;height:14px;"></i> What is GPT?</h3>
<p><strong>GPT</strong> stands for <em>Generative Pre-trained Transformer</em>. Each word tells you something:</p>
<ul>
  <li><strong>Generative</strong> — it generates (creates) new text</li>
  <li><strong>Pre-trained</strong> — it was trained on a massive dataset before being customised for chat</li>
  <li><strong>Transformer</strong> — it uses the Transformer architecture described above</li>
</ul>

<div class="visual-box">
  <div class="visual-box-title">Scale: How Big Are These Models?</div>
  <div style="display:flex;flex-direction:column;gap:6px;font-size:12px;">
    ${[
      ["GPT-2 (2019)","1.5 billion","parameters","rgba(148,163,184,0.20)","#94a3b8","22%"],
      ["GPT-3 (2020)","175 billion","parameters","rgba(99,102,241,0.20)","#818cf8","45%"],
      ["GPT-4 (2023)","~1 trillion","(estimated)","rgba(16,185,129,0.20)","#34d399","80%"],
      ["Your brain","~100 trillion","synapses","rgba(245,158,11,0.20)","#fbbf24","100%"],
    ].map(([name,val,unit,bg,col,w])=>`
    <div style="display:flex;align-items:center;gap:10px;">
      <div style="min-width:130px;color:rgba(221,225,240,0.70);font-size:11px;">${name}</div>
      <div style="flex:1;height:14px;background:rgba(255,255,255,0.04);border-radius:5px;overflow:hidden;">
        <div style="height:100%;width:${w};background:${bg};border:1px solid ${col};border-radius:5px;display:flex;align-items:center;padding-left:6px;">
          <span style="font-size:9px;font-family:'JetBrains Mono',monospace;color:${col};white-space:nowrap;">${val} ${unit}</span>
        </div>
      </div>
    </div>`).join('')}
  </div>
</div>

<h3><i data-lucide="message-square" style="width:14px;height:14px;"></i> From LLM to ChatBot: RLHF</h3>
<p>A raw LLM is trained to predict text — it might produce harmful or unhelpful responses. To make it a useful assistant, companies use <strong>RLHF</strong> — Reinforcement Learning from Human Feedback:</p>
<ol>
  <li>Human raters compare different AI responses and rank the best ones</li>
  <li>A reward model learns what humans prefer</li>
  <li>The LLM is fine-tuned using reinforcement learning to produce responses the reward model scores highly</li>
</ol>
<p>This is what turns a raw text-predictor into a helpful, safe, and conversational assistant like ChatGPT or Claude.</p>

<div class="callout tip"><strong>Fun fact:</strong> "Claude" (the AI made by Anthropic) and "ChatGPT" (by OpenAI) and "Gemini" (by Google) all use variants of this approach. They are competitors, each with their own training data, architecture choices, and safety techniques.</div>

let currentLesson = 0;
const completed = new Set();

// ── Build sidebar — collapsible unit groups ────────────────────────────────
// ── Sidebar collapse state — keyed by group index (stable, no string issues) ──
// Pre-compute unit groups once (stable across renders)
const _unitGroups = (() => {
  const groups = [];
  LESSONS.forEach((les, i) => {
    if (!groups.length || groups[groups.length - 1].unit !== les.unit) {
      groups.push({ unit: les.unit, lessons: [] });
    }
    groups[groups.length - 1].lessons.push(i);
  });
  return groups;
})();

// All groups start collapsed; the one containing lesson 0 is auto-expanded on first buildSidebar
const _collapsedGroups = new Set(_unitGroups.map((_, gi) => gi));

function buildSidebar() {
  const list = document.getElementById('sidebarList');
  list.innerHTML = '';

  _unitGroups.forEach((group, gi) => {
    const isCollapsed = _collapsedGroups.has(gi);
    const doneCount   = group.lessons.filter(i => completed.has(i)).length;

    // ── Group wrapper ──
    const groupEl = document.createElement('div');
    groupEl.className = 'unit-group' + (isCollapsed ? ' collapsed' : '');

    // ── Clickable header ──
    const hdr = document.createElement('div');
    hdr.className = 'unit-header';
    hdr.innerHTML =
      `<span class="unit-header-label">${group.unit}</span>` +
      `<span class="unit-header-count">${doneCount}/${group.lessons.length}</span>` +
      `<span class="unit-caret" style="transform:${isCollapsed ? 'rotate(-90deg)' : ''}">▾</span>`;

    // Toggle collapse directly on the element — no full rebuild needed
    hdr.addEventListener('click', function () {
      if (_collapsedGroups.has(gi)) {
        _collapsedGroups.delete(gi);
      } else {
        _collapsedGroups.add(gi);
      }
      groupEl.classList.toggle('collapsed');
      // Update caret and count (count unchanged but keeps it live)
      const caret = hdr.querySelector('.unit-caret');
      if (caret) caret.style.transform = _collapsedGroups.has(gi) ? 'rotate(-90deg)' : '';
    });

    groupEl.appendChild(hdr);

    // ── Lesson items ──
    const lessonsEl = document.createElement('div');
    lessonsEl.className = 'unit-lessons';

    group.lessons.forEach(i => {
      const les    = LESSONS[i];
      const isActive = i === currentLesson;
      const isDone   = completed.has(i);

      const item = document.createElement('div');
      item.className = 'lesson-item' + (isActive ? ' active' : '');
      item.dataset.idx = i;
      item.innerHTML =
        `<span class="lesson-num">${i + 1}</span>` +
        `<span class="lesson-name">${les.title}</span>` +
        (isDone ? '<span class="lesson-done">✓</span>' : '');

      item.addEventListener('click', function () { goTo(i); });
      lessonsEl.appendChild(item);
    });

    groupEl.appendChild(lessonsEl);
    list.appendChild(groupEl);
  });
}

// ── Render lesson ──────────────────────────────────────────────────────────
function renderLesson() {
  const les = LESSONS[currentLesson];
  const total = LESSONS.length;

  document.getElementById('lessonContent').innerHTML = `
    <div class="lesson-badge">
      <i data-lucide="book-open" style="width:11px;height:11px;"></i>
      ${les.unit}
    </div>
    <h1 class="lesson-title">${les.title}</h1>
    <p class="lesson-subtitle">${les.subtitle}</p>
    <div class="lesson-body">${les.content}</div>
  `;

  // Wire up quizzes
  document.querySelectorAll('.quiz-opt').forEach(btn => {
    btn.addEventListener('click', () => {
      const box = btn.closest('.quiz-box');
      const fb  = box.querySelector('.quiz-feedback');
      box.querySelectorAll('.quiz-opt').forEach(b => b.classList.remove('correct','wrong'));
      if (btn.dataset.correct === 'true') {
        btn.classList.add('correct');
        fb.textContent = '✅ Correct!'; fb.className = 'quiz-feedback correct';
        completed.add(currentLesson);
        updateProgress();
        updateSidebarActive();
        // Track correct answer
        if (window.MagicLabProgress) {
          const les = LESSONS[currentLesson];
          MagicLabProgress.track(ML_TOOLS.COMPUTER_CODEX, 'quiz_correct', {
            topic: les.title,
            grade: 8,
            score: 1,
            metadata: { unit: les.unit, question: box.querySelector('.quiz-q')?.textContent?.trim() }
          });
        }
      } else {
        btn.classList.add('wrong');
        fb.textContent = '❌ Not quite — try again!'; fb.className = 'quiz-feedback wrong';
        // Track wrong answer
        if (window.MagicLabProgress) {
          const les = LESSONS[currentLesson];
          MagicLabProgress.track(ML_TOOLS.COMPUTER_CODEX, 'quiz_wrong', {
            topic: les.title,
            grade: 8,
            score: 0,
            metadata: { unit: les.unit, question: box.querySelector('.quiz-q')?.textContent?.trim() }
          });
        }
      }
    });
  });

  // Update nav
  document.getElementById('prevBtn').style.visibility = currentLesson === 0 ? 'hidden' : 'visible';
  document.getElementById('nextBtn').textContent = currentLesson === total-1 ? 'Finish ✓' : 'Next →';
  document.getElementById('lessonCounter').textContent = `${currentLesson+1} / ${total}`;
  document.getElementById('headerProgress').textContent = `Lesson ${currentLesson+1} of ${total}`;

  document.getElementById('lessonScroll').scrollTop = 0;
  

// ── Flow Diagram Builder (Unit 8) ────────────────────────────────────────────
function initFlowDiagramBuilder() {
  const canvas = document.getElementById('fd-canvas');
  if (!canvas || canvas._fdInit) return;
  canvas._fdInit = true;

  // HiDPI crisp rendering
  const dpr = window.devicePixelRatio || 1;
  const CSS_W = 660, CSS_H = 400;
  canvas.width  = CSS_W * dpr;
  canvas.height = CSS_H * dpr;
  canvas.style.width  = CSS_W + 'px';
  canvas.style.height = CSS_H + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const labelRow   = document.getElementById('fd-label-row');
  const labelInput = document.getElementById('fd-label-input');

  let shapes = [], arrows = [], selected = null;
  let dragging = null, dragOffX = 0, dragOffY = 0;
  let arrowMode = null, arrowFrom = null;

  const W = 130, H = 42;
  const COLORS = {
    start:    { fill:'rgba(99,102,241,0.25)', stroke:'#a5b4fc', text:'#c7d2fe' },
    process:  { fill:'rgba(16,185,129,0.20)', stroke:'#6ee7b7', text:'#6ee7b7' },
    io:       { fill:'rgba(245,158,11,0.20)', stroke:'#fcd34d', text:'#fcd34d' },
    decision: { fill:'rgba(236,72,153,0.20)', stroke:'#f9a8d4', text:'#f9a8d4' }
  };
  function defaultLabel(t) {
    return {start:'START',process:'Process',io:'INPUT / OUTPUT',decision:'Condition?'}[t];
  }

  // Edge point calculation for arrow connections
  function edgePoint(s, dx, dy) {
    const len = Math.sqrt(dx*dx + dy*dy) || 1;
    const nx = dx/len, ny = dy/len;
    if (s.type === 'start') {
      const a = W/2, b = H/2;
      const t = 1 / Math.sqrt((nx*nx)/(a*a) + (ny*ny)/(b*b));
      return { x: s.x + nx*t, y: s.y + ny*t };
    } else if (s.type === 'decision') {
      const hw = W*0.6, hh = H*0.8;
      const t = (hw*hh) / (Math.abs(nx)*hh + Math.abs(ny)*hw);
      return { x: s.x + nx*t, y: s.y + ny*t };
    } else {
      // Rectangle and parallelogram — use bounding box
      const scaleX = (W/2) / (Math.abs(nx) || 0.001);
      const scaleY = (H/2) / (Math.abs(ny) || 0.001);
      const t = Math.min(scaleX, scaleY);
      return { x: s.x + nx*t, y: s.y + ny*t };
    }
  }

  // Draw arrowhead at (x,y) pointing in direction angle
  function arrowhead(x, y, angle) {
    const sz = 9;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(-sz, -sz*0.4);
    ctx.lineTo(-sz*0.65, 0);
    ctx.lineTo(-sz, sz*0.4);
    ctx.closePath();
    ctx.fillStyle = '#94a3b8';
    ctx.fill();
    ctx.restore();
  }

  function drawArrow(arr) {
    const fs = shapes.find(s => s.id === arr.from);
    const ts = shapes.find(s => s.id === arr.to);
    if (!fs || !ts) return;
    const dx = ts.x - fs.x, dy = ts.y - fs.y;
    const sp = edgePoint(fs,  dx,  dy);
    const ep = edgePoint(ts, -dx, -dy);
    const angle = Math.atan2(ep.y - sp.y, ep.x - sp.x);
    ctx.save();
    ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(sp.x, sp.y); ctx.lineTo(ep.x, ep.y); ctx.stroke();
    arrowhead(ep.x, ep.y, angle);
    if (arr.label) {
      ctx.fillStyle = '#94a3b8'; ctx.font = 'bold 10px Cabinet Grotesk,sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(arr.label, (sp.x+ep.x)/2, (sp.y+ep.y)/2 - 9);
    }
    ctx.restore();
  }

  function drawShape(s) {
    const c = COLORS[s.type], sel = selected === s;
    ctx.save();
    ctx.strokeStyle = sel ? '#ffffff' : c.stroke;
    ctx.lineWidth   = sel ? 2.5 : 1.5;
    ctx.fillStyle   = c.fill;
    // 0.5 offset for crisp lines
    ctx.translate(0.5, 0.5);

    if (s.type === 'start') {
      ctx.beginPath();
      ctx.ellipse(s.x, s.y, W/2, H/2, 0, 0, Math.PI*2);
      ctx.fill(); ctx.stroke();
    } else if (s.type === 'process') {
      const r = 6, x = s.x-W/2, y = s.y-H/2;
      ctx.beginPath();
      ctx.moveTo(x+r, y); ctx.lineTo(x+W-r, y); ctx.arcTo(x+W, y, x+W, y+r, r);
      ctx.lineTo(x+W, y+H-r); ctx.arcTo(x+W, y+H, x+W-r, y+H, r);
      ctx.lineTo(x+r, y+H); ctx.arcTo(x, y+H, x, y+H-r, r);
      ctx.lineTo(x, y+r); ctx.arcTo(x, y, x+r, y, r);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    } else if (s.type === 'io') {
      const sk = 14;
      ctx.beginPath();
      ctx.moveTo(s.x-W/2+sk, s.y-H/2); ctx.lineTo(s.x+W/2+sk, s.y-H/2);
      ctx.lineTo(s.x+W/2, s.y+H/2);    ctx.lineTo(s.x-W/2, s.y+H/2);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    } else if (s.type === 'decision') {
      const hw = W*0.6, hh = H*0.8;
      ctx.beginPath();
      ctx.moveTo(s.x, s.y-hh); ctx.lineTo(s.x+hw, s.y);
      ctx.lineTo(s.x, s.y+hh); ctx.lineTo(s.x-hw, s.y);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }

    // Label
    ctx.translate(-0.5, -0.5);
    ctx.fillStyle = sel ? '#ffffff' : c.text;
    ctx.font = 'bold 11px Cabinet Grotesk,sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const words = s.label.split(' '); let line = '', lines = [];
    for (const w of words) {
      const t = line + (line?' ':'') + w;
      if (ctx.measureText(t).width > W-20 && line) { lines.push(line); line = w; }
      else line = t;
    }
    lines.push(line);
    const lh = 15, sy2 = s.y - (lines.length-1)*lh/2;
    lines.forEach((l, i) => ctx.fillText(l, s.x, sy2 + i*lh));

    if (sel) {
      ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 1;
      ctx.setLineDash([4,3]);
      ctx.strokeRect(s.x-W/2-6, s.y-H/2-6, W+12, H+12);
      ctx.setLineDash([]);
    }
    ctx.restore();
  }

  function draw() {
    ctx.clearRect(0, 0, CSS_W, CSS_H);
    ctx.fillStyle = 'rgba(255,255,255,0.04)';
    for (let x=20; x<CSS_W; x+=30)
      for (let y=20; y<CSS_H; y+=30)
        ctx.fillRect(Math.round(x), Math.round(y), 1, 1);
    arrows.forEach(drawArrow);
    shapes.forEach(drawShape);
    if (arrowMode) {
      ctx.fillStyle = '#fbbf24'; ctx.font = 'bold 12px Cabinet Grotesk,sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(
        arrowMode === 'picking-from' ? 'Click shape to start arrow FROM' : 'Click shape to draw arrow TO',
        CSS_W/2, 18
      );
    }
  }

  function hitTest(s, mx, my) {
    if (s.type === 'decision') return Math.abs(mx-s.x)/(W*0.6) + Math.abs(my-s.y)/(H*0.8) < 1;
    return mx > s.x-W/2-10 && mx < s.x+W/2+24 && my > s.y-H/2-6 && my < s.y+H/2+6;
  }
  function getPos(e) {
    const r = canvas.getBoundingClientRect();
    const src = e.touches ? e.touches[0] : e;
    return { x: (src.clientX-r.left)*(CSS_W/r.width), y: (src.clientY-r.top)*(CSS_H/r.height) };
  }

  function onDown(e) {
    e.preventDefault();
    const {x,y} = getPos(e);
    if (arrowMode) {
      for (let i=shapes.length-1; i>=0; i--) {
        if (hitTest(shapes[i],x,y)) {
          if (arrowMode === 'picking-from') { arrowFrom = shapes[i].id; arrowMode = 'picking-to'; }
          else if (shapes[i].id !== arrowFrom) {
            arrows.push({from:arrowFrom, to:shapes[i].id, label:''});
            arrowMode = null; arrowFrom = null;
            const b = document.getElementById('fd-arrow-btn');
            if (b) b.textContent = '→ Add Arrow';
          }
          draw(); return;
        }
      }
      arrowMode = null; arrowFrom = null;
      const b = document.getElementById('fd-arrow-btn'); if (b) b.textContent = '→ Add Arrow';
      draw(); return;
    }
    dragging = null;
    for (let i=shapes.length-1; i>=0; i--) {
      if (hitTest(shapes[i],x,y)) {
        dragging = shapes[i]; dragOffX = x-shapes[i].x; dragOffY = y-shapes[i].y;
        selected = shapes[i]; labelInput.value = selected.label;
        labelRow.style.display = 'flex'; draw(); return;
      }
    }
    selected = null; labelRow.style.display = 'none'; draw();
  }
  function onMove(e) {
    if (!dragging) return; e.preventDefault();
    const {x,y} = getPos(e);
    dragging.x = Math.max(W/2+10, Math.min(CSS_W-W/2-10, x-dragOffX));
    dragging.y = Math.max(H/2+10, Math.min(CSS_H-H/2-10, y-dragOffY));
    draw();
  }
  function onUp() { dragging = null; }

  canvas.addEventListener('mousedown',onDown); canvas.addEventListener('mousemove',onMove); canvas.addEventListener('mouseup',onUp);
  canvas.addEventListener('touchstart',onDown,{passive:false}); canvas.addEventListener('touchmove',onMove,{passive:false}); canvas.addEventListener('touchend',onUp);
  document.addEventListener('keydown', function(e) { if ((e.key === 'Delete' || e.key === 'Backspace') && selected && document.activeElement !== labelInput) { e.preventDefault(); window.fdDeleteSelected(); } });

  window.fdAddShape = function(type) { shapes.push({id:Date.now(),type,x:80+Math.random()*500,y:60+Math.random()*280,label:defaultLabel(type)}); draw(); };
  window.fdClear = function() { shapes=[]; arrows=[]; selected=null; arrowMode=null; arrowFrom=null; labelRow.style.display='none'; const b=document.getElementById('fd-arrow-btn'); if(b)b.textContent='→ Add Arrow'; draw(); };
  window.fdApplyLabel = function() { if(selected){selected.label=labelInput.value; draw();} };
  labelInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') { e.preventDefault(); window.fdApplyLabel(); } });
  window.fdDeleteSelected = function() { if(!selected)return; arrows=arrows.filter(a=>a.from!==selected.id&&a.to!==selected.id); shapes=shapes.filter(s=>s!==selected); selected=null; labelRow.style.display='none'; draw(); };
  window.fdToggleArrowMode = function() { arrowMode=arrowMode?null:'picking-from'; arrowFrom=null; const b=document.getElementById('fd-arrow-btn'); if(b)b.textContent=arrowMode?'✕ Cancel':'→ Add Arrow'; draw(); };
  window.fdDownload = function() { const a=document.createElement('a'); a.download='my-flow-diagram.png'; a.href=canvas.toDataURL('image/png'); a.click(); };
  draw();
}

  initFlowDiagramBuilder();
  lucide.createIcons();
  buildSidebar();
}

function updateProgress() {
  const pct = Math.round((completed.size / LESSONS.length) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressPct').textContent = pct + '%';
}

// Update active highlight, done ticks, and count badges — no full rebuild
function updateSidebarActive() {
  const list = document.getElementById('sidebarList');
  if (!list) return;

  // Update lesson items
  list.querySelectorAll('.lesson-item').forEach(el => {
    const idx = parseInt(el.dataset.idx);
    el.classList.toggle('active', idx === currentLesson);
    let tick = el.querySelector('.lesson-done');
    if (completed.has(idx) && !tick) {
      const t = document.createElement('span');
      t.className = 'lesson-done'; t.textContent = '✓';
      el.appendChild(t);
    }
  });

  // Update count badges on unit headers
  const groupEls = list.querySelectorAll('.unit-group');
  _unitGroups.forEach((group, gi) => {
    const groupEl = groupEls[gi];
    if (!groupEl) return;
    const doneCount = group.lessons.filter(i => completed.has(i)).length;
    const badge = groupEl.querySelector('.unit-header-count');
    if (badge) badge.textContent = `${doneCount}/${group.lessons.length}`;

    // Auto-expand the unit containing the active lesson if it's collapsed
    if (group.lessons.includes(currentLesson) && _collapsedGroups.has(gi)) {
      _collapsedGroups.delete(gi);
      groupEl.classList.remove('collapsed');
      const caret = groupEl.querySelector('.unit-caret');
      if (caret) caret.style.transform = '';
    }
  });
}

function goTo(idx) {
  currentLesson = Math.max(0, Math.min(LESSONS.length-1, idx));
  renderLesson();
  updateSidebarActive();
  // Track topic started
  if (window.MagicLabProgress) {
    const les = LESSONS[currentLesson];
    MagicLabProgress.track(ML_TOOLS.COMPUTER_CODEX, 'topic_started', {
      topic: les.title,
      grade: 8,
      metadata: { unit: les.unit }
    });
  }
}

document.getElementById('prevBtn').addEventListener('click', () => goTo(currentLesson - 1));
document.getElementById('nextBtn').addEventListener('click', () => {
  completed.add(currentLesson);
  updateProgress();
  // Track lesson complete
  if (window.MagicLabProgress) {
    const les = LESSONS[currentLesson];
    MagicLabProgress.track(ML_TOOLS.COMPUTER_CODEX, 'lesson_complete', {
      topic: les.title,
      grade: 8,
      metadata: { unit: les.unit, lesson_index: currentLesson }
    });
  }
  if (currentLesson < LESSONS.length - 1) goTo(currentLesson + 1);
  else { /* finished */ document.getElementById('nextBtn').textContent = 'Complete! ✓'; }
});

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') {
    completed.add(currentLesson);
    updateProgress();
    // Track lesson complete via keyboard
    if (window.MagicLabProgress) {
      const les = LESSONS[currentLesson];
      MagicLabProgress.track(ML_TOOLS.COMPUTER_CODEX, 'lesson_complete', {
        topic: les.title,
        grade: 8,
        metadata: { unit: les.unit, via: 'keyboard' }
      });
    }
    goTo(currentLesson+1);
  }
  if (e.key === 'ArrowLeft')  goTo(currentLesson-1);
});

// ── Quiz toggle ───────────────────────────────────────────────────────────────
function toggleQuiz(btn) {
  btn.classList.toggle('open');
  const inner = btn.nextElementSibling;
  inner.classList.toggle('open');
}

// ── Init ──────────────────────────────────────────────────────────────────
renderLesson();

// ── Restore completed lessons from Supabase on page load ──────────────────
// getLessonHistory returns a Set of topic title strings previously saved via
// lesson_complete events. We map them back to lesson indices to restore ticks.
async function _restoreProgress() {
  if (!window.MagicLabProgress) return;
  const history = await MagicLabProgress.getLessonHistory(ML_TOOLS.COMPUTER_CODEX);
  if (!history.size) return;
  LESSONS.forEach((les, i) => {
    if (history.has(les.title)) completed.add(i);
  });
  updateSidebarActive();
  updateProgress();
}

// magiclab:progress:ready fires once auth + progress SDK are both initialised
document.addEventListener('magiclab:progress:ready', _restoreProgress);
// Also handle the case where the SDK was already ready before this ran
if (window.MagicLabProgress) _restoreProgress();
</script>
