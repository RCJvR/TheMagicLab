<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0f1e">
  <title>Web Wizard — HTML &amp; CSS Editor</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230891b2'/%3E%3Ctext x='10' y='46' font-family='monospace' font-size='36' font-weight='bold' fill='white'%3E%3C/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; width: 100%; overflow: hidden; }

    body {
      font-family: "DM Sans", sans-serif; font-size: 13px;
      background: #0a0f1e; color: #dde1f0;
      display: flex; flex-direction: column; height: 100%;
    }

    /* ── Background ── */
    #appShell {
      height: 100%; width: 100%;
      display: flex; flex-direction: column; overflow: hidden;
      background:
        radial-gradient(ellipse 55% 35% at 6% 4%,  rgba(6,182,212,0.14) 0%, transparent 60%),
        radial-gradient(ellipse 45% 30% at 96% 6%,  rgba(124,58,237,0.12) 0%, transparent 55%),
        radial-gradient(ellipse 35% 25% at 50% 98%, rgba(245,158,11,0.08) 0%, transparent 60%),
        #0a0f1e;
    }

    /* ── Header ── */
    #appHeader {
      flex-shrink: 0; display: flex; align-items: center; gap: 12px;
      padding: 8px 16px 7px; border-bottom: 1px solid rgba(255,255,255,0.07);
    }

    .home-btn {
      display: flex; align-items: center; gap: 5px;
      font-size: 11px; font-weight: 600; padding: 5px 10px;
      border-radius: 7px; border: 1px solid rgba(255,255,255,0.10);
      background: rgba(255,255,255,0.05); color: rgba(221,225,240,0.55);
      text-decoration: none; transition: all 130ms; flex-shrink: 0;
    }
    .home-btn:hover { background: rgba(255,255,255,0.10); color: #dde1f0; }

    h1.app-title {
      font-family: "Syne", sans-serif; font-weight: 800;
      font-size: clamp(18px, 2vw, 24px); line-height: 1;
      background: linear-gradient(125deg, #fff 0%, #67e8f9 50%, #a78bfa 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }

    .header-actions { margin-left: auto; display: flex; gap: 6px; align-items: center; }

    .hdr-btn {
      display: flex; align-items: center; gap: 5px; padding: 5px 11px;
      border-radius: 7px; border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.06); font-size: 11px; font-weight: 600;
      color: #b0b8d8; cursor: pointer; transition: all 130ms; white-space: nowrap;
    }
    .hdr-btn:hover { background: rgba(255,255,255,0.12); color: #dde1f0; }

    .preview-size-group { display: flex; gap: 3px; }
    .size-btn {
      padding: 5px 8px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.10);
      background: rgba(255,255,255,0.05); font-size: 11px; font-weight: 600;
      color: rgba(221,225,240,0.45); cursor: pointer; transition: all 130ms;
    }
    .size-btn.active { background: rgba(6,182,212,0.20); border-color: rgba(6,182,212,0.40); color: #67e8f9; }
    .size-btn:hover:not(.active) { color: rgba(221,225,240,0.80); }

    /* ── Main grid ── */
    #mainGrid {
      flex: 1; display: grid;
      grid-template-columns: 420px 1fr;
      gap: 10px; padding: 10px 14px 12px;
      min-height: 0; overflow: hidden;
    }

    /* ── Panels ── */
    .panel {
      background: rgba(255,255,255,0.038);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 14px; overflow: hidden;
      display: flex; flex-direction: column; min-height: 0;
    }

    .panel-hd {
      flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
      padding: 8px 12px 7px; border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .panel-title {
      font-family: "Syne", sans-serif; font-weight: 700; font-size: 12px;
      letter-spacing: 0.04em; color: #b0b8d8;
      display: flex; align-items: center; gap: 6px;
    }

    /* ── Left column: editor tabs ── */
    #leftCol { display: flex; flex-direction: column; min-height: 0; gap: 0; }

    .tab-group { display: flex; gap: 3px; background: rgba(0,0,0,0.30); border-radius: 7px; padding: 3px; }
    .tab-btn {
      font-family: "DM Sans", sans-serif; font-size: 11px; font-weight: 600;
      padding: 4px 10px; border-radius: 5px; border: none; cursor: pointer;
      transition: all 130ms; color: rgba(221,225,240,0.45); background: transparent;
    }
    .tab-btn.active { background: rgba(6,182,212,0.25); color: #67e8f9; }
    .tab-btn:hover:not(.active) { color: rgba(221,225,240,0.80); }

    .icon-btn {
      width: 26px; height: 26px; border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(255,255,255,0.05);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: rgba(221,225,240,0.45); transition: all 130ms;
    }
    .icon-btn:hover { background: rgba(255,255,255,0.12); color: #dde1f0; }
    .icon-btn.active { background: rgba(6,182,212,0.25); border-color: rgba(6,182,212,0.40); color: #67e8f9; }

    /* ── Code editor ── */
    .editor-wrap {
      position: relative; flex: 1; min-height: 0;
      background: #06091a; display: flex; overflow: hidden;
    }

    #lineNumbers {
      font-family: "JetBrains Mono", monospace; font-size: 12px; line-height: 21px;
      width: 36px; flex-shrink: 0;
      background: rgba(0,0,0,0.28); border-right: 1px solid rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.20); text-align: right;
      padding: 12px 6px 12px 0; overflow: hidden; user-select: none;
    }

    .code-editor {
      font-family: "JetBrains Mono", monospace; font-size: 12px; line-height: 21px;
      position: absolute; top: 0; left: 36px; right: 0; bottom: 0;
      border: none; background: transparent; color: transparent;
      caret-color: #e2e8ff; resize: none; padding: 12px 12px 12px 10px;
      outline: none; overflow-y: auto; z-index: 2;
      white-space: pre; overflow-wrap: normal;
    }
    .code-editor::selection { background: rgba(6,182,212,0.30); }

    .highlight-layer {
      font-family: "JetBrains Mono", monospace; font-size: 12px; line-height: 21px;
      position: absolute; top: 0; left: 36px; right: 0; bottom: 0;
      padding: 12px 12px 12px 10px; pointer-events: none;
      overflow: hidden; white-space: pre; overflow-wrap: normal;
      z-index: 1; color: #e2e8ff;
    }

    /* HTML syntax colours */
    .hl-tag   { color: #67e8f9; }   /* <div> tags */
    .hl-attr  { color: #a5b4fc; }   /* attributes */
    .hl-val   { color: #86efac; }   /* attribute values */
    .hl-cmt   { color: #4b5563; font-style: italic; }
    .hl-ent   { color: #fbbf24; }   /* &amp; entities */
    /* CSS syntax */
    .hl-sel   { color: #67e8f9; }   /* selectors */
    .hl-prop  { color: #a5b4fc; }   /* properties */
    .hl-unit  { color: #fb923c; }   /* values/units */
    .hl-cssv  { color: #86efac; }   /* string values */

    /* ── Actions row ── */
    .actions-row {
      flex-shrink: 0; display: grid; grid-template-columns: 1fr 1fr;
      gap: 7px; padding: 8px 12px; border-top: 1px solid rgba(255,255,255,0.06);
    }

    .act-btn {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      padding: 7px 12px; border-radius: 9px; border: none;
      font-family: "DM Sans", sans-serif; font-size: 12px; font-weight: 600;
      cursor: pointer; transition: all 150ms ease;
    }
    .act-btn:hover  { transform: translateY(-1px); }
    .act-btn:active { transform: translateY(0); }

    .btn-run {
      background: linear-gradient(135deg, #0891b2, #7c3aed);
      color: #fff; box-shadow: 0 3px 14px rgba(6,182,212,0.25);
    }
    .btn-run:hover { box-shadow: 0 5px 18px rgba(6,182,212,0.40); }

    .btn-reset {
      background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12); color: #b0b8d8;
    }
    .btn-reset:hover { background: rgba(255,255,255,0.12); }

    /* ── Examples panel ── */
    #examplesPanel { flex: 1; min-height: 0; overflow-y: auto; background: #06091a; }
    .ex-item {
      display: block; width: 100%; text-align: left; padding: 8px 12px;
      border: none; border-bottom: 1px solid rgba(255,255,255,0.04);
      background: none; cursor: pointer; transition: background 110ms; color: inherit;
    }
    .ex-item:last-child { border-bottom: none; }
    .ex-item:hover { background: rgba(6,182,212,0.10); }
    .ex-item h4 { font-size: 12px; font-weight: 600; color: #c7cfe8; margin-bottom: 2px; }
    .ex-item p  { font-size: 11px; color: rgba(221,225,240,0.38); }

    .diff { display: inline-block; font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 4px; margin-left: 5px; vertical-align: middle; text-transform: uppercase; }
    .diff-b { background: rgba(16,185,129,0.15); color: #6ee7b7; }
    .diff-i { background: rgba(245,158,11,0.15); color: #fcd34d; }

    /* ── Right column: preview ── */
    #rightCol { display: flex; flex-direction: column; min-height: 0; }
    #previewPanel { flex: 1; min-height: 0; display: flex; flex-direction: column; }

    .preview-outer {
      flex: 1; min-height: 0;
      margin: 0 12px 12px;
      border-radius: 10px; overflow: hidden;
      border: 1px solid rgba(255,255,255,0.09);
      background: #ffffff;
      display: flex; flex-direction: column;
    }

    /* Browser chrome bar */
    .browser-bar {
      flex-shrink: 0;
      background: #1e293b; padding: 6px 10px;
      display: flex; align-items: center; gap: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .browser-dots { display: flex; gap: 5px; }
    .browser-dot { width: 10px; height: 10px; border-radius: 50%; }
    .dot-red  { background: #ef4444; }
    .dot-yel  { background: #f59e0b; }
    .dot-grn  { background: #22c55e; }
    .browser-url {
      flex: 1; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.10);
      border-radius: 5px; padding: 3px 10px;
      font-family: "JetBrains Mono", monospace; font-size: 10px; color: rgba(255,255,255,0.40);
    }

    #previewFrame {
      flex: 1; width: 100%; border: none; background: #fff;
      display: block;
    }

    /* ── Resize handle between panels ── */
    #resizeHandle {
      width: 6px; cursor: col-resize; background: transparent;
      flex-shrink: 0; position: relative; z-index: 10;
      transition: background 150ms;
    }
    #resizeHandle:hover, #resizeHandle.dragging { background: rgba(6,182,212,0.30); }

    /* ── Status bar ── */
    #statusBar {
      flex-shrink: 0; display: flex; align-items: center; gap: 16px;
      padding: 4px 16px; background: rgba(0,0,0,0.25);
      border-top: 1px solid rgba(255,255,255,0.05);
      font-family: "JetBrains Mono", monospace; font-size: 10px;
      color: rgba(221,225,240,0.35);
    }
    #statusBar span { display: flex; align-items: center; gap: 5px; }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #22c55e; }

    /* ── Scrollbars ── */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 99px; }

    button:focus-visible, textarea:focus-visible { outline: 2px solid rgba(6,182,212,0.60); outline-offset: 2px; }
    .hidden { display: none !important; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  </style>
</head>
<body>
<div id="appShell">

  <!-- Header -->
  <header id="appHeader">
    <a href="index.html" class="home-btn">
      <i data-lucide="arrow-left" style="width:12px;height:12px;"></i> Home
    </a>
    <h1 class="app-title">Web Wizard</h1>

    <div class="header-actions">
      <!-- Preview size -->
      <div class="preview-size-group">
        <button class="size-btn active" data-size="desktop" title="Desktop preview"><i data-lucide="monitor" style="width:12px;height:12px;"></i></button>
        <button class="size-btn" data-size="tablet"  title="Tablet preview"><i data-lucide="tablet" style="width:12px;height:12px;"></i></button>
        <button class="size-btn" data-size="mobile"  title="Mobile preview"><i data-lucide="smartphone" style="width:12px;height:12px;"></i></button>
      </div>
      <button id="saveBtn" class="hdr-btn"><i data-lucide="download" style="width:13px;height:13px;"></i> Save</button>
      <button id="loadBtn" class="hdr-btn"><i data-lucide="upload"   style="width:13px;height:13px;"></i> Load</button>
      <input type="file" id="fileInput" accept=".html,.htm,.css,.txt" class="hidden">
    </div>
  </header>

  <!-- Main -->
  <div id="mainGrid" style="grid-template-columns: 420px 4px 1fr;">

    <!-- Left: editor -->
    <div id="leftCol" class="panel">
      <div class="panel-hd">
        <h2 class="panel-title">
          <i data-lucide="code-2" style="width:14px;height:14px;color:#67e8f9;"></i>
          <span>Code editor</span>
        </h2>
        <div style="display:flex;align-items:center;gap:5px;">
          <div class="tab-group">
            <button id="editorTab"   class="tab-btn active">Editor</button>
            <button id="examplesTab" class="tab-btn">Examples</button>
          </div>
          <button id="lineNumbersToggle" class="icon-btn active" title="Toggle line numbers">
            <i data-lucide="list" style="width:13px;height:13px;"></i>
          </button>
          <button id="autoRunToggle" class="icon-btn active" title="Auto-update preview">
            <i data-lucide="zap" style="width:13px;height:13px;"></i>
          </button>
        </div>
      </div>

      <div class="editor-wrap" id="editorWrap">
        <label for="codeEditor" class="sr-only">HTML and CSS code editor</label>
        <div id="lineNumbers"></div>
        <div id="highlightLayer" class="highlight-layer" aria-hidden="true"></div>
        <textarea id="codeEditor" class="code-editor" spellcheck="false" autocorrect="off" autocapitalize="off"><!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: sans-serif;
      background: #f0f4ff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 32px 40px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
      text-align: center;
    }

    h1 {
      color: #4f46e5;
      font-size: 2rem;
      margin-bottom: 8px;
    }

    p {
      color: #64748b;
      font-size: 1rem;
    }

    .btn {
      margin-top: 20px;
      padding: 10px 24px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
    }

    .btn:hover {
      background: #4338ca;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello, World!</h1>
    <p>Edit the code on the left to change this page.</p>
    <button class="btn">Click me!</button>
  </div>
</body>
</html></textarea>
      </div>

      <div id="examplesPanel" class="hidden">
        <button class="ex-item exampleLoader" data-example="hello_world">
          <h4>Hello World <span class="diff diff-b">beginner</span></h4>
          <p>a simple centred card with a heading and button</p>
        </button>
        <button class="ex-item exampleLoader" data-example="colour_boxes">
          <h4>Colour boxes <span class="diff diff-b">beginner</span></h4>
          <p>coloured div elements using background-color</p>
        </button>
        <button class="ex-item exampleLoader" data-example="flexbox_nav">
          <h4>Navigation bar <span class="diff diff-i">intermediate</span></h4>
          <p>a horizontal navbar using flexbox</p>
        </button>
        <button class="ex-item exampleLoader" data-example="grid_cards">
          <h4>Card grid <span class="diff diff-i">intermediate</span></h4>
          <p>a responsive 3-column card layout using CSS Grid</p>
        </button>
        <button class="ex-item exampleLoader" data-example="css_animation">
          <h4>CSS animation <span class="diff diff-i">intermediate</span></h4>
          <p>a bouncing ball using @keyframes</p>
        </button>
        <button class="ex-item exampleLoader" data-example="form_layout">
          <h4>Contact form <span class="diff diff-i">intermediate</span></h4>
          <p>a styled HTML form with inputs and a submit button</p>
        </button>
      </div>

      <div class="actions-row">
        <button id="runButton" class="act-btn btn-run">
          <i data-lucide="refresh-cw" style="width:14px;height:14px;"></i> Refresh preview
        </button>
        <button id="resetButton" class="act-btn btn-reset">
          <i data-lucide="rotate-ccw" style="width:14px;height:14px;"></i> Reset
        </button>
      </div>
    </div>

    <!-- Resize handle -->
    <div id="resizeHandle"></div>

    <!-- Right: preview -->
    <div id="rightCol">
      <div class="panel" id="previewPanel">
        <div class="panel-hd">
          <h2 class="panel-title">
            <i data-lucide="monitor" style="width:14px;height:14px;color:#67e8f9;"></i>
            Live preview
          </h2>
          <div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:rgba(221,225,240,0.35);" id="previewSizeLabel">Desktop</div>
        </div>
        <div class="preview-outer" id="previewOuter">
          <div class="browser-bar">
            <div class="browser-dots">
              <div class="browser-dot dot-red"></div>
              <div class="browser-dot dot-yel"></div>
              <div class="browser-dot dot-grn"></div>
            </div>
            <div class="browser-url">preview</div>
          </div>
          <iframe id="previewFrame" title="Live HTML preview" sandbox="allow-scripts"></iframe>
        </div>
      </div>
    </div>

  </div>

  <!-- Status bar -->
  <div id="statusBar">
    <span><div class="status-dot"></div> Ready</span>
    <span id="lineColReadout">Ln 1, Col 1</span>
    <span id="charCount">0 chars</span>
    <span style="margin-left:auto;color:rgba(221,225,240,0.20);">Web Wizard</span>
  </div>

</div>

<script>
// ── Examples ─────────────────────────────────────────────────────────────────
const examples = {

  hello_world: `<!DOCTYPE html>
<html>

  <style>

<body>

  colour_boxes: `<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: sans-serif;
      padding: 32px;
      background: #f8fafc;
    }
    h1 { margin-bottom: 24px; color: #1e293b; }
    .boxes {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }
    .box {
      width: 120px;
      height: 120px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <h1>Colour Boxes</h1>
  <div class="boxes">
    <div class="box" style="background: #ef4444;">Red</div>
    <div class="box" style="background: #f97316;">Orange</div>
    <div class="box" style="background: #eab308;">Yellow</div>
    <div class="box" style="background: #22c55e;">Green</div>
    <div class="box" style="background: #3b82f6;">Blue</div>
    <div class="box" style="background: #8b5cf6;">Purple</div>
  </div>
</body>
</html>`,

  flexbox_nav: `<!DOCTYPE html>
<html>
<head>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #f1f5f9; }
    nav {
      background: #1e293b;
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
    }
    .logo {
      color: white;
      font-weight: bold;
      font-size: 1.2rem;
    }
    .nav-links {
      display: flex;
      gap: 8px;
      list-style: none;
    }
    .nav-links a {
      color: rgba(255,255,255,0.7);
      text-decoration: none;
      padding: 6px 14px;
      border-radius: 6px;
      transition: background 0.2s;
    }

// ── DOM refs ──────────────────────────────────────────────────────────────────
const codeEditor        = document.getElementById('codeEditor');
const highlightLayer    = document.getElementById('highlightLayer');
const lineNumbers       = document.getElementById('lineNumbers');
const lineNumbersToggle = document.getElementById('lineNumbersToggle');
const autoRunToggle     = document.getElementById('autoRunToggle');
const editorTab         = document.getElementById('editorTab');
const examplesTab       = document.getElementById('examplesTab');
const editorWrap        = document.getElementById('editorWrap');
const examplesPanel     = document.getElementById('examplesPanel');
const runButton         = document.getElementById('runButton');
const resetButton       = document.getElementById('resetButton');
const previewFrame      = document.getElementById('previewFrame');
const previewOuter      = document.getElementById('previewOuter');
const previewSizeLabel  = document.getElementById('previewSizeLabel');
const lineColReadout    = document.getElementById('lineColReadout');
const charCount         = document.getElementById('charCount');
const saveBtn           = document.getElementById('saveBtn');
const loadBtn           = document.getElementById('loadBtn');
const fileInput         = document.getElementById('fileInput');
const mainGrid          = document.getElementById('mainGrid');
const resizeHandle      = document.getElementById('resizeHandle');

// ── Syntax highlighting (HTML/CSS aware) ──────────────────────────────────────
function highlight(code) {
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const TOKENS = [
    { re: /^<!--[\s\S]*?-->/, cls: 'hl-cmt' },
    { re: /^<\/[a-zA-Z][a-zA-Z0-9]*>/, cls: 'hl-tag' },
    { re: /^<[a-zA-Z][a-zA-Z0-9]*(\s[^>]*)?>/, cls: null, html: true },
    { re: /^&[a-zA-Z]+;/, cls: 'hl-ent' },
    { re: /^[\s\S]/, cls: null },
  ];

  // CSS token rules (used inside <style> blocks)
  const CSS_TOKENS = [
    { re: /^\/\*[\s\S]*?\*\//, cls: 'hl-cmt' },
    { re: /^[^{};:\/]+(?=\s*\{)/, cls: 'hl-sel' },
    { re: /^[a-zA-Z-]+(?=\s*:)/, cls: 'hl-prop' },
    { re: /^:\s*[^;{}]+/, cls: 'hl-unit' },
    { re: /^[\s\S]/, cls: null },
  ];

  // Detect CSS region
  const styleMatch = code.match(/<style[^>]*>([\s\S]*?)<\/style>/i);
  let cssStart = -1, cssEnd = -1;
  if (styleMatch) {
    cssStart = code.indexOf(styleMatch[1]);
    cssEnd   = cssStart + styleMatch[1].length;
  }

  let out = '', pos = 0;
  while (pos < code.length) {
    const slice = code.slice(pos);
    const inCSS = (pos >= cssStart && pos < cssEnd);
    const tokens = inCSS ? CSS_TOKENS : TOKENS;
    let matched = false;
    for (const tok of tokens) {
      const m = slice.match(tok.re);
      if (!m) continue;
      const raw = m[0]; pos += raw.length; matched = true;
      if (tok.html) {
        // colour tag name + attribute names + values separately
        let h = raw.replace(/^(<\/?)([a-zA-Z][a-zA-Z0-9]*)/, (_, p, t) =>
          `${esc(p)}<span class="hl-tag">${esc(t)}</span>`
        );
        h = h.replace(/\s([a-zA-Z:_-]+)=/g, (_, a) =>
          ` <span class="hl-attr">${esc(a)}</span>=`
        );
        h = h.replace(/=(["'])([^"']*)\1/g, (_, q, v) =>
          `=${esc(q)}<span class="hl-val">${esc(v)}</span>${esc(q)}`
        );
        out += h;
      } else if (tok.cls) {
        out += `<span class="${tok.cls}">${esc(raw)}</span>`;
      } else {
        out += esc(raw);
      }
      break;
    }
    if (!matched) { out += esc(code[pos]); pos++; }
  }
  return out;
}

function updateHighlight() {
  highlightLayer.innerHTML = highlight(codeEditor.value);
  highlightLayer.scrollTop  = codeEditor.scrollTop;
  highlightLayer.scrollLeft = codeEditor.scrollLeft;
}

// ── Line numbers ──────────────────────────────────────────────────────────────
let lineNumbersVisible = true;
function updateLineNumbers() {
  const lines = codeEditor.value.split('\n').length;
  lineNumbers.innerHTML = Array.from({length: lines}, (_, i) => i+1).join('<br>');
}

function toggleLineNumbers() {
  lineNumbersVisible = !lineNumbersVisible;
  lineNumbers.style.display = lineNumbersVisible ? '' : 'none';
  const left = lineNumbersVisible ? '36px' : '0';
  highlightLayer.style.left = left;
  codeEditor.style.left = left;
  lineNumbersToggle.classList.toggle('active', lineNumbersVisible);
}
lineNumbersToggle.addEventListener('click', toggleLineNumbers);

// ── Tab key → 2 spaces ───────────────────────────────────────────────────────
codeEditor.addEventListener('keydown', e => {
  if (e.key === 'Tab') {
    e.preventDefault();
    const s = codeEditor.selectionStart, en = codeEditor.selectionEnd;
    codeEditor.value = codeEditor.value.substring(0,s) + '  ' + codeEditor.value.substring(en);
    codeEditor.selectionStart = codeEditor.selectionEnd = s + 2;
    updateLineNumbers(); updateHighlight();
  }
});

codeEditor.addEventListener('input', () => {
  updateLineNumbers(); updateHighlight();
  charCount.textContent = codeEditor.value.length + ' chars';
  if (autoRun) scheduleRun();
});

codeEditor.addEventListener('scroll', () => {
  lineNumbers.scrollTop     = codeEditor.scrollTop;
  highlightLayer.scrollTop  = codeEditor.scrollTop;
  highlightLayer.scrollLeft = codeEditor.scrollLeft;
});

codeEditor.addEventListener('click',  updateCursor);
codeEditor.addEventListener('keyup',  updateCursor);
function updateCursor() {
  const val = codeEditor.value;
  const pos = codeEditor.selectionStart;
  const lines = val.substring(0, pos).split('\n');
  lineColReadout.textContent = `Ln ${lines.length}, Col ${lines[lines.length-1].length + 1}`;
}

// ── Auto-run ─────────────────────────────────────────────────────────────────
let autoRun = true;
let runTimer = null;

autoRunToggle.addEventListener('click', () => {
  autoRun = !autoRun;
  autoRunToggle.classList.toggle('active', autoRun);
  autoRunToggle.title = autoRun ? 'Auto-update on (click to disable)' : 'Auto-update off (click to enable)';
});

function scheduleRun() {
  clearTimeout(runTimer);
  runTimer = setTimeout(refreshPreview, 600);
}

// ── Preview ───────────────────────────────────────────────────────────────────
function refreshPreview() {
  const code = codeEditor.value;
  const blob = new Blob([code], {type: 'text/html'});
  const url  = URL.createObjectURL(blob);
  previewFrame.onload = () => URL.revokeObjectURL(url);
  previewFrame.src = url;
}

runButton.addEventListener('click', refreshPreview);
resetButton.addEventListener('click', () => {
  codeEditor.value = examples.hello_world;
  updateLineNumbers(); updateHighlight();
  refreshPreview();
});

// ── Preview size buttons ──────────────────────────────────────────────────────
const sizeBtns = document.querySelectorAll('.size-btn');
const sizeMap = {
  desktop: { width: '100%',  label: 'Desktop' },
  tablet:  { width: '768px', label: 'Tablet (768px)' },
  mobile:  { width: '375px', label: 'Mobile (375px)' },
};

sizeBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    sizeBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const cfg = sizeMap[btn.dataset.size];
    previewFrame.style.width    = cfg.width;
    previewFrame.style.maxWidth = cfg.width;
    previewSizeLabel.textContent = cfg.label;
  });
});

// ── Tab switching ─────────────────────────────────────────────────────────────
editorTab.addEventListener('click', () => {
  editorWrap.classList.remove('hidden');
  examplesPanel.classList.add('hidden');
  editorTab.classList.add('active');
  examplesTab.classList.remove('active');
});
examplesTab.addEventListener('click', () => {
  editorWrap.classList.add('hidden');
  examplesPanel.classList.remove('hidden');
  examplesTab.classList.add('active');
  editorTab.classList.remove('active');
});

document.querySelectorAll('.exampleLoader').forEach(btn => {
  btn.addEventListener('click', () => {
    const key = btn.getAttribute('data-example');
    if (examples[key]) {
      codeEditor.value = examples[key];
      updateLineNumbers(); updateHighlight();
      refreshPreview();
      editorTab.click();
    }
  });
});

// ── Save / Load ───────────────────────────────────────────────────────────────
saveBtn.addEventListener('click', () => {
  const blob = new Blob([codeEditor.value], {type: 'text/html'});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = 'my-page.html'; a.click();
  URL.revokeObjectURL(url);
});

loadBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    codeEditor.value = ev.target.result;
    updateLineNumbers(); updateHighlight(); refreshPreview();
    editorTab.click();
  };
  reader.readAsText(file);
  fileInput.value = '';
});

// ── Resize handle ─────────────────────────────────────────────────────────────
let dragging = false, dragStartX = 0, dragStartW = 0;
resizeHandle.addEventListener('mousedown', e => {
  dragging = true; dragStartX = e.clientX;
  dragStartW = parseInt(mainGrid.style.gridTemplateColumns);
  resizeHandle.classList.add('dragging');
  document.body.style.cursor = 'col-resize';
  document.body.style.userSelect = 'none';
});
document.addEventListener('mousemove', e => {
  if (!dragging) return;
  const delta   = e.clientX - dragStartX;
  const newW    = Math.max(280, Math.min(800, dragStartW + delta));
  mainGrid.style.gridTemplateColumns = `${newW}px 4px 1fr`;
});
document.addEventListener('mouseup', () => {
  if (!dragging) return;
  dragging = false;
  resizeHandle.classList.remove('dragging');
  document.body.style.cursor = '';
  document.body.style.userSelect = '';
});

// ── Init ──────────────────────────────────────────────────────────────────────
updateLineNumbers();
updateHighlight();
charCount.textContent = codeEditor.value.length + ' chars';
refreshPreview();
lucide.createIcons();
</script>
</body>
</html>
