<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web Wizard</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
height:100vh;
overflow:hidden;
background:#0a0f1e;
color:#dde1f0;
font-family:'DM Sans',sans-serif;
}
header{
padding:16px 24px;
border-bottom:1px solid rgba(255,255,255,0.08);
display:flex;
justify-content:space-between;
align-items:center;
}
.logo{
font-family:'Syne',sans-serif;
font-size:1.8rem;
font-weight:800;
background:linear-gradient(135deg,#fff,#a5b4fc,#6ee7b7);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}
.home{
color:#a5b4fc;
text-decoration:none;
font-weight:700;
}
.main{
display:grid;
grid-template-columns:420px 1fr;
gap:12px;
padding:12px;
height:calc(100vh - 74px);
}
.panel{
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.08);
border-radius:18px;
overflow:hidden;
display:flex;
flex-direction:column;
}
.panel-header{
padding:12px 16px;
font-family:'Syne',sans-serif;
border-bottom:1px solid rgba(255,255,255,0.08);
}
.tabs{
display:flex;
gap:10px;
padding:12px;
border-bottom:1px solid rgba(255,255,255,0.08);
}
.tab{
padding:8px 12px;
background:rgba(99,102,241,0.18);
border:1px solid rgba(99,102,241,0.3);
border-radius:8px;
color:#a5b4fc;
cursor:pointer;
}
.reference{
max-height:200px;
overflow:auto;
padding:12px;
border-bottom:1px solid rgba(255,255,255,0.08);
}
.ref{
padding:10px;
border-radius:10px;
background:rgba(255,255,255,0.04);
margin-bottom:10px;
cursor:pointer;
}
textarea{
flex:1;
background:#06091a;
border:none;
outline:none;
resize:none;
padding:18px;
color:#dde1f0;
font-family:'JetBrains Mono',monospace;
}
iframe{
width:100%;
height:100%;
border:none;
background:white;
}
.toolbar{
padding:12px;
border-top:1px solid rgba(255,255,255,0.08);
}
button{
padding:10px 18px;
border:none;
border-radius:10px;
font-weight:700;
background:linear-gradient(135deg,#6366f1,#10b981);
color:white;
cursor:pointer;
}
</style>
</head>
<body>

<header>
<div class="logo">🌐 Web Wizard</div>
<a class="home" href="index.html">← Home</a>
</header>

<div class="main">

<div class="panel">

<div class="panel-header">
HTML & CSS Editor
</div>

<div class="tabs">
<div class="tab" onclick="showHTML()">HTML Tags</div>
<div class="tab" onclick="showCSS()">CSS Properties</div>
</div>

<div class="reference" id="reference"></div>

<textarea id="editor"><h1>Hello World</h1>

<p>This is my first webpage.</p>

<style>
body{
background:#111827;
color:white;
font-family:Arial;
padding:40px;
}
</style></textarea>

<div class="toolbar">
<button onclick="updatePreview()">Run Preview</button>
</div>

</div>

<div class="panel">
<div class="panel-header">
Live Preview
</div>

<iframe id="preview"></iframe>
</div>

</div>

<script>
const editor = document.getElementById('editor');
const preview = document.getElementById('preview');
const reference = document.getElementById('reference');

const htmlTags = [
['h1','<h1>Main Heading</h1>'],
['p','<p>Paragraph</p>'],
['button','<button>Click Me</button>'],
['div','<div></div>']
];

const cssProps = [
['color','color:white;'],
['background','background:black;'],
['padding','padding:20px;'],
['border-radius','border-radius:12px;']
];

function render(items){
reference.innerHTML='';

items.forEach(item=>{
const div=document.createElement('div');
div.className='ref';
div.textContent=item[0];

div.onclick=()=>{
editor.value += '\n' + item[1];
};

reference.appendChild(div);
});
}

function showHTML(){
render(htmlTags);
}

function showCSS(){
render(cssProps);
}

function updatePreview(){
preview.srcdoc = editor.value;
}

showHTML();
updatePreview();
</script>

</body>
</html>
