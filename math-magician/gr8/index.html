<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0f1e">
  <title>Math Magician — Gr 8 Mathematics</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23b45309'/%3E%3Ctext x='50%25' y='54%25' font-size='38' text-anchor='middle' dominant-baseline='middle'%3E%E2%9C%A8%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Syne:wght@700;800&family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; width: 100%; overflow: hidden; }
    body { font-family: "DM Sans", sans-serif; font-size: 13px; background: #0a0f1e; color: #dde1f0; }

    #appShell {
      height: 100%; width: 100%;
      display: flex; flex-direction: column; overflow: hidden;
      background:
        radial-gradient(ellipse 55% 35% at 6%  4%, rgba(245,158,11,0.14) 0%, transparent 60%),
        radial-gradient(ellipse 45% 30% at 96%  6%, rgba(234,179,8,0.10) 0%, transparent 55%),
        radial-gradient(ellipse 35% 25% at 50% 98%, rgba(99,102,241,0.08) 0%, transparent 60%),
        #0a0f1e;
    }

    /* ── Header ── */
    #appHeader {
      flex-shrink: 0; display: flex; align-items: center; gap: 10px;
      padding: 8px 16px 7px; border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .home-btn {
      display: flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600;
      padding: 5px 10px; border-radius: 7px; border: 1px solid rgba(255,255,255,0.10);
      background: rgba(255,255,255,0.05); color: rgba(221,225,240,0.55);
      text-decoration: none; transition: all 130ms; flex-shrink: 0;
    }
    .home-btn:hover { background: rgba(255,255,255,0.10); color: #dde1f0; }
    .app-icon {
      width: 32px; height: 32px; border-radius: 9px; flex-shrink: 0;
      background: linear-gradient(135deg, #d97706, #f59e0b);
      display: flex; align-items: center; justify-content: center; font-size: 16px;
    }
    h1.app-title {
      font-family: "Syne", sans-serif; font-weight: 800;
      font-size: clamp(16px, 1.8vw, 22px); line-height: 1;
      background: linear-gradient(125deg, #fff 0%, #fcd34d 55%, #fb923c 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .grade-badge {
      font-size: 10px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase;
      padding: 3px 9px; border-radius: 99px;
      background: rgba(245,158,11,0.15); border: 1px solid rgba(245,158,11,0.30); color: #fcd34d;
    }
    .header-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    #progressText { font-size: 11px; color: rgba(221,225,240,0.35); }
    #progressBar {
      width: 120px; height: 5px; border-radius: 99px;
      background: rgba(255,255,255,0.08); overflow: hidden;
    }
    #progressFill {
      height: 100%; border-radius: 99px; width: 0%;
      background: linear-gradient(90deg, #f59e0b, #fcd34d);
      transition: width 400ms ease;
    }

    /* ── Main layout ── */
    #mainLayout { flex: 1; display: flex; min-height: 0; overflow: hidden; }

    /* ── Sidebar ── */
    #sidebar {
      width: 268px; flex-shrink: 0;
      border-right: 1px solid rgba(255,255,255,0.07);
      display: flex; flex-direction: column; overflow: hidden;
      background: rgba(0,0,0,0.22);
    }
    #sidebarHeader {
      flex-shrink: 0; padding: 12px 14px 10px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .sidebar-chapter {
      font-family: "Syne", sans-serif; font-weight: 800; font-size: 11px;
      letter-spacing: 0.06em; text-transform: uppercase; color: #fbbf24;
      display: flex; align-items: center; gap: 6px; margin-bottom: 2px;
    }
    .sidebar-subtitle { font-size: 10px; color: rgba(221,225,240,0.30); letter-spacing: 0.04em; }
    #sidebarList { flex: 1; overflow-y: auto; padding-bottom: 12px; }
    .topic-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 14px; cursor: pointer; transition: background 110ms;
      border-left: 2px solid transparent; user-select: none;
    }
    .topic-item:hover { background: rgba(245,158,11,0.07); }
    .topic-item.active {
      background: rgba(245,158,11,0.12); border-left-color: #f59e0b;
    }
    .topic-item.completed { opacity: 0.70; }
    .topic-num {
      font-family: "JetBrains Mono", monospace; font-size: 10px;
      color: rgba(221,225,240,0.25); width: 18px; flex-shrink: 0; text-align: right;
    }
    .topic-name { font-size: 12px; font-weight: 500; color: rgba(221,225,240,0.65); line-height: 1.3; flex: 1; }
    .topic-item.active .topic-name { color: #fcd34d; font-weight: 600; }
    .topic-tick { font-size: 11px; color: #6ee7b7; flex-shrink: 0; }

    /* ── Content area ── */
    #contentArea { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }

    /* ── Tab bar ── */
    #tabBar {
      flex-shrink: 0; display: flex; align-items: center; gap: 3px;
      padding: 8px 16px 0; border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .tab-btn {
      font-family: "DM Sans", sans-serif; font-size: 12px; font-weight: 600;
      padding: 6px 14px 8px; border-radius: 8px 8px 0 0; border: none; cursor: pointer;
      transition: all 130ms; color: rgba(221,225,240,0.40); background: transparent;
      border-bottom: 2px solid transparent;
    }
    .tab-btn.active { color: #fcd34d; border-bottom-color: #f59e0b; background: rgba(245,158,11,0.08); }
    .tab-btn:hover:not(.active) { color: rgba(221,225,240,0.75); }

    /* ── Panels ── */
    .content-panel { flex: 1; min-height: 0; overflow-y: auto; padding: 24px 28px 32px; }
    .content-panel.hidden { display: none; }

    /* ── Lesson panel ── */
    .lesson-heading {
      font-family: "Syne", sans-serif; font-weight: 800; font-size: 22px;
      background: linear-gradient(125deg, #fff 0%, #fcd34d 60%, #fb923c 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      margin-bottom: 6px;
    }
    .lesson-subheading {
      font-size: 12px; color: rgba(221,225,240,0.38); letter-spacing: 0.05em;
      text-transform: uppercase; margin-bottom: 22px;
    }
    .lesson-body { font-size: 14px; line-height: 1.8; color: rgba(221,225,240,0.78); max-width: 680px; }
    .lesson-body p { margin-bottom: 14px; }
    .lesson-body strong { color: #fcd34d; font-weight: 600; }
    .lesson-body em { color: #6ee7b7; font-style: normal; font-weight: 500; }

    .def-box {
      background: rgba(245,158,11,0.08); border: 1px solid rgba(245,158,11,0.22);
      border-radius: 12px; padding: 14px 18px; margin: 16px 0;
    }
    .def-box-title {
      font-family: "Syne", sans-serif; font-weight: 700; font-size: 11px;
      text-transform: uppercase; letter-spacing: 0.08em; color: #fbbf24; margin-bottom: 8px;
    }
    .def-box p { margin: 0; font-size: 13.5px; color: rgba(221,225,240,0.80); line-height: 1.7; }

    .example-box {
      background: rgba(99,102,241,0.08); border: 1px solid rgba(99,102,241,0.22);
      border-radius: 12px; padding: 14px 18px; margin: 16px 0;
    }
    .example-box-title {
      font-family: "Syne", sans-serif; font-weight: 700; font-size: 11px;
      text-transform: uppercase; letter-spacing: 0.08em; color: #a5b4fc; margin-bottom: 10px;
    }
    .example-step {
      display: flex; gap: 12px; align-items: flex-start; margin-bottom: 8px;
      font-size: 13px; color: rgba(221,225,240,0.78); line-height: 1.65;
    }
    .example-step:last-child { margin-bottom: 0; }
    .step-num {
      display: inline-flex; align-items: center; justify-content: center;
      width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0; margin-top: 1px;
      background: rgba(99,102,241,0.25); border: 1px solid rgba(99,102,241,0.40);
      font-size: 10px; font-weight: 700; color: #a5b4fc;
    }
    .math {
      font-family: "JetBrains Mono", monospace; font-size: 13px;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.09);
      border-radius: 6px; padding: 2px 8px; color: #fcd34d; display: inline;
    }
    .math-block {
      font-family: "JetBrains Mono", monospace; font-size: 13px;
      background: rgba(0,0,0,0.30); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px; padding: 12px 16px; margin: 12px 0;
      color: #fcd34d; display: block; line-height: 1.9;
    }
    .tip-box {
      background: rgba(16,185,129,0.08); border: 1px solid rgba(16,185,129,0.22);
      border-radius: 12px; padding: 12px 16px; margin: 14px 0;
      font-size: 13px; color: #6ee7b7; line-height: 1.65;
      display: flex; gap: 10px; align-items: flex-start;
    }
    .tip-icon { flex-shrink: 0; font-size: 15px; margin-top: 1px; }

    .lesson-next-btn {
      display: inline-flex; align-items: center; gap: 8px;
      margin-top: 28px; padding: 11px 24px; border-radius: 11px; border: none;
      background: linear-gradient(135deg, #d97706, #f59e0b); color: #fff;
      font-family: "DM Sans", sans-serif; font-size: 13px; font-weight: 700;
      cursor: pointer; transition: all 150ms; box-shadow: 0 4px 16px rgba(217,119,6,0.30);
    }
    .lesson-next-btn:hover { box-shadow: 0 6px 22px rgba(217,119,6,0.45); transform: translateY(-1px); }

    /* ── Practice panel ── */
    #practicePanel { padding: 24px 28px 32px; }
    .question-header {
      display: flex; align-items: center; gap: 12px; margin-bottom: 20px;
    }
    .q-counter {
      font-family: "JetBrains Mono", monospace; font-size: 10px; font-weight: 600;
      padding: 3px 10px; border-radius: 99px;
      background: rgba(245,158,11,0.12); border: 1px solid rgba(245,158,11,0.25); color: #fbbf24;
      letter-spacing: 0.06em; text-transform: uppercase;
    }
    .q-topic-tag {
      font-size: 10px; font-weight: 600; padding: 3px 9px; border-radius: 99px;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.10);
      color: rgba(221,225,240,0.40); letter-spacing: 0.04em;
    }
    .question-text {
      font-family: "Syne", sans-serif; font-weight: 700; font-size: 17px;
      color: #e8eaf4; line-height: 1.5; margin-bottom: 22px; max-width: 620px;
    }
    .question-text .math { font-size: 15px; }

    /* Multiple choice */
    .mc-options { display: flex; flex-direction: column; gap: 10px; max-width: 520px; }
    .mc-option {
      display: flex; align-items: center; gap: 14px;
      padding: 13px 18px; border-radius: 12px; cursor: pointer;
      border: 1px solid rgba(255,255,255,0.09); background: rgba(255,255,255,0.04);
      transition: all 140ms; user-select: none;
    }
    .mc-option:hover:not(.disabled) { border-color: rgba(245,158,11,0.35); background: rgba(245,158,11,0.08); }
    .mc-option.selected { border-color: rgba(245,158,11,0.55); background: rgba(245,158,11,0.12); }
    .mc-option.correct  { border-color: rgba(16,185,129,0.60); background: rgba(16,185,129,0.12); }
    .mc-option.wrong    { border-color: rgba(239,68,68,0.50);  background: rgba(239,68,68,0.10); }
    .mc-option.disabled { cursor: default; }
    .mc-letter {
      font-family: "JetBrains Mono", monospace; font-size: 11px; font-weight: 700;
      width: 24px; height: 24px; border-radius: 6px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.07); color: rgba(221,225,240,0.50);
      border: 1px solid rgba(255,255,255,0.10); transition: all 140ms;
    }
    .mc-option.selected .mc-letter { background: rgba(245,158,11,0.25); color: #fcd34d; border-color: rgba(245,158,11,0.45); }
    .mc-option.correct  .mc-letter { background: rgba(16,185,129,0.25); color: #6ee7b7; border-color: rgba(16,185,129,0.50); }
    .mc-option.wrong    .mc-letter { background: rgba(239,68,68,0.20);  color: #fca5a5; border-color: rgba(239,68,68,0.45); }
    .mc-text { font-size: 14px; color: rgba(221,225,240,0.75); line-height: 1.4; }

    /* Input question */
    .input-row { display: flex; gap: 10px; align-items: center; max-width: 360px; margin-bottom: 16px; }
    .answer-input {
      flex: 1; padding: 11px 16px; border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.06);
      color: #fcd34d; font-family: "JetBrains Mono", monospace; font-size: 15px;
      outline: none; transition: border-color 140ms;
    }
    .answer-input:focus { border-color: rgba(245,158,11,0.45); }
    .answer-input.correct { border-color: rgba(16,185,129,0.55); color: #6ee7b7; }
    .answer-input.wrong   { border-color: rgba(239,68,68,0.50);  color: #fca5a5; }
    .submit-btn {
      padding: 11px 20px; border-radius: 10px; border: none;
      background: linear-gradient(135deg, #d97706, #f59e0b); color: #fff;
      font-family: "DM Sans", sans-serif; font-size: 12px; font-weight: 700;
      cursor: pointer; transition: all 140ms; white-space: nowrap;
    }
    .submit-btn:hover { box-shadow: 0 4px 14px rgba(217,119,6,0.40); transform: translateY(-1px); }
    .submit-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; box-shadow: none; }

    /* Feedback area */
    #feedbackArea {
      margin-top: 18px; max-width: 600px;
      border-radius: 12px; padding: 14px 18px;
      font-size: 13px; line-height: 1.7; display: none;
    }
    #feedbackArea.correct { background: rgba(16,185,129,0.10); border: 1px solid rgba(16,185,129,0.28); color: #6ee7b7; }
    #feedbackArea.wrong   { background: rgba(239,68,68,0.09);  border: 1px solid rgba(239,68,68,0.28);  color: rgba(221,225,240,0.80); }
    #feedbackArea.loading { background: rgba(245,158,11,0.08); border: 1px solid rgba(245,158,11,0.20); color: rgba(221,225,240,0.55); }
    .feedback-label {
      font-family: "Syne", sans-serif; font-weight: 700; font-size: 12px;
      text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 7px;
      display: flex; align-items: center; gap: 6px;
    }
    #feedbackArea.correct .feedback-label { color: #6ee7b7; }
    #feedbackArea.wrong   .feedback-label { color: #fca5a5; }
    #feedbackArea.loading .feedback-label { color: #fbbf24; }

    /* Next question button */
    #nextQBtn {
      display: none; margin-top: 18px;
      padding: 10px 22px; border-radius: 10px; border: none;
      background: linear-gradient(135deg, #d97706, #f59e0b); color: #fff;
      font-family: "DM Sans", sans-serif; font-size: 12px; font-weight: 700;
      cursor: pointer; transition: all 140ms; align-items: center; gap: 7px;
    }
    #nextQBtn.show { display: inline-flex; }
    #nextQBtn:hover { box-shadow: 0 4px 14px rgba(217,119,6,0.40); transform: translateY(-1px); }

    /* Score bar at top of practice -->
    .score-row {
      display: flex; gap: 16px; margin-bottom: 22px; flex-wrap: wrap;
    }
    .score-pill {
      font-family: "JetBrains Mono", monospace; font-size: 11px;
      padding: 5px 14px; border-radius: 99px;
      border: 1px solid rgba(255,255,255,0.10); background: rgba(255,255,255,0.05);
      color: rgba(221,225,240,0.50);
    }
    .score-pill span { font-weight: 700; color: #fcd34d; }

    /* Empty/complete states */
    .complete-banner {
      text-align: center; padding: 48px 24px;
    }
    .complete-banner h2 {
      font-family: "Syne", sans-serif; font-weight: 800; font-size: 24px;
      background: linear-gradient(125deg, #fff 0%, #fcd34d 60%, #6ee7b7 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      margin-bottom: 10px;
    }
    .complete-banner p { font-size: 14px; color: rgba(221,225,240,0.50); margin-bottom: 24px; }

    .chapter-hdr {
      padding: 10px 14px 4px;
      font-family: "Syne", sans-serif; font-weight: 800; font-size: 10px;
      letter-spacing: 0.07em; text-transform: uppercase;
      color: rgba(245,158,11,0.65);
      border-top: 1px solid rgba(255,255,255,0.05); margin-top: 4px;
      display: flex; align-items: center; justify-content: space-between;
      cursor: pointer; user-select: none;
      transition: color 150ms;
    }
    .chapter-hdr:first-child { border-top: none; margin-top: 0; }
    .chapter-hdr:hover { color: rgba(245,158,11,0.90); }
    .chapter-hdr-left { display: flex; align-items: center; gap: 7px; }
    .chapter-hdr-meta { font-size: 9px; font-weight: 600; color: rgba(221,225,240,0.25); letter-spacing: 0.04em; text-transform: none; font-family: "DM Sans", sans-serif; }
    .chapter-chevron {
      width: 14px; height: 14px; flex-shrink: 0;
      color: rgba(245,158,11,0.45); transition: transform 220ms ease;
    }
    .chapter-chevron.collapsed { transform: rotate(-90deg); }
    .chapter-topics {
      overflow: hidden;
      transition: max-height 280ms ease, opacity 200ms ease;
      max-height: 1000px; opacity: 1;
    }
    .chapter-topics.collapsed { max-height: 0; opacity: 0; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 99px; }

    /* ── Workbook panel ── */
    #workbookPanel { padding: 24px 28px 48px; }
    .wb-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 6px; gap: 16px; flex-wrap: wrap; }
    .wb-title { font-family: "Syne", sans-serif; font-weight: 800; font-size: 20px; background: linear-gradient(125deg, #fff 0%, #fcd34d 60%, #fb923c 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .wb-print-btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 8px; border: 1px solid rgba(245,158,11,0.30); background: rgba(245,158,11,0.10); color: #fcd34d; font-family: "DM Sans", sans-serif; font-size: 11px; font-weight: 700; cursor: pointer; transition: all 140ms; white-space: nowrap; }
    .wb-print-btn:hover { background: rgba(245,158,11,0.20); }
    .wb-intro { font-size: 12px; color: rgba(221,225,240,0.38); margin-bottom: 24px; font-style: italic; }
    .wb-chapter-block { margin-bottom: 32px; }
    .wb-chapter-title { font-family: "Syne", sans-serif; font-weight: 800; font-size: 13px; text-transform: uppercase; letter-spacing: 0.07em; color: #fbbf24; margin-bottom: 14px; padding-bottom: 7px; border-bottom: 1px solid rgba(245,158,11,0.20); display: flex; align-items: center; gap: 8px; }
    .wb-topic-block { margin-bottom: 22px; }
    .wb-topic-label { font-family: "Syne", sans-serif; font-weight: 700; font-size: 11px; color: rgba(221,225,240,0.55); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }
    .wb-question { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07); border-radius: 10px; padding: 14px 18px; margin-bottom: 10px; }
    .wb-question-num { font-family: "JetBrains Mono", monospace; font-size: 10px; font-weight: 700; color: #fbbf24; margin-bottom: 7px; letter-spacing: 0.06em; }
    .wb-question-text { font-size: 13.5px; color: rgba(221,225,240,0.82); line-height: 1.75; }
    .wb-question-text strong { color: #fcd34d; }
    .wb-part { display: flex; gap: 10px; margin-top: 7px; align-items: flex-start; font-size: 13px; color: rgba(221,225,240,0.75); line-height: 1.65; }
    .wb-part-label { font-family: "JetBrains Mono", monospace; font-size: 11px; color: rgba(245,158,11,0.70); font-weight: 700; flex-shrink: 0; min-width: 22px; }
    .wb-marks { display: inline-block; font-family: "JetBrains Mono", monospace; font-size: 9px; padding: 1px 6px; border-radius: 99px; margin-left: 6px; background: rgba(245,158,11,0.12); border: 1px solid rgba(245,158,11,0.22); color: rgba(245,158,11,0.65); vertical-align: middle; }
    .wb-answer-lines { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
    .wb-line { height: 1px; background: rgba(255,255,255,0.08); border-radius: 1px; }

    /* ── Answer key sidebar section ── */
    #answerKeySection { border-top: 1px solid rgba(245,158,11,0.18); margin-top: 8px; flex-shrink: 0; }
    .ak-header { padding: 10px 14px; font-family: "Syne", sans-serif; font-weight: 800; font-size: 10px; letter-spacing: 0.07em; text-transform: uppercase; color: rgba(16,185,129,0.70); display: flex; align-items: center; justify-content: space-between; cursor: pointer; user-select: none; transition: color 150ms; }
    .ak-header:hover { color: rgba(16,185,129,0.95); }
    .ak-header-left { display: flex; align-items: center; gap: 7px; }
    .ak-chevron { width: 14px; height: 14px; flex-shrink: 0; color: rgba(16,185,129,0.45); transition: transform 220ms ease; }
    .ak-chevron.collapsed { transform: rotate(-90deg); }
    .ak-body { overflow-y: auto; max-height: 340px; transition: max-height 280ms ease, opacity 200ms ease; opacity: 1; }

<script>

// ═══════════════════════════════════════════════════════════════
// GRADE 8 CHAPTER MANIFEST
// ═══════════════════════════════════════════════════════════════
const GRADE = 8;
const CHAPTER_MANIFEST = [
  { num: 1, name: "Whole Numbers, Ratios, Rates & Finance", topics: 9,  file: "ch1.js" },
  { num: 2, name: "Integers",                               topics: 10, file: "ch2.js" },
  { num: 3, name: "Exponents",                              topics: 5,  file: "ch3.js" },
  { num: 4, name: "Numeric and Geometric Patterns",         topics: 3,  file: "ch4.js" },
  { num: 5, name: "Functions and Relationships",            topics: 5,  file: "ch5.js" },
  { num: 6, name: "Algebraic Expressions",                  topics: 6,  file: "ch6.js" },
  { num: 7, name: "Algebraic Equations",                    topics: 0,  file: null },
  { num: 8, name: "Graphs",                                 topics: 0,  file: null },
  { num: 9, name: "Geometry of 2D Shapes",                  topics: 0,  file: null },
  { num:10, name: "Geometry of 3D Objects",                 topics: 0,  file: null },
  { num:11, name: "Geometry of Straight Lines",             topics: 0,  file: null },
  { num:12, name: "Construction of Geometric Figures",      topics: 0,  file: null },
  { num:13, name: "Theorem of Pythagoras",                  topics: 0,  file: null },
  { num:14, name: "Area and Perimeter",                     topics: 0,  file: null },
  { num:15, name: "Surface Area and Volume",                topics: 0,  file: null },
  { num:16, name: "Data Handling",                          topics: 0,  file: null },
  { num:17, name: "Probability",                            topics: 0,  file: null },
];

// ═══════════════════════════════════════════════════════════════
// DYNAMIC CHAPTER LOADER
// ═══════════════════════════════════════════════════════════════
const MathMagician = {
  _registry: {},     // ch_num → { topics, workbook, answerKey }
  _loading:  {},     // ch_num → Promise
  _loaded:   new Set(),

  registerChapter(num, data) {
    this._registry[num] = data;
    this._loaded.add(num);
  },

  load(chNum) {
    if (this._loaded.has(chNum)) return Promise.resolve(this._registry[chNum]);
    if (this._loading[chNum])   return this._loading[chNum];
    const manifest = CHAPTER_MANIFEST.find(c => c.num === chNum);
    if (!manifest || !manifest.file) return Promise.resolve(null);

    this._loading[chNum] = new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = manifest.file;
      script.onload  = () => resolve(this._registry[chNum] || null);
      script.onerror = () => reject(new Error('Failed to load ' + manifest.file));
      document.head.appendChild(script);
    });
    return this._loading[chNum];
  },

  get(chNum) {
    return this._registry[chNum] || null;
  }
};

// ── Flat TOPICS array rebuilt from loaded chapters ─────────────
let TOPICS = [];
function rebuildTopics() {
  TOPICS = [];
  Object.keys(MathMagician._registry).sort((a,b)=>a-b).forEach(ch => {
    const data = MathMagician._registry[ch];
    if (data && data.topics) TOPICS.push(...data.topics);
  });
}

// ── Workbook & answer key pulled from loaded chapters ──────────
function getAllWorkbook() {
  return Object.keys(MathMagician._registry).sort((a,b)=>a-b)
    .map(ch => MathMagician._registry[ch]?.workbook).filter(Boolean);
}
function getAllAnswerKey() {
  return Object.keys(MathMagician._registry).sort((a,b)=>a-b)
    .map(ch => MathMagician._registry[ch]?.answerKey).filter(Boolean);
}

// Track which chapters are collapsed (all collapsed by default)
const collapsedChapters = new Set(CHAPTER_MANIFEST.map(c => c.num));

function buildSidebar() {
  sidebarList.innerHTML = '';
  CHAPTER_MANIFEST.forEach(manifest => {
    const ch = manifest.num;
    const isLoaded   = MathMagician._loaded.has(ch);
    const isComingSoon = !manifest.file;
    const isCollapsed  = collapsedChapters.has(ch);
    const chTopics     = isLoaded ? (MathMagician.get(ch)?.topics || []) : [];
    const doneCount    = chTopics.filter(t => completed.has(t.id)).length;
    const totalCount   = manifest.topics;

    // Header
    const hdr = document.createElement('div');
    hdr.className = 'chapter-hdr' +
      (isComingSoon ? ' chapter-hdr-soon' : '') +
      (!isComingSoon && !isLoaded && MathMagician._loading[ch] ? ' chapter-hdr-loading' : '');
    hdr.innerHTML = `
      <div class="chapter-hdr-left">
        ${!isComingSoon ? `<svg class="chapter-chevron ${isCollapsed ? 'collapsed' : ''}" viewBox="0 0 16 16" fill="none">
          <path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>` : `<span style="width:14px;height:14px;display:inline-block;opacity:0.3;">·</span>`}
        <span>Ch ${ch} — ${manifest.name}</span>
      </div>
      <span class="chapter-hdr-meta">${isComingSoon ? 'soon' : (isLoaded ? doneCount+'/'+totalCount : totalCount+' topics')}</span>
    `;

    // Topics container
    const group = document.createElement('div');
    group.className = 'chapter-topics' + (isCollapsed ? ' collapsed' : '');

    if (isComingSoon) {
      const soon = document.createElement('div');
      soon.style.cssText = 'padding:7px 14px 7px 28px;font-size:11px;color:rgba(221,225,240,0.20);font-style:italic;';
      soon.textContent = 'Coming soon';
      group.appendChild(soon);
    } else if (!isLoaded) {
      // Show a "load chapter" button
      const loadBtn = document.createElement('div');
      loadBtn.style.cssText = 'padding:8px 14px 8px 28px;';
      loadBtn.innerHTML = `<button style="font-size:11px;padding:5px 12px;border-radius:7px;border:1px solid rgba(245,158,11,0.30);background:rgba(245,158,11,0.08);color:#fcd34d;cursor:pointer;font-family:DM Sans,sans-serif;font-weight:600;" data-ch="${ch}">Load Chapter ${ch}</button>`;
      loadBtn.querySelector('button').addEventListener('click', async (e) => {
        const btn = e.target;
        btn.textContent = 'Loading…';
        btn.disabled = true;
        try {
          await MathMagician.load(ch);
          rebuildTopics();
          updateProgress();
          buildSidebar();
          buildAnswerKey();
        } catch(err) {
          btn.textContent = 'Failed — retry';
          btn.disabled = false;
        }
      });
      group.appendChild(loadBtn);
    } else {
      // Render topic items
      const chapterOffsets = {};
      let offset = 0;
      CHAPTER_MANIFEST.forEach(m => { chapterOffsets[m.num] = offset; offset += m.topics; });
      chTopics.forEach((t, idx) => {
        const div = document.createElement('div');
        div.className = 'topic-item' +
          (t.id === currentTopicId ? ' active' : '') +
          (completed.has(t.id) ? ' completed' : '');
        div.innerHTML = `
          <span class="topic-num">${idx + 1}</span>
          <span class="topic-name">${t.name}</span>
          ${completed.has(t.id) ? '<span class="topic-tick">✓</span>' : ''}
        `;
        div.addEventListener('click', () => selectTopic(t.id));
        group.appendChild(div);
      });
    }

    // Toggle collapse
    if (!isComingSoon) {
      hdr.addEventListener('click', () => {
        // If not loaded yet, load on first expand
        if (!isLoaded && !MathMagician._loading[ch] && manifest.file) {
          MathMagician.load(ch).then(() => {
            rebuildTopics();
            updateProgress();
            buildSidebar();
            buildAnswerKey();
          });
        }
        const chevron = hdr.querySelector('.chapter-chevron');
        if (collapsedChapters.has(ch)) {
          collapsedChapters.delete(ch);
          group.classList.remove('collapsed');
          if (chevron) chevron.classList.remove('collapsed');
        } else {
          collapsedChapters.add(ch);
          group.classList.add('collapsed');
          if (chevron) chevron.classList.add('collapsed');
        }
      });
    }

    sidebarList.appendChild(hdr);
    sidebarList.appendChild(group);
  });
}

// ═══════════════════════════════════════════════════════════════
// CURRICULUM DATA — Chapter 1: Whole Numbers, Ratios, Rates & Finance
// ═══════════════════════════════════════════════════════════════



// ═══════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════
let currentTopicId = 0;
let currentTab = 'lesson';   // 'lesson' | 'practice'
let qIndex = 0;
let answered = false;
let score = { correct: 0, total: 0 };
let topicScores = {};        // topicId → { correct, total }
let completed = new Set();   // topicIds where all questions done

// ═══════════════════════════════════════════════════════════════
// DOM REFS
// ═══════════════════════════════════════════════════════════════
const sidebarList   = document.getElementById('sidebarList');
const lessonPanel   = document.getElementById('lessonPanel');
const practicePanel = document.getElementById('practicePanel');
const lessonTabBtn  = document.getElementById('lessonTabBtn');
const practiceTabBtn= document.getElementById('practiceTabBtn');
const progressText  = document.getElementById('progressText');
const progressFill  = document.getElementById('progressFill');

// ═══════════════════════════════════════════════════════════════
// SIDEBAR
// ═══════════════════════════════════════════════════════════════


// ═══════════════════════════════════════════════════════════════
// PROGRESS
// ═══════════════════════════════════════════════════════════════
function updateProgress() {
  const done  = completed.size;
  const total = TOPICS.length;
  const allTotal = CHAPTER_MANIFEST.reduce((s,c) => s + c.topics, 0);
  progressText.textContent = `${done} / ${allTotal} topics`;
  progressFill.style.width = allTotal > 0 ? `${(done / allTotal) * 100}%` : '0%';
}

// ═══════════════════════════════════════════════════════════════
// TOPIC SELECTION
// ═══════════════════════════════════════════════════════════════
function selectTopic(id) {
  currentTopicId = id;
  qIndex = 0;
  answered = false;
  topicScores[id] = topicScores[id] || { correct: 0, total: 0 };
  const ch = TOPICS.find(t => t.id === id)?.chapter || 1;
  collapsedChapters.delete(ch);
  buildSidebar();
  renderLesson();
  switchTab('lesson');
}

// ═══════════════════════════════════════════════════════════════
// TABS
// ═══════════════════════════════════════════════════════════════
function switchTab(tab) {
  currentTab = tab;
  lessonTabBtn.classList.toggle('active', tab === 'lesson');
  practiceTabBtn.classList.toggle('active', tab === 'practice');
  workbookTabBtn.classList.toggle('active', tab === 'workbook');
  lessonPanel.classList.toggle('hidden', tab !== 'lesson');
  practicePanel.classList.toggle('hidden', tab !== 'practice');
  workbookPanel.classList.toggle('hidden', tab !== 'workbook');
  if (tab === 'practice') renderQuestion();
}

lessonTabBtn.addEventListener('click', () => switchTab('lesson'));
practiceTabBtn.addEventListener('click', () => { qIndex = 0; answered = false; switchTab('practice'); });

// ═══════════════════════════════════════════════════════════════
// LESSON RENDERER
// ═══════════════════════════════════════════════════════════════
function renderLesson() {
  const t = TOPICS[currentTopicId];
  const l = t.lesson;
  lessonPanel.innerHTML = `
    <div class="lesson-heading">${l.heading}</div>
    <div class="lesson-subheading">${l.sub}</div>
    <div class="lesson-body">${l.body}</div>
    <button class="lesson-next-btn" id="goToPractice">
      <i data-lucide="pencil" style="width:14px;height:14px;"></i>
      Start practice questions
    </button>
  `;
  // Re-execute any inline <script> tags in the lesson body
  // (innerHTML doesn't run scripts — we extract and run them manually)
  lessonPanel.querySelectorAll('script').forEach(oldScript => {
    const newScript = document.createElement('script');
    newScript.textContent = oldScript.textContent;
    oldScript.parentNode.replaceChild(newScript, oldScript);
  });
  document.getElementById('goToPractice').addEventListener('click', () => {
    qIndex = 0; answered = false; switchTab('practice');
  });
  lucide.createIcons();
}

// ═══════════════════════════════════════════════════════════════
// QUESTION RENDERER
// ═══════════════════════════════════════════════════════════════
function renderQuestion() {
  const t = TOPICS[currentTopicId];
  const ts = topicScores[currentTopicId] || { correct: 0, total: 0 };

  if (qIndex >= t.questions.length) {
    completed.add(currentTopicId);
    buildSidebar();
    updateProgress();
    const pct = ts.total > 0 ? Math.round((ts.correct / ts.total) * 100) : 0;
    const nextId = currentTopicId + 1;
    practicePanel.innerHTML = `
      <div class="complete-banner">
        <h2>Topic complete! 🎉</h2>
        <p>You scored <strong style="color:#fcd34d">${ts.correct} / ${ts.total}</strong> (${pct}%) on <em>${t.name}</em>.</p>
        ${nextId < TOPICS.length
          ? `<button class="lesson-next-btn" id="nextTopicBtn">
              <i data-lucide="arrow-right" style="width:14px;height:14px;"></i>
              Next topic: ${TOPICS[nextId].name}
             </button>`
          : `<p style="color:#6ee7b7;font-size:15px;font-weight:600;">🏆 You've completed all of Chapter 1!</p>`}
      </div>`;
    if (nextId < TOPICS.length) {
      document.getElementById('nextTopicBtn').addEventListener('click', () => selectTopic(nextId));
    }
    lucide.createIcons();
    return;
  }

  const q = t.questions[qIndex];
  const ts2 = topicScores[currentTopicId] || { correct: 0, total: 0 };

  let questionHTML = '';

  if (q.type === 'mc') {
    const letters = ['A','B','C','D'];
    const opts = q.options.map((o, i) => `
      <div class="mc-option" data-idx="${i}">
        <span class="mc-letter">${letters[i]}</span>
        <span class="mc-text">${o}</span>
      </div>`).join('');
    questionHTML = `<div class="mc-options" id="mcOptions">${opts}</div>`;
  } else {
    questionHTML = `
      <div class="input-row">
        <input type="text" class="answer-input" id="answerInput" placeholder="Type your answer…" autocomplete="off">
        <button class="submit-btn" id="submitBtn">Check</button>
      </div>`;
  }

  practicePanel.innerHTML = `
    <div class="score-row">
      <span class="score-pill">Q <span>${qIndex + 1}</span> of <span>${t.questions.length}</span></span>
      <span class="score-pill">Score <span>${ts2.correct}/${ts2.total}</span></span>
      <span class="q-topic-tag">${q.topic}</span>
    </div>
    <div class="question-text">${q.text}</div>
    ${questionHTML}
    <div id="feedbackArea">
      <div class="feedback-label" id="feedbackLabel"></div>
      <div id="feedbackText"></div>
    </div>
    <button id="nextQBtn">Next question <i data-lucide="arrow-right" style="width:13px;height:13px;"></i></button>
  `;
  lucide.createIcons();

  const feedbackArea = document.getElementById('feedbackArea');
  const feedbackLabel = document.getElementById('feedbackLabel');
  const feedbackText = document.getElementById('feedbackText');
  const nextQBtn = document.getElementById('nextQBtn');

  nextQBtn.addEventListener('click', () => {
    qIndex++;
    answered = false;
    renderQuestion();
  });

  function showFeedback(correct, explanation) {
    feedbackArea.style.display = 'block';
    if (correct) {
      feedbackArea.className = 'correct';
      feedbackLabel.textContent = '✓ Correct!';
      feedbackText.textContent = explanation || 'Well done!';
    } else {
      feedbackArea.className = 'wrong';
      feedbackLabel.textContent = '✗ Not quite';
      feedbackText.innerHTML = explanation || 'Have another look at the lesson and try the next question.';
    }
    nextQBtn.classList.add('show');
  }

  function checkAnswer(userAnswer, correct) {
    if (answered) return;
    answered = true;
    topicScores[currentTopicId] = topicScores[currentTopicId] || { correct: 0, total: 0 };
    topicScores[currentTopicId].total++;

    const isCorrect = String(userAnswer).trim().toLowerCase() === String(correct).trim().toLowerCase() ||
                      String(userAnswer).trim() === String(correct).trim();

    if (isCorrect) {
      topicScores[currentTopicId].correct++;
      showFeedback(true);
    } else {
      // Call AI for explanation
      fetchAIFeedback(q, userAnswer, correct, showFeedback);
    }
  }

  if (q.type === 'mc') {
    document.querySelectorAll('.mc-option').forEach(opt => {
      opt.addEventListener('click', () => {
        if (answered) return;
        const idx = parseInt(opt.dataset.idx);
        document.querySelectorAll('.mc-option').forEach(o => o.classList.add('disabled'));
        opt.classList.add('selected');
        const isCorrect = idx === q.answer;
        document.querySelectorAll('.mc-option')[q.answer].classList.add('correct');
        if (!isCorrect) opt.classList.add('wrong');
        checkAnswer(idx, q.answer);
      });
    });
  } else {
    const input = document.getElementById('answerInput');
    const btn = document.getElementById('submitBtn');
    const submit = () => {
      if (answered) return;
      const val = input.value.trim();
      if (!val) return;
      input.disabled = true;
      btn.disabled = true;
      const isCorrect = val.toLowerCase() === String(q.answer).toLowerCase();
      input.classList.add(isCorrect ? 'correct' : 'wrong');
      checkAnswer(val, q.answer);
    };
    btn.addEventListener('click', submit);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  }
}

// ═══════════════════════════════════════════════════════════════
// AI FEEDBACK (Anthropic API — wrong answers only)
// ═══════════════════════════════════════════════════════════════
async function fetchAIFeedback(q, userAnswer, correctAnswer, callback) {
  const feedbackArea = document.getElementById('feedbackArea');
  const feedbackLabel = document.getElementById('feedbackLabel');
  const feedbackText  = document.getElementById('feedbackText');

  feedbackArea.style.display = 'block';
  feedbackArea.className = 'loading';
  feedbackLabel.textContent = '⏳ Getting explanation…';
  feedbackText.textContent = '';

  const topic  = TOPICS[currentTopicId];
  const prompt = `You are a friendly, encouraging Grade 8 maths tutor (IEB/CAPS curriculum, South Africa).
A student answered a question incorrectly. Give a SHORT, clear explanation (max 3 sentences) of:
1. Why their answer is wrong.
2. The correct method to get the right answer.
Be encouraging and specific. Do not just state the answer — explain the method.

Question: ${q.text.replace(/<[^>]+>/g, '')}
Topic: ${q.topic} (${topic.name})
Student answered: ${userAnswer}
Correct answer: ${correctAnswer}`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        messages: [{ role: 'user', content: prompt }]
      })
    });
    const data = await res.json();
    const text = data.content?.map(c => c.text || '').join('') || 'Check the lesson for a worked example.';
    callback(false, text);
  } catch {
    callback(false, `The correct answer is <strong>${correctAnswer}</strong>. Review the worked example in the lesson.`);
  }
}

// ═══════════════════════════════════════════════════════════════
// WORKBOOK TAB
// ═══════════════════════════════════════════════════════════════
const workbookTabBtn = document.getElementById('workbookTabBtn');
const workbookPanel  = document.getElementById('workbookPanel');

workbookTabBtn.addEventListener('click', () => switchTab('workbook'));

function renderWorkbook() {
  let html = `
    <div class="wb-header">
      <div class="wb-title">Workbook Exercises</div>
      <button class="wb-print-btn" onclick="window.print()">
        <i data-lucide="printer" style="width:12px;height:12px;"></i> Print
      </button>
    </div>
    <p class="wb-intro">Answer these questions in your exercise book. Show all working. Marks are indicated per part.</p>
  `;

  getAllWorkbook().forEach(chap => {
    html += `<div class="wb-chapter-block">
      <div class="wb-chapter-title">
        ✦ Chapter ${chap.chapter} — ${chap.chapterName}
      </div>`;
    chap.topics.forEach(topic => {
      html += `<div class="wb-topic-block">
        <div class="wb-topic-label">${topic.name}</div>`;
      topic.questions.forEach(q => {
        html += `<div class="wb-question">
          <div class="wb-question-num">Question ${q.num}</div>
          <div class="wb-question-text">${q.text}</div>`;
        if (q.parts) {
          q.parts.forEach(p => {
            html += `<div class="wb-part">
              <span class="wb-part-label">${p.label}</span>
              <span>${p.text} <span class="wb-marks">${p.marks} mark${p.marks>1?'s':''}</span></span>
            </div>`;
          });
        }
        // Answer lines
        const totalLines = q.parts ? Math.max(3, q.parts.length * 2) : 4;
        html += `<div class="wb-answer-lines">`;
        for (let i = 0; i < totalLines; i++) html += `<div class="wb-line"></div>`;
        html += `</div></div>`;
      });
      html += `</div>`;
    });
    html += `</div>`;
  });

  workbookPanel.innerHTML = html;
  lucide.createIcons();
}

// ═══════════════════════════════════════════════════════════════
// ANSWER KEY
// ═══════════════════════════════════════════════════════════════
const akHeader  = document.getElementById('akHeader');
const akChevron = document.getElementById('akChevron');
const akBody    = document.getElementById('akBody');

function buildAnswerKey() {
  let html = '';
  getAllAnswerKey().forEach(chap => {
    html += `<div class="ak-chapter">${chap.chapterName}</div>`;
    chap.topics.forEach(topic => {
      html += `<div class="ak-topic">${topic.name}</div>`;
      topic.answers.forEach(a => {
        html += `<div class="ak-item">
          <span class="ak-item-num">${a.num}:</span>
          <span class="ak-item-ans"> ${a.ans}</span>
          ${a.note ? `<span class="ak-item-note">${a.note}</span>` : ''}
        </div>`;
      });
    });
  });
  akBody.innerHTML = html;
}

akHeader.addEventListener('click', () => {
  const isCollapsed = akBody.classList.contains('collapsed');
  if (isCollapsed) {
    akBody.classList.remove('collapsed');
    akChevron.classList.remove('collapsed');
  } else {
    akBody.classList.add('collapsed');
    akChevron.classList.add('collapsed');
  }
});


// ═══════════════════════════════════════════════════════════════
// INIT — load chapter 1 immediately, then initialise
// ═══════════════════════════════════════════════════════════════
async function init() {
  await MathMagician.load(1);
  rebuildTopics();
  TOPICS.forEach(t => { topicScores[t.id] = topicScores[t.id] || { correct: 0, total: 0 }; });
  buildSidebar();
  updateProgress();
  buildAnswerKey();
  renderWorkbook();
  selectTopic(0);
  lucide.createIcons();

  // ── Background preload all remaining chapters after a short delay ──
  // Stagger requests so they don't compete with the initial render
  const toPreload = CHAPTER_MANIFEST.filter(c => c.file && c.num !== 1);
  toPreload.forEach((manifest, i) => {
    setTimeout(() => {
      if (!MathMagician._loaded.has(manifest.num)) {
        MathMagician.load(manifest.num).then(() => {
          rebuildTopics();
          updateProgress();
          buildSidebar();
          buildAnswerKey();
        }).catch(() => {}); // silent fail — will retry on click
      }
    }, 800 + i * 400); // stagger: 800ms, 1200ms, 1600ms, 2000ms...
  });
}
init();
