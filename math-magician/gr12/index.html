  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; width: 100%; overflow: hidden; }
    body { font-family: "Cabinet Grotesk", sans-serif; font-size: 13px; background: #0a0f1e; color: #dde1f0; }

    #appShell {
      height: 100%; width: 100%;
      display: flex; flex-direction: column; overflow: hidden;
      background:
        radial-gradient(ellipse 55% 35% at 6%  4%, rgba(245,158,11,0.14) 0%, transparent 60%),
        radial-gradient(ellipse 45% 30% at 96%  6%, rgba(234,179,8,0.10) 0%, transparent 55%),
        radial-gradient(ellipse 35% 25% at 50% 98%, rgba(99,102,241,0.08) 0%, transparent 60%),
        #0a0f1e;
    }

    /* ── Header ── */
    #appHeader {
      flex-shrink: 0; display: flex; align-items: center; gap: 10px;
      padding: 10px 20px; border-bottom: 1px solid rgba(255,255,255,0.07); position: relative;
    }
    .home-btn {
      display: flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600;
      padding: 6px 13px; border-radius: 99px; border: 1px solid rgba(255,255,255,0.10);
      background: rgba(255,255,255,0.05); color: rgba(221,225,240,0.55);
      text-decoration: none; transition: all 130ms; flex-shrink: 0;
    }
    .home-btn:hover { background: rgba(255,255,255,0.10); color: #dde1f0; }
    .app-icon {
      width: 32px; height: 32px; border-radius: 9px; flex-shrink: 0;
      background: linear-gradient(135deg,rgba(245,166,35,0.28),rgba(234,179,8,0.14)); border: 1px solid rgba(245,166,35,0.28);
      display: flex; align-items: center; justify-content: center; font-size: 16px;
    }
    h1.app-title {
      font-family: "Cabinet Grotesk", sans-serif; font-weight: 800;
      font-size: clamp(16px, 1.8vw, 22px); line-height: 1;
      background: linear-gradient(125deg, #fff 0%, #fcd34d 55%, #fb923c 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .grade-badge {
      font-size: 10px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase;
      padding: 3px 9px; border-radius: 99px;
      background: rgba(245,158,11,0.15); border: 1px solid rgba(245,158,11,0.30); color: #fcd34d;
    }
    .hdr-left { display: flex; align-items: center; gap: 10px; flex: 1; }
    .header-right { display: flex; align-items: center; gap: 8px; }
    #progressText { font-size: 11px; color: rgba(221,225,240,0.35); }
    #progressBar {
      width: 120px; height: 5px; border-radius: 99px;
      background: rgba(255,255,255,0.08); overflow: hidden;
    }
    #progressFill {
      height: 100%; border-radius: 99px; width: 0%;
      background: linear-gradient(90deg, #f59e0b, #fcd34d);
      transition: width 400ms ease;
    }

    /* ── Main layout ── */
    #mainLayout { flex: 1; display: flex; min-height: 0; overflow: hidden; }

    /* ── Sidebar ── */
    #sidebar {
      width: 268px; flex-shrink: 0;
      border-right: 1px solid rgba(255,255,255,0.07);
      display: flex; flex-direction: column; overflow: hidden;
      background: rgba(0,0,0,0.22);
    }
    #sidebarHeader {
      flex-shrink: 0; padding: 12px 14px 10px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .sidebar-chapter {
      font-family: "Cabinet Grotesk", sans-serif; font-weight: 800; font-size: 11px;
      letter-spacing: 0.06em; text-transform: uppercase; color: #fbbf24;
      display: flex; align-items: center; gap: 6px; margin-bottom: 2px;
    }
    .sidebar-subtitle { font-size: 10px; color: rgba(221,225,240,0.30); letter-spacing: 0.04em; }
    #sidebarList { flex: 1; overflow-y: auto; padding-bottom: 12px; }
    .topic-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 14px; cursor: pointer; transition: background 110ms;
      border-left: 2px solid transparent; user-select: none;
    }
    .topic-item:hover { background: rgba(245,158,11,0.07); }
    .topic-item.active {
      background: rgba(245,158,11,0.12); border-left-color: #f59e0b;
    }
    .topic-item.completed { opacity: 0.70; }
    .topic-num {
      font-family: "JetBrains Mono", monospace; font-size: 10px;
      color: rgba(221,225,240,0.25); width: 18px; flex-shrink: 0; text-align: right;
    }
    .topic-name { font-size: 12px; font-weight: 500; color: rgba(221,225,240,0.65); line-height: 1.3; flex: 1; }
    .topic-item.active .topic-name { color: #fcd34d; font-weight: 600; }
    .topic-tick { font-size: 11px; color: #6ee7b7; flex-shrink: 0; }

    /* ── Content area ── */
    #contentArea { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }

    /* ── Tab bar ── */
    #tabBar {
      flex-shrink: 0; display: flex; align-items: center; gap: 3px;
      padding: 8px 16px 0; border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .tab-btn {
      font-family: "Cabinet Grotesk", sans-serif; font-size: 12px; font-weight: 600;
      padding: 6px 14px 8px; border-radius: 8px 8px 0 0; border: none; cursor: pointer;
      transition: all 130ms; color: rgba(221,225,240,0.40); background: transparent;
      border-bottom: 2px solid transparent;
    }
    .tab-btn.active { color: #fcd34d; border-bottom-color: #f59e0b; background: rgba(245,158,11,0.08); }
    .tab-btn:hover:not(.active) { color: rgba(221,225,240,0.75); }

    /* ── Panels ── */
    .content-panel { flex: 1; min-height: 0; overflow-y: auto; padding: 24px 28px 32px; }
    .content-panel.hidden { display: none; }

    /* ── Lesson panel ── */
    .lesson-heading {
      font-family: "Cabinet Grotesk", sans-serif; font-weight: 800; font-size: 22px;
      background: linear-gradient(125deg, #fff 0%, #fcd34d 60%, #fb923c 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      margin-bottom: 6px;
    }
    .lesson-subheading {
      font-size: 12px; color: rgba(221,225,240,0.38); letter-spacing: 0.05em;
      text-transform: uppercase; margin-bottom: 22px;
    }
    .lesson-body { font-size: 14px; line-height: 1.8; color: rgba(221,225,240,0.78); max-width: 680px; }
    .lesson-body p { margin-bottom: 14px; }
    .lesson-body strong { color: #fcd34d; font-weight: 600; }
    .lesson-body em { color: #6ee7b7; font-style: normal; font-weight: 500; }

    .def-box {
      background: rgba(245,158,11,0.08); border: 1px solid rgba(245,158,11,0.22);
      border-radius: 12px; padding: 14px 18px; margin: 16px 0;
    }
    .def-box-title {
      font-family: "Cabinet Grotesk", sans-serif; font-weight: 700; font-size: 11px;
      text-transform: uppercase; letter-spacing: 0.08em; color: #fbbf24; margin-bottom: 8px;
    }
    .def-box p { margin: 0; font-size: 13.5px; color: rgba(221,225,240,0.80); line-height: 1.7; }

    .example-box {
      background: rgba(99,102,241,0.08); border: 1px solid rgba(99,102,241,0.22);
      border-radius: 12px; padding: 14px 18px; margin: 16px 0;
    }
    .example-box-title {
      font-family: "Cabinet Grotesk", sans-serif; font-weight: 700; font-size: 11px;
      text-transform: uppercase; letter-spacing: 0.08em; color: #a5b4fc; margin-bottom: 10px;
    }
    .example-step {
      display: flex; gap: 12px; align-items: flex-start; margin-bottom: 8px;
      font-size: 13px; color: rgba(221,225,240,0.78); line-height: 1.65;
    }
    .example-step:last-child { margin-bottom: 0; }
    .step-num {
      display: inline-flex; align-items: center; justify-content: center;
      width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0; margin-top: 1px;
      background: rgba(99,102,241,0.25); border: 1px solid rgba(99,102,241,0.40);
      font-size: 10px; font-weight: 700; color: #a5b4fc;
    }
    .math {
      font-family: "JetBrains Mono", monospace; font-size: 13px;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.09);
      border-radius: 6px; padding: 2px 8px; color: #fcd34d; display: inline;
    }
    .math-block {
      font-family: "JetBrains Mono", monospace; font-size: 13px;
      background: rgba(0,0,0,0.30); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px; padding: 12px 16px; margin: 12px 0;
      color: #fcd34d; display: block; line-height: 1.9;
    }
    .tip-box {
      background: rgba(16,185,129,0.08); border: 1px solid rgba(16,185,129,0.22);
      border-radius: 12px; padding: 12px 16px; margin: 14px 0;
      font-size: 13px; color: #6ee7b7; line-height: 1.65;
      display: flex; gap: 10px; align-items: flex-start;
    }
    .tip-icon { flex-shrink: 0; font-size: 15px; margin-top: 1px; }

    .lesson-next-btn {
      display: inline-flex; align-items: center; gap: 8px;
      margin-top: 28px; padding: 11px 24px; border-radius: 11px; border: none;
      background: linear-gradient(135deg, #d97706, #f59e0b); color: #fff;
      font-family: "Cabinet Grotesk", sans-serif; font-size: 13px; font-weight: 700;
      cursor: pointer; transition: all 150ms; box-shadow: 0 4px 16px rgba(217,119,6,0.30);
    }
    .lesson-next-btn:hover { box-shadow: 0 6px 22px rgba(217,119,6,0.45); transform: translateY(-1px); }

    /* ── Practice panel ── */
    #practicePanel { padding: 24px 28px 32px; }
    .question-header {
      display: flex; align-items: center; gap: 12px; margin-bottom: 20px;
    }
    .q-counter {
      font-family: "JetBrains Mono", monospace; font-size: 10px; font-weight: 600;
      padding: 3px 10px; border-radius: 99px;
      background: rgba(245,158,11,0.12); border: 1px solid rgba(245,158,11,0.25); color: #fbbf24;
      letter-spacing: 0.06em; text-transform: uppercase;
    }
    .q-topic-tag {
      font-size: 10px; font-weight: 600; padding: 3px 9px; border-radius: 99px;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.10);
      color: rgba(221,225,240,0.40); letter-spacing: 0.04em;
    }
    .question-text {
      font-family: "Cabinet Grotesk", sans-serif; font-weight: 700; font-size: 17px;
      color: #e8eaf4; line-height: 1.5; margin-bottom: 22px; max-width: 620px;
    }
    .question-text .math { font-size: 15px; }

    /* Multiple choice */
    .mc-options { display: flex; flex-direction: column; gap: 10px; max-width: 520px; }
    .mc-option {
      display: flex; align-items: center; gap: 14px;
      padding: 13px 18px; border-radius: 12px; cursor: pointer;
      border: 1px solid rgba(255,255,255,0.09); background: rgba(255,255,255,0.04);
      transition: all 140ms; user-select: none;
    }
    .mc-option:hover:not(.disabled) { border-color: rgba(245,158,11,0.35); background: rgba(245,158,11,0.08); }
    .mc-option.selected { border-color: rgba(245,158,11,0.55); background: rgba(245,158,11,0.12); }
    .mc-option.correct  { border-color: rgba(16,185,129,0.60); background: rgba(16,185,129,0.12); }
    .mc-option.wrong    { border-color: rgba(239,68,68,0.50);  background: rgba(239,68,68,0.10); }
    .mc-option.disabled { cursor: default; }
    .mc-letter {
      font-family: "JetBrains Mono", monospace; font-size: 11px; font-weight: 700;
      width: 24px; height: 24px; border-radius: 6px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.07); color: rgba(221,225,240,0.50);
      border: 1px solid rgba(255,255,255,0.10); transition: all 140ms;
    }
    .mc-option.selected .mc-letter { background: rgba(245,158,11,0.25); color: #fcd34d; border-color: rgba(245,158,11,0.45); }
    .mc-option.correct  .mc-letter { background: rgba(16,185,129,0.25); color: #6ee7b7; border-color: rgba(16,185,129,0.50); }
    .mc-option.wrong    .mc-letter { background: rgba(239,68,68,0.20);  color: #fca5a5; border-color: rgba(239,68,68,0.45); }
    .mc-text { font-size: 14px; color: rgba(221,225,240,0.75); line-height: 1.4; }

    /* Input question */
    .input-row { display: flex; gap: 10px; align-items: center; max-width: 360px; margin-bottom: 16px; }
    .answer-input {
      flex: 1; padding: 11px 16px; border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.06);
      color: #fcd34d; font-family: "JetBrains Mono", monospace; font-size: 15px;
      outline: none; transition: border-color 140ms;
    }
    .answer-input:focus { border-color: rgba(245,158,11,0.45); }
    .answer-input.correct { border-color: rgba(16,185,129,0.55); color: #6ee7b7; }
    .answer-input.wrong   { border-color: rgba(239,68,68,0.50);  color: #fca5a5; }
    .submit-btn {
      padding: 11px 20px; border-radius: 10px; border: none;
      background: linear-gradient(135deg, #d97706, #f59e0b); color: #fff;
      font-family: "Cabinet Grotesk", sans-serif; font-size: 12px; font-weight: 700;
      cursor: pointer; transition: all 140ms; white-space: nowrap;
    }
    .submit-btn:hover { box-shadow: 0 4px 14px rgba(217,119,6,0.40); transform: translateY(-1px); }
    .submit-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; box-shadow: none; }

    /* Feedback area */
    #feedbackArea {
      margin-top: 18px; max-width: 600px;
      border-radius: 12px; padding: 14px 18px;
      font-size: 13px; line-height: 1.7; display: none;
    }
    #feedbackArea.correct { background: rgba(16,185,129,0.10); border: 1px solid rgba(16,185,129,0.28); color: #6ee7b7; }
    #feedbackArea.wrong   { background: rgba(239,68,68,0.09);  border: 1px solid rgba(239,68,68,0.28);  color: rgba(221,225,240,0.80); }
    #feedbackArea.loading { background: rgba(245,158,11,0.08); border: 1px solid rgba(245,158,11,0.20); color: rgba(221,225,240,0.55); }
    .feedback-label {
      font-family: "Cabinet Grotesk", sans-serif; font-weight: 700; font-size: 12px;
      text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 7px;
      display: flex; align-items: center; gap: 6px;
    }
    #feedbackArea.correct .feedback-label { color: #6ee7b7; }
    #feedbackArea.wrong   .feedback-label { color: #fca5a5; }
    #feedbackArea.loading .feedback-label { color: #fbbf24; }

    /* Next question button */
    #nextQBtn {
      display: none; margin-top: 18px;
      padding: 10px 22px; border-radius: 10px; border: none;
      background: linear-gradient(135deg, #d97706, #f59e0b); color: #fff;
      font-family: "Cabinet Grotesk", sans-serif; font-size: 12px; font-weight: 700;
      cursor: pointer; transition: all 140ms; align-items: center; gap: 7px;
    }
    #nextQBtn.show { display: inline-flex; }
    #nextQBtn:hover { box-shadow: 0 4px 14px rgba(217,119,6,0.40); transform: translateY(-1px); }

    /* Score bar at top of practice -->
    .score-row {
      display: flex; gap: 16px; margin-bottom: 22px; flex-wrap: wrap;
    }
    .score-pill {
      font-family: "JetBrains Mono", monospace; font-size: 11px;
      padding: 5px 14px; border-radius: 99px;
      border: 1px solid rgba(255,255,255,0.10); background: rgba(255,255,255,0.05);
      color: rgba(221,225,240,0.50);
    }
    .score-pill span { font-weight: 700; color: #fcd34d; }

    /* Empty/complete states */
    .complete-banner {
      text-align: center; padding: 48px 24px;
    }
    .complete-banner h2 {
      font-family: "Cabinet Grotesk", sans-serif; font-weight: 800; font-size: 24px;
      background: linear-gradient(125deg, #fff 0%, #fcd34d 60%, #6ee7b7 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      margin-bottom: 10px;
    }
    .complete-banner p { font-size: 14px; color: rgba(221,225,240,0.50); margin-bottom: 24px; }

    .chapter-hdr {
      padding: 10px 14px 4px;
      font-family: "Cabinet Grotesk", sans-serif; font-weight: 800; font-size: 10px;
      letter-spacing: 0.07em; text-transform: uppercase;
      color: rgba(245,158,11,0.65);
      border-top: 1px solid rgba(255,255,255,0.05); margin-top: 4px;
      display: flex; align-items: center; justify-content: space-between;
      cursor: pointer; user-select: none;
      transition: color 150ms;
    }
    .chapter-hdr:first-child { border-top: none; margin-top: 0; }
    .chapter-hdr:hover { color: rgba(245,158,11,0.90); }
    .chapter-hdr-left { display: flex; align-items: center; gap: 7px; }
    .chapter-hdr-meta { font-size: 9px; font-weight: 600; color: rgba(221,225,240,0.25); letter-spacing: 0.04em; text-transform: none; font-family: "Cabinet Grotesk", sans-serif; }
    .chapter-chevron {
      width: 14px; height: 14px; flex-shrink: 0;
      color: rgba(245,158,11,0.45); transition: transform 220ms ease;
    }
    .chapter-chevron.collapsed { transform: rotate(-90deg); }
    .chapter-topics {
      overflow: hidden;
      transition: max-height 280ms ease, opacity 200ms ease;
      max-height: 1000px; opacity: 1;
    }
    .chapter-topics.collapsed { max-height: 0; opacity: 0; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 99px; }

    /* ── Workbook panel ── */
    #workbookPanel { padding: 24px 28px 48px; }
    .wb-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 6px; gap: 16px; flex-wrap: wrap; }
    .wb-title { font-family: "Cabinet Grotesk", sans-serif; font-weight: 800; font-size: 20px; background: linear-gradient(125deg, #fff 0%, #fcd34d 60%, #fb923c 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .wb-print-btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 8px; border: 1px solid rgba(245,158,11,0.30); background: rgba(245,158,11,0.10); color: #fcd34d; font-family: "Cabinet Grotesk", sans-serif; font-size: 11px; font-weight: 700; cursor: pointer; transition: all 140ms; white-space: nowrap; }
    .wb-print-btn:hover { background: rgba(245,158,11,0.20); }
    .wb-intro { font-size: 12px; color: rgba(221,225,240,0.38); margin-bottom: 24px; font-style: italic; }
    .wb-chapter-block { margin-bottom: 32px; }
    .wb-chapter-title { font-family: "Cabinet Grotesk", sans-serif; font-weight: 800; font-size: 13px; text-transform: uppercase; letter-spacing: 0.07em; color: #fbbf24; margin-bottom: 14px; padding-bottom: 7px; border-bottom: 1px solid rgba(245,158,11,0.20); display: flex; align-items: center; gap: 8px; }
    .wb-topic-block { margin-bottom: 22px; }
    .wb-topic-label { font-family: "Cabinet Grotesk", sans-serif; font-weight: 700; font-size: 11px; color: rgba(221,225,240,0.55); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }
    .wb-question { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07); border-radius: 10px; padding: 14px 18px; margin-bottom: 10px; }
    .wb-question-num { font-family: "JetBrains Mono", monospace; font-size: 10px; font-weight: 700; color: #fbbf24; margin-bottom: 7px; letter-spacing: 0.06em; }
    .wb-question-text { font-size: 13.5px; color: rgba(221,225,240,0.82); line-height: 1.75; }
    .wb-question-text strong { color: #fcd34d; }
    .wb-part { display: flex; gap: 10px; margin-top: 7px; align-items: flex-start; font-size: 13px; color: rgba(221,225,240,0.75); line-height: 1.65; }
    .wb-part-label { font-family: "JetBrains Mono", monospace; font-size: 11px; color: rgba(245,158,11,0.70); font-weight: 700; flex-shrink: 0; min-width: 22px; }
    .wb-marks { display: inline-block; font-family: "JetBrains Mono", monospace; font-size: 9px; padding: 1px 6px; border-radius: 99px; margin-left: 6px; background: rgba(245,158,11,0.12); border: 1px solid rgba(245,158,11,0.22); color: rgba(245,158,11,0.65); vertical-align: middle; }
    .wb-answer-lines { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
    .wb-line { height: 1px; background: rgba(255,255,255,0.08); border-radius: 1px; }

    /* ── Answer key print button ── */
    .ak-print-btn {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 4px 10px; border-radius: 6px; border: 1px solid rgba(16,185,129,0.30);
      background: rgba(16,185,129,0.10); color: #6ee7b7;
      font-family: "Cabinet Grotesk", sans-serif; font-size: 10px; font-weight: 700;
      cursor: pointer; transition: all 140ms; white-space: nowrap;
    }
    .ak-print-btn:hover { background: rgba(16,185,129,0.20); }

    /* ── Chapter/topic print controls ── */
    .wb-chapter-header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; flex-wrap: wrap; margin-bottom: 0;
    }
    .wb-chapter-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .wb-chapter-print-btn {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 9px; border-radius: 5px; border: 1px solid rgba(245,158,11,0.25);
      background: rgba(245,158,11,0.08); color: rgba(245,158,11,0.70);
      font-family: "Cabinet Grotesk", sans-serif; font-size: 10px; font-weight: 700;
      cursor: pointer; transition: all 130ms; white-space: nowrap;
    }
    .wb-chapter-print-btn:hover { background: rgba(245,158,11,0.18); color: #fcd34d; }
    .wb-chapter-print-btn.ak-style {
      border-color: rgba(16,185,129,0.25); background: rgba(16,185,129,0.07); color: rgba(110,231,183,0.70);
    }
    .wb-chapter-print-btn.ak-style:hover { background: rgba(16,185,129,0.16); color: #6ee7b7; }
    .wb-topic-header {
      display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
    }
    .wb-topic-print-btn {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 10px; border-radius: 5px; border: 1px solid rgba(255,255,255,0.09);
      background: rgba(255,255,255,0.04); color: rgba(221,225,240,0.45);
      font-family: "Cabinet Grotesk", sans-serif; font-size: 11px; font-weight: 700;
      cursor: pointer; transition: all 130ms; white-space: nowrap;
    }
    .wb-topic-print-btn:hover { background: rgba(245,158,11,0.10); color: rgba(245,158,11,0.70); border-color: rgba(245,158,11,0.20); }
    .wb-topic-print-btn.ak-style:hover { background: rgba(16,185,129,0.10); color: rgba(110,231,183,0.70); border-color: rgba(16,185,129,0.20); }

    /* ── Print styles ── */
    @media print {
      @page { margin: 18mm 15mm; }

      /* Hide all chrome */
      #appHeader, #sidebar, #tabBar { display: none !important; }
      html, body { overflow: visible !important; height: auto !important; background: white !important; color: #111 !important; }
      #appShell, #mainLayout, #contentArea { display: block !important; height: auto !important; overflow: visible !important; background: transparent !important; }

      /* Hide non-printing panels */
      #lessonPanel, #practicePanel { display: none !important; }

      /* Workbook print */
      body.print-workbook #workbookPanel        { display: block !important; padding: 0 !important; }
      body.print-workbook #answerKeyPrintPanel  { display: none !important; }

      /* Answer key print */
      body.print-answerkey #workbookPanel       { display: none !important; }
      body.print-answerkey #answerKeyPrintPanel { display: block !important; padding: 0 !important; }

      /* Default (no class): print workbook */
      body:not(.print-answerkey) #workbookPanel       { display: block !important; padding: 0 !important; }
      body:not(.print-answerkey) #answerKeyPrintPanel { display: none !important; }

      /* Workbook element styles */
      .wb-title { font-size: 20px; font-weight: 800; color: #111 !important; -webkit-text-fill-color: #111 !important; margin-bottom: 4px; }
      .wb-print-btn, .ak-print-btn { display: none !important; }
      .wb-intro { color: #555 !important; font-size: 11px; }
      .wb-chapter-block { page-break-inside: avoid; margin-bottom: 20px; }
      .wb-chapter-title { color: #333 !important; -webkit-text-fill-color: #333 !important; border-bottom: 1.5px solid #bbb !important; font-size: 12px; padding-bottom: 4px; }
      .wb-topic-label { color: #555 !important; font-size: 10px; }
      .wb-question { border: 1px solid #ccc !important; background: white !important; padding: 10px 12px; page-break-inside: avoid; margin-bottom: 8px; }
      .wb-question-num { color: #c97706 !important; }
      .wb-question-text, .wb-part { color: #111 !important; font-size: 12px; }
      .wb-part-label { color: #c97706 !important; }
      .wb-marks { background: #fff3cd !important; border: 1px solid #f0c040 !important; color: #7a5500 !important; }
      .wb-line { background: #ccc !important; height: 1px !important; }

      /* Answer key print styles */
      .ak-print-title { font-size: 20px; font-weight: 800; color: #111; margin-bottom: 4px; font-family: "Cabinet Grotesk", sans-serif; }
      .ak-print-intro { font-size: 11px; color: #555; margin-bottom: 20px; font-style: italic; }
      .ak-print-chapter { font-size: 13px; font-weight: 800; color: #c97706; text-transform: uppercase; letter-spacing: 0.06em; border-bottom: 1.5px solid #bbb; padding-bottom: 4px; margin: 16px 0 8px; font-family: "Cabinet Grotesk", sans-serif; page-break-after: avoid; }
      .ak-print-topic { font-size: 10px; font-weight: 700; color: #555; text-transform: uppercase; letter-spacing: 0.05em; margin: 10px 0 4px; }
      .ak-print-item { display: flex; gap: 8px; padding: 4px 0; border-bottom: 1px solid #eee; font-size: 12px; page-break-inside: avoid; }
      .ak-print-num { font-family: "JetBrains Mono", monospace; font-size: 11px; color: #c97706; font-weight: 700; min-width: 50px; flex-shrink: 0; }
      .ak-print-ans { color: #146b48; font-weight: 700; flex: 1; }
      .ak-print-note { color: #777; font-size: 10px; display: block; }
    }

    /* Wide screen */
    @media (min-width: 1100px) {
      #sidebar { width: 320px; }
      .lesson-body { max-width: 820px; }
      .mc-options { max-width: 640px; }
      .content-panel { padding: 28px 48px 40px; }
    }    /* Mobile */
    @media (max-width: 700px) {
      html, body { height: auto; overflow: auto; }
      #appShell { height: auto; overflow: visible; min-height: 100vh; }
      #appHeader { flex-wrap: wrap; padding: 10px 14px; gap: 8px; }
      .hdr-left { flex: 1 1 auto; }
      h1.app-title { font-size: 15px; }
      .header-right { flex: 1 1 100%; flex-wrap: wrap; gap: 6px; justify-content: center; }
      #progressBar { width: 80px; }
      .home-btn { font-size: 10px; padding: 5px 10px; }
      #mainLayout { flex-direction: column; overflow: visible; height: auto; }
      #sidebar { width: 100%; border-right: none; border-bottom: 1px solid rgba(255,255,255,0.07); max-height: 220px; }
      #contentArea { overflow: visible; height: auto; }
      .content-panel { padding: 16px; }
      #practicePanel { padding: 16px; }
    }
  
    .chapter-hdr-soon { opacity: 0.40; cursor: default; }
    .chapter-hdr-soon:hover { color: rgba(245,158,11,0.55) !important; }

    /* Active chapter highlight in workbook/answer key */
    @keyframes chapterPulse {
      0%   { box-shadow: 0 0 0 0 rgba(245,158,11,0.0),  inset 3px 0 0 rgba(245,158,11,0.0); }
      25%  { box-shadow: 0 0 0 3px rgba(245,158,11,0.18), inset 3px 0 0 rgba(245,158,11,0.60); }
      100% { box-shadow: 0 0 0 0 rgba(245,158,11,0.0),  inset 3px 0 0 rgba(245,158,11,0.20); }
    }
    .wb-chapter-block.ch-active {
      border-radius: 10px;
      animation: chapterPulse 1s ease forwards;
      inset: 3px 0 0 rgba(245,158,11,0.20);
    }
</style>


<style>.app-footer{flex-shrink:0;height:26px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:rgba(210,218,245,0.26);border-top:1px solid rgba(255,255,255,0.06);background:rgba(0,0,0,0.15);letter-spacing:0.02em;}</style>

<body>
<div id="appShell">

const GRADE = 12;
let currentLang = (window.MLLang && MLLang.getLang()) || 'en';
const CHAPTER_MANIFEST = [
  { num:  1, name: "Sequences and Series", topics: 4, file: "ch1.js" },
  { num:  2, name: "Functions and Logarithms", topics: 4, file: "ch2.js" },

  { num:  8, name: "Euclidean Geometry", topics: 3, file: "ch8.js" },

  { num: 10, name: "Probability — Counting Principles", topics: 4, file: "ch10.js" }
];

// ═══════════════════════════════════════════════════════════════
// DYNAMIC CHAPTER LOADER
// ═══════════════════════════════════════════════════════════════
const MathMagician = {
  _registry: {},     // "num:lang" → { topics, workbook, answerKey }
  _loading:  {},     // "num:lang" → Promise
  _loaded:   new Set(),
  _pendingLang: {},  // num → lang, read by registerChapter while its <script> executes

  registerChapter(num, data) {
    const lang = this._pendingLang[num] || 'en';
    const key = num + ':' + lang;
    this._registry[key] = data;
    this._loaded.add(key);
  },

  // Loads a chapter in the given language. If no translation file exists yet
  // for that language, falls back to the English file so the UI never breaks
  // — the caller (buildSidebar/reloadContentForLang) surfaces a toast about it.
  load(chNum, lang) {
    lang = lang || currentLang;
    const manifest = CHAPTER_MANIFEST.find(c => c.num === chNum);
    if (!manifest) return Promise.resolve(null);

    let file = lang === 'af' ? manifest.fileAf : manifest.file;
    let effLang = lang;
    if (!file) {
      if (!manifest.file) return Promise.resolve(null);
      file = manifest.file;
      effLang = 'en';
    }
    const key = chNum + ':' + effLang;
    if (this._loaded.has(key)) return Promise.resolve(this._registry[key]);
    if (this._loading[key])   return this._loading[key];

    this._pendingLang[chNum] = effLang;
    this._loading[key] = new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = file;
      script.onload  = () => { delete this._pendingLang[chNum]; resolve(this._registry[key] || null); };
      script.onerror = () => { delete this._pendingLang[chNum]; reject(new Error('Failed to load ' + file)); };
      document.head.appendChild(script);
    });
    return this._loading[key];
  },

  // True once a chapter is available in `lang` OR has fallen back to English.
  isLoaded(chNum, lang) {
    lang = lang || currentLang;
    return this._loaded.has(chNum + ':' + lang) || this._loaded.has(chNum + ':en');
  },

  // True only when the chapter is actually translated into `lang` (used to
  // decide whether to show the "not yet translated" toast).
  hasTranslation(chNum, lang) {
    lang = lang || currentLang;
    if (lang === 'en') return true;
    const manifest = CHAPTER_MANIFEST.find(c => c.num === chNum);
    return !!(manifest && manifest.fileAf);
  },

  get(chNum, lang) {
    lang = lang || currentLang;
    return this._registry[chNum + ':' + lang] || this._registry[chNum + ':en'] || null;
  }
};

// ── Flat TOPICS array rebuilt from loaded chapters ─────────────
let TOPICS = [];
function rebuildTopics() {
  TOPICS = [];
  CHAPTER_MANIFEST.forEach(m => {
    const data = MathMagician.get(m.num, currentLang);
    if (data && data.topics) TOPICS.push(...data.topics);
  });
}

// Look up a topic by its actual `id` field — NEVER by array position.
// Topic ids are not guaranteed to equal their index in the flat TOPICS
// array (this only holds by coincidence when ids happen to be assigned
// 0,1,2,3... gaplessly across every loaded chapter). Looking up by id
// keeps topic selection correct regardless of how a grade's chapter
// files number their topics.
function getTopicById(id) {
  return TOPICS.find(t => t.id === id) || null;
}

// ── Workbook & answer key pulled from loaded chapters ──────────
function getAllWorkbook() {
  return CHAPTER_MANIFEST.map(m => MathMagician.get(m.num, currentLang)?.workbook).filter(Boolean);
}
function getAllAnswerKey() {
  return CHAPTER_MANIFEST.map(m => MathMagician.get(m.num, currentLang)?.answerKey).filter(Boolean);
}

// Track which chapters are collapsed (all collapsed by default)
const collapsedChapters = new Set(CHAPTER_MANIFEST.map(c => c.num));

function buildSidebar() {
  const t = T();
  sidebarList.innerHTML = '';
  CHAPTER_MANIFEST.forEach(manifest => {
    const ch = manifest.num;
    const isLoaded   = MathMagician.isLoaded(ch, currentLang);
    const isComingSoon = !manifest.file;
    const isCollapsed  = collapsedChapters.has(ch);
    const chTopics     = isLoaded ? (MathMagician.get(ch, currentLang)?.topics || []) : [];
    const doneCount    = chTopics.filter(t => completed.has(t.id)).length;
    const totalCount   = manifest.topics;
    const chapterName  = currentLang === 'af' && manifest.nameAf ? manifest.nameAf : manifest.name;

    // Header
    const hdr = document.createElement('div');
    hdr.className = 'chapter-hdr' + (isComingSoon ? ' chapter-hdr-soon' : '');
    hdr.innerHTML = `
      <div class="chapter-hdr-left">
        ${!isComingSoon ? `<svg class="chapter-chevron ${isCollapsed ? 'collapsed' : ''}" viewBox="0 0 16 16" fill="none">
          <path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>` : `<span style="width:14px;height:14px;display:inline-block;opacity:0.3;">·</span>`}
        <span>${t.chapterHdr(ch, chapterName)}</span>
      </div>
      <span class="chapter-hdr-meta">${isComingSoon ? t.comingSoon : (isLoaded ? doneCount+'/'+totalCount : t.topicsCount(totalCount))}</span>
    `;

    // Topics container
    const group = document.createElement('div');
    group.className = 'chapter-topics' + (isCollapsed ? ' collapsed' : '');

    if (isComingSoon) {
      const soon = document.createElement('div');
      soon.style.cssText = 'padding:7px 14px 7px 28px;font-size:11px;color:rgba(221,225,240,0.20);font-style:italic;';
      soon.textContent = t.comingSoon;
      group.appendChild(soon);
    } else if (!isLoaded) {
      // Show a "load chapter" button
      const loadBtn = document.createElement('div');
      loadBtn.style.cssText = 'padding:8px 14px 8px 28px;';
      loadBtn.innerHTML = `<button style="font-size:11px;padding:5px 12px;border-radius:7px;border:1px solid rgba(245,158,11,0.30);background:rgba(245,158,11,0.08);color:#fcd34d;cursor:pointer;font-family:Cabinet Grotesk,sans-serif;font-weight:600;" data-ch="${ch}">${t.loadChapter(ch)}</button>`;
      loadBtn.querySelector('button').addEventListener('click', async (e) => {
        const btn = e.target;
        btn.textContent = t.loading;
        btn.disabled = true;
        try {
          if (currentLang === 'af' && !MathMagician.hasTranslation(ch, 'af')) MLLang.toast(t.notTranslatedToast);
          await MathMagician.load(ch, currentLang);
          rebuildTopics();
          updateProgress();
          buildSidebar();
          buildAnswerKey();
        } catch(err) {
          btn.textContent = t.failedRetry;
          btn.disabled = false;
        }
      });
      group.appendChild(loadBtn);
    } else {
      // Render topic items
      const chapterOffsets = {};
      let offset = 0;
      CHAPTER_MANIFEST.forEach(m => { chapterOffsets[m.num] = offset; offset += m.topics; });
      chTopics.forEach((t, idx) => {
        const div = document.createElement('div');
        div.className = 'topic-item' +
          (t.id === currentTopicId ? ' active' : '') +
          (completed.has(t.id) ? ' completed' : '');
        div.innerHTML = `
          <span class="topic-num">${idx + 1}</span>
          <span class="topic-name">${t.name}</span>
          ${completed.has(t.id) ? '<span class="topic-tick">✓</span>' : ''}
        `;
        div.addEventListener('click', () => selectTopic(t.id));
        group.appendChild(div);
      });
    }

    // Toggle collapse
    if (!isComingSoon) {
      hdr.addEventListener('click', () => {
        // If not loaded yet, load on first expand
        if (!isLoaded && !MathMagician._loading[ch + ':' + currentLang] && manifest.file) {
          if (currentLang === 'af' && !MathMagician.hasTranslation(ch, 'af')) MLLang.toast(t.notTranslatedToast);
          MathMagician.load(ch, currentLang).then(() => {
            rebuildTopics();
            updateProgress();
            buildSidebar();
            buildAnswerKey();
          });
        }
        const chevron = hdr.querySelector('.chapter-chevron');
        if (collapsedChapters.has(ch)) {
          collapsedChapters.delete(ch);
          group.classList.remove('collapsed');
          if (chevron) chevron.classList.remove('collapsed');
        } else {
          collapsedChapters.add(ch);
          group.classList.add('collapsed');
          if (chevron) chevron.classList.add('collapsed');
        }
      });
    }

    sidebarList.appendChild(hdr);
    sidebarList.appendChild(group);
  });
}

let score = { correct: 0, total: 0 };
let topicScores = {};        // topicId → { correct, total }
let completed = new Set();   // topicIds where all questions done

// ═══════════════════════════════════════════════════════════════
// PROGRESS
// ═══════════════════════════════════════════════════════════════
function updateProgress() {
  const done  = completed.size;
  const total = TOPICS.length;
  const allTotal = CHAPTER_MANIFEST.reduce((s,c) => s + c.topics, 0);
  progressText.textContent = T().progressTopics(done, allTotal);
  progressFill.style.width = allTotal > 0 ? `${(done / allTotal) * 100}%` : '0%';
}

// ═══════════════════════════════════════════════════════════════
// TOPIC SELECTION
// ═══════════════════════════════════════════════════════════════
function selectTopic(id) {
  currentTopicId = id;
  qIndex = 0;
  answered = false;
  topicScores[id] = topicScores[id] || { correct: 0, total: 0 };
  const ch = TOPICS.find(t => t.id === id)?.chapter || 1;
  collapsedChapters.delete(ch);
  buildSidebar();
  renderLesson();
  switchTab('lesson');
}

// ═══════════════════════════════════════════════════════════════
// TABS
// ═══════════════════════════════════════════════════════════════
function switchTab(tab) {
  currentTab = tab;
  lessonTabBtn.classList.toggle('active',    tab === 'lesson');
  practiceTabBtn.classList.toggle('active',  tab === 'practice');
  workbookTabBtn.classList.toggle('active',  tab === 'workbook');
  answerKeyTabBtn.classList.toggle('active', tab === 'answerkey');
  lessonPanel.classList.toggle('hidden',    tab !== 'lesson');
  practicePanel.classList.toggle('hidden',  tab !== 'practice');
  workbookPanel.classList.toggle('hidden',  tab !== 'workbook');
  answerKeyPanel.classList.toggle('hidden', tab !== 'answerkey');
  if (tab === 'practice') renderQuestion();
  if (tab === 'workbook' || tab === 'answerkey') scrollToActiveChapter(tab);
}

function scrollToActiveChapter(tab) {
  const activeTopic = TOPICS.find(t => t.id === currentTopicId);
  if (!activeTopic) return;
  const ch = activeTopic.chapter;
  const panel = tab === 'workbook' ? workbookPanel : answerKeyPanel;
  // Small delay so panel is visible before we scroll
  setTimeout(() => {
    const block = panel.querySelector(`.wb-chapter-block[data-ch="${ch}"]`);
    if (!block) return;
    // Highlight pulse
    panel.querySelectorAll('.wb-chapter-block').forEach(b => b.classList.remove('ch-active'));
    block.classList.add('ch-active');
    block.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 50);
}

lessonTabBtn.addEventListener('click', () => switchTab('lesson'));
practiceTabBtn.addEventListener('click', () => { qIndex = 0; answered = false; switchTab('practice'); });

// ═══════════════════════════════════════════════════════════════
// LESSON RENDERER
// ═══════════════════════════════════════════════════════════════
function renderLesson() {
  const t = getTopicById(currentTopicId);
  const l = t.lesson;
  lessonPanel.innerHTML = `
    <div class="lesson-heading">${l.heading}</div>
    <div class="lesson-subheading">${l.sub}</div>
    <div class="lesson-body">${l.body}</div>
    <button class="lesson-next-btn" id="goToPractice">
      <i data-lucide="pencil" style="width:14px;height:14px;"></i>
      ${T().startPractice}
    </button>
  `;
  document.getElementById('goToPractice').addEventListener('click', () => {
    qIndex = 0; answered = false; switchTab('practice');
  });
  // Browsers don't execute <script> tags injected via innerHTML.
  // Re-create and append each script so widget code actually runs.
  lessonPanel.querySelectorAll('script').forEach(oldScript => {
    const newScript = document.createElement('script');
    newScript.textContent = oldScript.textContent;
    oldScript.replaceWith(newScript);
  });
  lucide.createIcons();
}

// ═══════════════════════════════════════════════════════════════
// QUESTION RENDERER
// ═══════════════════════════════════════════════════════════════
function renderQuestion() {
  const t = getTopicById(currentTopicId);
  const ts = topicScores[currentTopicId] || { correct: 0, total: 0 };

  if (qIndex >= t.questions.length) {
    completed.add(currentTopicId);
    buildSidebar();
    updateProgress();
    // Track topic complete
    if (window.MagicLabProgress) {
      const t = getTopicById(currentTopicId);
      MagicLabProgress.track(ML_TOOLS.MATH_MAGICIAN, 'lesson_complete', {
        topic: t?.name, grade: 12,
        metadata: { topicId: currentTopicId }
      });
    }
    const pct = ts.total > 0 ? Math.round((ts.correct / ts.total) * 100) : 0;
    // Find this topic's actual position in the flat array, then advance
    // by ONE POSITION — not by id+1. Topic ids are not guaranteed to be
    // sequential/gapless, so "currentTopicId + 1" can land on a topic
    // belonging to a totally different chapter (or on a non-existent id).
    const curIdx  = TOPICS.findIndex(t2 => t2.id === currentTopicId);
    const hasNext = curIdx !== -1 && curIdx + 1 < TOPICS.length;
    const nextTopic = hasNext ? TOPICS[curIdx + 1] : null;
    practicePanel.innerHTML = `
      <div class="complete-banner">
        <h2>${T().topicComplete}</h2>
        <p>${T().scoredOn(ts.correct, ts.total, pct, t.name)}</p>
        ${nextTopic
          ? `<button class="lesson-next-btn" id="nextTopicBtn">
              <i data-lucide="arrow-right" style="width:14px;height:14px;"></i>
              ${T().nextTopic(nextTopic.name)}
             </button>`
          : `<p style="color:#6ee7b7;font-size:15px;font-weight:600;">${T().allTopicsDone}</p>`}
      </div>`;
    if (nextTopic) {
      document.getElementById('nextTopicBtn').addEventListener('click', () => selectTopic(nextTopic.id));
    }
    lucide.createIcons();
    return;
  }

  const q = t.questions[qIndex];
  const ts2 = topicScores[currentTopicId] || { correct: 0, total: 0 };

  let questionHTML = '';

  if (q.type === 'mc') {
    const letters = ['A','B','C','D'];
    const opts = q.options.map((o, i) => `
      <div class="mc-option" data-idx="${i}">
        <span class="mc-letter">${letters[i]}</span>
        <span class="mc-text">${o}</span>
      </div>`).join('');
    questionHTML = `<div class="mc-options" id="mcOptions">${opts}</div>`;
  } else {
    questionHTML = `
      <div class="input-row">
        <input type="text" class="answer-input" id="answerInput" placeholder="${T().answerPlaceholder}" autocomplete="off">
        <button class="submit-btn" id="submitBtn">${T().check}</button>
      </div>`;
  }

  practicePanel.innerHTML = `
    <div class="score-row">
      <span class="score-pill">${T().qOf(qIndex + 1, t.questions.length)}</span>
      <span class="score-pill">${T().scoreLabel(ts2.correct, ts2.total)}</span>
      <span class="q-topic-tag">${q.topic}</span>
    </div>
    <div class="question-text">${q.text}</div>
    ${questionHTML}
    <div id="feedbackArea">
      <div class="feedback-label" id="feedbackLabel"></div>
      <div id="feedbackText"></div>
    </div>
    <button id="nextQBtn">${T().nextQuestion} <i data-lucide="arrow-right" style="width:13px;height:13px;"></i></button>
  `;
  lucide.createIcons();

  const feedbackArea = document.getElementById('feedbackArea');
  const feedbackLabel = document.getElementById('feedbackLabel');
  const feedbackText = document.getElementById('feedbackText');
  const nextQBtn = document.getElementById('nextQBtn');

  nextQBtn.addEventListener('click', () => {
    qIndex++;
    answered = false;
    renderQuestion();
  });

  function showFeedback(correct, explanation) {
    feedbackArea.style.display = 'block';
    if (correct) {
      feedbackArea.className = 'correct';
      feedbackLabel.textContent = T().correct;
      feedbackText.textContent = explanation || T().wellDone;
    } else {
      feedbackArea.className = 'wrong';
      feedbackLabel.textContent = T().notQuite;
      feedbackText.innerHTML = explanation || T().reviewDefault;
    }
    nextQBtn.classList.add('show');
  }

  function checkAnswer(userAnswer, correct) {
    if (answered) return;
    answered = true;
    topicScores[currentTopicId] = topicScores[currentTopicId] || { correct: 0, total: 0 };
    topicScores[currentTopicId].total++;

    const isCorrect = String(userAnswer).trim().toLowerCase() === String(correct).trim().toLowerCase() ||
                      String(userAnswer).trim() === String(correct).trim();

    if (isCorrect) {
      topicScores[currentTopicId].correct++;
      showFeedback(true);
      // Track correct answer
      if (window.MagicLabProgress) {
        const t = getTopicById(currentTopicId);
        MagicLabProgress.track(ML_TOOLS.MATH_MAGICIAN, 'quiz_correct', {
          topic: t?.name, grade: 12, score: 1,
          metadata: { question: q.text?.replace(/<[^>]+>/g,'')?.substring(0,100) }
        });
      }
    } else {
      // Call AI for explanation
      fetchAIFeedback(q, userAnswer, correct, showFeedback);
      // Track wrong answer
      if (window.MagicLabProgress) {
        const t = getTopicById(currentTopicId);
        MagicLabProgress.track(ML_TOOLS.MATH_MAGICIAN, 'quiz_wrong', {
          topic: t?.name, grade: 12, score: 0,
          metadata: { question: q.text?.replace(/<[^>]+>/g,'')?.substring(0,100) }
        });
      }
    }
  }

  if (q.type === 'mc') {
    document.querySelectorAll('.mc-option').forEach(opt => {
      opt.addEventListener('click', () => {
        if (answered) return;
        const idx = parseInt(opt.dataset.idx);
        document.querySelectorAll('.mc-option').forEach(o => o.classList.add('disabled'));
        opt.classList.add('selected');
        const isCorrect = idx === q.answer;
        document.querySelectorAll('.mc-option')[q.answer].classList.add('correct');
        if (!isCorrect) opt.classList.add('wrong');
        checkAnswer(idx, q.answer);
      });
    });
  } else {
    const input = document.getElementById('answerInput');
    const btn = document.getElementById('submitBtn');
    const submit = () => {
      if (answered) return;
      const val = input.value.trim();
      if (!val) return;
      input.disabled = true;
      btn.disabled = true;
      const isCorrect = val.toLowerCase() === String(q.answer).toLowerCase();
      input.classList.add(isCorrect ? 'correct' : 'wrong');
      checkAnswer(val, q.answer);
    };
    btn.addEventListener('click', submit);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  }
}

// ═══════════════════════════════════════════════════════════════
// AI FEEDBACK (Anthropic API — wrong answers only)
// ═══════════════════════════════════════════════════════════════
async function fetchAIFeedback(q, userAnswer, correctAnswer, callback) {
  const feedbackArea = document.getElementById('feedbackArea');
  const feedbackLabel = document.getElementById('feedbackLabel');
  const feedbackText  = document.getElementById('feedbackText');

  feedbackArea.style.display = 'block';
  feedbackArea.className = 'loading';
  feedbackLabel.textContent = T().gettingExplanation;
  feedbackText.textContent = '';

  const topic  = getTopicById(currentTopicId);
  const langInstruction = currentLang === 'af' ? '\nWrite your entire explanation in Afrikaans.' : '';
  const prompt = `You are a friendly, encouraging Grade 12 maths tutor (IEB/CAPS curriculum, South Africa).
A student answered a question incorrectly. Give a SHORT, clear explanation (max 3 sentences) of:
1. Why their answer is wrong.
2. The correct method to get the right answer.
Be encouraging and specific. Do not just state the answer — explain the method.${langInstruction}

Question: ${q.text.replace(/<[^>]+>/g, '')}
Topic: ${q.topic} (${topic.name})
Student answered: ${userAnswer}
Correct answer: ${correctAnswer}`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        messages: [{ role: 'user', content: prompt }]
      })
    });
    const data = await res.json();
    const text = data.content?.map(c => c.text || '').join('') || 'Check the lesson for a worked example.';
    callback(false, text);
  } catch {
    callback(false, currentLang === 'af'
      ? `Die korrekte antwoord is <strong>${correctAnswer}</strong>. Kyk weer na die uitgewerkte voorbeeld in die les.`
      : `The correct answer is <strong>${correctAnswer}</strong>. Review the worked example in the lesson.`);
  }
}

          q.parts.forEach(p => {
            html += `<div class="wb-part">
              <span class="wb-part-label">${p.label}</span>
              <span>${p.text} <span class="wb-marks">${t.markWord(p.marks)}</span></span>
            </div>`;
          });
        }
        const totalLines = q.parts ? Math.max(3, q.parts.length * 2) : 4;
        html += `<div class="wb-answer-lines">`;
        for (let i = 0; i < totalLines; i++) html += `<div class="wb-line"></div>`;
        html += `</div></div>`;
      });
      html += `</div>`;
    });
    html += `</div>`;
  });

  workbookPanel.innerHTML = html;
  lucide.createIcons();
}

// ═══════════════════════════════════════════════════════════════
// PRINT HELPERS
// ═══════════════════════════════════════════════════════════════
// printSection(type, chapterNum?, topicIdx?)
// type: 'workbook' | 'answerkey'
// chapterNum: if set, only print that chapter
// topicIdx: if set (and chapterNum set), only print that topic within the chapter
function printSection(type, chapterNum, topicIdx) {
  const wbPanel = document.getElementById('workbookPanel');
  const akPanel = document.getElementById('answerKeyPrintPanel');
  const isAK = (type === 'answerkey');

  // If chapter/topic filter — rebuild the print panel with just that slice
  if (chapterNum !== undefined) {
    const allWB = getAllWorkbook();
    const allAK = getAllAnswerKey();

    if (isAK) {
      _buildFilteredAK(allAK, chapterNum, topicIdx);
    } else {
      _buildFilteredWB(allWB, chapterNum, topicIdx);
    }
  }

  if (isAK) {
    document.body.classList.add('print-answerkey');
    document.body.classList.remove('print-workbook');
    akPanel.classList.remove('hidden');
    wbPanel.classList.add('hidden');
  } else {
    document.body.classList.add('print-workbook');
    document.body.classList.remove('print-answerkey');
    wbPanel.classList.remove('hidden');
    akPanel.classList.add('hidden');
  }

  setTimeout(() => {
    window.print();
    setTimeout(() => {
      document.body.classList.remove('print-workbook', 'print-answerkey');
      wbPanel.classList.toggle('hidden', currentTab !== 'workbook');
      akPanel.classList.toggle('hidden', currentTab !== 'answerkey');
      // Restore full panels after filtered print
      if (chapterNum !== undefined) {
        buildAnswerKey();
        renderWorkbook();
        lucide.createIcons();
      }
    }, 500);
  }, 100);
}

function _buildFilteredWB(allWB, chapterNum, topicIdx) {
  const t = T();
  const chap = allWB.find(c => c.chapter === chapterNum);
  if (!chap) return;
  const topics = topicIdx !== undefined ? [chap.topics[topicIdx]] : chap.topics;
  const label = topicIdx !== undefined
    ? t.filteredWBChapter(chap.chapter, chap.topics[topicIdx]?.name)
    : t.filteredWBChapter(chap.chapter, chap.chapterName);
  let html = `<div class="wb-header"><div class="wb-title">${label}</div></div>
    <p class="wb-intro">${t.workbookIntro}</p>
    <div class="wb-chapter-block">`;
  topics.filter(Boolean).forEach(topic => {
    html += `<div class="wb-topic-block"><div class="wb-topic-label">${topic.name}</div>`;
    topic.questions.forEach(q => {
      html += `<div class="wb-question"><div class="wb-question-num">${t.questionLabel(q.num)}</div>
        <div class="wb-question-text">${q.text}</div>`;
      if (q.parts) q.parts.forEach(p => {
        html += `<div class="wb-part"><span class="wb-part-label">${p.label}</span>
          <span>${p.text} <span class="wb-marks">${t.markWord(p.marks)}</span></span></div>`;
      });
      const lines = q.parts ? Math.max(3, q.parts.length * 2) : 4;
      html += `<div class="wb-answer-lines">${'<div class="wb-line"></div>'.repeat(lines)}</div></div>`;
    });
    html += `</div>`;
  });
  html += `</div>`;
  document.getElementById('workbookPanel').innerHTML = html;
}

function _buildFilteredAK(allAK, chapterNum, topicIdx) {
  const t = T();
  const chap = allAK.find(c => c.chapter === chapterNum);
  if (!chap) return;
  const topics = topicIdx !== undefined ? [chap.topics[topicIdx]] : chap.topics;
  const label = topicIdx !== undefined
    ? t.answerKeyTopic(chap.topics[topicIdx]?.name)
    : t.answerKeyChapter(chap.chapter, chap.chapterName);
  let html = `<div class="wb-header">
    <div class="wb-title" style="background:linear-gradient(125deg,#fff 0%,#6ee7b7 60%,#10b981 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">${label}</div>
  </div><p class="wb-intro">${t.filteredAKIntro}</p>
  <div class="wb-chapter-block">`;
  topics.filter(Boolean).forEach(topic => {
    html += `<div class="wb-topic-block">
      <div class="wb-topic-label" style="color:rgba(110,231,183,0.60);">${topic.name}</div>`;
    topic.answers.forEach(a => {
      html += `<div class="wb-question" style="padding:10px 18px;">
        <div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;">
          <span class="wb-question-num" style="min-width:60px;color:rgba(245,158,11,0.80);">${a.num}</span>
          <span style="color:#6ee7b7;font-size:13.5px;font-weight:600;flex:1;">${a.ans}</span>
        </div>
        ${a.note ? `<div style="font-size:11.5px;color:rgba(221,225,240,0.42);margin-top:4px;font-family:'JetBrains Mono',monospace;">${a.note}</div>` : ''}
      </div>`;
    });
    html += `</div>`;
  });
  html += `</div>`;
  document.getElementById('answerKeyPrintPanel').innerHTML = html;
}

// ═══════════════════════════════════════════════════════════════
// ANSWER KEY
// ═══════════════════════════════════════════════════════════════
function buildAnswerKey() {
  const t = T();
  const allKeys = getAllAnswerKey();
  const printPanel = document.getElementById('answerKeyPrintPanel');
  if (!printPanel) return;

  let html = `
    <div class="wb-header">
      <div class="wb-title" style="background:linear-gradient(125deg,#fff 0%,#6ee7b7 60%,#10b981 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">${t.answerKeyAll}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="wb-print-btn" onclick="printSection('answerkey')" style="border-color:rgba(16,185,129,0.30);background:rgba(16,185,129,0.10);color:#6ee7b7;">
          <i data-lucide="printer" style="width:12px;height:12px;"></i> ${t.printAll}
        </button>
        <button class="wb-print-btn" onclick="printSection('workbook')">
          <i data-lucide="printer" style="width:12px;height:12px;"></i> ${t.printWorkbook}
        </button>
      </div>
    </div>
    <p class="wb-intro">${t.answerKeyIntro}</p>
  `;

  if (!allKeys.length) {
    html += `<p style="color:rgba(221,225,240,0.35);font-style:italic;font-size:13px;">${t.noChaptersLoaded}</p>`;
  }

  allKeys.forEach(chap => {
    html += `<div class="wb-chapter-block" data-ch="${chap.chapter}">
      <div class="wb-chapter-title" style="color:#6ee7b7;-webkit-text-fill-color:#6ee7b7;border-color:rgba(16,185,129,0.20);">
        <div class="wb-chapter-header">
          <span>✦ ${chap.chapterName}</span>
          <div class="wb-chapter-actions">
            <button class="wb-chapter-print-btn ak-style" onclick="printSection('answerkey',${chap.chapter})">
              <i data-lucide="printer" style="width:9px;height:9px;"></i> ${t.printChapter}
            </button>
            <button class="wb-chapter-print-btn" onclick="printSection('workbook',${chap.chapter})">
              <i data-lucide="book" style="width:9px;height:9px;"></i> ${t.workbookBtn}
            </button>
          </div>
        </div>
      </div>`;
    chap.topics.forEach((topic, tIdx) => {
      html += `<div class="wb-topic-block" data-ch="${chap.chapter}" data-t="${tIdx}">
        <div class="wb-topic-header">
          <div class="wb-topic-label" style="color:rgba(110,231,183,0.60);">${topic.name}</div>
          <div style="display:flex;gap:5px;">
            <button class="wb-topic-print-btn ak-style" onclick="printSection('answerkey',${chap.chapter},${tIdx})">
              <i data-lucide="printer" style="width:11px;height:11px;"></i> ${t.answersBtn}
            </button>
            <button class="wb-topic-print-btn" onclick="printSection('workbook',${chap.chapter},${tIdx})">
              <i data-lucide="book" style="width:11px;height:11px;"></i> ${t.workbookBtn}
            </button>
          </div>
        </div>`;
      topic.answers.forEach(a => {
        html += `<div class="wb-question" style="padding:10px 18px;">
          <div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;">
            <span class="wb-question-num" style="min-width:60px;color:rgba(245,158,11,0.80);">${a.num}</span>
            <span style="color:#6ee7b7;font-size:13.5px;font-weight:600;flex:1;">${a.ans}</span>
          </div>
          ${a.note ? `<div style="font-size:11.5px;color:rgba(221,225,240,0.42);margin-top:4px;font-family:'JetBrains Mono',monospace;">${a.note}</div>` : ''}
        </div>`;
      });
      html += `</div>`;
    });
    html += `</div>`;
  });

  printPanel.innerHTML = html;
  lucide.createIcons();
}


// ═══════════════════════════════════════════════════════════════
// INIT — load chapter 1 immediately, then initialise
// ═══════════════════════════════════════════════════════════════
async function init() {
  applyChrome();
  // Load all chapters in parallel — the files are local so this is fast
  const loads = CHAPTER_MANIFEST.filter(m => m.file).map(m => MathMagician.load(m.num).catch(() => null));
  await Promise.all(loads);
  rebuildTopics();
  TOPICS.forEach(t => { topicScores[t.id] = topicScores[t.id] || { correct: 0, total: 0 }; });
  buildSidebar();
  updateProgress();
  buildAnswerKey();
  renderWorkbook();
  if (TOPICS.length) selectTopic(TOPICS[0].id);
  lucide.createIcons();
}
init();

// ═══════════════════════════════════════════════════════════════
// LANGUAGE TOGGLE — swap chrome text + re-fetch chapter content
// ═══════════════════════════════════════════════════════════════
function reloadContentForLang() {
  const loadedNums = new Set();
  MathMagician._loaded.forEach(key => loadedNums.add(parseInt(key.split(':')[0], 10)));
  const loads = [...loadedNums].map(n => MathMagician.load(n, currentLang).catch(() => null));
  Promise.all(loads).then(() => {
    rebuildTopics();
    buildSidebar();
    updateProgress();
    buildAnswerKey();
    renderWorkbook();
    if (currentTopicId && TOPICS.find(tp => tp.id === currentTopicId)) {
      renderLesson();
      if (currentTab === 'practice') renderQuestion();
    }
  });
}

if (window.MLLang) {
  MLLang.mount('mlLangToggle', {
    onChange(nextLang) {
      currentLang = nextLang;
      applyChrome();
      reloadContentForLang();
    }
  });
}

// ── Restore completed topics from Supabase ─────────────────────────────────
// Runs once progress SDK is ready. Matches saved topic titles back to IDs.
async function _restoreProgress() {
  if (!window.MagicLabProgress) return;
  const history = await MagicLabProgress.getLessonHistory(ML_TOOLS.MATH_MAGICIAN);
  if (!history.size) return;
  TOPICS.forEach(t => {
    if (history.has(t.name || t.title || t.id)) completed.add(t.id);
  });
  buildSidebar();
  updateProgress();
}

document.addEventListener('magiclab:progress:ready', _restoreProgress);
if (window.MagicLabProgress) _restoreProgress();
