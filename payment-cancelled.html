<!doctype html>
<html lang="en">
<head>
<script>document.documentElement.style.visibility='hidden';</script>
<script>window.MLSkipPaywall = true;</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080c1a">
  <title>Checkout cancelled — The Magic Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cabinet+Grotesk:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <script defer src="auth.js"></script>
<script defer src="require-auth.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; background: #080c1a; color: #e4e8f8; font-family: "Cabinet Grotesk", sans-serif; }
    body { display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; }
    .card { max-width: 420px; }
    .icon {
      width: 56px; height: 56px; margin: 0 auto 20px; border-radius: 50%;
      background: rgba(210,218,245,0.08); border: 1px solid rgba(210,218,245,0.18);
      display: flex; align-items: center; justify-content: center; font-size: 26px;
    }
    h1 { font-weight: 800; font-size: 24px; letter-spacing: -0.02em; margin-bottom: 10px; }
    p { color: rgba(210,218,245,0.55); font-size: 14px; line-height: 1.6; margin-bottom: 24px; }
    .btn-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .btn {
      display: inline-block; padding: 12px 24px; border-radius: 12px; text-decoration: none;
      font-weight: 700; font-size: 14px;
    }
    .btn-primary { background: linear-gradient(135deg,#7c6dfa,#11d98f); color: #0a0e1c; }
    .btn-ghost { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12); color: #e4e8f8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">↩︎</div>
    <h1>No payment was made</h1>
    <p>You cancelled checkout — nothing was charged. You can pick up right where you left off whenever you're ready.</p>
    <div class="btn-row">
      <a href="pricing.html" class="btn btn-primary">Try again</a>
      <a href="index.html" class="btn btn-ghost">Back to The Magic Lab</a>
    </div>
  </div>
</body>
</html>
