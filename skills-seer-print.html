<!-- Print page for Skills Seer: the dashboard stores the report or training
     plan in localStorage (ml_ss_print) and opens this page, which shows it
     with plain print styles and opens the print dialog. A real page on the
     site, with no third-party fonts, so every browser (Edge included) can
     finish loading it before printing. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Skills Seer — print</title>
  <link rel="icon" type="image/svg+xml" href="/assets/logo-prism.svg">
  <link rel="stylesheet" href="/assets/skills-seer.css">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    html,body{background:#fff;color:#1d2433;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
    body{padding:24px}
    .paper .rp-head h1,.paper h1,.paper h2,.plan h3{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
    .bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:0 auto 18px;max-width:820px;font-size:13px;color:#4a5468}
    .bar button{font:700 14px inherit;padding:9px 16px;border-radius:8px;border:1px solid #0b1220;background:#0b1220;color:#fff;cursor:pointer}
    .paper,.plan{max-width:820px;margin:0 auto}
    .plan h3{font-size:24px;font-weight:800;color:#0b1220;margin:4px 0 6px}
    .plan .ml-label{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#0e7490}
    .plan .sub{font-size:13px;color:#4a5468}
    .plan .sk-note{border:1px solid #d5dae3;background:#f4f6f9;border-radius:8px;padding:10px 14px;font-size:13px;line-height:1.55;margin-bottom:10px;color:#1d2433}
    .plan ul{margin:6px 0 0 18px}.plan li{margin:2px 0}.plan small{color:#6b7487}
    .plan table{width:100%;border-collapse:collapse;margin:10px 0 12px}
    .plan td{border-top:1px solid #e3e7ee;padding:8px 10px;font-size:13px;line-height:1.5;vertical-align:top;color:#1d2433;background:none}
    .plan td.name{width:70px;font-weight:800;white-space:nowrap}
    .plan strong{color:#0b1220}.plan a{color:#0e7490}
    .empty{max-width:620px;margin:60px auto;font-size:15px;line-height:1.6;color:#4a5468}
    @page{size:A4;margin:12mm}
    @media print{
      body{padding:0}.bar{display:none}
      .paper{padding:0;font-size:95%;max-width:none}.paper h1{font-size:24px}.paper section{margin-bottom:12px}
      .rp-head{padding-bottom:8px;margin-bottom:12px}.donut svg{width:68px;height:68px}.rp-heat .cell{min-height:19px}
      .rp-actions{font-size:11.5px;line-height:1.45}.rp-gap{margin-bottom:5px}.rp-foot{padding-top:6px}
    }
  </style>
</head>
<body>
  <div class="bar"><button type="button" id="printBtn">Print or save as PDF</button><span>Choose “Save as PDF” as the printer to keep a copy.</span></div>
  <main id="doc"></main>
  <script>
    (function () {
      var data = null;
      try { data = JSON.parse(localStorage.getItem('ml_ss_print')); } catch (e) {}
      var doc = document.getElementById('doc');
      document.getElementById('printBtn').addEventListener('click', function () { window.print(); });
      if (!data || !data.html) {
        doc.innerHTML = '<p class="empty">Nothing to print. Open the Skills Seer dashboard and use “Leadership report” or “Plan a training session”, then its print button.</p>';
        return;
      }
      document.title = data.title || document.title;
      doc.innerHTML = data.kind === 'plan' ? '<div class="plan">' + data.html + '</div>' : data.html;
      // open the dialog once the page (logo included) has finished loading
      function go() { setTimeout(function () { window.print(); }, 300); }
      if (document.readyState === 'complete') go(); else window.addEventListener('load', go);
    })();
  </script>
</body>
</html>
