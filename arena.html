<title>The Arena — The Magic Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@400,500,700,800,900&display=swap">

<style>
/* ══════════════════════════════════════════════════════════════════════════
   The Arena — live quiz player.

   Stylesheet only; every class and id the game script drives is untouched.

   This is the one screen on the site that is not a document. It is held in a
   hand, in a classroom, and read in about two seconds under time pressure —
   so it keeps big targets and high contrast, and takes less of the editorial
   restraint the rest of the site uses.

   The four answer tiles keep four distinct hues on purpose. Colour is paired
   with a shape on every tile, which is the right way to do it: a learner who
   cannot separate red from green still has the shape. That is a working
   accessibility feature, not decoration, so it survives intact.
   ═════════════════════════════════════════════════════════════════════════ */

:root {
  --surface2: rgba(255,255,255,0.03);
  --border2:  var(--line-soft);
  --text2:    var(--text-2);
  --font:     var(--font-display);
  --mono:     var(--font-mono);
}

html, body { height: 100%; }
body {
  font-family: var(--font); background: var(--ink-900); color: var(--text);
  min-height: 100vh; -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column;
}

.wrap {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; text-align: center;
  width: 100%; max-width: 520px; margin: 0 auto; padding: 24px;
}
.hidden { display: none !important; }

.logo {
  display: inline-block; margin-bottom: var(--space-6);
  font-family: var(--font-display); font-weight: 800; font-size: 16px;
  letter-spacing: -0.025em; color: var(--text-3); text-decoration: none;
  transition: color var(--dur-fast) var(--ease-standard);
}
.logo:hover { color: var(--paper); }

/* ── Hero ─────────────────────────────────────────────────────────────── */
.arena-hero { margin-bottom: var(--space-6); }
.arena-hero-icon { font-size: 40px; margin-bottom: 12px; }
/* Was a gradient-clipped fill. */
.arena-hero-title {
  font-family: var(--font-display); font-weight: 900; font-size: 30px;
  letter-spacing: -0.035em; color: var(--paper); margin-bottom: var(--space-2);
}
.arena-hero-sub { font-size: 14.5px; line-height: 1.6; color: var(--text-2); max-width: 400px; margin: 0 auto; }

/* ── Status bar: arena name, rank, last-5 history ─────────────────────── */
.arena-statusbar {
  width: 100%; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
  gap: 10px; margin-bottom: var(--space-4); padding: 10px 14px;
  background: var(--ink-850); border: 1px solid var(--line); border-radius: var(--radius-sm);
}
.arena-statusbar-title { flex: 1; min-width: 110px; text-align: left; font-weight: 700; font-size: 13px; color: var(--text-2); }
.arena-rank-badge {
  font-family: var(--mono); font-size: 11px; font-weight: 500; white-space: nowrap;
  padding: 4px 10px; border-radius: var(--radius-full);
  background: rgba(91,156,255,0.14); border: 1px solid rgba(91,156,255,0.32); color: var(--fam-computing);
  font-variant-numeric: tabular-nums;
}
.arena-history { display: flex; gap: 4px; align-items: center; }
.arena-history-dot {
  width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 800;
}
/* Right and wrong keep the semantic pair, separate from the tile hues. */
.arena-history-dot.correct { background: rgba(74,207,127,0.18); color: var(--good); border: 1px solid rgba(74,207,127,0.38); }
.arena-history-dot.wrong   { background: rgba(239,91,91,0.16);  color: #f5a3a3;    border: 1px solid rgba(239,91,91,0.34); }

/* ── Join form ────────────────────────────────────────────────────────── */
.form-field { width: 100%; margin-bottom: var(--space-4); text-align: left; }
.form-label {
  display: block; margin-bottom: 7px;
  font-family: var(--mono); font-size: 10px; font-weight: 500;
  letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-3);
}
.form-input {
  width: 100%; padding: 14px 16px; text-align: center;
  background: var(--ink-850); border: 1px solid var(--line-hard);
  border-radius: var(--radius-sm); color: var(--text);
  font-family: var(--font); font-size: 18px; outline: none;
  transition: border-color var(--dur-fast) var(--ease-standard);
}
.form-input::placeholder { color: var(--text-4); }
.form-input:focus { border-color: var(--paper); }
/* The room code is the thing being typed under pressure — give it room. */
#codeInput {
  font-family: var(--mono); font-size: 28px; font-weight: 600;
  letter-spacing: 0.18em; text-transform: uppercase;
}

.btn-primary {
  width: 100%; margin-top: var(--space-2); padding: 15px;
  border: 1px solid var(--paper); border-radius: var(--radius-sm); cursor: pointer;
  background: var(--paper); color: var(--ink-900);
  font-family: var(--font); font-size: 16px; font-weight: 700; letter-spacing: -0.01em;
  transition: background var(--dur-fast) var(--ease-standard),
              transform var(--dur-fast) var(--ease-standard);
}
.btn-primary:hover:not(:disabled) { background: #fff; transform: translateY(-1px); }
.btn-primary:active:not(:disabled) { transform: translateY(0); }
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

.msg { margin-top: 10px; font-size: 13px; font-weight: 600; }
.msg.err { color: #f5a3a3; }

/* ── Waiting ──────────────────────────────────────────────────────────── */
.wait-icon { font-size: 44px; margin-bottom: var(--space-4); }
.wait-title { font-family: var(--font-display); font-weight: 900; font-size: 24px; letter-spacing: -0.03em; margin-bottom: var(--space-2); color: var(--paper); }
.wait-sub { font-size: 14.5px; color: var(--text-2); }

/* ── Question ─────────────────────────────────────────────────────────── */
.q-progress {
  font-family: var(--mono); font-size: 12px; color: var(--text-3);
  margin-bottom: var(--space-4); font-variant-numeric: tabular-nums;
}
.opt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; }
.opt-tile {
  min-height: 104px; padding: 24px 14px;
  border: none; border-radius: var(--radius-md); cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  font-family: var(--font); font-size: 15.5px; font-weight: 800; color: #fff;
  transition: transform 120ms, opacity 150ms, filter 150ms;
}
.opt-tile:hover { filter: brightness(1.08); }
.opt-tile:active { transform: scale(0.96); }
/* Flat fills rather than gradients, and every one measured against its own
   text colour rather than eyeballed. All four failed WCAG AA before this:
   red 3.76, blue 3.68, yellow 1.92, green 2.28 against white, where 15.5px
   bold needs 4.5. They now read 4.59, 4.70, 9.45 and 4.70 — the amber by
   taking ink text, since white on yellow cannot get there at any usable
   lightness. Hues stay far enough apart to tell at a glance, and every tile
   still carries its shape as well. */
.opt-tile.c0 { background: #d24141; }
.opt-tile.c1 { background: #2f6fe0; }
.opt-tile.c2 { background: #e5a828; color: var(--ink-900); }
.opt-tile.c3 { background: #19853e; }
.opt-tile.dimmed { opacity: 0.28; }
.opt-shape { font-size: 26px; }

.locked-icon { font-size: 44px; margin-bottom: var(--space-3); }

/* ── Result ───────────────────────────────────────────────────────────── */
.result-icon { font-size: 52px; margin-bottom: var(--space-3); }
.result-title { font-family: var(--font-display); font-weight: 900; font-size: 26px; letter-spacing: -0.03em; margin-bottom: 6px; color: var(--paper); }
.result-title.correct { color: var(--good); }
.result-title.wrong   { color: #f5a3a3; }
.result-points { font-family: var(--mono); font-size: 15px; color: var(--text-2); margin-bottom: var(--space-5); font-variant-numeric: tabular-nums; }
.result-rank { font-size: 13px; color: var(--text-3); }

/* ── Ended ────────────────────────────────────────────────────────────── */
.final-icon { font-size: 48px; margin-bottom: var(--space-3); }
.final-rank { font-family: var(--font-display); font-weight: 900; font-size: 32px; letter-spacing: -0.035em; margin-bottom: 6px; color: var(--paper); }
.final-score { font-family: var(--mono); font-size: 15px; color: var(--text-2); margin-bottom: var(--space-5); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>

<div class="wrap">
  <a href="dashboard-student.html" class="logo">🧙 The Magic Lab</a>

  <div class="arena-statusbar hidden" id="arenaStatusBar">
    <div class="arena-statusbar-title" id="arenaTitleLabel"></div>
    <div class="arena-history" id="historyStrip"></div>
    <div class="arena-rank-badge" id="rankBadge"></div>
  </div>

  <!-- Join -->
  <div id="stateJoin">
    <div class="arena-hero">
      <div class="arena-hero-icon">🏟️</div>
      <div class="arena-hero-title">The Arena</div>
      <div class="arena-hero-sub">Live quiz battles. Answer fast, climb the leaderboard, see how you stack up against the rest of your class in real time.</div>
    </div>
    <div class="form-field">
      <label class="form-label">Arena code</label>
      <input class="form-input" id="codeInput" maxlength="6" placeholder="ABC123">
    </div>
    <div class="form-field">
      <label class="form-label">Your name</label>
      <input class="form-input" id="nameInput" maxlength="24" placeholder="How should we show you on the leaderboard?">
    </div>
    <button class="btn-primary" id="btnJoin" onclick="onJoin()">Enter the Arena</button>
    <div class="msg err" id="joinMsg"></div>
  </div>

  <!-- Waiting for host -->
  <div class="hidden" id="stateWaiting">
    <div class="wait-icon">⏳</div>
    <div class="wait-title">You're in!</div>
    <div class="wait-sub">Waiting for the host to start the round…</div>
  </div>

  <!-- Question -->
  <div class="hidden" id="stateQuestion" style="width:100%;">
    <div class="q-progress" id="qProgress"></div>
    <div class="opt-grid" id="qOpts"></div>
  </div>

  <!-- Locked in, waiting for reveal -->
  <div class="hidden" id="stateLocked">
    <div class="locked-icon">✅</div>
    <div class="wait-title">Answer locked in!</div>
    <div class="wait-sub">Waiting for the other players…</div>
  </div>

  <!-- Result -->
  <div class="hidden" id="stateResult">
    <div class="result-icon" id="resultIcon"></div>
    <div class="result-title" id="resultTitle"></div>
    <div class="result-points" id="resultPoints"></div>
    <div class="result-rank" id="resultRank"></div>
  </div>

  <!-- Ended -->
  <div class="hidden" id="stateEnded">
    <div class="final-icon" id="finalIcon"></div>
    <div class="final-rank" id="finalRank"></div>
    <div class="final-score" id="finalScore"></div>
    <a href="dashboard-student.html" class="btn-primary" style="text-decoration:none;display:inline-block;">← Back to Dashboard</a>
  </div>
</div>

<script src="auth.js"></script>
<script defer src="require-auth.js"></script>
<script src="games.js"></script>
<script>
const params = new URLSearchParams(location.search);
const OPT_ICONS = ['🪄', '🔮', '⭐', '💎']; // wand / orb / star / gem — distinct silhouettes, matches arena-host.html
let sessionId = null;
let participantId = null;
let pollTimer = null;
let questionStartedLocal = null;
let lastAnsweredIndex = -1;
let answerHistory = []; // [{correct: bool}], most recent last, capped to 5
let rankAtQuestionStart = null;

function showState(name) {
  ['Join','Waiting','Question','Locked','Result','Ended'].forEach(s => {
    document.getElementById('state' + s).classList.toggle('hidden', s !== name);
  });
}

async function onJoin() {
  const code = document.getElementById('codeInput').value.trim();
  const name = document.getElementById('nameInput').value.trim();
  const msg  = document.getElementById('joinMsg');
  const btn  = document.getElementById('btnJoin');
  if (!code) { msg.textContent = 'Enter the arena code.'; return; }
  if (!window.MagicLabAuth?.isLoggedIn()) { msg.textContent = 'Please sign in first.'; return; }

  btn.disabled = true; btn.textContent = 'Entering…';
  const { data, error } = await window.MagicLabGames.joinGameSession(code, name);
  if (error) {
    msg.textContent = error.message;
    btn.disabled = false; btn.textContent = 'Enter the Arena';
    return;
  }
  sessionId = data.id;
  const me = await window.MagicLabGames.getMyParticipant(sessionId);
  participantId = me?.id;

  document.getElementById('arenaTitleLabel').textContent = data.title || '';
  document.getElementById('arenaStatusBar').classList.remove('hidden');

  showState('Waiting');
  poll();
  pollTimer = setInterval(poll, 1200);
}

function renderHistoryStrip() {
  document.getElementById('historyStrip').innerHTML = answerHistory.map(h =>
    `<div class="arena-history-dot ${h ? 'correct' : 'wrong'}">${h ? '✓' : '✗'}</div>`
  ).join('');
}

function recordAnswer(correct) {
  answerHistory.push(correct);
  if (answerHistory.length > 5) answerHistory = answerHistory.slice(-5);
  renderHistoryStrip();
}

async function updateRankBadge() {
  const players = await window.MagicLabGames.getParticipants(sessionId);
  const rank = players.findIndex(p => p.id === participantId) + 1;
  rankAtQuestionStart = rank || null;
  document.getElementById('rankBadge').textContent = rank ? `Going in: #${rank} of ${players.length}` : '';
}

async function poll() {
  try {
    await pollOnce();
  } catch (e) {
    console.warn('[LiveGame] poll error:', e.message);
  }
}

async function pollOnce() {
  if (!sessionId) return;
  const session = await window.MagicLabGames.getSession(sessionId);
  if (!session) return;

  if (session.status === 'lobby') {
    showState('Waiting');
  } else if (session.status === 'question') {
    if (lastAnsweredIndex !== session.current_index) renderQuestion(session);
  } else if (session.status === 'reveal') {
    if (lastAnsweredIndex !== session.current_index) {
      // Time ran out before this player answered.
      document.getElementById('resultIcon').textContent = '⏱️';
      document.getElementById('resultTitle').textContent = "Time's up!";
      document.getElementById('resultTitle').className = 'result-title wrong';
      document.getElementById('resultPoints').textContent = '+0 points';
      lastAnsweredIndex = session.current_index;
      recordAnswer(false);
      const players = await window.MagicLabGames.getParticipants(sessionId);
      const rank = players.findIndex(p => p.id === participantId) + 1;
      document.getElementById('resultRank').textContent = rank
        ? `Now: #${rank} of ${players.length}${rankAtQuestionStart ? ` (was #${rankAtQuestionStart} going in)` : ''}`
        : '';
      showState('Result');
    }
  } else if (session.status === 'ended') {
    await renderEnded();
  }
}

function renderQuestion(session) {
  if (questionStartedLocal === session.current_index) return; // already rendered this one
  questionStartedLocal = session.current_index;
  const q = session.questions_public[session.current_index];
  document.getElementById('qProgress').textContent = `Question ${session.current_index + 1} of ${session.question_count}`;
  document.getElementById('qOpts').innerHTML = q.opts.map((text, i) => `
    <button class="opt-tile c${i % 4}" onclick="onAnswer(${session.current_index}, ${i})">
      <span class="opt-shape">${OPT_ICONS[i % 4]}</span><span>${text}</span>
    </button>`).join('');
  window.__qStart = Date.now();
  updateRankBadge(); // rank as of right now — i.e. before anyone's answered this question
  showState('Question');
}

async function onAnswer(questionIndex, optionIndex) {
  document.querySelectorAll('#qOpts .opt-tile').forEach(el => el.disabled = true);
  const responseMs = Date.now() - (window.__qStart || Date.now());
  showState('Locked');
  const { data, error } = await window.MagicLabGames.submitAnswer(sessionId, questionIndex, optionIndex, responseMs);
  lastAnsweredIndex = questionIndex;
  if (error) return;
  renderResult(data);
}

async function renderResult(result) {
  document.getElementById('resultIcon').textContent = result.correct ? '🎉' : '❌';
  document.getElementById('resultTitle').textContent = result.correct ? 'Correct!' : 'Not quite';
  document.getElementById('resultTitle').className = 'result-title ' + (result.correct ? 'correct' : 'wrong');
  document.getElementById('resultPoints').textContent = `+${result.points} points`;
  recordAnswer(result.correct);

  const players = await window.MagicLabGames.getParticipants(sessionId);
  const rank = players.findIndex(p => p.id === participantId) + 1;
  document.getElementById('resultRank').textContent = rank
    ? `Now: #${rank} of ${players.length}${rankAtQuestionStart ? ` (was #${rankAtQuestionStart} going in)` : ''}`
    : '';
  showState('Result');
}

async function renderEnded() {
  const players = await window.MagicLabGames.getParticipants(sessionId);
  const rank = players.findIndex(p => p.id === participantId) + 1;
  const me = players.find(p => p.id === participantId);
  document.getElementById('finalIcon').textContent = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : '🏁';
  document.getElementById('finalRank').textContent = rank ? `#${rank} of ${players.length}` : 'Arena closed';
  document.getElementById('finalScore').textContent = me ? `${(me.score || 0).toLocaleString()} points` : '';
  showState('Ended');
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}

// Pre-fill code from ?code= query param
document.addEventListener('DOMContentLoaded', () => {
  const code = params.get('code');
  if (code) document.getElementById('codeInput').value = code.toUpperCase();
  document.getElementById('nameInput').addEventListener('keydown', e => { if (e.key === 'Enter') onJoin(); });
});
</script>
  <script src="/contact-button.js" defer></script>
</body>
</html>
