<html lang="en">
<head>
<script src="/assets/theme.js"></script>
<script>document.documentElement.style.visibility='hidden';</script>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080c1a">
<title>Test Tome Versions — The Magic Lab</title>
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@400,500,700,800,900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/magic-lab.css">
<style>
body { font-family: var(--font-display); background: var(--ink-900); color: var(--text); min-height: 100vh; margin: 0; -webkit-font-smoothing: antialiased; }
.v-main { max-width: 1100px; margin: 0 auto; padding: 32px 16px 96px; box-sizing: border-box; }
.v-top { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; margin-bottom: 22px; }
.v-top a { color: var(--text-2); font-size: 14px; text-decoration: none; border: 1px solid var(--line-hard); border-radius: var(--radius-sm); padding: 7px 12px; }
.v-top a:hover { color: var(--paper); }
h1 { font-weight: 900; font-size: clamp(26px, 5vw, 34px); letter-spacing: -0.035em; color: var(--paper); margin: 0 0 8px; }
.v-sub { color: var(--text-2); line-height: 1.6; max-width: 720px; margin: 0 0 28px; }
.v-set { margin: 0 0 36px; }
.v-set h2 { font-size: 20px; color: var(--paper); margin: 0 0 4px; letter-spacing: -0.02em; }
.v-set > p { color: var(--text-3); font-size: 14px; margin: 0 0 12px; }
.v-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--ink-850); }
table { border-collapse: collapse; width: 100%; min-width: 560px; font-size: 14.5px; }
th, td { padding: 9px 14px; text-align: left; border-bottom: 1px solid var(--line-soft); font-variant-numeric: tabular-nums; }
thead th { color: var(--paper); font-weight: 800; white-space: nowrap; }
thead th a { color: inherit; text-decoration: underline; text-underline-offset: 3px; }
tbody th { font-weight: 600; color: var(--text-2); }
tr:last-child th, tr:last-child td { border-bottom: 0; }
tr.v-head th { color: var(--text-3); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; background: var(--ink-900); }
.v-bar { display: inline-block; height: 8px; border-radius: 4px; background: var(--text-3); vertical-align: middle; margin-right: 8px; min-width: 2px; }
.v-note { color: var(--text-3); font-size: 13px; }
#vMsg { color: var(--text-2); }
</style>
</head>
<body>
<main class="v-main" id="main">
  <div class="v-top"><a href="test-tome.html?view=results">← Class results</a><a href="test-tome-results.html">Learner results by version</a></div>
  <h1>Test versions</h1>
  <p class="v-sub">Each exam practice comes in several versions so that learners sitting together do not all have the same paper. This compares them side by side: how long they are, how many marks, and where the marks sit.</p>
  <p id="vMsg">Loading…</p>
  <div id="vSets"></div>
</main>
<script src="auth.js"></script>
<script defer src="require-auth.js"></script>
<script>
(function () {
  'use strict';
  var BASE = 'assets/test-tome/';
  var TOPICS = { html: 'HTML & CSS', excel: 'Excel', ct: 'Computational thinking', java: 'Java (jGRASP)', freecad: 'FreeCAD', tinkercad: 'TinkerCAD & Arduino', other: 'Other' };
  var TYPES = { mcq: 'Multiple choice', tf: 'True / false', match: 'Match A to B', order: 'Put in order', pairs: 'Matching pairs', fill: 'Fill in', scenario: 'Scenario' };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function maxMarks(q) {
    var n = q.type === 'match' || q.type === 'pairs' ? q.pairs.length : q.type === 'order' ? q.steps.length : q.type === 'fill' ? q.blanks.length : 1;
    return q.marks || n;
  }
  // every marked leaf of a test: its marks, topic, skill and type
  function leaves(qz) {
    var out = [];
    qz.sections.forEach(function (sec) {
      sec.questions.forEach(function (q) {
        if (q.type === 'scenario') q.questions.forEach(function (sq) { out.push({ max: maxMarks(sq), topic: sq.topic || q.topic || 'other', skill: sq.skill || 'application', type: sq.type }); });
        else out.push({ max: maxMarks(q), topic: q.topic || 'other', skill: q.skill || 'knowledge', type: q.type });
      });
    });
    return out;
  }
  function sum(a, f) { return a.reduce(function (s, x) { return s + f(x); }, 0); }
  function pct(a, b) { return b ? Math.round(a / b * 100) : 0; }

  function render(sets) {
    $('vMsg').textContent = '';
    $('vSets').innerHTML = sets.map(function (S) {
      var cols = S.versions;
      var topics = {}, types = {};
      cols.forEach(function (v) { v.L.forEach(function (x) { topics[x.topic] = 1; types[x.type] = 1; }); });
      var head = '<tr><th></th>' + cols.map(function (v) { return '<th><a href="test-tome.html?quiz=' + encodeURIComponent(v.id) + '">Version ' + esc(v.version) + '</a></th>'; }).join('') + '</tr>';
      var rows = [];
      function row(label, f) { rows.push('<tr><th scope="row">' + esc(label) + '</th>' + cols.map(function (v) { return '<td>' + f(v) + '</td>'; }).join('') + '</tr>'); }
      function sect(label) { rows.push('<tr class="v-head"><th colspan="' + (cols.length + 1) + '">' + esc(label) + '</th></tr>'); }
      sect('Size');
      row('Marks', function (v) { return sum(v.L, function (x) { return x.max; }); });
      row('Questions', function (v) { return v.L.length; });
      row('Sections', function (v) { return v.q.sections.length; });
      row('Time (minutes)', function (v) { return v.q.minutes; });
      sect('Share of marks by topic');
      Object.keys(topics).forEach(function (k) {
        row(TOPICS[k] || k, function (v) {
          var p = pct(sum(v.L.filter(function (x) { return x.topic === k; }), function (x) { return x.max; }), sum(v.L, function (x) { return x.max; }));
          return '<span class="v-bar" style="width:' + p * 0.9 + 'px"></span>' + p + '%';
        });
      });
      sect('Knowledge and application');
      ['knowledge', 'application'].forEach(function (k) {
        row(k === 'knowledge' ? 'Knowledge' : 'Application', function (v) { return pct(sum(v.L.filter(function (x) { return x.skill === k; }), function (x) { return x.max; }), sum(v.L, function (x) { return x.max; })) + '%'; });
      });
      sect('Question types (number of questions)');
      Object.keys(types).forEach(function (k) { row(TYPES[k] || k, function (v) { return v.L.filter(function (x) { return x.type === k; }).length || '–'; }); });
      return '<section class="v-set"><h2>' + esc(S.title) + '</h2><p>Grade ' + esc(S.grade) + ' · ' + cols.length + ' version' + (cols.length === 1 ? '' : 's') + '</p>' +
        '<div class="v-scroll"><table><thead>' + head + '</thead><tbody>' + rows.join('') + '</tbody></table></div></section>';
    }).join('') + '<p class="v-note">Topic and skill shares are of the marks in each version. Open a version to see or print the paper.</p>';
  }
  function $(id) { return document.getElementById(id); }

  var started = false;
  function start() {
    if (started || !(window.MagicLabAuth && MagicLabAuth.isTeacher)) return;
    started = true;
    if (!MagicLabAuth.isTeacher()) { $('vMsg').textContent = 'This page is for teachers.'; return; }
    fetch(BASE + 'manifest.json', { cache: 'no-cache' }).then(function (r) { return r.json(); }).then(function (m) {
      var ms = (m.quizzes || []).filter(function (x) { return x.set && x.version; });
      return Promise.all(ms.map(function (x) {
        return fetch(BASE + x.file, { cache: 'no-cache' }).then(function (r) { return r.json(); }).then(function (q) { return { id: x.id, set: x.set, version: x.version, grade: x.grade, subject: x.subject, q: q, L: leaves(q) }; });
      }));
    }).then(function (all) {
      var by = {}, order = [];
      all.forEach(function (v) { if (!by[v.set]) { by[v.set] = { set: v.set, grade: v.grade, title: v.subject + ' · Grade ' + v.grade, versions: [] }; order.push(v.set); } by[v.set].versions.push(v); });
      render(order.map(function (k) { by[k].versions.sort(function (a, b) { return a.version < b.version ? -1 : 1; }); return by[k]; }));
    });
  }
  document.addEventListener('magiclab:auth:ready', start);
  document.addEventListener('magiclab:auth:change', start);
  setTimeout(start, 1500);
})();
</script>
</body>
</html>
