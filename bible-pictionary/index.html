<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#14121f">
<title>Bible Pictionary</title>
<link rel="icon" type="image/svg+xml" href="/assets/logo-prism.svg">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3vh; padding: 3vh 16px;
    background: #14121f; color: #f4f1ea;
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  h1 { font-size: clamp(1.6rem, 5vh, 2.8rem); text-align: center; }
  #stage { width: min(960px, 100%); min-height: 56vh; display: flex; flex-direction: column; justify-content: center; }
  #intro { text-align: center; font-size: clamp(1.1rem, 3vh, 1.6rem); color: #b9b4cc; }
  #label { text-align: center; color: #b9b4cc; margin-bottom: 2vh; font-size: 1.2rem; }
  #items { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; list-style: none; }
  .item {
    background: #fffdf7; color: #1d1a2b; border-radius: 18px; border-top: 10px solid var(--c);
    padding: 3vh 16px; text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 1.2vh;
  }
  .item svg { width: clamp(40px, 8vh, 72px); height: auto; color: var(--c); }
  .item small { text-transform: uppercase; letter-spacing: .12em; font-weight: 700; color: var(--c); }
  .item strong { font-size: clamp(1.3rem, 4.6vh, 2.5rem); line-height: 1.15; }
  .covered strong { visibility: hidden; }
  .buttons { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  button {
    font: inherit; font-size: 1.25rem; font-weight: 700; cursor: pointer;
    padding: 14px 34px; border-radius: 999px; border: 2px solid #ffc83d;
    background: #ffc83d; color: #1d1a2b;
  }
  button.quiet { background: transparent; color: #ffc83d; }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .rules { color: #b9b4cc; font-size: 1.1rem; }
  [hidden] { display: none !important; }
  /* Phones: one slim row per item, so the whole card fits without scrolling. */
  @media (max-width: 520px) {
    body { gap: 12px; padding: 10px 12px; }
    h1 { font-size: 1.4rem; }
    #stage { min-height: 0; }
    #label { font-size: .95rem; margin-bottom: 6px; }
    #items { grid-template-columns: 1fr; gap: 8px; }
    .item {
      display: grid; grid-template-columns: 40px 1fr; column-gap: 12px; row-gap: 2px;
      align-content: center; align-items: center; text-align: left;
      min-height: 86px; padding: 8px 12px;
      border-top: 0; border-left: 8px solid var(--c); border-radius: 14px;
    }
    .item svg { grid-row: span 2; width: 40px; height: 40px; }
    .item small { font-size: .72rem; }
    .item strong { font-size: 1.3rem; }
    .buttons { flex-wrap: nowrap; gap: 10px; }
    button { font-size: 1.05rem; padding: 11px 24px; white-space: nowrap; }
    .rules { font-size: .95rem; }
  }
</style>
</head>
<body>
<h1>Bible Pictionary</h1>

<main id="stage" aria-live="polite">
  <p id="intro">Press <b>Pick a card</b>, then choose any one item on it to draw.</p>
  <div id="card" hidden>
    <p id="label"></p>
    <ul id="items"></ul>
  </div>
</main>

<div class="buttons">
  <button id="pick" type="button">Pick a card</button>
  <button id="cover" type="button" class="quiet" hidden>Hide words</button>
</div>

<a class="rules" href="rules/" target="_blank" rel="noopener">How to play</a>

<!-- Category icons -->
<svg hidden xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-person" viewBox="0 0 24 24"><circle cx="12" cy="7" r="4.5"/><path d="M3 22c0-5 4-8.5 9-8.5s9 3.500 9 8.500z"/></symbol>
  <symbol id="i-place" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M12 1.500a8 8 0 0 0-8 8c0 5.500 8 13 8 13s8-7.500 8-13a8 8 0 0 0-8-8zm0 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6z"/></symbol>
  <symbol id="i-event" viewBox="0 0 24 24"><path d="M12 1.500l3.100 6.600 7.200.900-5.300 5 1.400 7.100L12 17.600l-6.400 3.500L7 14 1.700 9l7.200-.900z"/></symbol>
  <symbol id="i-law" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M2 22V7a4.750 4.750 0 0 1 9.500 0v15zm2.500-13h4.500V7.500H4.500zm0 4h4.500v-1.500H4.500zm0 4h4.500v-1.500H4.500zM12.500 22V7A4.750 4.750 0 0 1 22 7v15zM15 9h4.500V7.500H15zm0 4h4.500v-1.500H15zm0 4h4.500v-1.500H15z"/></symbol>
  <symbol id="i-fruit" viewBox="0 0 24 24"><path d="M12 7.500c3-2.500 9-1.500 9 5 0 5-3.500 10-6 10-1.300 0-1.800-.700-3-.700s-1.700.700-3 .700c-2.500 0-6-5-6-10 0-6.500 6-7.500 9-5z"/><path d="M12 6.500c0-3 2-5 5.500-5 0 3-2 5-5.500 5z"/></symbol>
  <symbol id="i-parable" viewBox="0 0 24 24"><path d="M2 4c4-1.5 7-1 9 1v16c-2-1.500-5-2-9-.800zM22 4c-4-1.500-7-1-9 1v16c2-1.500 5-2 9-.800z"/></symbol>
</svg>

<script>
(function () {
  // [person, place, event, commandment] for each card, in card number order.
  // A card ending in FRUIT or PARABLE has that as its fourth item instead.
  var FRUIT = { name: "Fruit of the Spirit", icon: "i-fruit", colour: "#c4264f" };
  var PARABLE = { name: "Parable", icon: "i-parable", colour: "#0e7c86" };
  var CARDS = [
    ["Noah", "Garden of Eden", "The Flood", "Do Not Steal"],
    ["David", "Bethlehem", "David and Goliath", "Honor Parents"],
    ["Moses", "Mount Sinai", "Parting the Red Sea", "Do Not Murder"],
    ["Jonah", "Jerusalem", "The Last Supper", "Sabbath Day"],
    ["Samson", "Mount Ararat", "Walking on Water", "Do Not Lie"],
    ["Adam", "Nazareth", "Feeding the Five Thousand", "The Good Samaritan", PARABLE],
    ["Daniel", "Egypt", "Daniel in the Lions' Den", "The Prodigal Son", PARABLE],
    ["Solomon", "Babylon", "Tower of Babel", "The Lost Sheep", PARABLE],
    ["Esther", "River Jordan", "Nativity", "Do Not Steal"],
    ["Peter", "Sea of Galilee", "Ten Plagues", "Honor Parents"],
    ["Eve", "Mount of Olives", "Jesus Calms the Storm", "Do Not Steal"],
    ["Joseph", "Jericho", "The Burning Bush", "Honor Parents"],
    ["Mary", "The Temple", "Jonah and the Whale", "Do Not Lie"],
    ["Joshua", "The Desert", "The Crucifixion", "Do Not Murder"],
    ["Goliath", "A Stable", "The Baptism of Jesus", "Sabbath Day"],
    ["Abraham", "Noah's Ark", "Baby Moses in the Basket", "Love", FRUIT],
    ["Zacchaeus", "A Well", "The Walls of Jericho Fall", "Joy", FRUIT],
    ["Elijah", "A Prison", "Jesus Heals a Blind Man", "The Mustard Seed", PARABLE],
    ["Ruth", "A Palace", "The Wise Men Follow the Star", "The Sower", PARABLE],
    ["Paul", "The Empty Tomb", "Adam and Eve Eat the Fruit", "Kindness", FRUIT]
  ];
  var TYPES = [
    { name: "Person", icon: "i-person", colour: "#2563c9" },
    { name: "Place", icon: "i-place", colour: "#1f8a4c" },
    { name: "Event", icon: "i-event", colour: "#c2570c" },
    { name: "Commandment", icon: "i-law", colour: "#7b3fbf" }
  ];
  // Demonstration card, shown only at ?example. Never put these words in CARDS.
  var EXAMPLE = ["God", "Heaven", "Creation", "Longsuffering", FRUIT];
  var isExample = new URLSearchParams(location.search).has("example");
  var KEY = "bible-pictionary-v4"; // change when the card list changes

  var pick = document.getElementById("pick");
  var cover = document.getElementById("cover");
  var card = document.getElementById("card");
  var items = document.getElementById("items");

  // Cards still in the deck, and the card on screen. Saved so a refresh keeps them.
  var state = { deck: [], current: null };
  try {
    var saved = JSON.parse(localStorage.getItem(KEY));
    if (saved && Array.isArray(saved.deck)) state = saved;
  } catch (e) {}

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }

  // Every card comes up once before any card repeats.
  function draw() {
    if (!state.deck.length) {
      state.deck = CARDS.map(function (_, i) { return i; });
    }
    // A fresh deck must not start with the card already on screen.
    var choices = state.deck.filter(function (i) { return i !== state.current; });
    state.current = choices[Math.floor(Math.random() * choices.length)];
    state.deck.splice(state.deck.indexOf(state.current), 1);
    save();
    show();
  }

  function show() {
    if (!isExample && !CARDS[state.current]) return;
    var data = isExample ? EXAMPLE : CARDS[state.current];
    items.innerHTML = data.slice(0, 4).map(function (word, i) {
      var t = i === 3 && data[4] ? data[4] : TYPES[i];
      return '<li class="item" style="--c:' + t.colour + '">' +
        '<svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor"><use href="#' + t.icon + '"/></svg>' +
        '<small>' + t.name + '</small><strong>' + word + '</strong></li>';
    }).join("");
    document.getElementById("label").textContent = isExample ? "Example card" : "Card " + (state.current + 1);
    document.getElementById("intro").hidden = true;
    card.hidden = false;
    cover.hidden = false;
    setCovered(false);
    pick.textContent = "Next card";
  }

  function setCovered(on) {
    card.classList.toggle("covered", on);
    cover.textContent = on ? "Show words" : "Hide words";
  }

  pick.addEventListener("click", draw);
  cover.addEventListener("click", function () {
    setCovered(!card.classList.contains("covered"));
  });
  show();
  if (isExample) {
    document.querySelector(".buttons").hidden = true;
    document.querySelector(".rules").hidden = true;
  }
})();
</script>
</body>
</html>
