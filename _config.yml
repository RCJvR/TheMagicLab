# GitHub Pages builds this site with Jekyll. Everything in the repo is
# published unless it is listed here (or starts with "_" or "."), so this
# keeps source-only files in the repo but off the public website:
# database scripts, the Supabase edge-function code, build scripts and
# design mockups. Nothing on the site loads any of them.
exclude:
  - "*.sql"
  - "*.md"
  - "*.py"
  - supabase/
  - scripts/
  - mockups/
