<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="The Magic Lab">
  <title>The Magic Lab</title>
  <defs>
    <clipPath id="r"><rect width="64" height="64" rx="14"/></clipPath>
    <linearGradient id="glass" x1="0" y1="13.00" x2="0" y2="40.71" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="spark">
      <stop offset="0" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#r)">
    <!-- The same neutral ink the site uses, so the mark sits on its own
         ground as a favicon and disappears into the nav bar in place. -->
    <rect width="64" height="64" fill="#08090b"/>

    <!-- Thirteen bands, one per tool, edge to edge. No hairline gaps: at
         favicon size a 1px gap turns the fan to mud. -->
    <g>
    <path fill="#9b6bff" d="M 33.55 33.00 L 64.0 0.00 L 64.0 4.92 Z"/>
    <path fill="#7a7dff" d="M 33.55 33.00 L 64.0 4.92 L 64.0 9.85 Z"/>
    <path fill="#5b93ff" d="M 33.55 33.00 L 64.0 9.85 L 64.0 14.77 Z"/>
    <path fill="#35a6f0" d="M 33.55 33.00 L 64.0 14.77 L 64.0 19.69 Z"/>
    <path fill="#1fb8dc" d="M 33.55 33.00 L 64.0 19.69 L 64.0 24.62 Z"/>
    <path fill="#17c4c0" d="M 33.55 33.00 L 64.0 24.62 L 64.0 29.54 Z"/>
    <path fill="#1fc98e" d="M 33.55 33.00 L 64.0 29.54 L 64.0 34.46 Z"/>
    <path fill="#4acf6b" d="M 33.55 33.00 L 64.0 34.46 L 64.0 39.38 Z"/>
    <path fill="#9ed43c" d="M 33.55 33.00 L 64.0 39.38 L 64.0 44.31 Z"/>
    <path fill="#e8c63a" d="M 33.55 33.00 L 64.0 44.31 L 64.0 49.23 Z"/>
    <path fill="#eda13c" d="M 33.55 33.00 L 64.0 49.23 L 64.0 54.15 Z"/>
    <path fill="#ee7544" d="M 33.55 33.00 L 64.0 54.15 L 64.0 59.08 Z"/>
    <path fill="#ed5c86" d="M 33.55 33.00 L 64.0 59.08 L 64.0 64.00 Z"/>
    </g>

    <!-- White light in, and the refracted ray across the glass. -->
    <path d="M 0 25.50 L 14.78 25.50" stroke="#fff" stroke-width="3.8" stroke-linecap="round" opacity="0.95"/>
    <path d="M 14.78 25.50 L 33.55 33.00" stroke="#fff" stroke-width="2.2" stroke-linecap="round" opacity="0.75"/>

    <!-- The prism itself: an outline with just enough fill to read as glass. -->
    <path d="M 22.00 13.00 L 38.00 40.71 L 6.00 40.71 Z"
          fill="url(#glass)" stroke="#fff" stroke-width="4.0" stroke-linejoin="round" opacity="0.95"/>

    <!-- The exit point, where the spectrum is born. -->
    <circle cx="33.55" cy="33.00" r="5.5" fill="url(#spark)"/>
    <circle cx="33.55" cy="33.00" r="1.5" fill="#fff"/>
  </g>
</svg>
