  <style>
    /* ══════════════════════════════════════════════════════════════════════
       Model Mage — Circuit Simulator.

       Rebuilt and re-enabled 2026-10-20 (parts redrawn, touch input,
       solver fixes); linked again from the Model Mage picker.

       NOT TOUCHED: every wire and component colour in the script below. Red
       for live, black for ground and the rest are electronics convention,
       and they were deliberately corrected on 2026-09-01. Chrome only here.
       ══════════════════════════════════════════════════════════════════════ */
    :root {
      --bg: var(--ink-900); --bg2: var(--ink-850);
      --surface: rgba(255,255,255,0.048); --border: var(--line);
      --text2: var(--text-2); --muted: var(--text-3);
      --accent: var(--t-model); --accent2: var(--t-model);
      --blue:#5b93ff; --green:var(--good); --red:#f5a3a3;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    html,body{height:100%;}
    body{font-family:'Cabinet Grotesk',sans-serif;background:var(--bg);color:var(--text);
         height:100vh;overflow:hidden;display:flex;flex-direction:column;}

    header{flex-shrink:0;background:var(--bg2);border-bottom:1px solid var(--border);
           display:flex;align-items:center;justify-content:space-between;padding:10px 20px;gap:12px;}
    .logo{font-weight:900;font-size:17px;letter-spacing:-0.03em;color:var(--accent2);display:flex;align-items:center;gap:8px;text-decoration:none;flex-shrink:0;}
    .hdr-right{display:flex;align-items:center;gap:6px;}
    .nav-link{background:var(--surface);border:1px solid var(--border);color:var(--text2);
              font-size:0.76rem;font-weight:600;padding:6px 14px;border-radius:99px;
              text-decoration:none;transition:all 120ms;white-space:nowrap;}
    .nav-link:hover{color:var(--text);border-color:var(--text-3);}

    .toolbar{flex-shrink:0;background:rgba(10,15,32,0.95);border-bottom:1px solid var(--border);
             display:flex;padding:8px 10px;}
    /* Parts tray: a sidebar beside the board, so the board keeps the
       height of the screen (it used to sit above the board and take up to
       340px of it). On phones it becomes one sideways-scrolling strip. */
    .parts-panel{width:216px;flex-shrink:0;overflow-y:auto;background:var(--bg2);
                 border-right:1px solid var(--border);padding:10px 8px;
                 display:flex;flex-direction:column;gap:12px;}
    .comp-cat-row{display:flex;flex-direction:column;gap:4px;}
    .comp-cat-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;}
    .toolbar-actions{flex:1;display:flex;align-items:center;gap:6px;}
    .toolbar-actions .examples-sel{flex:0 1 300px;min-width:0;}
    .toolbar-actions .run-btn{margin-left:auto;}
    .examples-sel{height:36px;padding:0 10px;border-radius:8px;border:1px solid var(--border);
              background:var(--surface);color:var(--text);font-size:0.76rem;font-weight:600;
              cursor:pointer;font-family:inherit;}
    .examples-sel:focus:not(:focus-visible){outline:none;border-color:rgba(245,158,11,0.5);}
    .comp-btn{min-height:56px;min-width:0;padding:5px 3px;border-radius:8px;border:1px solid transparent;
            background:none;color:var(--text2);font-size:0.62rem;font-weight:600;line-height:1.15;text-align:center;
            cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
            font-family:inherit;transition:background 100ms,color 100ms;flex-shrink:0;}
    .comp-btn:hover{background:var(--surface);color:var(--text);}
    .comp-btn.active{background:rgba(245,158,11,0.18);color:var(--accent2);border-color:rgba(245,158,11,0.4);}
    .comp-btn .ci{font-size:18px;line-height:1;}
    .tb-sep{width:1px;height:32px;background:var(--border);margin:0 6px;flex-shrink:0;}
    .comp-cat-label{font-size:0.64rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
                    color:var(--accent2);flex-shrink:0;white-space:nowrap;}
    .run-btn{height:36px;padding:0 16px;border-radius:8px;border:none;font-weight:700;font-size:0.8rem;
              cursor:pointer;display:flex;align-items:center;gap:7px;font-family:inherit;flex-shrink:0;}
    .run-btn.go{background:var(--good);color:var(--ink-900);}
    .run-btn.stop{background:var(--crit);color:#fff;}
    .run-btn i{width:14px;height:14px;}

    .main{flex:1;display:flex;overflow:hidden;min-height:0;}
    .canvas-wrap{flex:1;position:relative;overflow:auto;background:#05081a;
                 background-image:radial-gradient(circle,rgba(255,255,255,0.035) 1px,transparent 1px);
                 background-size:20px 20px;}
    #svgScaleBox{position:absolute;top:0;left:0;transform-origin:0 0;}
    #circuit-svg{display:block;cursor:default;transform-origin:0 0;}
    /* Building-tips hint: collapses to a small "?" pill so it never
       parks itself on top of the board — the pill is the only clickable
       part (the rest is decorative, pointer-events:none, so it can
       never eat a tap meant for the canvas underneath it). */
    .canvas-hint{position:absolute;bottom:10px;left:10px;display:flex;align-items:flex-end;gap:8px;
                 max-width:340px;pointer-events:none;}
    .hint-toggle{flex-shrink:0;width:30px;height:30px;border-radius:50%;border:1px solid var(--border);
                 background:rgba(10,15,32,0.92);color:var(--accent2);font-weight:800;font-size:14px;
                 cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;
                 pointer-events:auto;}
    .hint-toggle:hover{background:rgba(255,255,255,.1);}
    .canvas-hint:not(.collapsed) .hint-toggle{background:rgba(245,158,11,0.18);border-color:rgba(245,158,11,0.4);}
    .hint-text{background:rgba(10,15,32,0.9);border:1px solid var(--border);
              border-radius:8px;padding:8px 12px;font-size:0.70rem;color:var(--text2);line-height:1.7;}
    .canvas-hint.collapsed .hint-text{display:none;}
    .hint-text b{color:var(--text);}
    .zoom-controls{position:absolute;bottom:10px;right:10px;display:flex;align-items:center;gap:2px;
                   background:rgba(10,15,32,0.9);border:1px solid var(--border);border-radius:8px;padding:4px;}
    .zoom-btn{width:26px;height:26px;border-radius:6px;border:none;background:var(--surface);color:var(--text);
              font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;}
    .zoom-btn:hover{background:rgba(255,255,255,.14);}
    .zoom-pct{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text2);width:38px;text-align:center;}

    .right-panel{width:300px;flex-shrink:0;display:flex;flex-direction:column;
                 border-left:1px solid var(--border);background:var(--bg2);overflow-y:auto;}
    .panel-sec{padding:14px 16px;border-bottom:1px solid var(--border);}
    .panel-title{font-size:0.68rem;font-weight:700;color:var(--text2);
                 letter-spacing:.09em;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;}
    .prop-row{margin-bottom:9px;}
    .prop-lbl{display:flex;justify-content:space-between;align-items:center;
            font-size:0.76rem;color:var(--text2);margin-bottom:4px;}
    .prop-val{font-family:'JetBrains Mono',monospace;font-size:0.74rem;font-weight:700;color:var(--accent2);}
    input[type=range]{width:100%;accent-color:var(--accent2);}
    select,input[type=number],input[type=text]{width:100%;height:28px;padding:0 8px;border-radius:6px;
             border:1px solid var(--border);background:rgba(255,255,255,0.06);
             color:var(--text);font-family:'JetBrains Mono',monospace;font-size:0.76rem;}
    select:focus:not(:focus-visible),input:focus:not(:focus-visible){outline:none;border-color:rgba(245,158,11,0.5);}
    .empty-hint{font-size:0.76rem;color:var(--muted);line-height:1.7;}
    .del-btn{width:100%;height:30px;border-radius:6px;border:1px solid rgba(239,68,68,0.35);
              background:rgba(239,68,68,0.10);color:#fca5a5;font-size:0.74rem;font-weight:700;
              cursor:pointer;font-family:inherit;margin-top:8px;}
    .del-btn:hover{background:rgba(239,68,68,0.18);}

    #code-editor{width:100%;height:220px;background:#05070f;border:1px solid var(--border);border-radius:8px;
                 color:#d1d5db;font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.6;
                 padding:10px;resize:vertical;outline:none;}
    #code-editor:focus{border-color:rgba(245,158,11,0.5);}
    #serial-out{width:100%;height:90px;background:#05070f;border:1px solid var(--border);border-radius:8px;
                color:#86efac;font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.6;
                padding:8px;overflow-y:auto;white-space:pre-wrap;}
    .code-err{color:#fca5a5;font-size:11px;font-family:'JetBrains Mono',monospace;margin-top:6px;line-height:1.6;white-space:pre-wrap;}
    .mini-btn{height:26px;padding:0 10px;border-radius:6px;border:1px solid var(--border);
              background:var(--surface);color:var(--text2);font-size:0.70rem;font-weight:600;
              cursor:pointer;font-family:inherit;}
    .mini-btn:hover{background:rgba(255,255,255,.08);color:var(--text);}
    .mini-btn.active{background:rgba(245,158,11,0.18);color:var(--accent2);border-color:rgba(245,158,11,0.4);}
    .btn-row{display:flex;gap:6px;margin-top:8px;}
    .panel-close-row{padding:10px 16px 0;flex-shrink:0;}

    /* Text/Block code tabs */
    .code-tabs{display:flex;gap:4px;margin-bottom:8px;}
    .code-tab-btn{flex:1;height:28px;border-radius:6px;border:1px solid var(--border);background:var(--surface);
                 color:var(--text2);font-size:0.72rem;font-weight:700;cursor:pointer;font-family:inherit;}
    .code-tab-btn:hover{color:var(--text);}
    .code-tab-btn.active{background:rgba(245,158,11,0.18);color:var(--accent2);border-color:rgba(245,158,11,0.4);}

    /* Block coding editor */
    .block-section{margin-bottom:10px;}
    .block-section-title{font-size:0.72rem;font-weight:700;color:var(--text2);margin-bottom:6px;
                         display:flex;align-items:baseline;gap:6px;}
    .block-section-hint{font-size:0.64rem;font-weight:500;color:var(--muted);}
    .block-list{display:flex;flex-direction:column;gap:6px;}
    .block-card{background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:8px;padding:8px 10px;}
    .block-card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;gap:6px;}
    .block-type-label{font-size:0.74rem;font-weight:700;color:var(--text);}
    .block-controls{display:flex;gap:3px;flex-shrink:0;}
    .block-mini-btn{width:24px;height:24px;border-radius:5px;border:1px solid var(--border);background:var(--surface);
                    color:var(--text2);font-size:0.68rem;cursor:pointer;font-family:inherit;
                    display:flex;align-items:center;justify-content:center;}
    .block-mini-btn:hover{background:rgba(255,255,255,.1);color:var(--text);}
    .block-fields{display:flex;flex-wrap:wrap;gap:8px;}
    .block-field{display:flex;flex-direction:column;gap:2px;font-size:0.66rem;color:var(--muted);min-width:64px;flex:1;}
    .block-field.wide{flex-basis:100%;}
    .block-field input,.block-field select{height:27px;padding:0 6px;font-size:0.72rem;}
    .block-children{margin-top:8px;padding-left:10px;border-left:2px solid var(--border);
                    display:flex;flex-direction:column;gap:4px;}
    .block-children-label{font-size:0.62rem;font-weight:700;color:var(--muted);text-transform:uppercase;
                          letter-spacing:.05em;margin-top:4px;}
    .block-add-row{margin-top:6px;}
    .block-add-select{width:100%;height:30px;border-radius:6px;border:1px dashed var(--border);background:transparent;
                      color:var(--text2);font-size:0.72rem;font-family:inherit;cursor:pointer;}

    /* Tutorials modal */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;
                   justify-content:center;z-index:100;}
    .modal-box{background:var(--bg2);border:1px solid var(--border);border-radius:16px;width:min(640px,92vw);
               max-height:85vh;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.5);}
    .modal-header{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;
                  border-bottom:1px solid var(--border);flex-shrink:0;}
    .modal-header h2{font-size:16px;font-weight:800;color:#fff;}
    .modal-close{background:none;border:none;color:var(--text2);font-size:16px;cursor:pointer;
                 padding:4px 9px;border-radius:8px;font-family:inherit;}
    .modal-close:hover{background:rgba(255,255,255,.08);color:#fff;}
    .modal-body{padding:20px 22px;overflow-y:auto;}
    .tut-list{display:grid;gap:10px;}
    .tut-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;
             text-align:left;cursor:pointer;color:inherit;display:flex;gap:12px;align-items:flex-start;
             font-family:inherit;width:100%;}
    .tut-card:hover{border-color:var(--accent);background:rgba(245,158,11,.08);}
    .tut-icon{font-size:22px;flex-shrink:0;line-height:1.3;}
    .tut-title{font-weight:700;font-size:14px;color:#fff;margin-bottom:3px;}
    .tut-desc{font-size:12px;color:var(--text2);line-height:1.5;}
    .tut-steps-count{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);margin-top:6px;}
    .tut-back-link{background:none;border:none;color:var(--text2);font-size:12px;cursor:pointer;
                   margin-bottom:14px;padding:0;font-family:inherit;}
    .tut-back-link:hover{color:#fff;}
    .tut-step-progress{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent2);margin-bottom:10px;}
    .tut-step-title{font-size:16px;font-weight:800;color:#fff;margin-bottom:12px;}
    .tut-step-body{font-size:13.5px;color:var(--text2);line-height:1.8;}
    .tut-step-body b{color:#fff;}
    .tut-step-body code{background:rgba(255,255,255,.08);padding:1px 5px;border-radius:4px;
                        font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--accent2);}
    .tut-step-body pre{background:#05070f;border:1px solid var(--border);border-radius:8px;padding:10px 12px;
                       overflow-x:auto;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#d1d5db;margin:10px 0;}
    .tut-step-body ul,.tut-step-body ol{padding-left:20px;margin:8px 0;}
    .tut-footer{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;
               border-top:1px solid var(--border);gap:10px;flex-shrink:0;}
    .tut-btn{padding:8px 16px;border-radius:9px;font-size:12.5px;font-weight:700;cursor:pointer;
            border:1px solid var(--border);background:var(--surface);color:var(--text);font-family:inherit;}
    .tut-btn:hover{background:rgba(255,255,255,.08);}
    .tut-btn.primary{background:var(--paper);border:none;color:var(--ink-900);}
    .tut-btn:disabled{opacity:0.35;cursor:not-allowed;}

    /* SVG component styling */
    .comp-group{cursor:grab;}
    .comp-group.dragging{cursor:grabbing;opacity:0.85;}
    .comp-hit{transition:fill 120ms;}
    .comp-group:hover .comp-hit{fill:rgba(255,255,255,0.035);}
    .sel-outline{fill:none;stroke:var(--accent2);stroke-width:1.5;stroke-dasharray:5 4;pointer-events:none;}
    /* pin terminal: .pin-dot is the large invisible target, .pin-term the
       small visible ring drawn right after it */
    .pin-dot{fill:transparent;cursor:crosshair;}
    .pin-term{fill:#e2e8f0;stroke:#0b1020;stroke-width:1.5;pointer-events:none;transition:r 100ms,fill 100ms;}
    .pin-dot.connected + .pin-term{fill:#34d399;}
    .pin-dot:hover + .pin-term{fill:var(--accent2);r:6px;}
    .pin-dot.wiring-from + .pin-term{fill:var(--accent2);r:6px;}
    .part-text{font-family:'Cabinet Grotesk',system-ui,sans-serif;pointer-events:none;}
    .part-icon{display:block;overflow:visible;}
    .bb-hole{fill:#1a1f33;stroke:#0a0e1f;stroke-width:0.5;cursor:pointer;}
    .bb-hole:hover{fill:#33405c;}
    .bb-hole.bus-highlight{fill:#fbbf24!important;filter:drop-shadow(0 0 3px rgba(251,191,36,0.85));}
    .bb-col-label{font-family:'JetBrains Mono',monospace;fill:#9c9478;text-anchor:middle;pointer-events:none;}
    .bb-row-label{font-family:'JetBrains Mono',monospace;fill:#9c9478;text-anchor:middle;font-weight:700;pointer-events:none;}
    .bb-rail-sym{font-family:'JetBrains Mono',monospace;font-weight:800;text-anchor:middle;pointer-events:none;}
    .wire-line{stroke:#fbbf24;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;fill:none;cursor:pointer;
              filter:drop-shadow(0 1px 1.5px rgba(0,0,0,0.5));}
    .wire-line:hover{stroke:#fff;stroke-width:4.5;}
    .wire-line.selected{stroke:#fff!important;stroke-width:4.5;filter:drop-shadow(0 0 4px rgba(255,255,255,0.7));}
    .wire-preview{stroke:var(--accent2);stroke-width:2;stroke-dasharray:5,4;opacity:0.65;fill:none;pointer-events:none;}
    .placement-ghost{opacity:0.5;pointer-events:none;}
    .sel-handle{fill:#1f2937;stroke:var(--accent2);stroke-width:1.5;cursor:pointer;}
    .sel-handle:hover{fill:var(--accent2);}
    .sel-handle:hover + .sel-handle-icon{fill:#1a1206;}
    .sel-handle-icon{font-size:11px;fill:var(--accent2);text-anchor:middle;font-weight:700;}
    .meter-lcd-text{font-family:'JetBrains Mono',monospace;font-weight:700;fill:#0a2e0a;text-anchor:middle;}
    .meter-unit-badge{font-family:'JetBrains Mono',monospace;font-weight:800;fill:#fff;text-anchor:middle;}
    .callout-text{font-family:'JetBrains Mono',monospace;font-weight:800;fill:#fff;text-anchor:middle;pointer-events:none;}
    .wire-waypoint{fill:#fff;opacity:0.85;pointer-events:none;}
    .comp-label{font-family:'Cabinet Grotesk',system-ui,sans-serif;font-size:11.5px;font-weight:700;fill:#d5dbe6;text-anchor:middle;pointer-events:none;
                paint-order:stroke;stroke:#05081a;stroke-width:3px;stroke-linejoin:round;}
    .comp-label .v{fill:#fbbf24;font-weight:800;}
    .comp-value{font-family:'JetBrains Mono',monospace;font-size:8.5px;fill:var(--accent2);text-anchor:middle;pointer-events:none;font-weight:700;}

    #circuit-svg{touch-action:none;}
    .sim-warnings{position:sticky;top:8px;left:8px;z-index:5;display:flex;flex-direction:column;gap:6px;
                  width:max-content;max-width:min(420px,calc(100% - 16px));height:0;overflow:visible;pointer-events:none;}
    .sim-warn{background:#2a1212;border:1px solid #b45353;color:#fde2e2;border-radius:8px;padding:8px 11px;
              font-size:0.74rem;line-height:1.5;box-shadow:0 6px 18px rgba(0,0,0,.4);}
    .sim-warn b{color:#fff;}

    @media (max-width:820px){
      header{padding:8px 10px;flex-wrap:wrap;row-gap:6px;}
      .hdr-right{flex-wrap:wrap;gap:5px;}
      .main{flex-direction:column;}
      .parts-panel{width:auto;flex-direction:row;overflow-x:auto;overflow-y:hidden;gap:14px;
                   border-right:none;border-bottom:1px solid var(--border);padding:6px 8px;}
      .comp-cat-row{flex-shrink:0;}
      .comp-cat-strip{display:flex;gap:2px;}
      .comp-btn{width:64px;min-height:50px;}
      .right-panel{position:absolute;right:0;top:0;bottom:0;z-index:20;width:min(320px,92vw);
                   box-shadow:-8px 0 24px rgba(0,0,0,0.45);}
    }
      .sr-only { position: absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

<script>
/* ═══════════════════════════════════════════════════════════════
   MODEL MAGE — CIRCUIT SIMULATOR
   Breadboard + component graph, a linear/piecewise-linear MNA
   solver, and an Arduino-flavoured code runner for a simulated
   microcontroller board.
═══════════════════════════════════════════════════════════════ */

const GRID = 24; // px per breadboard hole / grid unit — bumped up from 20 so parts and holes are easier to see and click
// Board width fills whatever the canvas viewport actually has available
// (never fewer columns than the original fixed 40, so existing saved
// circuits built at smaller window sizes still fit).
// Three fixed sizes matching real breadboards (mini/half+/full) rather than
// one board that stretches to fill the window — a size is something you
// pick for the circuit you're building, not something that changes on you
// when the window resizes.
const BOARD_SIZE_COLS = { small:20, medium:30, large:60 };
let breadboardSize = 'medium';
let BOARD_COLS = BOARD_SIZE_COLS[breadboardSize];
const BOARD_ROWS_TOP = 5;   // rows a-e
const BOARD_ROWS_BOT = 5;   // rows f-j
const BOARD_X = 40, BOARD_Y = 140; // top-left of the terminal-strip area in SVG space
const RAIL_GAP = GRID;      // gap between rail rows and the main strip

const svg = document.getElementById('circuit-svg');
const SVGNS = 'http://www.w3.org/2000/svg';
function el(tag, attrs) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

/* ─── zoom: CSS-scale the SVG inside a sized wrapper so canvas-wrap's
   native scrollbars stay correct at any zoom level ─── */
let zoomLevel = 1;
const ZOOM_MIN = 0.4, ZOOM_MAX = 2.5;
function clientToSvgPos(e){
  const r = document.getElementById('svgScaleBox').getBoundingClientRect();
  return { x:(e.clientX-r.left)/zoomLevel, y:(e.clientY-r.top)/zoomLevel };
}
function applyZoomTransform(){
  svg.style.transform = `scale(${zoomLevel})`;
  const box = document.getElementById('svgScaleBox');
  const w = parseFloat(svg.getAttribute('width'))||0, h = parseFloat(svg.getAttribute('height'))||0;
  box.style.width = (w*zoomLevel)+'px';
  box.style.height = (h*zoomLevel)+'px';
}
function setZoom(z){
  zoomLevel = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, z));
  applyZoomTransform();
  const pctEl = document.getElementById('zoomPct');
  if (pctEl) pctEl.textContent = Math.round(zoomLevel*100)+'%';
}

/* ─── right-side panel (component properties + code + serial monitor):
   collapsed by default so the board gets the full screen on phones/
   tablets, opened on demand from the header button or by selecting
   a part/wire on the board ─── */
function isPanelOpen(){
  return document.getElementById('rightPanel').style.display !== 'none';
}
function setPanelOpen(open){
  document.getElementById('rightPanel').style.display = open ? 'flex' : 'none';
  document.getElementById('btn-toggle-panel').classList.toggle('active', open);
}
document.getElementById('btn-toggle-panel').addEventListener('click', ()=> setPanelOpen(!isPanelOpen()));
document.getElementById('btn-panel-close').addEventListener('click', ()=> setPanelOpen(false));
// On phones/tablets the panel is a full overlay that hides the whole board,
// so auto-opening it every time something is selected (which also fires on
// every drag and every tap on empty board space) would fight the user out
// of the canvas. Only auto-open on wide screens where the panel sits beside
// the board instead of on top of it — on narrow screens the user opens it
// on purpose with the header button.
const MOBILE_LAYOUT_QUERY = window.matchMedia('(max-width:820px)');
function autoOpenPanel(){
  if (!MOBILE_LAYOUT_QUERY.matches) setPanelOpen(true);
}

/* the placement/wiring/delete flow is the same tap-or-click gesture on
   any device, but the wording needs to match what's actually on screen —
   there's no dragging, and touch has no Ctrl key or Delete key, so the
   hint on a phone points at the panel's delete button instead. */
function updateCanvasHint(){
  const mobile = MOBILE_LAYOUT_QUERY.matches;
  document.getElementById('hintText').innerHTML = mobile
    ? `<b>How to build:</b> Tap a part in the toolbar, then tap the board to place it. Tap one pin, then another to draw a wire — tap empty board space in between to bend the cable and keep routing tidy. Tap a part or wire, then open the <b>Code</b> panel above to edit or delete it.`
    : `<b>How to build:</b> Click a part in the toolbar, then click the board to place it. Click one pin, then another to draw a wire — click empty board space in between to bend the cable and keep routing tidy (hold Ctrl to snap that bend to horizontal/vertical). Click a part or wire to edit or delete it in the panel, or press Delete on your keyboard.`;
}
updateCanvasHint();
MOBILE_LAYOUT_QUERY.addEventListener('change', updateCanvasHint);

/* Collapsed to a small "?" pill by default so it never sits on top of
   the board — this is especially cramped on a phone screen, which is
   why a phone starts collapsed. Whatever the user picks (open or
   closed) is remembered, overriding that device default next visit. */
const HINT_STORAGE_KEY = 'mm_circuits_hint_open';
function getStoredHintOpen(){
  try { const v = localStorage.getItem(HINT_STORAGE_KEY); return v===null ? null : v==='1'; } catch(_) { return null; }
}
function setStoredHintOpen(open){
  try { localStorage.setItem(HINT_STORAGE_KEY, open ? '1' : '0'); } catch(_) {}
}
let hintOpen = getStoredHintOpen();
if (hintOpen===null) hintOpen = !MOBILE_LAYOUT_QUERY.matches;
function applyHintOpenState(){
  const hint = document.getElementById('canvasHint');
  hint.classList.toggle('collapsed', !hintOpen);
  document.getElementById('hintToggle').textContent = hintOpen ? '✕' : '?';
  document.getElementById('hintToggle').title = hintOpen ? 'Hide building tips' : 'Show building tips';
}
document.getElementById('hintToggle').addEventListener('click', ()=>{
  hintOpen = !hintOpen;
  setStoredHintOpen(hintOpen);
  applyHintOpenState();
});
applyHintOpenState();
// The tips are for an empty board. Once there's a circuit they'd sit on
// top of it, so fold them away (just for now — the "?" brings them back,
// and the student's own choice is still what's remembered).
function foldHintForCircuit(){
  if (hintOpen){ hintOpen = false; applyHintOpenState(); }
}

/* ───────────────────────────────────────────────────────────────
   COMPONENT DEFINITIONS
   Each type defines its footprint (w × h grid units), its pins (dx,dy in
   grid units from the footprint's top-left), default props, an SVG
   renderer and the flags the solver reads.

   Drawing rules, shared by every part so the kit reads as one set:
   - every pin sits on a whole grid point, 0.1" apart like real parts, so
     anything plugs straight into the breadboard
   - flat colours with one dark outline and at most one soft highlight
     (no gloss, no gradients) — clean at any zoom, readable on a projector
   - labels in the page font: the part's name, then its value in amber
   - polarity shown as plain + / − beside the pin it belongs to
   The pin terminals themselves are drawn by renderComponent(), and a
   renderer called with c._icon set (the parts tray) leaves out the text.
─────────────────────────────────────────────────────────────── */
const PART_INK = '#0b1020', PART_LEAD = '#b9c2cf';
function pLead(g, x1,y1,x2,y2, col){ g.appendChild(el('line',{x1,y1,x2,y2,stroke:col||PART_LEAD,'stroke-width':2.4,'stroke-linecap':'round'})); }
function pPath(g, d, col, w){ g.appendChild(el('path',{d, fill:'none', stroke:col||PART_LEAD,'stroke-width':w||2.4,'stroke-linecap':'round','stroke-linejoin':'round'})); }
function pBox(g, x,y,w,h,r, fill, stroke){ const e = el('rect',{x,y,width:w,height:h,rx:r,fill,stroke:stroke===undefined?PART_INK:stroke,'stroke-width':1.3}); g.appendChild(e); return e; }
function pDisc(g, cx,cy,r, fill, stroke){ const e = el('circle',{cx,cy,r,fill,stroke:stroke===undefined?PART_INK:stroke,'stroke-width':1.3}); g.appendChild(e); return e; }
function pShine(g, x,y,w,h,r){ g.appendChild(el('rect',{x:x+2.5,y:y+2,width:Math.max(0,w-5),height:Math.max(0,h*0.3),rx:Math.max(0,r-2),fill:'#fff',opacity:0.1})); }
/* Text on a rotated or mirrored part is turned back upright about its own
   anchor point, so it never reads sideways, upside down or back to front.
   renderComponent() sets uprightFor to the part being drawn. */
let uprightFor = null;
function keepUpright(t, x, y){
  const c = uprightFor; if (!c) return;
  const rot = ((c.rotation||0)%360+360)%360;
  let tf = '';
  if (c.mirrored) tf += `translate(${2*x},0) scale(-1,1) `;
  if (rot) tf += `rotate(${-rot} ${x} ${y})`;
  // rotating about the baseline would shift the text off its spot; pivot on its middle instead
  if (tf) t.setAttribute('transform', tf.replace(`rotate(${-rot} ${x} ${y})`, `rotate(${-rot} ${x} ${y-4})`));
}
function pText(g, x,y, str, size, fill, weight, anchor){
  const t = el('text',{x,y,'font-size':size,fill,'font-weight':weight||700,'text-anchor':anchor||'middle',class:'part-text'});
  t.textContent = str; keepUpright(t, x, y); g.appendChild(t); return t;
}
function partLabel(g, c, cx, y, name, value){
  if (c._icon) return;
  // a part turned on its side shows just its value — a long name would
  // run across its neighbours
  if ((c.rotation||0)%180 && value) name = '';
  const t = el('text',{x:cx, y, class:'comp-label'});
  if (name){ const a = el('tspan',{}); a.textContent = name; t.appendChild(a); }
  if (value!=null && value!==''){ const b = el('tspan',{class:'v', dx:name?5:0}); b.textContent = value; t.appendChild(b); }
  keepUpright(t, cx, y); g.appendChild(t);
}
function pPol(g, c, x, y, sign){
  if (c._icon) return;
  pText(g, x, y+4, sign==='+'?'+':'−', 13, sign==='+'?'#fca5a5':'#93c5fd', 800);
}
/* A cylindrical cell lying on its side: − terminal on the left pin (0,1),
   + terminal (the end with the nub and the coloured band) on the right. */
function drawCell(g, c, o){
  const G = GRID, y = G - o.h/2, len = o.x1-o.x0, bw = len*0.24;
  pLead(g, 0, G, o.x0, G); pLead(g, o.x1+4, G, 4*G, G);
  pBox(g, o.x1, G-o.h*0.22, 4.5, o.h*0.44, 1.5, '#cbd5e1');
  pBox(g, o.x0, y, len, o.h, o.h*0.3, o.body, 'none');
  g.appendChild(el('rect',{x:o.x1-bw, y, width:bw, height:o.h, fill:o.band}));
  pShine(g, o.x0, y, len, o.h, o.h*0.3);
  pBox(g, o.x0, y, len, o.h, o.h*0.3, 'none');
  pText(g, o.x0+(len-bw)/2, G+o.h*0.17, o.text, o.size||11, '#f8fafc', 800);
  pPol(g, c, 7, G-11, '−'); pPol(g, c, 4*G-7, G-11, '+');
}
const LED_PIN_NAMES = [{id:'a', name:'Anode (+), the longer leg'}, {id:'c', name:'Cathode (−), the flat side'}];
/* LED dome, front view: a bullet shape on a rim, tinted by its colour and
   brighter as current flows; a lit LED gets a soft halo the size of its
   brightness (a light source, so the one place a halo belongs). */
function drawLedDome(g, cx, yt, yb, r, col, glow, blown){
  if (glow>0.03 && !blown) g.appendChild(el('circle',{cx, cy:yt+r+2, r:r+5+glow*9, fill:col, opacity:0.12+glow*0.22}));
  const d = `M${cx-r} ${yb} L${cx-r} ${yt+r} A${r} ${r} 0 0 1 ${cx+r} ${yt+r} L${cx+r} ${yb} Z`;
  g.appendChild(el('path',{d, fill:'#151a26'}));
  g.appendChild(el('path',{d, fill:blown?'#3a3a3a':col, opacity:blown?1:0.38+glow*0.62}));
  // the two little lead frames inside the epoxy
  g.appendChild(el('path',{d:`M${cx-3.5} ${yb} L${cx-3.5} ${yt+r+3}`, stroke:'#d1d5db', 'stroke-width':1.4, opacity:0.55}));
  g.appendChild(el('path',{d:`M${cx+3.5} ${yb} L${cx+3.5} ${yt+r+1} L${cx} ${yt+r+3}`, fill:'none', stroke:'#d1d5db', 'stroke-width':1.4, opacity:0.55}));
  g.appendChild(el('path',{d:`M${cx-r+3} ${yb-3} L${cx-r+3} ${yt+r}`, stroke:'#fff', 'stroke-width':2, 'stroke-linecap':'round', opacity:0.28}));
  if (blown) g.appendChild(el('polyline',{points:`${cx-5},${yt+5} ${cx-1},${yt+r} ${cx-3},${yt+r+4} ${cx+4},${yb-3}`, fill:'none', stroke:'#f8fafc', 'stroke-width':1.2}));
  g.appendChild(el('path',{d, fill:'none', stroke:PART_INK, 'stroke-width':1.3}));
  pBox(g, cx-r-2, yb, 2*r+4, 3.5, 1, blown?'#3a3a3a':col);
}

const COMPONENT_DEFS = {
  battery: {
    label:'Battery', w:4, h:2, category:'power',
    pins:[{id:'+', dx:4, dy:1, name:'Positive (+)'},{id:'-', dx:0, dy:1, name:'Negative (−)'}], // + first: the solver reads a source's first pin as +
    defaultProps:{voltage:6},
    props:[{key:'voltage', label:'Voltage (V)', type:'select', options:[1.5,3,4.5,6,9,12]}],
    render(g,c){
      drawCell(g, c, {x0:0.5*GRID, x1:3.4*GRID, h:1.2*GRID, body:'#2b3242', band:'#e0a526', text:`${c.props.voltage} V`, size:12});
      partLabel(g, c, 2*GRID, -2, 'Battery', `${c.props.voltage} V`);
    },
    isSource:true, internalR:0.3,
  },
  batteryAA: {
    label:'AA Cell', w:4, h:2, category:'power',
    pins:[{id:'+', dx:4, dy:1, name:'Positive (+)'},{id:'-', dx:0, dy:1, name:'Negative (−)'}], // + first: the solver reads a source's first pin as +
    defaultProps:{voltage:1.5},
    render(g,c){
      drawCell(g, c, {x0:0.75*GRID, x1:3.2*GRID, h:0.95*GRID, body:'#1f2430', band:'#c2410c', text:'AA', size:10});
      partLabel(g, c, 2*GRID, 2, 'AA cell', '1.5 V');
    },
    isSource:true, internalR:0.2,
  },
  batteryAAA: {
    label:'AAA Cell', w:4, h:2, category:'power',
    pins:[{id:'+', dx:4, dy:1, name:'Positive (+)'},{id:'-', dx:0, dy:1, name:'Negative (−)'}], // + first: the solver reads a source's first pin as +
    defaultProps:{voltage:1.5},
    render(g,c){
      drawCell(g, c, {x0:0.95*GRID, x1:3.05*GRID, h:0.78*GRID, body:'#3b4558', band:'#94a3b8', text:'AAA', size:9});
      partLabel(g, c, 2*GRID, 4, 'AAA cell', '1.5 V');
    },
    isSource:true, internalR:0.35,
  },
  battery9v: {
    label:'9V Battery', w:3, h:3, category:'power',
    pins:[{id:'+', dx:1, dy:0, name:'Positive (+), small round snap'},{id:'-', dx:2, dy:0, name:'Negative (−), large hex snap'}],
    defaultProps:{voltage:9},

/* Multimeter set to volts or amps: yellow case, LCD with the reading in
   digits big enough to read from the back of a classroom, a range dial
   and the red (+) / black (−) probe sockets the two pins come from. */
function drawMeter(g, c, unit){
  const G = GRID;
  pLead(g, G, 3.3*G, G, 4*G, '#ef4444'); pLead(g, 3*G, 3.3*G, 3*G, 4*G, '#64748b');
  pBox(g, 0, 0, 4*G, 3.4*G, 8, '#f2b705');
  pBox(g, 0.2*G, 0.2*G, 3.6*G, 3.0*G, 6, '#1f2430', 'none');
  pBox(g, 0.42*G, 0.42*G, 3.16*G, 1.3*G, 3, '#b9d4a8');
  const reading = c._icon ? (unit==='V'?'1.80V':'19.1mA') : fmtVal(c._reading, unit);
  const t = pText(g, 2*G, 1.38*G, reading, 16, '#14210d', 800);
  t.setAttribute('font-family', "'JetBrains Mono', monospace");
  if (!c._icon) pText(g, 0.6*G, 0.8*G, unit==='V'?'DC V':'DC A', 7, '#3f5232', 800, 'start');
  pDisc(g, 2*G, 2.3*G, 0.42*G, '#3a4256');
  const pa = unit==='V' ? -2.3 : -0.85;
  g.appendChild(el('line',{x1:2*G, y1:2.3*G, x2:2*G+Math.cos(pa)*0.38*G, y2:2.3*G+Math.sin(pa)*0.38*G, stroke:'#f8fafc', 'stroke-width':2.5, 'stroke-linecap':'round'}));
  if (!c._icon){ pText(g, 1.35*G, 1.95*G, 'V', 8, unit==='V'?'#fde68a':'#6b7280', 800); pText(g, 2.65*G, 1.95*G, 'A', 8, unit==='A'?'#fde68a':'#6b7280', 800); }
  pDisc(g, G, 2.9*G, 5.5, '#dc2626'); pDisc(g, 3*G, 2.9*G, 5.5, '#111827', '#64748b');
  pPol(g, c, G-11, 3.75*G, '+'); pPol(g, c, 3*G+11, 3.75*G, '−');
  partLabel(g, c, 2*G, -4, unit==='V'?'Voltmeter':'Ammeter', '');
}

function fmtOhms(v){ return v>=1000 ? (v/1000)+'kΩ' : v+'Ω'; }
function fmtVal(v,unit){
  if (v==null || !isFinite(v)) return '0.00'+unit;
  const av = Math.abs(v);
  if (unit==='A' && av<1) return (v*1000).toFixed(1)+'mA';
  return v.toFixed(2)+unit;
}

/* 4-band resistor colour code, derived from the resistance value so the
   on-screen part matches what a real resistor of that value looks like. */
const BAND_HEX = ['#1c1c1c','#7c4a2d','#dc2626','#f97316','#eab308','#16a34a','#2563eb','#7c3aed','#9ca3af','#f8fafc'];
function resistorBands(ohms){
  let exp = 0, val = ohms;
  while (val >= 100){ val/=10; exp++; }
  val = Math.round(val);
  const d1 = Math.floor(val/10), d2 = val%10;
  return [BAND_HEX[d1]||'#1c1c1c', BAND_HEX[d2]||'#1c1c1c', BAND_HEX[exp]||'#1c1c1c'];
}

/* ═══════════════════════════════════════════════════════════════
   BREADBOARD MODEL
   Each hole belongs to a "bus id" string used for union-find:
   - main strip: `col{n}-top` for rows a-e, `col{n}-bot` for rows f-j
   - rails: `rail-top-pos`, `rail-top-neg`, `rail-bot-pos`, `rail-bot-neg`
═══════════════════════════════════════════════════════════════ */
const boardHoles = []; // {x,y,bus}
// The breadboard is an optional convenience, not a required fixture — a
// circuit can be wired entirely with direct pin-to-pin wires (buildUnionFind
// unions wire endpoints regardless of whether either end is a hole). Toggled
// via the Placement toolbar button and selectable/removable like a part.
// Starts absent: the board should be something you choose to add, not
// something that's just there whether you asked for it or not.
let breadboardPresent = false;
const ROW_LETTERS_TOP = ['a','b','c','d','e'], ROW_LETTERS_BOT = ['f','g','h','i','j'];
/* Single source of truth for the board's vertical layout — buildBreadboard()
   (hole positions) and renderBreadboard() (background/labels/rails) used to
   compute overlapping pieces of this independently, and the two drifted out
   of sync: the background rect ended above the actual bottom rail/labels,
   leaving them stranded in the dark canvas below the board, while the top
   labels sat right on top of the top rail's holes instead of above them. */
function boardLayout(){
  const botY0 = BOARD_Y + BOARD_ROWS_TOP*GRID + RAIL_GAP*1.4;
  const topLabelY = BOARD_Y - 2*GRID - 22;
  const botRail2Y = botY0 + BOARD_ROWS_BOT*GRID + 2*GRID;
  const botLabelY = botRail2Y + 22;
  const bottomY = botLabelY + 14;
  const bgTop = topLabelY - 14;
  return { botY0, topLabelY, botRail2Y, botLabelY, bottomY, bgTop };
}
function buildBreadboard(){
  boardHoles.length = 0;
  if (!breadboardPresent) return BOARD_Y;
  const { botY0, bottomY } = boardLayout();
  const railRows = [
    {dy:-2, bus:'rail-top-pos', color:'#ef4444'},
    {dy:-1, bus:'rail-top-neg', color:'#3b82f6'},
  ];
  railRows.forEach(r=>{
    for (let col=1; col<BOARD_COLS-1; col++){
      if (col % 6 === 0) continue; // grouped in 5s with gaps, like a real rail
      boardHoles.push({x:BOARD_X+col*GRID, y:BOARD_Y+r.dy*GRID, bus:r.bus, rail:true, color:r.color});
    }
  });
  for (let row=0; row<BOARD_ROWS_TOP; row++){
    for (let col=0; col<BOARD_COLS; col++){
      boardHoles.push({x:BOARD_X+col*GRID, y:BOARD_Y+row*GRID, bus:'col'+col+'-top', col, rowLetter:ROW_LETTERS_TOP[row]});
    }
  }
  for (let row=0; row<BOARD_ROWS_BOT; row++){
    for (let col=0; col<BOARD_COLS; col++){
      boardHoles.push({x:BOARD_X+col*GRID, y:botY0+row*GRID, bus:'col'+col+'-bot', col, rowLetter:ROW_LETTERS_BOT[row]});
    }
  }
  const railRows2 = [
    {y:botY0+BOARD_ROWS_BOT*GRID+GRID, bus:'rail-bot-pos', color:'#ef4444'},
    {y:botY0+BOARD_ROWS_BOT*GRID+2*GRID, bus:'rail-bot-neg', color:'#3b82f6'},
  ];
  railRows2.forEach(r=>{
    for (let col=1; col<BOARD_COLS-1; col++){
      if (col % 6 === 0) continue;
      boardHoles.push({x:BOARD_X+col*GRID, y:r.y, bus:r.bus, rail:true, color:r.color});
    }
  });
  return bottomY;
}
let boardBottomY = buildBreadboard();
function toggleBreadboard(){
  breadboardPresent = false;
  boardBottomY = buildBreadboard();
  if (selected==='__breadboard__'){ selected=null; renderPropPanel(); }
  updateBreadboardButtonStates();
  scheduleRender();
}
function setBreadboardSize(size){
  if (breadboardPresent && breadboardSize===size){
    breadboardPresent = false;
  } else {
    breadboardSize = size;
    BOARD_COLS = BOARD_SIZE_COLS[size];
    breadboardPresent = true;
  }
  boardBottomY = buildBreadboard();
  if (!breadboardPresent && selected==='__breadboard__'){ selected=null; renderPropPanel(); }
  updateBreadboardButtonStates();
  scheduleRender();
}
function updateBreadboardButtonStates(){
  ['small','medium','large'].forEach(size=>{
    const btn = document.getElementById('btn-breadboard-'+size);
    if (btn) btn.classList.toggle('active', breadboardPresent && breadboardSize===size);
  });
}

function nearestHole(x,y){
  let best=null, bd=Infinity;
  for (const h of boardHoles){
    const d = (h.x-x)**2 + (h.y-y)**2;
    if (d<bd){ bd=d; best=h; }
  }
  return bd < (GRID*0.55)**2 ? best : null;
}
