let tutState = { tutorial:null, step:0 };
function openTutorials(){
  tutState = { tutorial:null, step:0 };
  renderTutorialModal();
  document.getElementById('tutorialOverlay').style.display = 'flex';
}
function closeTutorials(){ document.getElementById('tutorialOverlay').style.display = 'none'; }
document.getElementById('btn-tutorials').addEventListener('click', openTutorials);
document.getElementById('tutorialClose').addEventListener('click', closeTutorials);
document.getElementById('tutorialOverlay').addEventListener('click', (e)=>{ if (e.target.id==='tutorialOverlay') closeTutorials(); });

function renderTutorialModal(){
  const body = document.getElementById('tutorialModalBody');
  const titleEl = document.getElementById('tutorialModalTitle');
  const footer = document.getElementById('tutorialFooter');
  if (!tutState.tutorial){
    titleEl.textContent = 'Tutorials';
    footer.style.display = 'none';
    body.innerHTML = '<div class="tut-list">' + TUTORIALS.map((t,i)=>`
      <button class="tut-card" data-idx="${i}">
        <span class="tut-icon">${t.icon}</span>
        <span>
          <div class="tut-title">${t.title}</div>
          <div class="tut-desc">${t.desc}</div>
          <div class="tut-steps-count">${t.steps.length} steps</div>
        </span>
      </button>`).join('') + '</div>';
    body.querySelectorAll('.tut-card').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        tutState = { tutorial: TUTORIALS[+btn.dataset.idx], step:0 };
        renderTutorialModal();
      });
    });
    return;
  }
  const t = tutState.tutorial, s = t.steps[tutState.step];
  titleEl.textContent = t.icon + ' ' + t.title;
  footer.style.display = 'flex';
  body.innerHTML = `
    <button class="tut-back-link" id="tutBackToList">← All tutorials</button>
    <div class="tut-step-progress">STEP ${tutState.step+1} OF ${t.steps.length}</div>
    <div class="tut-step-title">${s.title}</div>
    <div class="tut-step-body">${s.body}</div>
  `;
  document.getElementById('tutBackToList').addEventListener('click', ()=>{ tutState = {tutorial:null, step:0}; renderTutorialModal(); });
  document.getElementById('tutPrev').disabled = tutState.step===0;
  document.getElementById('tutNext').style.display = tutState.step < t.steps.length-1 ? '' : 'none';
  document.getElementById('tutFinish').style.display = tutState.step === t.steps.length-1 ? '' : 'none';
}
document.getElementById('tutPrev').addEventListener('click', ()=>{
  if (tutState.tutorial && tutState.step>0){ tutState.step--; renderTutorialModal(); }
});
document.getElementById('tutNext').addEventListener('click', ()=>{
  if (tutState.tutorial && tutState.step < tutState.tutorial.steps.length-1){ tutState.step++; renderTutorialModal(); }
});
document.getElementById('tutFinish').addEventListener('click', closeTutorials);
document.getElementById('tutSolution').addEventListener('click', ()=>{
  if (!tutState.tutorial) return;
  if (components.length && !confirm('Load the finished circuit for this tutorial? It will replace what\'s currently on the board.')) return;
  loadCircuitData(tutState.tutorial.solution, {builtIn:true});
  closeTutorials();
});

/* Extent of everything drawn: parts (with room for their labels), wire
   bends and hole ends, and the breadboard if includeBoard. */
function contentBounds(includeBoard){
  let x0=Infinity, y0=Infinity, x1=-Infinity, y1=-Infinity;
  const add = (x,y)=>{ x0=Math.min(x0,x); y0=Math.min(y0,y); x1=Math.max(x1,x); y1=Math.max(y1,y); };
  for (const c of components){
    const def = COMPONENT_DEFS[c.type]; if (!def) continue;
    const w = def.w*GRID, h = def.h*GRID, r = Math.max(w,h)/2, cx = c.x+w/2, cy = c.y+h/2;
    const rot = ((c.rotation||0)%180+180)%180;
    const hw = rot ? r : w/2, hh = rot ? r : h/2;
    add(cx-hw-14, cy-hh-22); add(cx+hw+14, cy+hh+14);
  }
  for (const w of wires){
    [w.from, w.to].forEach(end=>{ if (end.kind==='hole') add(end.x, end.y); });
    (w.waypoints||[]).forEach(p=>add(p.x,p.y));
  }
  if (includeBoard && breadboardPresent){ add(BOARD_X-30, BOARD_Y-80); add(BOARD_X+BOARD_COLS*GRID+30, boardBottomY+40); }
  return isFinite(x0) ? {x0,y0,x1,y1} : null;
}
/* Zoom and scroll so the whole circuit is in view — loaded circuits used to
   open scrolled to the top-left corner, often with nothing visible at all. */
function fitToContent(){
  renderAll();
  const b = contentBounds(true); if (!b) return;
  const wrap = document.getElementById('canvasWrap');
  const pad = 30, bw = b.x1-b.x0, bh = b.y1-b.y0;
  const z = Math.min(1.6, (wrap.clientWidth-2*pad)/bw, (wrap.clientHeight-2*pad)/bh);
  setZoom(z);
  wrap.scrollLeft = Math.max(0, b.x0*zoomLevel - Math.max(pad, (wrap.clientWidth-bw*zoomLevel)/2));
  wrap.scrollTop = Math.max(0, b.y0*zoomLevel - Math.max(pad, (wrap.clientHeight-bh*zoomLevel)/2));
}

/* The built-in circuits are stored as pin-to-pin wires with no bends.
   Route each one on a half-grid: the path with the fewest bends that goes
   around every part and every other pin, and that keeps off wires already
   laid where it can. */
function routeAroundParts(){
  const step = GRID/2;
  const boxes = components.map(c=>contentBoundsOf(c, COMPONENT_DEFS[c.type]));
  const pins = [];
  components.forEach(c=>COMPONENT_DEFS[c.type].pins.forEach(pin=>pins.push(pinWorldPos(c, pin.id))));
  const ext = contentBounds(false);
  const gx0 = Math.floor((ext.x0-BOARD_X)/step)-6, gy0 = Math.floor((ext.y0-BOARD_Y)/step)-6;
  const W = Math.ceil((ext.x1-ext.x0)/step)+14, H = Math.ceil((ext.y1-ext.y0)/step)+14;
  const toXY = (i,j)=>({x:BOARD_X+(gx0+i)*step, y:BOARD_Y+(gy0+j)*step});
  const toIJ = p=>[Math.round((p.x-BOARD_X)/step)-gx0, Math.round((p.y-BOARD_Y)/step)-gy0];
  const blocked = new Uint8Array(W*H), used = new Uint8Array(W*H);
  for (let i=0;i<W;i++) for (let j=0;j<H;j++){
    const {x,y} = toXY(i,j);
    if (boxes.some(b=>x>b.x0-2 && x<b.x1+2 && y>b.y0-2 && y<b.y1+2)) blocked[j*W+i] = 1;
  }
  pins.forEach(pp=>{ const [i,j] = toIJ(pp); if (i>=0&&j>=0&&i<W&&j<H) blocked[j*W+i] = 1; });
  const DIRS = [[1,0],[-1,0],[0,1],[0,-1]];
  function route(p1, p2){
    const [si,sj] = toIJ(p1), [ti,tj] = toIJ(p2);
    const N = W*H*4, cost = new Float64Array(N).fill(Infinity), prev = new Int32Array(N).fill(-1);
    const heap = [];
    const push = (c,s)=>{ heap.push([c,s]); let k=heap.length-1; while(k>0){ const q=(k-1)>>1; if(heap[q][0]<=heap[k][0]) break; [heap[q],heap[k]]=[heap[k],heap[q]]; k=q; } };
    const pop = ()=>{ const top=heap[0], last=heap.pop(); if(heap.length){ heap[0]=last; let k=0; for(;;){ const a=2*k+1,b=a+1; let m=k; if(a<heap.length&&heap[a][0]<heap[m][0]) m=a; if(b<heap.length&&heap[b][0]<heap[m][0]) m=b; if(m===k) break; [heap[m],heap[k]]=[heap[k],heap[m]]; k=m; } } return top; };
    for (let d=0;d<4;d++){ const st=(sj*W+si)*4+d; cost[st]=0; push(0,st); }
    let goal = -1;
    while (heap.length){
      const [c,st] = pop();
      if (c>cost[st]) continue;
      const cell = st>>2, d = st&3, i = cell%W, j = (cell/W)|0;
      if (i===ti && j===tj){ goal = st; break; }
      for (let nd=0;nd<4;nd++){
        const ni = i+DIRS[nd][0], nj = j+DIRS[nd][1];
        if (ni<0||nj<0||ni>=W||nj>=H) continue;
        const ncell = nj*W+ni;
        if (blocked[ncell] && !(ni===ti && nj===tj)) continue;
        const nc = c + 1 + (nd!==d && !(i===si&&j===sj) ? 6 : 0) + (used[ncell] ? 4 : 0);
        const ns = ncell*4+nd;
        if (nc < cost[ns]){ cost[ns] = nc; prev[ns] = st; push(nc, ns); }
      }
    }
    if (goal<0) return null;
    const cells = [];
    for (let st=goal; st>=0; st=prev[st]) cells.push(st>>2);
    cells.reverse();
    cells.forEach(cl=>used[cl]=1);
    // keep only the corners
    const pts = cells.map(cl=>toXY(cl%W, (cl/W)|0));
    const corners = [];
    for (let k=1;k<pts.length-1;k++){
      const a=pts[k-1], b=pts[k], c=pts[k+1];
      if ((a.x===b.x) !== (b.x===c.x)) corners.push(b);
    }
    return corners;
  }
  for (const w of wires){
    if (w.waypoints && w.waypoints.length) continue;
    const p1 = wireEndpointPos(w.from), p2 = wireEndpointPos(w.to);
    if (!p1 || !p2) continue;
    const r = route(p1, p2);
    if (r) w.waypoints = r;
  }
}
function contentBoundsOf(c, def){
  const w = def.w*GRID, h = def.h*GRID, cx = c.x+w/2, cy = c.y+h/2;
  const rot = ((c.rotation||0)%180+180)%180;
  const hw = rot ? h/2 : w/2, hh = rot ? w/2 : h/2;
  return {x0:cx-hw, y0:cy-hh, x1:cx+hw, y1:cy+hh};
}

function loadCircuitData(data, opts){
  // work on a copy: the built-in examples and tutorial solutions must stay
  // as written, however the student then changes the loaded circuit
  data = JSON.parse(JSON.stringify(data));
  if (running) document.getElementById('btn-run').click();
  components = data.components||[];
  let maxId = 0;
  components.forEach(c=>{ const n=parseInt(c.id.slice(1)); if(n>maxId) maxId=n; });
  nextId = maxId+1;
  wires = data.wires||[];
  wires.forEach((w,i)=>{ if (!w.color) w.color = DEFAULT_WIRE_PALETTE[i % DEFAULT_WIRE_PALETTE.length]; });
  if (opts && opts.builtIn){
    const b = contentBounds(false);
    if (b){
      const dx = b.x0 < 30 ? Math.ceil((30-b.x0)/GRID)*GRID : 0, dy = b.y0 < 40 ? Math.ceil((40-b.y0)/GRID)*GRID : 0;
      components.forEach(c=>{ c.x += dx; c.y += dy; });
    }
    routeAroundParts();
  }
  document.getElementById('code-editor').value = data.code || '';
  blockProgram = data.blockProgram || defaultBlockProgram();
  const st = {max:0}; scanMaxBlockId(blockProgram.setup, st); scanMaxBlockId(blockProgram.loop, st);
  blockSeq = st.max+1;
  setCodeMode(data.codeMode==='blocks' ? 'blocks' : 'text');
  document.getElementById('serial-out').textContent = '';
  document.getElementById('codeErr').textContent = '';
  selected = null;
  renderPropPanel();
  foldHintForCircuit();
  fitToContent();
}

document.getElementById('btn-load').addEventListener('click', ()=>document.getElementById('file-load').click());
document.getElementById('file-load').addEventListener('change', (e)=>{
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try { loadCircuitData(JSON.parse(reader.result)); }
    catch(err){ alert('Could not read that file.'); }
  };
  reader.readAsText(file);
});
document.getElementById('btn-clear').addEventListener('click', ()=>{
  if (!confirm('Clear the whole board?')) return;
  components = []; wires = []; selected = null;
  scheduleRender(); renderPropPanel();
});
