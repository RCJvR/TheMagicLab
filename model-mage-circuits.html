let simTimer = null;
// Rotation used to auto-colour new wires (see finishWire) — ordered so
// neighbouring wires in a typical build read as distinct at a glance
// against both the cream breadboard and the dark canvas.
const DEFAULT_WIRE_PALETTE = ['#ef4444','#3b82f6','#22c55e','#f97316','#a855f7','#eab308','#f8fafc','#9ca3af'];
let wiringFrom = null; // {kind:'pin'|'hole', compId, pinId, x, y}
let wiringWaypoints = []; // confirmed bend points {x,y} for the wire in progress
let liveMousePos = null;  // current mouse position (SVG space) while wiring, for the rubber-band preview
let liveMouseCtrl = false; // was Ctrl held at that mouse position (axis-lock)

function newId(){ return 'c'+(nextId++); }

/* Rotation/mirror are applied in local (unplaced) space in a fixed order —
   mirror first, then rotate — around the component's own bounding-box
   centre. The SVG render transform on the component's <g> (see
   renderComponent) applies the exact same order so the clickable pin-dots
   (drawn in local coordinates, rotated by the browser) land exactly on
   top of the logical positions computed here. */
function localPinPos(def, pin, rotation, mirrored){
  const w = def.w*GRID, h = def.h*GRID, cx = w/2, cy = h/2;
  let px = pin.dx*GRID, py = pin.dy*GRID;
  if (mirrored) px = 2*cx - px;
  const rot = ((rotation||0)%360+360)%360;
  if (rot===90){ const rx=px-cx, ry=py-cy; px = cx-ry; py = cy+rx; }
  else if (rot===180){ px = 2*cx-px; py = 2*cy-py; }
  else if (rot===270){ const rx=px-cx, ry=py-cy; px = cx+ry; py = cy-rx; }
  return { x:px, y:py };
}
function pinWorldPos(comp, pinId){
  const def = COMPONENT_DEFS[comp.type];
  const pin = def.pins.find(p=>p.id===pinId);
  const local = localPinPos(def, pin, comp.rotation, comp.mirrored);
  return { x: comp.x + local.x, y: comp.y + local.y };
}

/* ─── connection key helpers ─── */
function pinKey(compId, pinId){ return 'p:'+compId+':'+pinId; }
function holeKey(hole){ return 'h:'+hole.x+','+hole.y; }

/* ═══════════════════════════════════════════════════════════════
   RENDERING
═══════════════════════════════════════════════════════════════ */
function renderAll(){
  svg.innerHTML = '';
  svg.appendChild(componentDefs());
  const totalW = BOARD_X*2 + BOARD_COLS*GRID;
  const totalH = boardBottomY + 220;
  // grow with the circuit, so parts placed or loaded low down or far right
  // are never clipped off the edge of the drawing
  const ext = contentBounds(false);
  svg.setAttribute('width', Math.max(totalW, 1100, ext ? ext.x1+240 : 0));
  svg.setAttribute('height', Math.max(totalH, 700, ext ? ext.y1+240 : 0));

  if (breadboardPresent) renderBreadboard();

  for (const w of wires) renderWire(w);
  for (const c of components) renderComponent(c);
  updatePinConnectionStyles();
  renderWirePreview();
  renderPlacementGhost();
  applyZoomTransform();
}

/* Translucent preview of the part about to be placed, following the mouse
   — so you can see exactly where it'll land (and that it's snapped to the
   grid) before committing, instead of clicking blind. */
function renderPlacementGhost(){
  if (!placingType || !placingPreviewPos) return;
  const def = COMPONENT_DEFS[placingType];
  const ghost = el('g',{class:'placement-ghost', transform:`translate(${placingPreviewPos.x},${placingPreviewPos.y})`});
  def.render(ghost, { id:'ghost', x:placingPreviewPos.x, y:placingPreviewPos.y, props:JSON.parse(JSON.stringify(def.defaultProps)) });
  svg.appendChild(ghost);
}

/* Realistic breadboard: cream perforated body, a centre trench between the
   two 5-row strips (real boards have a physical gap there so DIP chips can
   straddle it), printed column numbers/row letters, and continuous red/blue
   rail stripes with +/- end markers — modelled on an actual half+ breadboard
   rather than an abstract dot grid. Hovering any hole highlights every other
   hole on the same strip/rail, since that's the part that's easy to
   misjudge by eye (which holes are actually the same electrical node). */
function renderBreadboard(){
  const { botY0, topLabelY, botLabelY, bgTop } = boardLayout();
  const bgW = BOARD_COLS*GRID + 20, bgH = (boardBottomY + 10) - bgTop;
  const boardBg = rect(BOARD_X-30, bgTop, bgW, bgH, 10, '#ece7d8');
  boardBg.setAttribute('class', 'board-bg');
  boardBg.addEventListener('click', (e)=>{ e.stopPropagation(); selectComponent('__breadboard__'); });
  svg.appendChild(boardBg);

  const trenchY = BOARD_Y+BOARD_ROWS_TOP*GRID+RAIL_GAP*0.7;
  svg.appendChild(rect(BOARD_X-20, trenchY-3, BOARD_COLS*GRID+10, 6, 2, '#d8d2bd'));
  svg.appendChild(el('line',{x1:BOARD_X-20,y1:trenchY,x2:BOARD_X+BOARD_COLS*GRID+10,y2:trenchY,stroke:'#b8b09a','stroke-width':1}));

  for (let col=5; col<BOARD_COLS; col+=5){
    svg.appendChild(text(BOARD_X+col*GRID, topLabelY, String(col), 'bb-col-label', 7));
    svg.appendChild(text(BOARD_X+col*GRID, botLabelY, String(col), 'bb-col-label', 7));
  }
  ROW_LETTERS_TOP.forEach((letter,i)=> svg.appendChild(text(BOARD_X-14, BOARD_Y+i*GRID+3, letter, 'bb-row-label', 7)));
  ROW_LETTERS_BOT.forEach((letter,i)=> svg.appendChild(text(BOARD_X-14, botY0+i*GRID+3, letter, 'bb-row-label', 7)));

  const railStripes = [
    {y:BOARD_Y-2*GRID, color:'#dc2626', sym:'+'},
    {y:BOARD_Y-1*GRID, color:'#2563eb', sym:'–'},
    {y:botY0+BOARD_ROWS_BOT*GRID+GRID, color:'#dc2626', sym:'+'},
    {y:botY0+BOARD_ROWS_BOT*GRID+2*GRID, color:'#2563eb', sym:'–'},
  ];
  railStripes.forEach(r=>{
    svg.appendChild(el('line',{x1:BOARD_X-10,y1:r.y,x2:BOARD_X+BOARD_COLS*GRID,y2:r.y,stroke:r.color,'stroke-width':1.5,opacity:0.55}));
    const sym = text(BOARD_X-22, r.y+3, r.sym, 'bb-rail-sym', 9);
    sym.setAttribute('fill', r.color);
    svg.appendChild(sym);
  });

  for (const h of boardHoles){
    const c = el('circle',{cx:h.x, cy:h.y, r:4, class:'bb-hole'});
    if (h.rail) c.setAttribute('fill', h.color+'55');
    c.dataset.bus = h.bus;
    c.addEventListener('click', (e)=>{ e.stopPropagation(); onHoleClick(h); });
    c.addEventListener('mouseenter', ()=>highlightBus(h.bus, true));
    c.addEventListener('mouseleave', ()=>highlightBus(h.bus, false));
    svg.appendChild(c);
  }
}
function highlightBus(bus, on){
  svg.querySelectorAll(`.bb-hole[data-bus="${CSS.escape(bus)}"]`).forEach(hole=>hole.classList.toggle('bus-highlight', on));
}

function renderWire(w){
  const p1 = wireEndpointPos(w.from), p2 = wireEndpointPos(w.to);
  if (!p1||!p2) return;
  const pts = [p1, ...(w.waypoints||[]), p2];
  const d = 'M'+pts.map(p=>`${p.x},${p.y}`).join(' L ');
  const path = el('path',{d, class:'wire-line'+(selectedWireId===w.id?' selected':'')});
  if (w.color) path.setAttribute('style', `stroke:${w.color}`);
  path.addEventListener('click', (e)=>{
    e.stopPropagation();
    selectedWireId = w.id; selected = null;
    autoOpenPanel();
    renderPropPanel(); scheduleRender();
  });
  svg.appendChild(path);
}

/* live rubber-band preview while a wire is being drawn: dashed line from
   the starting pin through any confirmed bend points to the current mouse
   position, so the student can see the cable's path before committing it */
function renderWirePreview(){
  if (!wiringFrom) return;
  const pts = [{x:wiringFrom.x,y:wiringFrom.y}, ...wiringWaypoints];
  pts.forEach((p,i)=>{ if (i>0) svg.appendChild(el('circle',{cx:p.x,cy:p.y,r:3,class:'wire-waypoint'})); });
  if (liveMousePos){
    const origin = pts[pts.length-1];
    let lp = liveMousePos;
    if (liveMouseCtrl){
      const dx = Math.abs(lp.x-origin.x), dy = Math.abs(lp.y-origin.y);
      lp = dx>dy ? {x:lp.x, y:origin.y} : {x:origin.x, y:lp.y};
    }
    pts.push(lp);
  }
  const d = 'M'+pts.map(p=>`${p.x},${p.y}`).join(' L ');
  svg.appendChild(el('path',{d, class:'wire-preview'}));
}
function wireEndpointPos(end){
  if (end.kind==='hole') return {x:end.x, y:end.y};
  const comp = components.find(c=>c.id===end.compId);
  if (!comp) return null;
  return pinWorldPos(comp, end.pinId);
}

function componentTransform(c, def){
  const w = def.w*GRID, h = def.h*GRID, cx = w/2, cy = h/2;
  let tf = `translate(${c.x},${c.y})`;
  if (c.rotation) tf += ` rotate(${c.rotation},${cx},${cy})`;
  if (c.mirrored) tf += ` translate(${2*cx},0) scale(-1,1)`;
  return tf;
}
function renderComponent(c){
  const def = COMPONENT_DEFS[c.type];
  const g = el('g',{class:'comp-group'+(selected===c.id?' selected':''), transform:componentTransform(c, def)});
  g.dataset.id = c.id;
  // the whole footprint is clickable, not just the painted strokes — gaps
  // in a drawing (between a switch's housing and paddle) are easy to miss
  // with a finger
  g.appendChild(el('rect',{x:0, y:0, width:def.w*GRID, height:def.h*GRID, fill:'transparent', class:'comp-hit'}));
  const bodyWrap = el('g',{class:'comp-body'});
  uprightFor = c;
  try { def.render(bodyWrap, c); } finally { uprightFor = null; }
  g.appendChild(bodyWrap);

  if (selected===c.id) g.appendChild(el('rect',{x:-7, y:-7, width:def.w*GRID+14, height:def.h*GRID+14, rx:6, class:'sel-outline'}));

  // Pin terminal: a small ring that doesn't bury the drawing, sitting on a
  // much larger invisible target so it's easy to hit with a finger. The
  // tooltip names the pin (anode, collector, D13 ...).
  for (const pin of def.pins){
    const cx = pin.dx*GRID, cy = pin.dy*GRID;
    const dot = el('circle',{cx, cy, r:10, class:'pin-dot'});
    dot.dataset.pin = pin.id;
    if (wiringFrom && wiringFrom.kind==='pin' && wiringFrom.compId===c.id && wiringFrom.pinId===pin.id) dot.classList.add('wiring-from');
    const tip = el('title',{}); tip.textContent = pin.name || pin.id; dot.appendChild(tip);
    dot.addEventListener('click', (e)=>{ e.stopPropagation(); onPinClick(c.id, pin.id); });
    g.appendChild(dot);
    g.appendChild(el('circle',{cx, cy, r:4, class:'pin-term'}));
  }

  // Pointer events so mouse, pen and touch all drag, press and toggle the
  // same way. A press that doesn't move counts as a click (the switch
  // toggles), and a push button is held only while the pointer is down —
  // both handled in startDrag's release, not with per-render listeners.
  g.addEventListener('pointerdown', (e)=>{
    if (e.target.classList.contains('pin-dot')) return;
    if (e.button>0) return;
    e.stopPropagation();
    selectComponent(c.id);
    if (def.onDown) { def.onDown(c); scheduleRender(); }
    startDrag(c, e);
  });

  svg.appendChild(g);
  c._el = g;

  if (selected===c.id) renderSelectionHandles(c, def);
}

/* Word-style selection handles: a rotate "wand" above the component and a
   mirror button beside it. Positioned in world space using the component's
   centre (which rotation pivots around, so it doesn't move) and its
   post-rotation bounding box (width/height swap at 90°/270°). Each click
   steps in fixed 90° increments / flips — matches the R/M keyboard
   shortcuts so there's one mental model, not a free-drag angle to fight
   with pins that only really make sense at 0/90/180/270. */
function renderSelectionHandles(c, def){
  const w = def.w*GRID, h = def.h*GRID;
  const rot = ((c.rotation||0)%360+360)%360;
  const effW = (rot===90||rot===270) ? h : w, effH = (rot===90||rot===270) ? w : h;
  const worldCx = c.x + w/2, worldCy = c.y + h/2;
  const topY = worldCy - effH/2;
  const handleY = topY - 26;

  const g = el('g',{class:'selection-handles'});
  g.appendChild(line(worldCx, topY-4, worldCx, handleY+9, 'rgba(255,255,255,0.55)', 1.4));
  const rotHandle = el('circle',{cx:worldCx, cy:handleY, r:9, class:'sel-handle rotate-handle'});
  const rotIcon = text(worldCx, handleY+3.5, '⟳', 'sel-handle-icon', 11);
  rotHandle.addEventListener('click', (e)=>{ e.stopPropagation(); c.rotation = ((c.rotation||0)+90)%360; scheduleRender(); });
  rotIcon.style.pointerEvents = 'none';
  g.appendChild(rotHandle); g.appendChild(rotIcon);

  const mirrorX = worldCx + effW/2 + 16, mirrorY = worldCy;
  const mirrorHandle = el('circle',{cx:mirrorX, cy:mirrorY, r:9, class:'sel-handle mirror-handle'});
  const mirrorIcon = text(mirrorX, mirrorY+3.5, '⇋', 'sel-handle-icon', 10);
  mirrorHandle.addEventListener('click', (e)=>{ e.stopPropagation(); c.mirrored = !c.mirrored; scheduleRender(); });
  mirrorIcon.style.pointerEvents = 'none';
  g.appendChild(mirrorHandle); g.appendChild(mirrorIcon);

  svg.appendChild(g);
}

function updatePinConnectionStyles(){
  const uf = buildUnionFind();
  svg.querySelectorAll('.pin-dot').forEach(dot=>{
    const g = dot.closest('.comp-group');
    if (!g) return;
    const compId = g.dataset.id, pinId = dot.dataset.pin;
    const root = uf.find(pinKey(compId,pinId));
    const connected = uf.groupSize(root) > 1;
    dot.classList.toggle('connected', connected);
  });
}

let renderScheduled = false;
// Every render rebuilds the SVG, and while the simulation runs that's 50
// times a second. A browser only fires "click" when press and release land
// on the same element, so a rebuild between the two silently swallows a
// click on a pin, hole, wire or handle. Hold rendering for the length of
// such a press (parts themselves are handled on pointerup, so they're free
// to keep animating while held — a push button has to show it's pressed).
let renderHeld = false, renderHeldTimer = null;
window.addEventListener('pointerdown', (e)=>{
  const t = e.target;
  if (!t.closest || !t.closest('#circuit-svg')) return;
  if (t.closest('.comp-group') && !t.classList.contains('pin-dot')) return;
  renderHeld = true; clearTimeout(renderHeldTimer);
}, true);
['pointerup','pointercancel'].forEach(type=>window.addEventListener(type, ()=>{
  if (!renderHeld) return;
  // touch taps deliver their click a moment after the finger lifts
  clearTimeout(renderHeldTimer);
  renderHeldTimer = setTimeout(()=>{ renderHeld = false; scheduleRender(); }, 120);
}, true));
function scheduleRender(){
  if (renderScheduled) return;
  renderScheduled = true;
  requestAnimationFrame(()=>{ renderScheduled=false; if (renderHeld) return; renderAll(); });
}

/* ═══════════════════════════════════════════════════════════════
   INTERACTION — placing, dragging, wiring, selecting
═══════════════════════════════════════════════════════════════ */
function addComponent(type, x, y){
  const def = COMPONENT_DEFS[type];
  const snappedX = Math.round((x-BOARD_X)/GRID)*GRID+BOARD_X;
  const snappedY = Math.round((y-BOARD_Y)/GRID)*GRID+BOARD_Y;
  const c = { id:newId(), type, x:snappedX, y:snappedY, props: JSON.parse(JSON.stringify(def.defaultProps)) };
  components.push(c);
  foldHintForCircuit();
  selectComponent(c.id);
  scheduleRender();
  return c;
}

function selectComponent(id){
  selected = id;
  selectedWireId = null;
  autoOpenPanel();
  scheduleRender();
  renderPropPanel();
}

function removeComponent(id){
  components = components.filter(c=>c.id!==id);
  wires = wires.filter(w => !( (w.from.kind==='pin'&&w.from.compId===id) || (w.to.kind==='pin'&&w.to.compId===id) ));
  if (selected===id) selected=null;
  scheduleRender();
  renderPropPanel();
}

function removeWire(id){
  wires = wires.filter(w=>w.id!==id);
  scheduleRender();
}

let dragState = null;
function startDrag(comp, e){
  dragState = { comp, startX: e.clientX, startY: e.clientY, origX: comp.x, origY: comp.y, moved:false, pointerId:e.pointerId };
  function onMove(ev){
    if (!dragState || ev.pointerId!==dragState.pointerId) return;
    const dx = (ev.clientX - dragState.startX)/zoomLevel, dy = (ev.clientY - dragState.startY)/zoomLevel;
    // a few pixels of wobble is still a tap, not a drag
    if (!dragState.moved && Math.hypot(dx,dy)*zoomLevel < 5) return;
    dragState.moved = true;
    // snap to the breadboard's own grid, so pins drop exactly into holes
    dragState.comp.x = BOARD_X + Math.round((dragState.origX+dx-BOARD_X)/GRID)*GRID;
    dragState.comp.y = BOARD_Y + Math.round((dragState.origY+dy-BOARD_Y)/GRID)*GRID;
    scheduleRender();
  }
  function onUp(ev){
    if (ev.pointerId!==e.pointerId) return;
    const def = COMPONENT_DEFS[comp.type];
    if (def.onUp) def.onUp(comp);
    // dragState is cleared if a second finger turned this into a pinch
    if (dragState && !dragState.moved && def.onClick && ev.type==='pointerup'){ def.onClick(comp); renderPropPanel(); }
    dragState = null;
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointercancel', onUp);
    scheduleRender();
  }
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);
}

function cancelWiring(){
  wiringFrom = null; wiringWaypoints = []; liveMousePos = null;
  scheduleRender();
}
function onPinClick(compId, pinId){
  const comp = components.find(c=>c.id===compId);
  const pos = pinWorldPos(comp, pinId);
  if (!wiringFrom){
    wiringFrom = { kind:'pin', compId, pinId, x:pos.x, y:pos.y };
    wiringWaypoints = [];
    scheduleRender();
  } else {
    finishWire({ kind:'pin', compId, pinId, x:pos.x, y:pos.y });
  }
}
function onHoleClick(hole){
  if (!wiringFrom){
    wiringFrom = { kind:'hole', x:hole.x, y:hole.y, bus:hole.bus };
    wiringWaypoints = [];
    scheduleRender();
  } else {
    finishWire({ kind:'hole', x:hole.x, y:hole.y, bus:hole.bus });
  }
}
function finishWire(to){
  if (wiringFrom.kind===to.kind && wiringFrom.kind==='pin' && wiringFrom.compId===to.compId && wiringFrom.pinId===to.pinId){
    cancelWiring(); return;
  }
  // Auto-assign a colour from a fixed rotation rather than leaving every
  // wire the same amber — real breadboard cabling uses different colours
  // per net so you can trace a path by eye; a same-coloured tangle is one
  // of the biggest things that made this look unlike a real circuit.
  const color = DEFAULT_WIRE_PALETTE[wires.length % DEFAULT_WIRE_PALETTE.length];
  wires.push({ id:newId(), from:wiringFrom, to, waypoints:wiringWaypoints, color });
  wiringFrom = null; wiringWaypoints = []; liveMousePos = null;
  scheduleRender();
}

document.getElementById('circuit-svg').addEventListener('click', (e)=>{
  if (e.target.id==='circuit-svg' || e.target.classList.contains('board-bg')){
    // while wiring, this same click also bubbles to canvasWrap's handler,
    // which drops a bend point there instead of cancelling — cancelling a
    // wire in progress is Escape's job now, so a stray click can't lose routing
    if (wiringFrom) return;
    selected = null; selectedWireId = null; renderPropPanel(); scheduleRender();
  }
});

const LED_COLOR_KEYS = ['red','green','yellow','blue','white']; // matches LED_COLORS / the colour <select> order, 1-5 on the number row
const WIRE_COLOR_KEYS = ['#ef4444','#111827','#eab308','#22c55e','#3b82f6','#f8fafc','#f97316','#a855f7','#9ca3af']; // red,black,yellow,green,blue,white,orange,purple,grey — 1-9
window.addEventListener('keydown', (e)=>{
  if (document.activeElement.tagName==='INPUT' || document.activeElement.tagName==='TEXTAREA') return;
  if (e.key==='Delete'||e.key==='Backspace'){
    if (selected==='__breadboard__'){ if (breadboardPresent) toggleBreadboard(); }
    else if (selected) removeComponent(selected);
    else if (selectedWireId){ removeWire(selectedWireId); selectedWireId=null; renderPropPanel(); }
    return;
  }
  if (e.key==='Escape') {
    cancelWiring();
    placingType = null; placingPreviewPos = null;
    document.querySelectorAll('.comp-btn').forEach(b=>b.classList.remove('active'));
    scheduleRender();
    return;
  }
  if (selectedWireId && e.key>='1' && e.key<='9'){
    const w = wires.find(x=>x.id===selectedWireId);
    const col = WIRE_COLOR_KEYS[+e.key-1];
    if (w && col){ w.color = col; scheduleRender(); renderPropPanel(); }
    return;
  }
  if (!selected) return;
  const c = components.find(x=>x.id===selected);
  if (!c) return;
  if (e.key==='r' || e.key==='R'){ c.rotation = ((c.rotation||0)+(e.shiftKey?-90:90)+360)%360; scheduleRender(); return; }
  if (e.key==='m' || e.key==='M'){ c.mirrored = !c.mirrored; scheduleRender(); return; }
  if (e.key>='1' && e.key<='5' && c.props && c.props.color!==undefined){
    const col = LED_COLOR_KEYS[+e.key-1];
    if (col){ c.props.color = col; scheduleRender(); renderPropPanel(); }
  }
});

/* ─── toolbar: click-to-place (simplest reliable interaction) ─── */
const compScroll = document.getElementById('compScroll');
const CATEGORY_ORDER = ['placement','power','input','output','control','passive','tools'];
const CATEGORY_LABELS = {placement:'Placement', power:'Power', input:'Input', output:'Output', control:'Control', passive:'Parts', tools:'Tools'};
const byCategory = {};
Object.keys(COMPONENT_DEFS).forEach(type=>{
  const cat = COMPONENT_DEFS[type].category || 'passive';
  (byCategory[cat] = byCategory[cat]||[]).push(type);
});
CATEGORY_ORDER.forEach(cat=>{
  if (!byCategory[cat] && cat!=='placement') return;
  const row = el2('div', {class:'comp-cat-row'});
  const label = el2('div', {class:'comp-cat-label'});
  label.textContent = CATEGORY_LABELS[cat];
  row.appendChild(label);
  const strip = el2('div', {class:'comp-cat-strip'});
  if (cat==='placement'){
    // the breadboard isn't a draggable part like everything else here —
    // it's a single optional fixture, sized and toggled on/off rather than
    // placed. Three fixed sizes (not one that stretches to the window)
    // matching real mini/half+/full breadboards; picking a size that's
    // already showing turns it off, picking a different one swaps to it.
    const sizes = [{key:'small', label:'Small Breadboard'}, {key:'medium', label:'Medium Breadboard'}, {key:'large', label:'Large Breadboard'}];
    sizes.forEach(s=>{
      const boardBtn = el2('button', {class:'comp-btn', id:'btn-breadboard-'+s.key, title:'Show/hide a '+s.key+' breadboard'});
      boardBtn.appendChild(breadboardIconSvg(BOARD_SIZE_COLS[s.key]));
      boardBtn.appendChild(Object.assign(document.createElement('span'), {textContent:s.label}));
      if (breadboardPresent && breadboardSize===s.key) boardBtn.classList.add('active');
      boardBtn.addEventListener('click', ()=>setBreadboardSize(s.key));
      strip.appendChild(boardBtn);
    });
  }
  (byCategory[cat]||[]).forEach(type=>{
    const def = COMPONENT_DEFS[type];
    const btn = el2('button', {class:'comp-btn', title:'Click, then click the board to place a '+def.label});
    btn.appendChild(partIconSvg(type));
    btn.appendChild(Object.assign(document.createElement('span'), {textContent:def.label}));
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.comp-btn').forEach(b=>b.classList.remove('active'));
      if (placingType===type){ placingType=null; return; }
      btn.classList.add('active');
      placingType = type;
    });
    strip.appendChild(btn);
  });
  row.appendChild(strip);
  compScroll.appendChild(row);
});
function el2(tag, attrs){ const e=document.createElement(tag); for(const k in attrs) e.setAttribute(k,attrs[k]); return e; }

let placingType = null;
let placingPreviewPos = null;
document.getElementById('canvasWrap').addEventListener('click', (e)=>{
  if (wiringFrom){
    // clicked bare board space mid-wire (pins/holes stop propagation before
    // this fires) — drop a bend point here instead of placing a component
    if (e.target.classList && (e.target.classList.contains('pin-dot') || e.target.classList.contains('bb-hole'))) return;
    const origin = wiringWaypoints.length ? wiringWaypoints[wiringWaypoints.length-1] : {x:wiringFrom.x, y:wiringFrom.y};
    let pt = clientToSvgPos(e);
    if (e.ctrlKey){
      const dx = Math.abs(pt.x-origin.x), dy = Math.abs(pt.y-origin.y);
      pt = dx>dy ? {x:pt.x, y:origin.y} : {x:origin.x, y:pt.y};
    }
    pt = { x:Math.round(pt.x/(GRID/2))*(GRID/2), y:Math.round(pt.y/(GRID/2))*(GRID/2) };
    wiringWaypoints.push(pt);
    scheduleRender();
    return;
  }
  if (!placingType) return;
  const pos = clientToSvgPos(e);
  addComponent(placingType, pos.x, pos.y);
  placingType = null;
  placingPreviewPos = null;
  document.querySelectorAll('.comp-btn').forEach(b=>b.classList.remove('active'));
});
/* Touch panning. The board turns off the browser's own touch scrolling
   (touch-action:none) so dragging a part doesn't scroll the page out from
   under the finger; a one-finger drag on empty board scrolls it instead,
   and two fingers pinch-zoom. The click a pan ends with is swallowed so it
   doesn't place a part or drop a wire bend. */
const touchPts = new Map();
let touchPan = null, suppressClickUntil = 0;
document.getElementById('circuit-svg').addEventListener('pointerdown', (e)=>{
  if (e.pointerType!=='touch') return;
  touchPts.set(e.pointerId, {x:e.clientX, y:e.clientY});
  const onPart = e.target.closest('.comp-group') && !e.target.classList.contains('pin-dot');
  const wrap = document.getElementById('canvasWrap');
  if (touchPts.size===2){
    const [a,b] = [...touchPts.values()];
    touchPan = { pinch:true, d0:Math.hypot(a.x-b.x,a.y-b.y), z0:zoomLevel, moved:true };
    dragState = null;
  } else if (!onPart){
    touchPan = { id:e.pointerId, x:e.clientX, y:e.clientY, sl:wrap.scrollLeft, st:wrap.scrollTop, moved:false };
  }
});
window.addEventListener('pointermove', (e)=>{
  if (e.pointerType!=='touch' || !touchPts.has(e.pointerId)) return;
  touchPts.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (!touchPan) return;
  const wrap = document.getElementById('canvasWrap');
  if (touchPan.pinch){
    if (touchPts.size<2) return;
    const [a,b] = [...touchPts.values()];
    setZoom(touchPan.z0 * Math.hypot(a.x-b.x,a.y-b.y) / Math.max(1,touchPan.d0));
    return;
  }
  if (e.pointerId!==touchPan.id) return;
  const dx = e.clientX-touchPan.x, dy = e.clientY-touchPan.y;
  if (!touchPan.moved && Math.hypot(dx,dy) < 8) return;
  touchPan.moved = true;
  wrap.scrollLeft = touchPan.sl - dx; wrap.scrollTop = touchPan.st - dy;
});
['pointerup','pointercancel'].forEach(type=>window.addEventListener(type, (e)=>{
  if (e.pointerType!=='touch') return;
  touchPts.delete(e.pointerId);
  if (touchPan && touchPan.moved) suppressClickUntil = performance.now()+400;
  if (touchPts.size===0) touchPan = null;
}));
document.getElementById('canvasWrap').addEventListener('click', (e)=>{
  if (performance.now() < suppressClickUntil){ e.stopPropagation(); e.preventDefault(); }
}, true);

document.getElementById('canvasWrap').addEventListener('pointermove', (e)=>{
  if (wiringFrom){
    liveMousePos = clientToSvgPos(e);
    liveMouseCtrl = e.ctrlKey;
    scheduleRender();
    return;
  }
  if (placingType){
    const pos = clientToSvgPos(e);
    placingPreviewPos = {
      x: Math.round((pos.x-BOARD_X)/GRID)*GRID+BOARD_X,
      y: Math.round((pos.y-BOARD_Y)/GRID)*GRID+BOARD_Y,
    };
    scheduleRender();
  }
});
document.getElementById('canvasWrap').addEventListener('wheel', (e)=>{
  if (!e.ctrlKey) return;
  e.preventDefault();
  setZoom(zoomLevel + (e.deltaY<0 ? 0.1 : -0.1));
}, {passive:false});
document.getElementById('zoomIn').addEventListener('click', ()=>setZoom(zoomLevel+0.1));
document.getElementById('zoomOut').addEventListener('click', ()=>setZoom(zoomLevel-0.1));
document.getElementById('zoomReset').addEventListener('click', ()=>setZoom(1));

/* ═══════════════════════════════════════════════════════════════
   PROPERTY PANEL
═══════════════════════════════════════════════════════════════ */
function renderPropPanel(){
  const panel = document.getElementById('propPanel');
  if (selected==='__breadboard__'){
    panel.innerHTML = `
      <div style="font-weight:800;color:#fff;font-size:14px;margin-bottom:10px;">🍞 Breadboard <span style="opacity:.6;font-weight:600;text-transform:capitalize;">(${breadboardSize})</span></div>
      <p class="empty-hint">A breadboard is optional — you can wire parts directly to each other's pins instead. Holes in the same row (or the same power rail) are already connected to each other; hover a hole to see which ones. Pick a different size from the Placement row in the toolbar to swap it out.</p>
      <button class="del-btn" id="btnRemoveBoard">Remove breadboard</button>`;
    document.getElementById('btnRemoveBoard').addEventListener('click', ()=>{ toggleBreadboard(); selected=null; renderPropPanel(); });
    return;
  }
  if (selectedWireId){
    const w = wires.find(x=>x.id===selectedWireId);
    if (!w){ panel.innerHTML = ''; return; }
    const bendCount = (w.waypoints||[]).length;
    panel.innerHTML = `
      <div style="font-weight:800;color:#fff;font-size:14px;margin-bottom:10px;">🔌 Wire</div>
      <div class="prop-row"><div id="lbl-wireColorInput" class="prop-lbl"><span>Colour</span></div>
        <input aria-labelledby="lbl-wireColorInput" type="color" id="wireColorInput" value="${w.color||'#fbbf24'}" style="width:100%;height:30px;border-radius:6px;border:1px solid var(--border);background:none;cursor:pointer;"></div>
      <p class="empty-hint">${bendCount ? bendCount+' routing point'+(bendCount>1?'s':'')+' along this wire.' : 'Tip: while drawing a wire, click empty board space to bend it around other parts — hold Ctrl to snap that bend perfectly horizontal or vertical.'} Press 1–9 to set its colour without opening the picker.</p>
      <button class="del-btn" id="btnDelWire">Delete wire</button>`;
    document.getElementById('wireColorInput').addEventListener('input', (e)=>{ w.color = e.target.value; scheduleRender(); });
    document.getElementById('btnDelWire').addEventListener('click', ()=>{ removeWire(w.id); selectedWireId=null; renderPropPanel(); });
    return;
  }
  if (!selected){ panel.innerHTML = '<p class="empty-hint">Click a component on the board to see and edit its properties here.</p>'; return; }
  const c = components.find(x=>x.id===selected);
  if (!c){ panel.innerHTML = ''; return; }
  const def = COMPONENT_DEFS[c.type];
  let html = `<div style="font-weight:800;color:#fff;font-size:14px;margin-bottom:10px;">${def.label}</div>`;
  html += `<div class="btn-row" style="margin-bottom:12px;">
      <button class="mini-btn" id="btnRotateSel" style="flex:1;" title="Keyboard shortcut: R">⟳ Rotate</button>
      <button class="mini-btn" id="btnMirrorSel" style="flex:1;${c.mirrored?'background:rgba(245,158,11,.18);color:var(--accent2);':''}" title="Keyboard shortcut: M">⇋ Mirror</button>
    </div>`;
  (def.props||[]).forEach(p=>{
    const val = c.props[p.key];
    if (p.type==='select'){
      html += `<div class="prop-row"><div class="prop-lbl"><span>${p.label}</span></div>
        <select data-key="${p.key}" class="propInput" aria-label="${p.label}">
        ${p.options.map(o=>`<option value="${o}" ${String(o)===String(val)?'selected':''}>${o}</option>`).join('')}
        </select></div>`;
    } else if (p.type==='range'){
      html += `<div class="prop-row"><div class="prop-lbl"><span>${p.label}</span><span class="prop-val" id="rv-${p.key}">${Math.round(val)}</span></div>
        <input type="range" min="${p.min}" max="${p.max}" value="${val}" data-key="${p.key}" class="propInput" aria-label="${p.label}"></div>`;
    }
  });
  if (c.type==='switch'){
    html += `<button class="mini-btn${c.props.closed?' active':''}" id="btnToggleSwitch" style="width:100%;height:32px;margin-bottom:10px;" aria-pressed="${!!c.props.closed}">${c.props.closed?'Switch is ON (closed) — turn it off':'Switch is OFF (open) — turn it on'}</button>`;
  }
  if (c.type==='mcu'){
    html += `<p class="empty-hint">Digital/analog pins act as OUTPUT or INPUT according to your code's <code>pinMode()</code> calls. Wire 5V/GND to power your breadboard components.</p>`;
  }
  if (def.isMeter){
    html += `<p class="empty-hint">${def.isMeter==='voltage' ? 'Wire in parallel across two points to read voltage — it does not affect the circuit.' : 'Wire in series (break the circuit and insert it) to read current.'}</p>`;
  }
  html += `<button class="del-btn" id="btnDelSel">Delete component</button>`;
  panel.innerHTML = html;
  panel.querySelectorAll('.propInput').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const key = inp.dataset.key;
      let v = inp.value;
      if (inp.tagName==='SELECT' && !isNaN(parseFloat(v)) && /^[0-9.]+$/.test(v)) v = parseFloat(v);
      if (inp.type==='range') { v = parseFloat(v); const rv=document.getElementById('rv-'+key); if(rv) rv.textContent=Math.round(v); }
      c.props[key] = v;
      scheduleRender();
    });
  });
  document.getElementById('btnDelSel').addEventListener('click', ()=>removeComponent(c.id));
  const tog = document.getElementById('btnToggleSwitch');
  if (tog) tog.addEventListener('click', ()=>{ c.props.closed = !c.props.closed; scheduleRender(); renderPropPanel(); });
  document.getElementById('btnRotateSel').addEventListener('click', ()=>{ c.rotation = ((c.rotation||0)+90)%360; scheduleRender(); });
  document.getElementById('btnMirrorSel').addEventListener('click', ()=>{ c.mirrored = !c.mirrored; scheduleRender(); renderPropPanel(); });
}

/* ═══════════════════════════════════════════════════════════════
   UNION-FIND — collapses breadboard columns + wires into nodes
═══════════════════════════════════════════════════════════════ */
class UF {
  constructor(){ this.parent = new Map(); this.size = new Map(); }
  make(k){ if (!this.parent.has(k)){ this.parent.set(k,k); this.size.set(k,1);} }
  find(k){ this.make(k); let r=k; while(this.parent.get(r)!==r) r=this.parent.get(r); let cur=k; while(this.parent.get(cur)!==r){ const nx=this.parent.get(cur); this.parent.set(cur,r); cur=nx; } return r; }
  union(a,b){ this.make(a); this.make(b); const ra=this.find(a), rb=this.find(b); if (ra===rb) return; const sa=this.size.get(ra), sb=this.size.get(rb); if (sa<sb){ this.parent.set(ra,rb); this.size.set(rb,sa+sb);} else { this.parent.set(rb,ra); this.size.set(ra,sa+sb);} }
  groupSize(root){ return this.size.get(root)||1; }
}

function buildUnionFind(){
  const uf = new UF();
  // union breadboard holes sharing the same bus (column strip / rail)
  const byBus = new Map();
  for (const h of boardHoles){
    if (!byBus.has(h.bus)) byBus.set(h.bus, []);
    byBus.get(h.bus).push(holeKey(h));
  }
  for (const [bus, keys] of byBus){ for (let i=1;i<keys.length;i++) uf.union(keys[0], keys[i]); }
  // union every pin/hole touched by wires, and merge with the hole's bus group representative
  for (const w of wires){
    const k1 = endpointKey(w.from), k2 = endpointKey(w.to);
    uf.union(k1, k2);
  }
  // ensure a component pin sitting exactly on a breadboard hole (no explicit wire) still connects
  for (const c of components){
    const def = COMPONENT_DEFS[c.type];
    for (const pin of def.pins){
      const pos = pinWorldPos(c, pin.id);
      const hole = boardHoles.find(h=>Math.abs(h.x-pos.x)<3 && Math.abs(h.y-pos.y)<3);
      if (hole) uf.union(pinKey(c.id,pin.id), holeKey(hole));
    }
  }
  return uf;
}
function endpointKey(end){ return end.kind==='hole' ? holeKey(end) : pinKey(end.compId, end.pinId); }

/* ═══════════════════════════════════════════════════════════════
   CIRCUIT SOLVER — Modified Nodal Analysis with fixed-point
   iteration for nonlinear parts (LED, transistor).
═══════════════════════════════════════════════════════════════ */
function solveCircuit(){
  const uf = buildUnionFind();
  // collect branches: {a, b, kind, comp, pin pair}
  const branches = [];
  for (const c of components){
    const def = COMPONENT_DEFS[c.type];
    if (def.isMcu) continue; // handled per-pin below
    if (c.type==='potentiometer'){
      const rTotal = c.props.maxOhms, wp = c.props.wiperPos/100;
      const rA = Math.max(1, rTotal*wp), rB = Math.max(1, rTotal*(1-wp));
      branches.push({ comp:c, kind:'resistor', ohms:rA, na:pinKey(c.id,'a'), nb:pinKey(c.id,'wiper') });
      branches.push({ comp:c, kind:'resistor', ohms:rB, na:pinKey(c.id,'wiper'), nb:pinKey(c.id,'b') });
      continue;
    }
    if (c.type==='transistor'){
      branches.push({ comp:c, kind:'transistor', nb:pinKey(c.id,'b'), nc:pinKey(c.id,'c'), ne:pinKey(c.id,'e') });
      continue;
    }
    if (c.type==='rgbled'){
      // Three independent LED branches sharing the common cathode pin —
      // each needs its own on/off state (subKey) since they turn on at
      // different currents/voltages depending on colour (vfColor).
      branches.push({ comp:c, kind:'led', na:pinKey(c.id,'r'), nb:pinKey(c.id,'gnd'), subKey:c.id+'_r', vfColor:'red' });
      branches.push({ comp:c, kind:'led', na:pinKey(c.id,'g'), nb:pinKey(c.id,'gnd'), subKey:c.id+'_g', vfColor:'green' });
      branches.push({ comp:c, kind:'led', na:pinKey(c.id,'b'), nb:pinKey(c.id,'gnd'), subKey:c.id+'_b', vfColor:'blue' });
      continue;
    }
    if (c.type==='servo' || c.type==='ultrasonic') continue; // logical components only — see simTick for how their pins are read
    if (def.pins.length===2){
      const na = pinKey(c.id, def.pins[0].id), nb = pinKey(c.id, def.pins[1].id);
      if (def.isSource){
        // Real batteries aren't ideal voltage sources — they sag under
        // load because of their own internal resistance (tiny for a LiPo
        // cell, surprisingly large for a coin cell, which is why a CR2032
        // can light an LED fine but can't drive a motor). Modelled as an
        // ideal source feeding the + pin through that resistance, via a
        // hidden internal node between them.
        const rInt = def.internalR;
        if (rInt){
          const internalNode = pinKey(c.id, '_int');
          branches.push({ comp:c, kind:'vsource', v:c.props.voltage, na:internalNode, nb });
          branches.push({ comp:c, kind:'resistor', ohms:rInt, na:internalNode, nb:na });
        } else {
          branches.push({ comp:c, kind:'vsource', v:c.props.voltage, na, nb });
        }
      }
      else if (c.type==='switch' || c.type==='button'){
        const closed = c.type==='switch' ? c.props.closed : c.props.pressed;
        if (closed) uf.union(na, nb);
      }
      else if (def.isNonlinear){ if (!c._blown) branches.push({ comp:c, kind:'led', na, nb }); }
      else if (def.isCapacitor) branches.push({ comp:c, kind:'capacitor', uf:c.props.uf, na, nb });
      else if (def.highImpedance) branches.push({ comp:c, kind:'resistor', ohms:10000000, na, nb });
      else if (def.fixedResistance!=null) branches.push({ comp:c, kind:'resistor', ohms:def.fixedResistance, na, nb });
      else if (def.resistanceFn) branches.push({ comp:c, kind:'resistor', ohms:def.resistanceFn(c), na, nb });
      else branches.push({ comp:c, kind:'resistor', ohms:c.props.ohms||220, na, nb });
    }
  }
  // microcontroller pins: OUTPUT -> voltage source to GND-node; INPUT/INPUT_PULLUP -> high impedance (or pulled up)
  for (const c of components){
    if (!COMPONENT_DEFS[c.type].isMcu) continue;
    const gndNode = pinKey(c.id,'GND');
    for (const pin of COMPONENT_DEFS[c.type].pins){
      if (pin.id==='GND' || pin.id==='5V') continue;
      if (pin.id==='GNDT'){ branches.push({ comp:null, kind:'resistor', ohms:0.001, na:pinKey(c.id,'GNDT'), nb:gndNode }); continue; }
      const mode = mcuState.pinModes[pin.id] || 'INPUT';
      const node = pinKey(c.id, pin.id);
      if (mode==='OUTPUT'){
        // a real output pin isn't ideal either: about 25 Ω of driver
        // resistance, which is what limits an LED wired with no resistor
        const v = (mcuState.pinValues[pin.id]||0);
        const drv = pinKey(c.id, '_drv_'+pin.id);
        branches.push({ comp:null, kind:'vsource', v, na:drv, nb:gndNode, mcuPin:pin.id });
        branches.push({ comp:null, kind:'resistor', ohms:25, na:drv, nb:node });
      } else if (mode==='INPUT_PULLUP'){
        branches.push({ comp:null, kind:'resistor', ohms:20000, na:node, nb:pinKey(c.id,'5V') });
      }
      // plain INPUT: no stamp, high impedance / floating
    }
    // 5V pin acts as a fixed 5V source relative to GND
    branches.push({ comp:null, kind:'vsource', v:5, na:pinKey(c.id,'5V'), nb:gndNode });
  }

  // A voltage source whose two ends are joined by plain wire (a 5V pin wired
  // straight to GND, an output pin wired to GND) has no solution at all —
  // drop it from the solve and report it instead.
  const shortedSources = [];
  for (let i=branches.length-1; i>=0; i--){
    const b = branches[i];
    if (b.kind==='vsource' && uf.find(b.na)===uf.find(b.nb)){ shortedSources.push(b); branches.splice(i,1); }
  }

  // resolve every branch endpoint to its union-find root, build node index (excluding a chosen ground)
  const nodeRoots = new Set();
  branches.forEach(b=>{
    if (b.na) nodeRoots.add(uf.find(b.na));
    if (b.nb) nodeRoots.add(uf.find(b.nb));
    if (b.nc) nodeRoots.add(uf.find(b.nc));
    if (b.ne) nodeRoots.add(uf.find(b.ne));
  });
  const nodeList = Array.from(nodeRoots);
  if (nodeList.length===0) return { uf, branches, voltages:new Map(), vsrcCurrents:new Map(), shortedSources };
  // ground = the node touching any vsource negative terminal if present, else node 0
  let groundNode = nodeList[0];
  const vsrc = branches.find(b=>b.kind==='vsource');
  if (vsrc) groundNode = uf.find(vsrc.nb);
  const nodes = nodeList.filter(n=>n!==groundNode);
  const nIdx = new Map(nodes.map((n,i)=>[n,i]));

  // nonlinear fixed-point iteration
  let ledState = new Map(); // comp.id -> 'on'|'off'
  let transState = new Map(); // comp.id -> 'sat'|'cutoff'
  let voltages = new Map(), vsrcCurrents = new Map();

  for (let iter=0; iter<80; iter++){
    const activeVSources = branches.filter(b=>b.kind==='vsource');
    // build extra unknowns for each independent vsource branch (merge vsources whose both nodes already unioned to avoid singular matrix duplicates)
    const vsIdx = new Map();
    activeVSources.forEach((b,i)=>{ vsIdx.set(b, nodes.length + i); });
    const n = nodes.length + activeVSources.length;
    const A = Array.from({length:n}, ()=>new Array(n).fill(0));
    const z = new Array(n).fill(0);

    function stampG(nodeA, nodeB, g){
      const ra = uf.find(nodeA), rb = uf.find(nodeB);
      const ia = ra===groundNode? -1 : nIdx.get(ra);
      const ib = rb===groundNode? -1 : nIdx.get(rb);
      if (ia>=0) A[ia][ia]+=g;
      if (ib>=0) A[ib][ib]+=g;
      if (ia>=0 && ib>=0){ A[ia][ib]-=g; A[ib][ia]-=g; }
    }
    function stampI(nodeA, nodeB, i){
      const ra=uf.find(nodeA), rb=uf.find(nodeB);
      const ia = ra===groundNode? -1 : nIdx.get(ra);
      const ib = rb===groundNode? -1 : nIdx.get(rb);
      if (ia>=0) z[ia]-=i;
      if (ib>=0) z[ib]+=i;
    }

    for (const b of branches){
      if (b.kind==='resistor'){
        stampG(b.na, b.nb, 1/Math.max(b.ohms,0.0001));
      } else if (b.kind==='capacitor'){
        // Backward-Euler companion model: a conductance dt/C in parallel
        // with a current source representing the cap's remembered voltage
        // — structurally the same "na should end up higher than nb by some
        // V" shape as the LED/transistor companion models below, and
        // stampI's convention needs the same negation for the same reason
        // (positive i here would make the capacitor charge toward the
        // NEGATIVE of its previous voltage instead of holding/approaching it).
        const dt = 0.02, R = Math.max(1, dt/(b.uf*1e-6));
        const gEq = 1/R;
        const prevV = b.comp._capV||0;
        stampG(b.na, b.nb, gEq);
        stampI(b.na, b.nb, -gEq*prevV);
      } else if (b.kind==='led'){
        // Exponential diode, linearised about the last guess (Newton's
        // method): a conductance G plus a current source Ieq, so that
        // I = G·V + Ieq is the tangent to the diode curve there. stampI
        // draws current out of na into nb, the way a diode conducts.
        // Unlike an on/off switch this gives a real dimming curve — a
        // capacitor discharging through an LED fades it out over a second
        // or so instead of cutting it off in one step.
        const col = LED_COLORS[b.vfColor || b.comp.props.color];
        const vd = diodeV.get(b.subKey || b.comp.id) || 0;
        const { I, G } = ledIV(col.vf, vd);
        stampG(b.na, b.nb, G);
        stampI(b.na, b.nb, I - G*vd);
      } else if (b.kind==='transistor'){
        const state = transState.get(b.comp.id) || 'cutoff';
        // base-emitter behaves like a diode (small fixed drop when
        // conducting) — same sign fix as the LED above: Vb must end up
        // higher than Ve by ~0.6V, not lower.
        const baseState = ledState.get('t_'+b.comp.id+'_be') || 'off';
        if (baseState==='on'){ stampG(b.nb,b.ne,1/22); stampI(b.nb,b.ne,-0.6/22); } else { stampG(b.nb,b.ne,1/2000000); }
        if (state==='sat'){ stampG(b.nc,b.ne,1/8); } else { stampG(b.nc,b.ne,1/5000000); }
      } else if (b.kind==='vsource'){
        const idx = vsIdx.get(b);
        const ra=uf.find(b.na), rb=uf.find(b.nb);
        const ia = ra===groundNode? -1 : nIdx.get(ra);
        const ib = rb===groundNode? -1 : nIdx.get(rb);
        if (ia>=0){ A[ia][idx]+=1; A[idx][ia]+=1; }
        if (ib>=0){ A[ib][idx]-=1; A[idx][ib]-=1; }
        z[idx]+=b.v;
      }
    }

    const x = solveLinear(A, z);
    if (!x){ voltages = new Map(); break; }
    voltages = new Map();
    nodes.forEach((node,i)=>voltages.set(node, x[i]));
    voltages.set(groundNode, 0);
    activeVSources.forEach(b=>vsrcCurrents.set(b, x[vsIdx.get(b)]));

    // Update nonlinear states based on this iteration's voltages, check
    // convergence. Each uses hysteresis (a lower bound to STAY on, a higher
    // bound to SWITCH on from off) rather than one hard threshold — a
    // single threshold lets the state flip every iteration when the
    // equilibrium value sits close to it (e.g. a transistor's clamped ~0.6V
    // base-emitter drop is right next to a 0.55V cutoff), which never
    // converges and leaves the branch stuck on whichever state the last of
    // the 25 iterations happened to land on — sometimes the wrong one.
    let changed = false;
    for (const b of branches){
      if (b.kind==='led'){
        const va = voltages.get(uf.find(b.na))||0, vb = voltages.get(uf.find(b.nb))||0;
        const col = LED_COLORS[b.vfColor || b.comp.props.color];
        const key = b.subKey || b.comp.id;
        const vold = diodeV.get(key) || 0;
        const vnew = limitDiodeStep(va-vb, vold, col.vf);
        diodeV.set(key, vnew);
        if (Math.abs(vnew-vold) > 1e-4) changed = true;
      }
      if (b.kind==='transistor'){
        const vb = voltages.get(uf.find(b.nb))||0, ve = voltages.get(uf.find(b.ne))||0;
        const beKey = 't_'+b.comp.id+'_be';
        const wasOn = ledState.get(beKey)==='on';
        const threshold = wasOn ? 0.45 : 0.65;
        const newBe = (vb-ve) > threshold ? 'on' : 'off';
        if (ledState.get(beKey)!==newBe){ ledState.set(beKey,newBe); changed=true; }
        const newState = newBe==='on' ? 'sat' : 'cutoff';
        if (transState.get(b.comp.id)!==newState){ transState.set(b.comp.id,newState); changed=true; }
      }
    }
    if (!changed) break;
  }

  return { uf, branches, voltages, vsrcCurrents, groundNode, shortedSources };
}

/* LED as a diode: I = Is·(e^(V/nVt) − 1), with Is set so the LED carries
   20 mA at its rated forward voltage vf. nVt = 0.05 V (ideality ≈ 2) gives
   the familiar shape: ~1 mA about 0.15 V below vf, almost nothing below
   that. diodeV holds each LED's last voltage across ticks, so a steady
   circuit converges in a step or two. */
const LED_NVT = 0.05;
const diodeV = new Map();
function ledIV(vf, v){
  const Is = 0.02*Math.exp(-vf/LED_NVT);
  const vc = Math.min(v, vf+0.5);            // keep exp() finite on a wild guess
  const e = Math.exp(vc/LED_NVT);
  let I = Is*(e-1), G = Is*e/LED_NVT;
  if (v>vc) I += G*(v-vc);                   // straight-line beyond the clamp
  return { I, G:G+1e-9 };
}
function ledCurrent(vf, v){ return Math.max(0, ledIV(vf, v).I); }
// SPICE's pnjlim: stop a Newton step from leaping far up the exponential
function limitDiodeStep(vnew, vold, vf){
  const Is = 0.02*Math.exp(-vf/LED_NVT);
  const vcrit = LED_NVT*Math.log(LED_NVT/(Math.SQRT2*Is));
  if (vnew > vcrit && Math.abs(vnew-vold) > 2*LED_NVT){
    if (vold > 0){
      const arg = 1 + (vnew-vold)/LED_NVT;
      vnew = arg>0 ? vold + LED_NVT*Math.log(arg) : vcrit;
    } else {
      vnew = LED_NVT*Math.log(vnew/LED_NVT);
    }
  }
  return vnew;
}
// perceived brightness: a few mA already looks clearly lit
// perceived brightness grows roughly with the log of the current: 10 µA is
// a faint glimmer, 1 mA already clearly lit, 15 mA and up full brightness
function ledGlow(I){ return I<=1e-5 ? 0 : Math.min(1, Math.log10(I/1e-5)/Math.log10(0.015/1e-5)); }

function solveLinear(A, z){
  const n = z.length;
  if (n===0) return [];
  const M = A.map((row,i)=>[...row, z[i]]);
  for (let col=0; col<n; col++){
    let piv = col;
    for (let r=col+1;r<n;r++) if (Math.abs(M[r][col])>Math.abs(M[piv][col])) piv=r;
    if (Math.abs(M[piv][col])<1e-12) continue;
    [M[col],M[piv]] = [M[piv],M[col]];
    for (let r=0;r<n;r++){
      if (r===col) continue;
      const f = M[r][col]/M[col][col];
      if (f===0) continue;
      for (let cc=col;cc<=n;cc++) M[r][cc]-=f*M[col][cc];
    }
  }
  const x = new Array(n).fill(0);
  for (let i=0;i<n;i++) x[i] = Math.abs(M[i][i])>1e-12 ? M[i][n]/M[i][i] : 0;
  return x;
}

/* ═══════════════════════════════════════════════════════════════
   SIMULATION LOOP
═══════════════════════════════════════════════════════════════ */
function simTick(){
  const result = solveCircuit();
  const { uf, voltages } = result;
  const warnings = [];
  for (const c of components){
    const def = COMPONENT_DEFS[c.type];
    if (def.isNonlinear){
      const na = uf.find(pinKey(c.id,'a')), nb = uf.find(pinKey(c.id,'c'));
      const va = voltages.get(na)||0, vb = voltages.get(nb)||0;
      const col = LED_COLORS[c.props.color];
      const current = c._blown ? 0 : ledCurrent(col.vf, va-vb);
      c._current = current;
      c._glow = (c._glow||0)*0.7 + ledGlow(current)*0.3;
      // A real 5 mm LED is rated about 20 mA; well past that it burns out
      // within moments. It then stays dead (open circuit) until Run is
      // pressed again, the way a student would have to fit a new one.
      c._overTicks = current > 0.1 ? (c._overTicks||0)+1 : 0;
      if (!c._blown && c._overTicks >= 5){ c._blown = true; c._blownAt = current; c._glow = 0; }
      if (c._blown) warnings.push(`<b>The ${c.props.color} LED burnt out.</b> About ${c._blownAt>=1 ? c._blownAt.toFixed(1)+' A' : Math.round(c._blownAt*1000)+' mA'} went through it; a real LED is rated about 20 mA. Put a resistor in series with it (220 Ω to 470 Ω), then press Run again.`);
    }
    if (c.type==='buzzer'){
      const na = uf.find(pinKey(c.id,'+')), nb = uf.find(pinKey(c.id,'-'));
      const v = (voltages.get(na)||0) - (voltages.get(nb)||0);
      c._current = Math.abs(v)/42;
    }
    if (c.type==='capacitor'){
      const na = uf.find(pinKey(c.id,'+')), nb = uf.find(pinKey(c.id,'-'));
      c._capV = (voltages.get(na)||0) - (voltages.get(nb)||0);
    }
    if (c.type==='dcmotor'){
      const na = uf.find(pinKey(c.id,'+')), nb = uf.find(pinKey(c.id,'-'));
      const v = (voltages.get(na)||0) - (voltages.get(nb)||0);
      c._current = v/25; // signed — direction flips if wired reversed
      // Spin rate proportional to current, not just a fixed on/off spin —
      // a gentle trickle current shouldn't spin it as fast as full voltage.
      c._spinAngle = (c._spinAngle||0) + c._current*0.6;
    }
    if (c.type==='rgbled'){
      const gnd = uf.find(pinKey(c.id,'gnd'));
      ['r','g','b'].forEach((ch, i)=>{
        const colorName = ['red','green','blue'][i];
        const col = LED_COLORS[colorName];
        const pn = uf.find(pinKey(c.id,ch));
        const v = (voltages.get(pn)||0) - (voltages.get(gnd)||0);
        const current = ledCurrent(col.vf, v);
        const glowKey = '_glow'+ch.toUpperCase();
        c[glowKey] = (c[glowKey]||0)*0.7 + ledGlow(current)*0.3;
      });
    }
    if (c.type==='servo'){
      const node = uf.find(pinKey(c.id,'sig'));
      const v = voltages.get(node);
      // Only move if the signal pin is actually driven by something —
      // an unwired servo shouldn't visually snap to a default angle.
      if (v!=null) c._angle = Math.max(0, Math.min(180, (v/5)*180));
    }
    if (def.isMeter==='voltage'){
      const na = uf.find(pinKey(c.id,'+')), nb = uf.find(pinKey(c.id,'-'));
      c._reading = (voltages.get(na)||0) - (voltages.get(nb)||0);
    }
    if (def.isMeter==='current'){
      const na = uf.find(pinKey(c.id,'+')), nb = uf.find(pinKey(c.id,'-'));
      const v = (voltages.get(na)||0) - (voltages.get(nb)||0);
      c._reading = v/0.01;
    }
  }
  // feed analogRead()/digitalRead() from mcu input pins
  for (const c of components){
    if (!COMPONENT_DEFS[c.type].isMcu) continue;
    for (const pin of COMPONENT_DEFS[c.type].pins){
      if (pin.id[0]!=='A' && pin.id[0]!=='D') continue;
      const node = uf.find(pinKey(c.id,pin.id));
      const v = voltages.get(node)||0;
      mcuState.pinReadings[pin.id] = v;
    }
  }
  // Short circuits and overloaded pins. Battery limits are rough "this
  // would get hot" levels; 40 mA is the absolute maximum of an Arduino pin.
  for (const [b, i] of (result.vsrcCurrents||new Map())){
    const amps = Math.abs(i);
    if (b.comp && amps > (b.comp.type==='battery2032' ? 0.15 : 1.5)){
      warnings.push(`<b>Short circuit!</b> ${Math.abs(amps).toFixed(1)} A is flowing out of the ${COMPONENT_DEFS[b.comp.type].label.toLowerCase()}, almost nothing in its way. A real battery would get hot and go flat fast. Check for a wire or closed switch joining + straight to −.`);
    } else if (!b.comp && b.mcuPin && amps > 0.04){
      warnings.push(`<b>Pin ${b.mcuPin} is overloaded:</b> ${Math.round(amps*1000)} mA. A real microcontroller pin can give 40 mA at most and would be damaged. Add a resistor (220 Ω or more) in series.`);
    } else if (!b.comp && !b.mcuPin && amps > 0.5){
      warnings.push(`<b>Short circuit on the microcontroller's 5V pin:</b> ${amps.toFixed(1)} A. Check for a wire joining 5V straight to GND.`);
    }
  }
  for (const b of (result.shortedSources||[])){
    if (b.comp) continue;
    warnings.push(b.mcuPin
      ? (b.v>0 ? `<b>Pin ${b.mcuPin} is wired straight to GND</b> while your code sets it HIGH. That is a short circuit; a real pin would be damaged.` : '')
      : `<b>The microcontroller's 5V pin is wired straight to GND.</b> That is a short circuit; remove that wire.`);
  }
  showSimWarnings(warnings.filter(Boolean));
  scheduleRender();
}
let lastWarningsHtml = '';
function showSimWarnings(list){
  const html = [...new Set(list)].map(w=>`<div class="sim-warn">${w}</div>`).join('');
  if (html===lastWarningsHtml) return;
  lastWarningsHtml = html;
  document.getElementById('simWarnings').innerHTML = html;
}

document.getElementById('btn-run').addEventListener('click', ()=>{
  running = !running;
  const btn = document.getElementById('btn-run');
  if (running){
    btn.innerHTML = '<i data-lucide="square"></i> Stop';
    btn.classList.remove('go'); btn.classList.add('stop');
    // start from a fresh state: new LEDs fitted, capacitors empty
    diodeV.clear();
    components.forEach(c=>{ c._blown = false; c._overTicks = 0; if (c.type==='capacitor') c._capV = 0; });
    simTimer = setInterval(simTick, 20);
    // The big toolbar Run button is the one thing every student reaches
    // for first — a circuit with a microcontroller on it does nothing at
    // all until its setup()/loop() code is also running, so start that
    // here too rather than leaving it stranded behind a second "Run code"
    // button students have to already know exists.
    if (components.some(c=>c.type==='mcu')) runUserCode();
  } else {
    btn.innerHTML = '<i data-lucide="play"></i> Run';
    btn.classList.remove('stop'); btn.classList.add('go');
    clearInterval(simTimer);
    codeRunning = false;
    showSimWarnings([]);
  }
  if (window.lucide) lucide.createIcons();
});

/* ═══════════════════════════════════════════════════════════════
   BLOCK CODING
   A tap-friendly alternative to typing setup()/loop() by hand —
   built for touch screens where dragging small puzzle pieces around
   is painful. Each block is a plain object; blockProgramToArduino()
   compiles the whole program into the same Arduino-flavoured source
   text the text editor produces, so it runs through the exact same
   preprocessArduino()/runUserCode() pipeline as typed code.
═══════════════════════════════════════════════════════════════ */
let codeMode = 'text'; // 'text' | 'blocks'
let blockSeq = 1;
const newBlockId = () => 'blk' + (blockSeq++);

function defaultBlockProgram(){
  return {
    setup: [ {id:newBlockId(), type:'pinMode', pin:13, mode:'OUTPUT'} ],
    loop: [
      {id:newBlockId(), type:'digitalWrite', pin:13, value:'HIGH'},
      {id:newBlockId(), type:'delay', ms:500},
      {id:newBlockId(), type:'digitalWrite', pin:13, value:'LOW'},
      {id:newBlockId(), type:'delay', ms:500},
    ],
  };
}
let blockProgram = defaultBlockProgram();

const BLOCK_TYPES = {
  pinMode:      { label:'Set pin mode' },
  digitalWrite: { label:'Digital write' },
  analogWrite:  { label:'Analog write (PWM)' },
  delay:        { label:'Wait (ms)' },
  serialPrint:  { label:'Print to serial monitor' },
  ifBlock:      { label:'If…' },
  repeat:       { label:'Repeat N times' },
};
function defaultBlock(type){
  switch(type){
    case 'pinMode': return {id:newBlockId(), type, pin:13, mode:'OUTPUT'};
    case 'digitalWrite': return {id:newBlockId(), type, pin:13, value:'HIGH'};
    case 'analogWrite': return {id:newBlockId(), type, pin:9, value:128};
    case 'delay': return {id:newBlockId(), type, ms:500};
    case 'serialPrint': return {id:newBlockId(), type, text:'hello'};
    case 'ifBlock': return {id:newBlockId(), type, cond:{source:'digitalRead', pin:2, op:'==', value:'HIGH'}, then:[], else:[]};
    case 'repeat': return {id:newBlockId(), type, times:5, body:[]};
  }
}

function scanMaxBlockId(arr, state){
  (arr||[]).forEach(b=>{
    const n = parseInt(String(b.id).replace(/^blk/,''), 10);
    if (!isNaN(n) && n>state.max) state.max = n;
    if (b.then) scanMaxBlockId(b.then, state);
    if (b.else) scanMaxBlockId(b.else, state);
    if (b.body) scanMaxBlockId(b.body, state);
  });
}

function condToCode(cond){
  const left = cond.source==='analogRead' ? `analogRead(${cond.pin})` : `digitalRead(${cond.pin})`;
  return `${left} ${cond.op} ${cond.value}`;
}
function blockToCode(b, depth){
  const pad = '  '.repeat(depth);
  switch(b.type){
    case 'pinMode': return `${pad}pinMode(${b.pin}, ${b.mode});`;
    case 'digitalWrite': return `${pad}digitalWrite(${b.pin}, ${b.value});`;
    case 'analogWrite': return `${pad}analogWrite(${b.pin}, ${b.value});`;
    case 'delay': return `${pad}delay(${b.ms});`;
    case 'serialPrint': return `${pad}Serial.println(${JSON.stringify(b.text||'')});`;
    case 'ifBlock': {
      let out = `${pad}if (${condToCode(b.cond)}) {\n${blocksToCode(b.then,depth+1)}\n${pad}}`;
      if (b.else && b.else.length) out += ` else {\n${blocksToCode(b.else,depth+1)}\n${pad}}`;
      return out;
    }
    case 'repeat': {
      const v = '_i'+b.id;
      return `${pad}for (let ${v}=0; ${v}<${b.times}; ${v}++) {\n${blocksToCode(b.body,depth+1)}\n${pad}}`;
    }
    default: return '';
  }
}
function blocksToCode(arr, depth){ return (arr||[]).map(b=>blockToCode(b,depth)).join('\n'); }
function blockProgramToArduino(){
  return `void setup() {\n${blocksToCode(blockProgram.setup,1)}\n}\n\nvoid loop() {\n${blocksToCode(blockProgram.loop,1)}\n}`;
}

function setCodeMode(mode){
  codeMode = mode;
  document.getElementById('tabTextCode').classList.toggle('active', mode==='text');
  document.getElementById('tabBlockCode').classList.toggle('active', mode==='blocks');
  document.getElementById('code-editor').style.display = mode==='text' ? '' : 'none';
  document.getElementById('blockEditor').style.display = mode==='blocks' ? '' : 'none';
  if (mode==='blocks') renderBlockEditor();
}
document.getElementById('tabTextCode').addEventListener('click', ()=>{
  if (codeMode==='blocks') document.getElementById('code-editor').value = blockProgramToArduino();
  setCodeMode('text');
});
document.getElementById('tabBlockCode').addEventListener('click', ()=>setCodeMode('blocks'));

function fieldEl(labelTxt, inputEl, wide){
  const wrap = document.createElement('label'); wrap.className = 'block-field' + (wide ? ' wide' : '');
  const span = document.createElement('span'); span.textContent = labelTxt;
  wrap.appendChild(span); wrap.appendChild(inputEl);
  return wrap;
}
function fieldNumber(labelTxt, value, onChange, opts={}){
  const inp = document.createElement('input');
  inp.type = 'number';
  if (opts.min!=null) inp.min = opts.min;
  if (opts.max!=null) inp.max = opts.max;
  inp.value = value;
  inp.addEventListener('input', ()=>onChange(Number(inp.value)||0));
  return fieldEl(labelTxt, inp, opts.wide);
}
function fieldSelect(labelTxt, value, options, onChange, opts={}){
  const sel = document.createElement('select');
  options.forEach(o=>{
    const opt = document.createElement('option');
    opt.value = o; opt.textContent = o; if (String(o)===String(value)) opt.selected = true;
    sel.appendChild(opt);
  });
  sel.addEventListener('change', ()=>onChange(sel.value));
  return fieldEl(labelTxt, sel, opts.wide);
}
function fieldText(labelTxt, value, onChange){
  const inp = document.createElement('input');
  inp.type = 'text'; inp.value = value;
  inp.addEventListener('input', ()=>onChange(inp.value));
  return fieldEl(labelTxt, inp);
}

function makeAddRow(targetArr){
  const row = document.createElement('div'); row.className = 'block-add-row';
  const sel = document.createElement('select'); sel.className = 'block-add-select';
  sel.setAttribute('aria-label', 'Add a block');   // its only visible text is the placeholder option
  const ph = document.createElement('option'); ph.value=''; ph.textContent='+ Add a block…'; sel.appendChild(ph);
  Object.keys(BLOCK_TYPES).forEach(t=>{
    const o = document.createElement('option'); o.value=t; o.textContent=BLOCK_TYPES[t].label; sel.appendChild(o);
  });
  sel.addEventListener('change', ()=>{
    if (!sel.value) return;
    targetArr.push(defaultBlock(sel.value));
    renderBlockEditor();
  });
  row.appendChild(sel);
  return row;
}

function renderBlockCard(b, arr, idx){
  const card = document.createElement('div'); card.className = 'block-card';
  const head = document.createElement('div'); head.className = 'block-card-head';
  const label = document.createElement('span'); label.className = 'block-type-label';
  label.textContent = BLOCK_TYPES[b.type].label;
  head.appendChild(label);
  const ctrls = document.createElement('div'); ctrls.className = 'block-controls';
  const mkBtn = (txt, title, fn)=>{
    const btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'block-mini-btn'; btn.textContent = txt; btn.title = title;
    btn.addEventListener('click', fn);
    return btn;
  };
  ctrls.appendChild(mkBtn('▲','Move up', ()=>{ if (idx>0){ [arr[idx-1],arr[idx]]=[arr[idx],arr[idx-1]]; renderBlockEditor(); } }));
  ctrls.appendChild(mkBtn('▼','Move down', ()=>{ if (idx<arr.length-1){ [arr[idx+1],arr[idx]]=[arr[idx],arr[idx+1]]; renderBlockEditor(); } }));
  ctrls.appendChild(mkBtn('✕','Delete', ()=>{ arr.splice(idx,1); renderBlockEditor(); }));
  head.appendChild(ctrls);
  card.appendChild(head);

  const fields = document.createElement('div'); fields.className = 'block-fields';
  switch(b.type){
    case 'pinMode':
      fields.appendChild(fieldNumber('Pin', b.pin, v=>b.pin=v, {min:0,max:19}));
      fields.appendChild(fieldSelect('Mode', b.mode, ['OUTPUT','INPUT','INPUT_PULLUP'], v=>b.mode=v));
      break;
    case 'digitalWrite':
      fields.appendChild(fieldNumber('Pin', b.pin, v=>b.pin=v, {min:0,max:19}));
      fields.appendChild(fieldSelect('Value', b.value, ['HIGH','LOW'], v=>b.value=v));
      break;
    case 'analogWrite':
      fields.appendChild(fieldNumber('Pin', b.pin, v=>b.pin=v, {min:0,max:19}));
      fields.appendChild(fieldNumber('Value (0–255)', b.value, v=>b.value=v, {min:0,max:255}));
      break;
    case 'delay':
      fields.appendChild(fieldNumber('Milliseconds', b.ms, v=>b.ms=v, {min:0}));
      break;
    case 'serialPrint':
      fields.appendChild(fieldText('Text', b.text, v=>b.text=v));
      break;
    case 'ifBlock':
      fields.appendChild(fieldSelect('Read', b.cond.source, ['digitalRead','analogRead'], v=>{ b.cond.source=v; b.cond.value = v==='digitalRead' ? 'HIGH' : 512; renderBlockEditor(); }, {wide:true}));
      fields.appendChild(fieldNumber('Pin', b.cond.pin, v=>b.cond.pin=v, {min:0,max:19}));
      fields.appendChild(fieldSelect('Is', b.cond.op, ['==','!=','<','>','<=','>='], v=>b.cond.op=v));
      if (b.cond.source==='digitalRead') fields.appendChild(fieldSelect('Value', b.cond.value, ['HIGH','LOW'], v=>b.cond.value=v));
      else fields.appendChild(fieldNumber('Value (0–1023)', b.cond.value, v=>b.cond.value=v, {min:0,max:1023}));
      break;
    case 'repeat':
      fields.appendChild(fieldNumber('Times', b.times, v=>b.times=v, {min:1}));
      break;
  }
  card.appendChild(fields);

  if (b.type==='ifBlock' || b.type==='repeat'){
    const children = document.createElement('div'); children.className = 'block-children';
    const bodyArr = b.type==='ifBlock' ? b.then : b.body;
    const bodyLabel = document.createElement('div'); bodyLabel.className='block-children-label';
    bodyLabel.textContent = b.type==='ifBlock' ? 'then:' : 'repeat body:';
    children.appendChild(bodyLabel);
    const bodyList = document.createElement('div'); bodyList.className = 'block-list';
    renderBlockList(bodyList, bodyArr);
    children.appendChild(bodyList);
    children.appendChild(makeAddRow(bodyArr));
    if (b.type==='ifBlock'){
      const elseLabel = document.createElement('div'); elseLabel.className='block-children-label'; elseLabel.textContent='else:';
      children.appendChild(elseLabel);
      const elseList = document.createElement('div'); elseList.className = 'block-list';
      renderBlockList(elseList, b.else);
      children.appendChild(elseList);
      children.appendChild(makeAddRow(b.else));
    }
    card.appendChild(children);
  }
  return card;
}
function renderBlockList(container, arr){
  container.innerHTML = '';
  arr.forEach((b, idx)=> container.appendChild(renderBlockCard(b, arr, idx)));
}
function renderBlockEditor(){
  renderBlockList(document.getElementById('blockList-setup'), blockProgram.setup);
  renderBlockList(document.getElementById('blockList-loop'), blockProgram.loop);
  const setupAdd = document.getElementById('blockAdd-setup'); setupAdd.innerHTML=''; setupAdd.appendChild(makeAddRow(blockProgram.setup));
  const loopAdd = document.getElementById('blockAdd-loop'); loopAdd.innerHTML=''; loopAdd.appendChild(makeAddRow(blockProgram.loop));
}

/* ═══════════════════════════════════════════════════════════════
   MICROCONTROLLER CODE RUNNER
   Arduino-flavoured JS: strips C-style type keywords, then runs
   the result as real async JS via `new Function`, with pinMode /
   digitalWrite / digitalRead / analogRead / delay / millis wired
   to the simulated board. delay() really awaits, so setup()/loop()
   pace themselves in real time, same technique Robot Realm uses.
═══════════════════════════════════════════════════════════════ */
const mcuState = { pinModes:{}, pinValues:{}, pinReadings:{} };
let codeRunning = false;
let codeRunToken = 0;

function preprocessArduino(src){
  return src
    .replace(/\b(void|int|float|double|long|unsigned|byte|bool|boolean|char|const)\s+/g, '')
    .replace(/\bHIGH\b/g,'1').replace(/\bLOW\b/g,'0')
    .replace(/\bOUTPUT\b/g,"'OUTPUT'").replace(/\bINPUT_PULLUP\b/g,"'INPUT_PULLUP'").replace(/\bINPUT\b/g,"'INPUT'")
    .replace(/\btrue\b/g,'true').replace(/\bfalse\b/g,'false')
    // Real Arduino delay() blocks synchronously — ours is async (it really
    // waits in wall-clock time so setup()/loop() pace themselves like real
    // hardware). Without "await" here, delay() fires and is immediately
    // forgotten: the rest of the statements after it in loop() all run in
    // the same synchronous burst, so e.g. a blink's ON and OFF writes both
    // happen before the next frame ever renders — the LED never visibly lights.
    .replace(/(?<!await\s)\bdelay\s*\(/g, 'await delay(')
    .replace(/(?<!await\s)\bdelayMicroseconds\s*\(/g, 'await delayMicroseconds(')
    .replace(/(?<!await\s)\bpulseIn\s*\(/g, 'await pulseIn(');
}

function logSerial(msg){
  const box = document.getElementById('serial-out');
  box.textContent += msg + '\n';
  box.scrollTop = box.scrollHeight;
}

/* setup()/loop() are extracted as raw statement bodies and re-wrapped
   into async functions compiled with pinMode/digitalWrite/etc. as actual
   parameters (not closure lookups) — new Function() bodies don't close
   over anything outside themselves, so the API must be passed in. */
async function runUserCode(){
  const mcu = components.find(c=>c.type==='mcu');
  if (!mcu){ document.getElementById('codeErr').textContent = 'Place a Microcontroller on the board first.'; return; }
  document.getElementById('codeErr').textContent = '';
  const raw = codeMode==='blocks' ? blockProgramToArduino() : document.getElementById('code-editor').value;
  const processed = preprocessArduino(raw);
  const wrapped = `
    return { async setup(){ ${extractBody(processed,'setup')} }, async loop(){ ${extractBody(processed,'loop')} } };
  `;
  let compiled;
  try {
    const factory = new Function('pinMode','digitalWrite','digitalRead','analogRead','analogWrite','delay','delayMicroseconds','pulseIn','millis','Serial', wrapped);
    const api = {
      pinMode:(pin, mode)=>{ mcuState.pinModes['D'+pin]=mode; },
      digitalWrite:(pin, val)=>{ mcuState.pinValues['D'+pin] = val ? 5 : 0; },
      digitalRead:(pin)=>{ const v = mcuState.pinReadings['D'+pin]||0; return v>2.5 ? 1 : 0; },
      analogRead:(pin)=>{ const v = mcuState.pinReadings['A'+pin]||0; return Math.round((v/5)*1023); },
      analogWrite:(pin, val)=>{ mcuState.pinValues['D'+pin] = (val/255)*5; },
      delay:(ms)=> new Promise(res=>setTimeout(res, Math.max(0, ms))),
      // Real microsecond-scale timing isn't meaningful on a browser's
      // event loop (setTimeout can't resolve that finely), so this just
      // yields a tick rather than genuinely waiting `us` microseconds.
      delayMicroseconds:(us)=> new Promise(res=>setTimeout(res, 0)),
      // pulseIn measures a real echo pulse's duration on real hardware.
      // We can't time a microsecond-scale pulse through setTimeout either,
      // so instead of simulating the trigger/echo pulse itself, this looks
      // up whichever Ultrasonic Sensor's echo pin is wired to `pin` and
      // computes the duration a real HC-SR04 would report directly from
      // its configured distance (duration_us = distance_cm * 58, the
      // standard speed-of-sound conversion) — after a short real-time
      // pause standing in for "the sensor taking a reading". Functionally
      // correct for code that then does distance = duration/58.0, even
      // though no real pulse is timed internally.
      pulseIn:(pin, state)=>{
        const mcuNode = pinKey(mcu.id, 'D'+pin);
        const uf = buildUnionFind();
        const sensor = components.find(c => c.type==='ultrasonic' && uf.find(pinKey(c.id,'echo'))===uf.find(mcuNode));
        if (!sensor) return new Promise(res=>setTimeout(()=>res(0), 40)); // floating pin — real pulseIn also times out
        const durationUs = sensor.props.distance * 58;
        return new Promise(res=>setTimeout(()=>res(durationUs), Math.min(50, durationUs/1000)));
      },
      millis:()=> Date.now(),
      Serial:{ print:(m)=>logSerial(String(m)), println:(m)=>logSerial(String(m)) },
    };
    compiled = factory(api.pinMode, api.digitalWrite, api.digitalRead, api.analogRead, api.analogWrite, api.delay, api.delayMicroseconds, api.pulseIn, api.millis, api.Serial);
  } catch(e){
    document.getElementById('codeErr').textContent = 'Syntax error: ' + e.message;
    return;
  }
  const myToken = ++codeRunToken;
  codeRunning = true;
  try {
    if (compiled.setup) await compiled.setup();
    while (codeRunning && codeRunToken===myToken){
      if (compiled.loop) await compiled.loop();
      await new Promise(r=>setTimeout(r,4));
    }
  } catch(e){
    document.getElementById('codeErr').textContent = 'Runtime error: ' + e.message;
    codeRunning = false;
  }
}
function extractBody(src, fnName){
  const re = new RegExp(fnName+'\\s*\\(\\s*\\)\\s*\\{');
  const m = re.exec(src);
  if (!m) return '';
  let i = m.index + m[0].length, depth=1, start=i;
  while (i<src.length && depth>0){ if (src[i]==='{') depth++; else if (src[i]==='}') depth--; i++; }
  return src.slice(start, i-1);
}

document.getElementById('btn-code-run').addEventListener('click', ()=>{
  if (!running) document.getElementById('btn-run').click();
  runUserCode();
});
document.getElementById('btn-code-stop').addEventListener('click', ()=>{ codeRunning = false; });
